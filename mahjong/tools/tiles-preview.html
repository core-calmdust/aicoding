<!doctype html><meta charset=utf-8>
<body style="background:#234;margin:10px"><div id=o style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script src="../tiles.js"></script><script>
// every face as the 2D tiles show it (the carving baked in), then the red fives — open through a local server (the sheets are images)
MJTiles.ready().then(()=>{for(let t=0;t<34;t++){const i=new Image();i.src=MJTiles.url(t);i.style.cssText='width:90px;background:#fafaf6;border-radius:8px';o.appendChild(i)}
for(const t of [4,13,22]){const i=new Image();i.src=MJTiles.url(t,true);i.style.cssText='width:90px;background:#fafaf6;border-radius:8px';o.appendChild(i)}});
</script>
