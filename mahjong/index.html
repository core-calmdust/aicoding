<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120d22">
<title>雀華 〜姫たちの麻雀〜</title>
<meta name="description" content="キャラクターごとの特殊スキルで点数がふくらむ、3Dの4人打ちリーチ麻雀。BOT戦、スキル戦と標準戦、ガチャでキャラを集めよう。">
<meta property="og:title" content="雀華 〜姫たちの麻雀〜">
<meta property="og:description" content="スキルで点数がふくらむ3D麻雀。BOT戦、ガチャ、キャラごとのカットイン演出。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://core-calmdust.github.io/aicoding/mahjong/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='50' rx='7' fill='%23f6f0e0'/%3E%3Crect x='14' y='50' width='36' height='8' rx='3' fill='%236b3fc4'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23d42a2a' font-family='serif' font-weight='900'%3E中%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Boku&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Cinzel:wght@600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=14">
</head>
<body>
<div id="root">
<div id="bgfx"></div>

<!-- ============ HOME ============ -->
<section id="home" class="screen">
  <header class="top">
    <div class="logo">
      <span class="lg-k">雀華</span>
      <span class="lg-s"><b data-t="sub"></b><small data-t="series"></small></span>
    </div>
    <span class="sp"></span>
    <div class="coins" id="coinBox"><i class="coin"></i><b id="coinN">0</b></div>
    <button class="ib" id="btnGacha" data-tt="gacha"></button>
    <button class="ib" id="btnColl" data-tt="collection"></button>
    <button class="ib" id="btnLite"></button>
    <button class="ib snd" id="btnSnd"></button>
    <select id="langSel" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select>
    <a class="ib" href="../" id="btnPortal" title="CALMDUST COLLECTION"></a>
  </header>
  <main class="hmain">
    <div class="partner" id="partner"></div>
    <div class="modes">
      <div class="mcard main" id="mBot">
        <div class="mh"><b data-t="bot"></b></div>
        <div class="opt"><div class="seg" id="optLen"></div></div>
        <div class="opt"><div class="seg" id="optSkill"></div></div>
        <div class="opt"><small data-t="strength"></small><div class="seg lv" id="optLv"></div></div>
        <button class="go" id="btnStart" data-t="start"></button>
      </div>
      <div class="mrow">
        <div class="mcard sub soon"><b data-t="rated"></b><em data-t="soon"></em></div>
        <div class="mcard sub soon"><b data-t="lesson"></b><em data-t="soon"></em></div>
        <div class="mcard sub soon"><b data-t="rules"></b><em data-t="soon"></em></div>
      </div>
    </div>
  </main>
</section>

<!-- ============ CHARACTERS ============ -->
<section id="chara" class="screen" hidden>
  <header class="top ch-top">
    <button class="ib" id="chBack"></button>
    <b class="ch-title" data-t="chars"></b>
    <small class="ch-count" id="chCount"></small>
    <span class="sp"></span>
    <div class="coins"><i class="coin"></i><b id="coinN2">0</b></div>
  </header>
  <div class="ch-main">
    <div class="ch-list" id="chList"></div>
    <div class="ch-art" id="chArt"></div>
    <div class="ch-info" id="chInfo"></div>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen" hidden>
  <div id="stage"></div>
  <div class="hud">
    <div class="rbox" id="rbox"></div>
    <div class="khelp" id="khelp"></div>
    <div class="tbtns">
      <button class="ib snd" id="gSnd"></button>
      <button class="ib" id="gExit"></button>
    </div>
    <div class="opp" id="opp1"></div>
    <div class="opp" id="opp2"></div>
    <div class="opp" id="opp3"></div>
    <div class="intel" id="intel" hidden></div>
    <div class="me" id="mePanel"></div>
    <div class="acts" id="acts"></div>
    <div class="chiPick" id="chiPick" hidden></div>
    <div class="dealAsk" id="dealAsk" hidden></div>
    <div class="hand" id="hand"></div>
    <div class="callout" id="callout"></div>
  </div>
</section>

<div id="cutin" class="cutin" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="i18n.js?v=9"></script>
<script src="engine.js?v=2"></script>
<script src="skills.js?v=7"></script>
<script src="game.js?v=7"></script>
<script src="ai.js?v=6"></script>
<script src="tiles.js?v=1"></script>
<script src="chars.js?v=3"></script>
<script src="table3d.js?v=4"></script>
<script src="app.js?v=15"></script>
</body>
</html>
