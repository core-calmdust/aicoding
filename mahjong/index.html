<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="../shared/latinfs.js?v=1"></script>
<script src="../shared/focusgate.js?v=4ol"></script>
<script src="../shared/phonesnd.js?v=2"></script>
<meta name="theme-color" content="#120d22">
<title>雀華 〜姫たちの麻雀〜</title>
<meta name="description" content="キャラクターごとの特殊スキルで点数がふくらむ、3Dの4人打ちリーチ麻雀。BOT戦、スキル戦と標準戦、ガチャでキャラを集めよう。">
<meta property="og:title" content="雀華 〜姫たちの麻雀〜">
<meta property="og:description" content="スキルで点数がふくらむ3D麻雀。BOT戦、ガチャ、キャラごとのカットイン演出。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://core-calmdust.github.io/aicoding/mahjong/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='50' rx='7' fill='%23f6f0e0'/%3E%3Crect x='14' y='50' width='36' height='8' rx='3' fill='%236b3fc4'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23d42a2a' font-family='serif' font-weight='900'%3E中%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Boku&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Cinzel:wght@600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=63">
</head>
<body>
<div id="root">
<div id="bgfx"></div>

<!-- ============ HOME ============ -->
<section id="home" class="screen aaa">
  <div class="aa-bg" aria-hidden="true"><img class="aa-blur" id="aaBlur" alt=""><i class="aa-wash"></i><i class="aa-lat"></i><i class="aa-beam"></i><i class="aa-vig"></i></div>
  <div class="aa-hero" id="pArt"></div>
  <canvas class="aa-fx" id="aaFx" aria-hidden="true"></canvas>
  <div class="aa-ui">
    <header class="aa-top">
      <button class="aa-prof" id="aaProf"></button>
      <span class="sp"></span>
      <div class="coins" id="coinBox"><i class="coin"></i><b id="coinN">0</b></div>
      <button class="ib" id="btnSet" data-tt="settings"></button>
      <a class="ib" href="../" id="btnPortal" title="CALMDUST COLLECTION"></a>
    </header>
    <div class="aa-logo">
      <span class="lg-k" data-text="雀華">雀華</span>
      <span class="lg-sub" data-t="sub"></span>
      <i class="aa-orn"></i>
      <small class="lg-ser" data-t="series"></small>
    </div>
    <nav class="aa-menu" id="luxMenu">
      <button class="lm" id="btnGacha"></button>
      <button class="lm" id="btnColl"></button>
      <button class="lm" id="btnStats"></button>
      <button class="lm" id="btnRated"></button>
      <button class="lm soon" data-soon="lesson"></button>
      <button class="lm soon" data-soon="rules"></button>
    </nav>
    <div class="aa-plate" id="partner"></div>
    <div class="aa-say" id="aaSay" hidden></div>
    <button class="aa-banner" id="aaBanner"></button>
    <div class="aa-play">
      <div class="ap-opts">
        <div class="seg" id="optLen"></div>
        <div class="seg" id="optSkill"></div>
        <div class="seg lv" id="optLv"></div>
      </div>
      <button class="go aa-go" id="btnStart"><span class="ag-k" data-t="start"></span><small class="ag-s" id="aaGoSub"></small></button>
    </div>
  </div>
</section>

<!-- ============ CHARACTERS ============ -->
<section id="chara" class="screen aaa ch2" hidden>
  <div class="aa-bg" aria-hidden="true"><img class="aa-blur" id="chBlur" alt=""><i class="aa-wash"></i><i class="aa-lat"></i><i class="aa-vig"></i></div>
  <div class="ch-hero" id="chArt"></div>
  <div class="aa-ui">
    <header class="aa-top ch-top">
      <button class="ib" id="chBack"></button>
      <b class="ch-title" data-t="chars"></b>
      <small class="ch-count" id="chCount"></small>
      <span class="sp"></span>
      <div class="coins"><i class="coin"></i><b id="coinN2">0</b></div>
    </header>
    <aside class="ch-panel">
      <div class="ch-tabs" id="chTabs"></div>
      <div class="ch-list" id="chList"></div>
    </aside>
    <div class="ch-info" id="chInfo"></div>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen" hidden>
  <div id="stage"></div>
  <div class="rays" aria-hidden="true"></div>
  <div class="hud">
    <div class="rbox" id="rbox"></div>
    <div class="khelp" id="khelp"></div>
    <div class="tbtns">
      <button class="ib keyb" id="gKeys" aria-expanded="false"></button>
      <button class="ib snd" id="gSnd"></button>
      <button class="ib" id="gExit"></button>
    </div>
    <div class="opp" id="opp1"></div>
    <div class="opp" id="opp2"></div>
    <div class="opp" id="opp3"></div>
    <div class="intel" id="intel" hidden></div>
    <div class="me" id="mePanel"></div>
    <div class="acts" id="acts"></div>
    <div class="chiPick" id="chiPick" hidden></div>
    <div class="dealAsk" id="dealAsk" hidden></div>
    <div class="hand" id="hand"></div>
    <div class="callout" id="callout"></div>
  </div>
</section>

<div id="cutin" class="cutin" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="pstats" class="pstats" hidden></div>
<div id="toast" class="toast"></div>
</div>

<script>/* three.js r186 + compatibility layer by default; ?three=128 = the old version (2026-11-13) */
if (/[?&]three=128\b/.test(location.search)) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
else document.write('<script src="../atlas/vendor/three-r186.min.js?v=1"><\/script><script src="../atlas/vendor/three-compat.js?v=15"><\/script>');</script>
<script src="i18n.js?v=18"></script>
<script src="engine.js?v=2"></script>
<script src="skills.js?v=8"></script>
<script src="game.js?v=8"></script>
<script src="pstats.js?v=1"></script>
<script src="rank.js?v=1"></script>
<script src="ai.js?v=6"></script>
<script src="tiles.js?v=11"></script>
<script src="chars.js?v=4"></script>
<script src="img/tex/baked.js?v=2"></script>
<script src="hand.js?v=8"></script>
<script src="table3d.js?v=59"></script>
<script src="framefx.js?v=12"></script>
<script src="../shared/record.js?v=16"></script>
<script src="app.js?v=65"></script>
</body>
</html>
