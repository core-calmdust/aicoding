let boss = null;
let bossSpawnFrame = -1;
let bossCount = 0; // 出現した通算数（種類のローテーションに使う）
// スマホは軽いLambertマテリアルで代用（金属感の計算を省く）
class LiteMat extends THREE.MeshLambertMaterial { constructor(p = {}) { const q = Object.assign({}, p); delete q.metalness; delete q.roughness; super(q); } }
const StdMat = IS_MOBILE ? LiteMat : THREE.MeshStandardMaterial;
const BS = IS_MOBILE ? 1.5 : 1.7;
const COL_LANCE = new THREE.Color(0xff3050);
const ENEMY_SPD = IS_MOBILE ? 1.4 : 1; // スマホは雑魚敵の動きを速めに
const VS = IS_MOBILE ? 2.0 : 1;
const INV_GLAZE_K = IS_MOBILE ? 1.5 * 0.9 : 1.5; // 無敵中のグレイズ範囲（自機周りの円）の倍率。スマホは0.9倍に
const CK = IS_MOBILE ? 1.35 : 1; // 中央メッセージの間隔（スマホは文字が大きいので広め）
const ES = IS_MOBILE ? 1 : 1.5; // PCは雑魚敵を1.5倍（見た目と当たり判定） // スマホはキャラの見た目を大きめに（当たり判定は同じ） // ボスの大きさ倍率（見た目と当たり判定）
const FS = config.canvasWidth / 1067; // ボスの横移動の幅をフィールド幅に合わせる

function bossShoot(x, y, angle, speed, radius = 4) {
    if (tutorial && Math.random() < 0.7) return; // チュートリアルのボスは弾を控えめに
    enemyBullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius, isGlazed: false, fromBoss: true });
    if (hyperT > 0) { const a2 = angle + 0.09; enemyBullets.push({ x, y, vx: Math.cos(a2) * speed * 0.92, vy: Math.sin(a2) * speed * 0.92, radius, isGlazed: false, fromBoss: true }); } // ハイパー中は弾2倍
}
function aimAt(x, y) { return Math.atan2(player.y - y, player.x - x); }
function ring(x, y, n, speed, offset = 0, skip = null, radius = 4) {
    for (let k = 0; k < n; k++) {
        if (skip && skip(k)) continue;
        bossShoot(x, y, offset + (k / n) * Math.PI * 2, speed, radius);
    }
}
function fan(x, y, center, n, spread, speed, radius = 4) {
    for (let k = 0; k < n; k++) {
        const a = n === 1 ? center : center - spread / 2 + (spread * k) / (n - 1);
        bossShoot(x, y, a, speed, radius);
    }
}

const BOSS_DEFS = [
    {   // 1. AXIS: 横に大きく往復しつつ、回転する4本の螺旋＋周期的な狙い撃ち
        name: 'AXIS', hp: 6, r: 46,

function rand2(a, b) { return a + Math.random() * (b - a); }

// ボスのHP: 2 → 3,3 → 4,4,4 → 5×4 → 6（上限）。HP h（3以上）は h-1 体続く
let lastBossIdx = -1;
function bossHpFor(n) {
    if (n <= 0) return 2;
    let h = 3, i = n - 1;
    while (i >= h - 1 && h < 6) { i -= h - 1; h++; }
    return Math.min(h, 6);
}
function spawnBoss() {
    // 1・2体目は固定、3体目からはランダム（直前と同じボスは避ける）
    let idx = bossCount < 2 ? bossCount : Math.floor(Math.random() * BOSS_DEFS.length);
    if (bossCount >= 2) { let guard = 0; while ((idx === lastBossIdx) && guard++ < 10) idx = Math.floor(Math.random() * BOSS_DEFS.length); }
    if (tutorial) idx = 0;
    lastBossIdx = idx;
    const hp = bossHpFor(bossCount);
    bossCount++;
    const def = BOSS_DEFS[idx];
    boss = { idx, def, x: config.canvasWidth / 2, y: -140, t: 0, enterT: 0, state: 'enter', hp, maxHp: hp, flash: 0, alpha: 1, invuln: false, contactCd: 0, r: def.r * BS };
    if (def.init) def.init(boss);
    audioHandler.playSound('bossWarning');
}

function bossBodies(b) {
    return b.def.bodies ? b.def.bodies(b) : [{ x: b.x, y: b.y, r: b.r }];
}

function killBoss() {
    const b = boss;
    const stageMultiplier = scoreMul();
    const comboMultiplier = chainCount > 1 ? Math.pow(1.1, chainCount - 1) : 1;
    const earned = Math.floor(30000 * stageMultiplier * comboMultiplier);
    score += earned;
    scoreTexts.push({ x: b.x, y: b.y, text: `+${earned}`, life: 90, type: 'bonus' });
    // ご褒美: 得点アイテムと回復アイテムを画面中にばら撒く
    const gemN = 48 + bossCount * 6;
    const gemValue = Math.floor(2500 * stageMultiplier * comboMultiplier);
    for (let i = 0; i < gemN; i++) {
        const a = Math.random() * Math.PI * 2, sp = 300 + Math.random() * 900;
        gems.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: Math.random() * 0.2, value: gemValue, big: i % 8 === 0 });
    }
    for (let k = 0; k < 7; k++) {
        const a = -Math.PI / 2 + (k - 3) * 0.45;
        items.push({ x: b.x, y: b.y, type: k === 3 ? 'special' : 'normal', vx: Math.cos(a) * 380, vy: Math.sin(a) * 300 - 120, phys: true });
    }
    audioHandler.playSound('explosion');
    audioHandler.playSound('enemyDestroy');
    screenShake = { intensity: 16, duration: 30 };
    bossBodies(b).forEach(p => effects.push({ type: 'shockwave', x: p.x, y: p.y, life: 30, maxLife: 30, radius: 30 }));
    effects.push({ type: 'screenFlash', life: 12, maxLife: 12 });
    const cols = ['#ffffff', '#ffdd55', '#ff66cc', '#55eeff', '#88ff66'];
    const n = isEffectsEnabled ? 260 : 60;
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = (Math.random() * 14 + 4) * 60;
        particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: Math.random() * 90 + 60, maxLife: 150, color: cols[i % cols.length], size: Math.random() * 2.5 + 1.2, gravityMultiplier: 0.6 });
    }
    // ボスの弾は消してボーナスに
    enemyBullets = enemyBullets.filter(eb => !eb.fromBoss);
    effects.push({ type: 'bossDefeated', name: b.def.name, life: 150, maxLife: 150 });
    boss = null;
    triggerSpecialItemEffect();
}

// 戻り値 true = ゲームオーバー
function updateBoss(isPlayerInvincible) {
    if (bossSpawnFrame !== -1 && frameCount >= bossSpawnFrame && !boss) {
        bossSpawnFrame = -1;
        spawnBoss();
    }
    const b = boss;
    if (!b) return false;
    if (b.flash > 0) b.flash--;
    if (b.contactCd > 0) b.contactCd--;
    const homeY = 160;

    if (b.state === 'enter') {
        b.enterT++;
        const p = Math.min(1, b.enterT / 110);
        b.y = -140 + (homeY + 140) * (1 - Math.pow(1 - p, 3));
        if (b.def.name === 'MIRROR') b.d = 270 * FS;
        if (b.def.name === 'SERPENT') { b.hist.unshift({ x: b.x, y: b.y }); if (b.hist.length > 160) b.hist.pop(); b.segs = []; for (let k = 1; k <= 8; k++) { const h = b.hist[Math.min(b.hist.length - 1, k * 14)]; b.segs.push({ x: h.x, y: h.y }); } }
        if (p >= 1) { b.state = 'fight'; b.t = 0; }
        return false;
    }
    if (b.state === 'leave') {
        b.y -= 5;
        if (b.y < -200) boss = null;
        return false;
    }

    b.def.fight(b);
    b.t++;
    if (b.t > 60 * 30) { b.state = 'leave'; b.invuln = true; } // 30秒で撤退

    // 自機弾との判定
    if (playerBullet && !b.invuln) {
        const hit = (b.def.name === 'SERPENT' ? [{ x: b.x, y: b.y, r: 38 * BS }, ...b.segs.map(s => ({ x: s.x, y: s.y, r: 17 * BS }))] : bossBodies(b)).some(p => Math.hypot(playerBullet.x - p.x, playerBullet.y - p.y) < p.r + config.playerBulletHitRadius);
        if (hit) {
            const hx = playerBullet.x, hy = playerBullet.y;
            playerBullet = null;
            damageBoss(hx, hy);
            if (!boss) return false;
        }
    }
    // 自機との接触
    for (const p of bossBodies(b)) {
        const d = Math.hypot(player.x - p.x, player.y - p.y);
        if (d < player.radius + p.r) {
            if (isPlayerInvincible) {
                if (b.contactCd <= 0 && !b.invuln) { b.contactCd = 30; damageBoss(player.x, player.y - 20); if (!boss) return false; }
            } else {
                gameOver('collision'); // ボスの体当たりはシールドに関係なく一発アウト
                return true;
            }
        }
    }
    return false;
}

function damageBoss(hx, hy) {
    const b = boss;
    b.hp--;
    b.flash = 8;
    const stageMultiplier = scoreMul();
    const pts = Math.floor(2000 * stageMultiplier);
    score += pts;
    scoreTexts.push({ x: hx, y: hy, text: `+${pts}`, life: 60, type: 'bonus' });
    audioHandler.playSound('bossHit');
    if (b.hp <= 0) killBoss();
}

const TUT_SHIELD = 6, TUT_INV = 7, TUT_BOSS = 8, TUT_HYPER = 9; // チュートリアルのステップ番号
function tutorialStepStart(i) {
    const t = tutorial;
    t.spawnT = 0;
    comets = []; enemyBullets = [];
    // 前のステップで溜まった回数を持ち越さない（グレイズ等が即クリアになるのを防ぐ）
    t.glazes = 0; t.kills = 0; t.items = 0; t.smash = 0;
    if (i === 4) { monsters = []; }
    if (i === 5) { energy = config.energyTotal * 0.3; items = []; }
    if (i === TUT_SHIELD) { items = []; maxShields = shields = 1; t.shieldPhase = 0; t.shieldT = 0; t.line = { y: -40 - TOP_EXT }; }
    if (i === TUT_INV) t.bsmash = 0;
    if (i === TUT_BOSS) {
        const saved = bossCount;
        bossCount = 0;
        spawnBoss();
        bossCount = saved;

        t.bossSpawned = true;
    }

function updateTutorial(dt) {
    const t = tutorial;
    if (t.hitFlash > 0) t.hitFlash--;
    if (t.step !== 5) energy = config.energyTotal; // チュートリアル中はエネルギー切れにならない
    lowEnergyWarningPlayed = false;

    if (t.step >= TUTORIAL_STEPS.length) {
        t.doneT += dt;
        if (t.doneT > 3.5) {
            tutorial = null;
            audioHandler.stopBgm();
            gameState = 'title';
            init();
        }
        return;
    }
    const st = TUTORIAL_STEPS[t.step];

    // ステップ達成後は少し間を置いて次へ
    if (t.clearT > 0) {
        t.clearT -= dt;
        if (t.clearT <= 0) {
            t.step++;
            if (IS_MOBILE && t.step === 1) t.step++; // スマホは低速移動なし
            if (t.step < TUTORIAL_STEPS.length) tutorialStepStart(t.step);
            else { comets = []; enemyBullets = []; audioHandler.playSound('waveClear'); }
        }
        return;
    }

    // 進捗の計測
    const dx = player.x - t.lastX;
    if (dx < 0) t.movedL += -dx; else t.movedR += dx;
    t.lastX = player.x;
    if (input.slow && (input.left || input.right)) t.slowFrames++;
    if (t.step === 2 && t.hitFlash === 0) t.survive += dt;
    if (t.step === TUT_BOSS && t.bossSpawned && !boss) { t.bossDone = true; t.afterBoss += dt; }
    if (t.step === TUT_HYPER && (t.hyper || 0) >= 1) t.afterHyper = (t.afterHyper || 0) + dt;

    // ステップごとの出現
    t.spawnT += dt;
    if (st.comets) {
        const interval = 0.42 / st.comets;
        while (t.spawnT > interval) {
            t.spawnT -= interval;
            const near = t.step === 3 && Math.random() < 0.5;
            comets.push({ x: near ? player.x + (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 30) : Math.random() * config.canvasWidth, y: -10, vx: 0, vy: 230, radius: config.cometCoreRadius, isGlazed: false });
        }
    }
    if (t.step === 4 && !monsters.some(m => m.type === 'invader')) {
        monsters.push({ type: 'invader', x: config.canvasWidth * (0.3 + Math.random() * 0.4), y: -30, vx: 0, vy: 45, width: 56, height: 56, shootCooldown: 1e9 });
    }
    if (t.step === 5 && items.length === 0 && t.items < 2) {
        items.push({ x: Math.max(80, Math.min(config.canvasWidth - 80, player.x + (Math.random() < 0.5 ? -1 : 1) * 220)), y: -20, type: t.items === 0 ? 'normal' : 'special' });
    }
    if (t.step === TUT_HYPER && !(t.hyper >= 1) && !items.some(it => it.type === 'hyper')) {
        items.push({ x: Math.max(80, Math.min(config.canvasWidth - 80, player.x + (Math.random() < 0.5 ? -1 : 1) * 200)), y: -20, type: 'hyper' });
    }
    if (t.step === TUT_INV) {
        if (player.invincibleTimer < 40) triggerInvincibility(240);
        energy = config.energyTotal;
        // 敵の弾も降らせる（体当たりで高ボーナス）
        t.bulletT = (t.bulletT || 0) + dt;
        if (t.bulletT > 0.45) { t.bulletT = 0; enemyBullets.push({ x: Math.max(30, Math.min(config.canvasWidth - 30, player.x + (Math.random() - 0.5) * 260)), y: -10, vx: (Math.random() - 0.5) * 40, vy: 200, radius: 5, isGlazed: false }); }
    }
    if (t.step === TUT_SHIELD) {
        if (t.shieldPhase >= 2) t.shieldT += dt;
        if (t.line) { // 横一列の光のライン: 自機の高さを通過したら必ずシールドが1減る
            const prev = t.line.y; t.line.y += 300 * dt;
            if (t.shieldPhase === 0 && prev < player.y && t.line.y >= player.y) {
                shields = 0; hurtTimer = 120; t.shieldPhase = 1;
                audioHandler.playSound('explosion'); audioHandler.playSound('bossHit');
                screenShake = { intensity: 12, duration: 16 };
                effects.push({ type: 'shockwave', x: player.x, y: player.y, life: 26, maxLife: 26, radius: 20 });
                effects.push({ type: 'screenFlash', life: 10, maxLife: 10 });
                effects.push({ type: 'shieldMsg', text: 'SHIELD BREAK  ·  ' + T('hud.last'), color: '#ff5577', life: 90, maxLife: 90 });
            }
            if (t.line.y > config.canvasHeight + 40) t.line = null;
        }
        if (t.shieldPhase === 1 && !t.line && items.length === 0) items.push({ x: Math.max(80, Math.min(config.canvasWidth - 80, player.x + (Math.random() < 0.5 ? -1 : 1) * 200)), y: -20, type: 'special' });

    if (st.goal(t)) {

}

let tutPanelBottom = 160;
// 幅に合わせて折り返す（スペースの無い日本語・中国語は文字単位）
function wrapLines(c, text, maxW, flags) {
    const out = [];
    text.split('\n').forEach(par => {
        const hl = par.startsWith('★'); // ★で始まる段落は強調表示
        const n0 = out.length;
        let line = '';
        const tokens = par.match(/[\u3000-\u9fff\uff00-\uffef\uac00-\ud7af]|[^\s\u3000-\u9fff\uff00-\uffef\uac00-\ud7af]+\s*|\s+/g) || [''];
        tokens.forEach(tk => {
            if (line && c.measureText(line + tk).width > maxW) { out.push(line.trimEnd()); line = tk.trimStart(); }
            else line += tk;
        });
        out.push(line.trimEnd());
        if (flags) for (let k = n0; k < out.length; k++) flags[k] = hl;
    });
    return out;
}

        ctx2.fillText(T('tut.back'), cx, y0 + 66);

    }
    const st = TUTORIAL_STEPS[t.step];
    ctx2.fillStyle = themes[currentThemeIndex].ui;
    ctx2.font = `700 13px ${config.fontFamily}`;
    ctx2.fillText(`${T('tut.label')}  ${t.step + 1 - (IS_MOBILE && t.step > 1 ? 1 : 0)} / ${TUTORIAL_STEPS.length - (IS_MOBILE ? 1 : 0)}　${st.title()}`, cx, y0 + 19);
    ctx2.fillStyle = '#ffffff';
    ctx2.font = `600 17px ${config.fontFamily}`;
    lines.forEach((ln, k) => {
        ctx2.fillStyle = hlFlags[k] ? `hsl(${45 + Math.sin(frameCount * 0.12) * 8}, 100%, ${66 + Math.sin(frameCount * 0.2) * 8}%)` : '#ffffff'; // 強調行は金色で明滅
        ctx2.fillText(ln, cx, y0 + 44 + k * 24);
    });
    if (t.clearT > 0) {
        ctx2.fillStyle = `hsl(${(frameCount * 8) % 360}, 100%, 70%)`;
        ctx2.font = `800 20px ${config.fontFamily}`;
        ctx2.fillText('CLEAR!', cx, y0 + 69 + extra);
    } else if (t.hitFlash > 0) {
        ctx2.fillStyle = '#ff5577';
        ctx2.font = `700 15px ${config.fontFamily}`;
        ctx2.fillText(T('tut.hit'), cx, y0 + 69 + extra);
    } else {
        ctx2.fillStyle = '#b8c4ff';
        ctx2.font = `600 15px ${config.fontFamily}`;
        ctx2.fillText(st.progress(t), cx, y0 + 69 + extra);
    }
    // ステップの進行ドット
    const nDots = TUTORIAL_STEPS.length - (IS_MOBILE ? 1 : 0);
    for (let k = 0, d = 0; k < TUTORIAL_STEPS.length; k++) {
        if (IS_MOBILE && k === 1) continue;
        ctx2.beginPath();
        ctx2.arc(cx - (nDots - 1) * 9 + (d++) * 18, y0 + h + 10, 3.5, 0, Math.PI * 2);
        ctx2.fillStyle = k < t.step ? '#7dffb0' : k === t.step ? '#ffffff' : 'rgba(255,255,255,0.25)';
        ctx2.fill();
    }
    ctx2.restore();
}

function update(timestamp) {
    if (gameState !== 'paused') {
        if (!lastTimestamp) {
            lastTimestamp = timestamp;
        }
        const dt_ms = timestamp - lastTimestamp;
        const dt_sec = Math.min(dt_ms / 1000, 1 / 30);
        lastTimestamp = timestamp;

        pollInput();
        updateInstructions();

        // ★ ここから追加 ★
        mutekiTextBottom = 0;
    if (mutekiAnim.life > 0 && gameState !== 'paused' && gameState !== 'gameOver') {
            mutekiAnim.life -= 60 * dt_sec; // フレームレートに依存しないようにdt_secで減算
            if (mutekiAnim.life < 0) mutekiAnim.life = 0;
        }
        // ★ ここまで追加 ★

        if (chainComboAnim.life > 0) {
            chainComboAnim.life--;
        }
        
        if (screenShake.duration > 0) {
            screenShake.duration--;
            if (screenShake.duration <= 0) {
                screenShake.intensity = 0;
            }
        }

        if (grayscaleAnimation.isActive && grayscaleAnimation.progress < 1) {
            grayscaleAnimation.progress += dt_sec / 1.0;
            if (grayscaleAnimation.progress > 1) {
                grayscaleAnimation.progress = 1;
            }
        }

        if (gameState === 'playing' && input.pauseTrigger) {
            pauseGame();
            return;
        }

        // Toggle invincibility cheat
        const isMPressed = keyState['KeyM'];
        if (isMPressed && !wasMPressed) {
            if (gameState === 'playing') {
                isInvincible = !isInvincible;
                if (isInvincible) hasUsedInvincibility = true;
            }
        }
        wasMPressed = isMPressed;


        const previousVisualBeat = visualBeat;
        visualBeat *= 0.85;
        if (visualBeat < 0.01) {
            visualBeat = 0;
        }

        updateBackground(dt_sec);
        
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life--;
            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                if (p.gravityMultiplier) {
                    p.vy += config.gravity * p.gravityMultiplier * dt_sec;
                }
                p.x += p.vx * dt_sec;
                p.y += p.vy * dt_sec;
            }
        }
        
        for (let i = effects.length - 1; i >= 0; i--) {
            const e = effects[i];
            e.life--;
            if (e.life <= 0) {
                effects.splice(i, 1);
            }
        }

        if (gameState === 'playing') {
            frameCount++;
            audioHandler.scheduleBGM();
            elapsedTime += dt_ms;
            updatePlayingState(dt_sec);
            if (pendingHitClear) {
                pendingHitClear = false;
                const far = o => Math.hypot(o.x - player.x, o.y - player.y) > 150;
                comets = comets.filter(far);
                enemyBullets = enemyBullets.filter(far);
            }

            if (chainEffectPending && visualBeat >= 1.0 && previousVisualBeat < 1.0) {
                effects.push({ type: 'shockwave', x: 150, y: IS_MOBILE ? 184 : 65, life: 20, maxLife: 20, radius: 20, hud: true });
                effects.push({ type: 'screenFlash', life: 8, maxLife: 8 });
                chainEffectPending = false; // ★ 変更点: この行は元々ありましたが、この変更がパフォーマンス改善の鍵となります
            }

        } else if (gameState === 'confirmReset') { // ★ この else if ブロックを追加
            if (input.confirmYesTrigger) {
                resetHighScores();
                gameState = 'title';
            } else if (input.confirmNoTrigger) {
                gameState = 'title';
            }
        } else if (gameState === 'title') {
            // ★ ここから追加 ★
            if (input.resetTrigger) {
                gameState = 'confirmReset';
                return; // 状態が変わったので、このフレームの残りの更新はスキップ
            }
            frameCount++;

            // --- タイマー更新 ---
            if (effectTimer > 0) {
                effectTimer--;
            }
            if (descriptionTimer > 0) {
                descriptionTimer--;
                if (descriptionTimer === 0) {
                    // 説明表示期間が完全に終了したので、元のテキストに戻るためのエフェクトを開始
                    effectTimer = EFFECT_DURATION;
                }
            }

            // --- 入力処理 ---
            if (input.nameTrigger) { openNameEdit(); return; }
            if (input.leftTrigger || input.rightTrigger) { openRanking(); if (input.leftTrigger) rankView.diff = (rankView.diff + DIFFS.length - 1) % DIFFS.length; else rankView.diff = (rankView.diff + 1) % DIFFS.length; return; } // 左右でランキング画面へ
            const prevMenuIndex = titleMenuIndex;
            if (input.upTrigger) {
                titleMenuIndex = (titleMenuIndex - 1 + titleMenuItems.length) % titleMenuItems.length;
            }
            if (input.downTrigger) {
                titleMenuIndex = (titleMenuIndex + 1) % titleMenuItems.length;
            }
            if (tapSel !== null) titleMenuIndex = tapSel;

            if (prevMenuIndex !== titleMenuIndex) {
                audioHandler.playSound('menu'); // カーソル音
                // メニューが変更されたので、エフェクトと説明タイマーを開始
                effectTimer = EFFECT_DURATION;
                descriptionTimer = DESCRIPTION_DISPLAY_DURATION;
            }

            // --- 表示テキストの決定 ---
            let targetText;
            if (descriptionTimer > 0) {
                targetText = T('md.' + titleMenuIndex);
            } else {
                targetText = TK('start');
            }

            if (effectTimer > 0) {
                let randomText = '';
                // 表示されるテキストの長さに合わせてランダムな文字列を生成
                for (let i = 0; i < targetText.length; i++) {
                    randomText += RANDOM_CHARS[Math.floor(Math.random() * RANDOM_CHARS.length)];
                }
                titleBottomText = randomText;
            } else {
                titleBottomText = targetText;
            }
            
            // --- ゲーム開始処理 ---
            if (input.replayTrigger) {
                audioHandler.initialize();
                if (titleMenuItems[titleMenuIndex] === 'TUTORIAL') startTutorial();
                else {
                    // モードを選んだら難易度選択へ
                    pendingMode = titleMenuItems[titleMenuIndex];
                    diffMenuIndex = difficultyIndex;
                    gameState = 'difficulty';
                    audioHandler.playSound('menu');
                }
            }
        } else if (gameState === 'difficulty') {
            frameCount++;
            if (input.upTrigger) { diffMenuIndex = (diffMenuIndex + DIFFS.length - 1) % DIFFS.length; audioHandler.playSound('menu'); }
            if (input.downTrigger) { diffMenuIndex = (diffMenuIndex + 1) % DIFFS.length; audioHandler.playSound('menu'); }
            if (tapDiffSel !== null) { diffMenuIndex = tapDiffSel; audioHandler.playSound('menu'); }
            if (input.titleTrigger) {
                gameState = 'title';
            } else if (input.replayTrigger) {
                difficultyIndex = diffMenuIndex;
                try { localStorage.setItem('cometPlusDifficulty', difficultyIndex); } catch (e) {}
                loadHighScores();
                startGame(pendingMode);
            }
        } else if (gameState === 'ranking') {
            frameCount++;
            rankInput();
        } else if (gameState === 'nameEdit') {
            frameCount++;
            if (nameEntry) nameEntryInput(); else gameState = 'title';
        } else if (gameState === 'gameOver') {
            frameCount++; // Keep frameCount running for animations
            if (nameEntry) nameEntryInput(); // ネーム登録中は他の操作をしない
            else if (input.titleTrigger) {
                 gameState = 'title';
                 init();
            } else if (input.replayTrigger) {
                startGame(gameMode);
            }
        }
    } else { // Paused
        pollInput();
        updateInstructions();
        if (input.pauseTrigger) {
            gameState = 'playing';
            lastTimestamp = 0;
            resumeAudioClock();
        } else if (input.titleTrigger) {
             audioHandler.stopBgm();
             resumeAudioClock();
             gameState = 'title';
             init();
        }
    }
}


function drawRoundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawWithGlow(ctx, drawFunc, color, useBeat = false) {
    // ▼▼▼ このブロックを修正 ▼▼▼
    if (!isEffectsEnabled) {
        drawFunc(); // EFX OFF時はグローを適用せず、描画関数のみ実行
        return;
    }
    // ▲▲▲ 修正はここまで ▲▲▲
    if (IS_MOBILE || (typeof quality !== 'undefined' && quality < 0.9)) { drawFunc(); return; } // 重い時は文字のグローを省く
    const blurAmount = useBeat ? (config.glowBlur + Math.round(visualBeat * 4) * 2) : config.glowBlur;
    ctx.shadowColor = color;
    ctx.shadowBlur = blurAmount;
    drawFunc();
    ctx.shadowBlur = 0;
}

function formatTime(ms) {
    if (isNaN(ms)) ms = 0;
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const msec = Math.floor(ms % 1000);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(msec).padStart(3,'0')}`;
}

function drawChainComboText(renderCtx, count, alpha = 1.0) {
    const comboText = `${count} CHAIN COMBO!!`;
    const baseFontSize = IS_MOBILE ? 22 : 16;
    const sizeStep = 2;
    const maxChainForSizing = 30;
    const chainLevel = Math.floor((Math.min(count, maxChainForSizing) - 1) / 5);
    let fontSize = baseFontSize + chainLevel * sizeStep;
    
    // ★ 変更点: effects.find() をやめ、専用のタイマーを参照する
    const comboEffect = chainComboAnim.life > 0 ? chainComboAnim : null;
    let textToDraw = comboText;

    if (comboEffect && alpha === 1.0) {
        const progress = 1 - (comboEffect.life / comboEffect.maxLife);
        fontSize = fontSize * 1.2 - (fontSize * 0.2) * progress;

        const chars = "!?#$ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        // ★ 変更点: 文字列の直接連結をやめ、配列を使って高速化
        const textChars = [];
        for (let i = 0; i < comboText.length; i++) {
            if (progress > (i / comboText.length) * 0.5 + (frameRand(i) * 0.1)) {
                textChars.push(comboText[i]);
            } else {
                textChars.push(chars[Math.floor(frameRand(i + 50) * chars.length)]);
            }
        }
        textToDraw = textChars.join('');
    }

    renderCtx.save();
    renderCtx.globalAlpha = alpha;
    renderCtx.font = `600 ${fontSize}px ${config.fontFamily}`;
    renderCtx.textAlign = 'left';

    const textMetrics = renderCtx.measureText(textToDraw);
    const gradient = renderCtx.createLinearGradient(20, 0, 20 + textMetrics.width, 0);
    const numColors = 12;
    for (let i = 0; i < numColors; i++) {
        const hue = (rTime * 1000 / 15 + i * (360 / numColors)) % 360; // ゲーム内時間（停止中は止まる）
        gradient.addColorStop(Math.max(0, Math.min(1, i / (numColors - 1))), `hsl(${hue}, 100%, 70%)`);
    }

    renderCtx.fillStyle = gradient;

    drawWithGlow(renderCtx, () => {
        renderCtx.fillText(textToDraw, 20, IS_MOBILE ? 190 : 70);
    }, '#ffffcc', true);

    renderCtx.restore();
}

function drawTitleTextMorph(renderCtx, x, y, font, color) {
    const originalText = 'outburst+';
    const chars = "!?#$@%&<>*=/+abcdefghijklmnopqrstuvwxyz0123456789";
    const now = Date.now();
    const cycle = 2000; // 2秒周期
    const timeInCycle = now % cycle;
    let textToShow = '';

    // 0-999ms: 静的表示
    if (timeInCycle < 1000) {
        textToShow = originalText;
    } else {
        // 1000-2000ms: アニメーション
        const animProgress = (timeInCycle - 1000) / 1000; // 0.0 ~ 1.0

        if (animProgress > 0.8) {
            // 最後の0.2秒で収束
            const convergeProgress = (animProgress - 0.8) / 0.2; // 0.0 ~ 1.0
            const len = originalText.length + Math.round(originalText.length * (1 - convergeProgress));
            for(let i = 0; i < len; i++) {
                textToShow += chars[Math.floor(Math.random() * chars.length)];
            }
        } else {
            // 最初の0.8秒は倍の長さ
            const expandedLength = originalText.length * 2;
            for(let i = 0; i < expandedLength; i++) {
                textToShow += chars[Math.floor(Math.random() * chars.length)];
            }
        }
    }

    drawWithGlow(renderCtx, () => {
        renderCtx.font = font;
        renderCtx.fillStyle = color;
        renderCtx.fillText(textToShow, x, y);
    }, color);
}

    composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(Math.round(VW * PR), Math.round(VH * PR), { type: THREE.HalfFloatType, samples: msaa }));
    composer.setPixelRatio(PR);

    bloom = new UnrealBloomPass(new THREE.Vector2(VW, VH), 0.6, 0.4, 0.38);
    { const bk = 0.6; /* スマホも低すぎるとグローが荒く見えるのでPCと同じ比率 */ const ss = bloom.setSize.bind(bloom); bloom.setSize = (w, h) => ss(Math.round(w * bk), Math.round(h * bk)); bloom.setSize(VW * PR, VH * PR); } // ブルームは低解像度で（GPU負荷＝遅延を減らす） // スマホはブルームを半解像度で
    composer.addPass(bloom);
    // ハイパー中の色調: ステージの色を活かしたまま色相を少し回し、鮮やかに（ハイパー中だけ有効）
    hyperGrade = new ShaderPass({
        uniforms: { tDiffuse: { value: null }, amt: { value: 0 }, t: { value: 0 }, gray: { value: 0 } },
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: `uniform sampler2D tDiffuse; uniform float amt; uniform float t; uniform float gray; varying vec2 vUv;
            void main(){
                vec4 c = texture2D(tDiffuse, vUv);
                const mat3 toY = mat3(0.299, 0.596, 0.211, 0.587, -0.274, -0.523, 0.114, -0.322, 0.312);
                const mat3 toR = mat3(1.0, 1.0, 1.0, 0.956, -0.272, -1.106, 0.621, -0.647, 1.703);
                vec3 yiq = toY * c.rgb;
                float h = amt * (0.32 + 0.1 * sin(t * 2.0)); // 色相は控えめに回す（ステージの色を残す）
                float cs = cos(h), sn = sin(h);
                yiq.yz = mat2(cs, sn, -sn, cs) * yiq.yz * (1.0 + 0.08 * amt);
                vec3 g = toR * yiq;
                // ネオン感: 暗部は深い紫へ沈め、光っている所だけを強く・白熱させる
                float l = dot(g, vec3(0.299, 0.587, 0.114));
                vec3 sh = vec3(0.13, 0.03, 0.28);
                g = mix(sh * (0.1 + l * 2.0) + g * 0.55, g, smoothstep(0.08, 0.4, l));
                g = pow(max(g, 0.0), vec3(1.15)) * 1.1;
                g += smoothstep(0.55, 1.0, l) * vec3(0.09, 0.035, 0.12) * (0.8 + 0.2 * sin(t * 7.0)); // 明部にピンクの白熱
                float vig = 1.0 - amt * 0.3 * smoothstep(0.35, 0.85, length(vUv - 0.5));
                vec3 o = mix(c.rgb, g * vig, clamp(amt, 0.0, 1.0));
                float lo = dot(o, vec3(0.299, 0.587, 0.114));
                gl_FragColor = vec4(mix(o, vec3(lo) * (1.0 - 0.2 * gray), gray), c.a); // エネルギー切れのゲームオーバーで白黒に（CSSのフィルターより軽い）
            }`
    });
    hyperGrade.enabled = false;
    composer.addPass(hyperGrade);
    composer.addPass(new OutputPass());
}

            // なめらかなガウス風の減衰（縁は0へ滑らかに）。負荷はほぼ増えない
            float r2 = r * r;
            float halo = (exp(-r2 * 4.2) * 0.95 + exp(-r2 * 14.0) * 0.25) * (1.0 - r2) * 0.85;
            float core = exp(-r2 * 22.0); // 芯もなめらかに（硬い点だとチラつく）
            vec3 col = (vColor * halo + vec3(core) * length(vColor) * 0.55) * vFade;
            gl_FragColor = vec4(col, 1.0); // ディザはグローに拾われてチラつくので入れない
        }`,

});

function makeTrailTexture() {
    const c = document.createElement('canvas');
    c.width = 32; c.height = 128;
    const g = c.getContext('2d');
    const img = g.createImageData(32, 128);
    for (let y = 0; y < 128; y++) {
        const along = Math.pow(1 - y / 127, 1.7);
        for (let x = 0; x < 32; x++) {
            const dx = (x - 15.5) / 15.5;
            const across = Math.exp(-dx * dx * 4.0);
            const a = Math.min(1, along * across * 1.1);
            const i = (y * 32 + x) * 4;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
            img.data[i + 3] = a * 255;
        }
    }
    g.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
}

function glowInstMaterial(k, extra = {}) {

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
const AXIS_Y = new THREE.Vector3(0, 1, 0);

class TrailBatch {
    constructor(max) {

        this.mesh = new THREE.InstancedMesh(trailGeo, mat, max);

    begin() { this.n = 0; }
    // a = 尾, b = 先端
    add(ax, ay, az, bx, by, bz, width, c, intensity = 1) {
        if (this.n >= this.max) return;
        const dx = bx - ax, dz = bz - az;
        const len = Math.max(0.001, Math.hypot(dx, dz));
        _v.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
        _q.setFromAxisAngle(AXIS_Y, Math.atan2(-dx, -dz));
        _s.set(width, 1, len);
        _m4.compose(_v, _q, _s);
        this.mesh.setMatrixAt(this.n, _m4);
        _tmpC2.copy(c).multiplyScalar(intensity);

class InstPool {
    constructor(geo, mat, max, renderOrder = 0) {

        _v.set(x, y, z);
        _q.setFromEuler(_e.set(rx, ry, rz));
        _s.set(sx, sy, sz);
        _m4.compose(_v, _q, _s);

    end() {

        this.mesh.instanceColor.needsUpdate = true;
    }
}

function gridLines(size, step, y) {
    const p = [];
    for (let i = -size; i <= size; i += step) {
        p.push(-size, y, i, size, y, i, i, y, -size, i, y, size);
    }

function towerGeometry(w, d, h, step, taper = 1) {
    const p = [];
    const ring = (y, s) => {
        const x0 = -w / 2 * s, x1 = w / 2 * s, z0 = -d / 2 * s, z1 = d / 2 * s;
        p.push(x0, y, z0, x1, y, z0, x1, y, z0, x1, y, z1, x1, y, z1, x0, y, z1, x0, y, z1, x0, y, z0);
    };
    const levels = Math.max(1, Math.floor(h / step));
    for (let i = 0; i <= levels; i++) {
        const y = (i / levels) * h;
        ring(y, 1 + (taper - 1) * (i / levels));
    }
    const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    corners.forEach(([sx, sz]) => {
        p.push(sx * w / 2, 0, sz * d / 2, sx * w / 2 * taper, h, sz * d / 2 * taper);
    });
    // 窓のような縦線
    for (let k = 1; k < 3; k++) {
        const fx = -w / 2 + (w * k) / 3;
        p.push(fx, 0, d / 2, fx * taper, h, d / 2 * taper, fx, 0, -d / 2, fx * taper, h, -d / 2 * taper);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    return g;
}
function spireGeometry(r, h) {
    const p = [];
    const sides = 4;
    for (let i = 0; i < sides; i++) {
        const a0 = (i / sides) * Math.PI * 2 + Math.PI / 4, a1 = ((i + 1) / sides) * Math.PI * 2 + Math.PI / 4;
        p.push(Math.cos(a0) * r, 0, Math.sin(a0) * r, 0, h, 0);
        for (let lv = 0; lv < 8; lv++) {
            const t = lv / 8, s = 1 - t;
            p.push(Math.cos(a0) * r * s, h * t, Math.sin(a0) * r * s, Math.cos(a1) * r * s, h * t, Math.sin(a1) * r * s);
        }
        // クロスブレース
        p.push(Math.cos(a0) * r, 0, Math.sin(a0) * r, Math.cos(a1) * r * 0.5, h * 0.5, Math.sin(a1) * r * 0.5);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    return g;
}

function addGlass(obj, w, d, h, step, count) {
    const floors = Math.max(1, Math.floor(h / step));
    for (let n = 0; n < count; n++) {
        const face = Math.floor(Math.random() * 4), fw = face % 2 ? d : w;
        const k0 = Math.floor(Math.random() * floors), len = Math.min(floors - k0, 1 + Math.floor(Math.random() * 4)); // 1〜4階分の帯
        const m = new THREE.Mesh(_glassGeo, glassMats[Math.floor(Math.random() * glassMats.length)]);
        const part = Math.random() < 0.5 ? 1 : 0.5, off = part < 1 ? (Math.random() < 0.5 ? -0.25 : 0.25) * fw : 0;
        m.scale.set(fw * part * 0.94, step * len * 0.9, 1);
        const y = (k0 + len / 2) * step;
        if (face === 0) m.position.set(off, y, d / 2 + 0.5);
        else if (face === 2) m.position.set(off, y, -d / 2 - 0.5);
        else { m.position.set((face === 1 ? 1 : -1) * (w / 2 + 0.5), y, off); m.rotation.y = Math.PI / 2; }
        obj.add(m);
    }
}

function terrainGeometry(w, d, seg, amp, seed) {
    const g = new THREE.PlaneGeometry(w, d, seg, seg);
    g.rotateX(-Math.PI / 2);
    const pos = g.attributes.position;
    for (let k = 0; k < pos.count; k++) {

        const edge = Math.min(1, Math.abs(x) / (w / 2) * 1.6);

        pos.setY(k, Math.max(0, h));

    for (let i = motifFading.length - 1; i >= 0; i--) {
        const m = motifFading[i]; m.fadeT += dt / 2.0;
        const e = Math.min(1, m.fadeT), ee = 1 - Math.pow(1 - e, 2);
        m.fade = 1 - ee; m.group.position.y = -420 * ee; m.group.scale.set(1 + ee * 0.25, Math.max(0.05, 1 - ee * 0.6), 1 + ee * 0.25);

    }
    motifs.forEach(m => { if (!m.group.visible) return; m.sync.forEach(([c, o]) => { c.color.copy(o.color); c.opacity = o.opacity * m.fade; }); });

            if (it.obj.position.z > WORLD_NEAR) m.place(it, it.obj.position.z - WORLD_SPAN);

        const p = lt / 1.1;

for (let i = 0; i < FRAME_N; i++) {
    let d = (i / FRAME_N) * framePerim; // 下辺中央から時計回り
    let x, z;
    const hw = W / 2, hh = H / 2, ht = hh + FRAME_TOP_EXT;

    if (Math.abs(z - hh) < 0.01 || Math.abs(z + ht) < 0.01) { frameNx[i] = 0; frameNz[i] = Math.sign(z); }

function buildVoxelModel(art, px, heights) {
    const group = new THREE.Group();
    const rows = art.length, cols = art[0].length;
    const byCode = {};
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const code = art[r][c];
            if (!code) continue;
            const h = px * (heights[code] || 1);
            const box = new THREE.BoxGeometry(px * 0.94, h, px * 0.94);
            box.translate((c - cols / 2 + 0.5) * px, h / 2, (r - rows / 2 + 0.5) * px);
            (byCode[code] = byCode[code] || []).push(box);
        }
    }
    const mats = {};
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    Object.keys(byCode).forEach(code => {
        const geo = mergeGeometries(byCode[code]);
        const mat = new StdMat({ color: 0xffffff, emissive: 0x000000, flatShading: true, metalness: 0.35, roughness: 0.35 });
        mats[code] = mat;
        group.add(new THREE.Mesh(geo, mat));
        group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
    });
    return { group, mats, edgeMat };
}

// 当たり判定がない間（登場中・無敵中）はドット状のモザイクで半透明にする
const bossMosaicU = { value: 0 };
function applyMosaic(mat) {
    if (mat.userData.mosaic) return;
    mat.userData.mosaic = true;
    mat.transparent = true;
    mat.customProgramCacheKey = () => 'bossMosaic';
    mat.onBeforeCompile = sh => {
        sh.uniforms.uMosaic = bossMosaicU;
        sh.fragmentShader = 'uniform float uMosaic;\n' + sh.fragmentShader.replace('#include <tonemapping_fragment>', `
            if (uMosaic > 0.001) {
                float cs = mix(1.5, 7.0, uMosaic);
                vec2 f = fract(gl_FragCoord.xy / cs) - 0.5;
                if (length(f) > mix(0.75, 0.34, uMosaic)) discard;
                gl_FragColor.a *= mix(1.0, 0.5, uMosaic);
                gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(dot(gl_FragColor.rgb, vec3(0.3333))), 0.35 * uMosaic);
            }
            #include <tonemapping_fragment>`);
    };
    mat.needsUpdate = true;
}
function renderBoss(dt) {
    if (bossObj && bossObjFor !== boss) {
        // ボスが消えた: 撃破なら破片
        if (!boss && bossObjFor && bossObjFor.hp <= 0) {
            const b = bossObjFor;
            spawnBurst(b.x, b.y, themeCur.ui, 90, { speed: 600, up: 800, minSize: 4, maxSize: 14 });
            spawnBurst(b.x, b.y, COL_WHITE, 40, { speed: 400, up: 600, minSize: 3, maxSize: 8 });
        }
        scene.remove(bossObj);
        (bossObj.userData.extra || []).forEach(e => scene.remove(e));
        bossObj = null; bossObjFor = null;
    }
    if (!boss) return;
    if (!bossObj) {
        bossMosaicU.value = 1;
        bossObj = BOSS_BUILDERS[boss.idx]();
        bossObj.userData.mats = [];
        const collect = o => o.traverse(c => {
            if (!c.material) return;
            applyMosaic(c.material);
            if (c.material.emissive) bossObj.userData.mats.push({ m: c.material, base: c.material.emissiveIntensity });
        });
        collect(bossObj);
        (bossObj.userData.extra || []).forEach(collect);
        bossObjFor = boss;
        bossObj.scale.setScalar(BS);
        scene.add(bossObj);
    }
    const b = boss;
    const noHit = b.state !== 'fight' || b.invuln;
    bossMosaicU.value = noHit ? Math.min(1, bossMosaicU.value + dt * 6) : Math.max(0, bossMosaicU.value - dt * 3.5);
    bossObj.position.set(toX(ix(b)), 50 + Math.sin(rTime * 2) * 8, toZ(iy(b)));
    bossObj.userData.anim(bossObj, b, rTime);
    if (IS_MOBILE) { // スマホは大ボスをカメラ寄りに浮かせて大きく見せる（画面上の位置は同じ）
        liftToCam(bossObj);
        if (b.idx !== undefined) (bossObj.userData.extra || []).forEach(e => { if (e.userData.lift) liftToCam(e); });
    }
    const fl = b.flash > 0 ? 3.5 : 0;
    bossObj.userData.mats.forEach(({ m, base }) => { m.emissiveIntensity = base + fl + visualBeat * 0.25; });
    if (isEffectsEnabled) glow.add(bossObj.position.x, 20, bossObj.position.z, themeCur.ui, 380, 0.12 + visualBeat * 0.08);
}

const Q_MAX = PR, Q_MIN = IS_MOBILE ? 0.45 : 0.55;
let quality = PR, qCeil = PR;
const perf = { t0: 0, frames: 0, good: 0, lastRaise: -1e9 };
function applyQuality() {
    renderer.setPixelRatio(quality);
    renderer.setSize(VW, VH, false);
    composer.setPixelRatio(quality);
    composer.setSize(VW, VH);
    glowMat.uniforms.uScale.value = GLOW_BASE * quality;
}
function adaptQuality(now) {
    if (!perf.t0) { perf.t0 = now; return; }
    if (now - perf.lastFrame > 500) { perf.t0 = now; perf.frames = 0; } // タブ復帰などの長い空白は無視
    perf.lastFrame = now;
    perf.frames++;
    const span = now - perf.t0;
    if (span < 1000) return;
    const fps = perf.frames * 1000 / span;
    perf.t0 = now; perf.frames = 0;
    perf.bad = fps < 54 ? (perf.bad || 0) + 1 : 0;
    if (perf.bad >= 3 && quality > Q_MIN) {
        perf.bad = 0;
        if (now - perf.lastRaise < 20000) qCeil = Math.max(Q_MIN, quality - 0.05); // 上げてすぐ落ちたら上限を固定（行ったり来たりを防ぐ）
        quality = Math.max(Q_MIN, quality - 0.15);
        perf.good = 0;
        applyQuality();
    } else if (fps >= 58) {
        perf.good++;
        if (perf.good >= 12 && quality < Math.min(Q_MAX, qCeil) && gameState !== 'playing') { // プレイ中は画質を上げ直さない（切り替えの一瞬のカクつきを避ける）
            quality = Math.min(Q_MAX, qCeil, quality + 0.1);
            perf.good = 0;
            perf.lastRaise = now;
            applyQuality();
        }
    } else {
        perf.good = 0;
    }
}

        shipPivot.rotation.x = -0.12;

        const glazeR = player.radius + (player.invincibleTimer > 0 ? config.glazeDistance * INV_GLAZE_K : config.glazeDistance);
        glazeDisc.position.set(px, 11, pz); glazeDisc.scale.setScalar(glazeR);
        glazeRing.position.set(px, 11.5, pz); glazeRing.scale.setScalar(glazeR);
        glazeFillMat.color.copy(themeCur.player);
        glazeRingMat.color.copy(themeCur.player);
        glazeFillMat.opacity = efx ? 0.025 + visualBeat * 0.04 : 0.0;
        glazeRingMat.opacity = efx ? 0.16 + visualBeat * 0.22 : 0.3;

        // エンジン
        if (playerVisible) {
                        const flick = 0.8 + Math.random() * 0.4;
            [0].forEach(off => { // 推進ユニットの噴射口（2枚の羽の間）
                const ex = px + off * VS * Math.cos(shipBank), ez = pz + 14 * VS;
                glow.add(ex, 12, ez, themeCur.player, 24 * flick * VS, 1.5);
                if (efx) trails.add(ex, 11, ez + 46 * flick * VS, ex, 11, ez, 9 * VS, themeCur.player, 1.0);
            });
            // 当たり判定とスローマーカー
            // 当たり判定の円だけを、色を回して表示
            hitDot.visible = true;
            hitDot.position.set(px, 12, pz); // 機体・円と同じ高さに置き、遠近で中心がずれないように
            hitDot.scale.setScalar(config.playerHitboxRadius);
            hsl(frameCount * 10, 1, 0.6, hitDotMat.color);
        }

        if (player.invincibleTimer > 0) {
            const blinkShield = player.invincibleTimer < 30 && frameCount % 10 < 5;
            shield.visible = !blinkShield;
            shield.position.set(px, 12, pz);
            shield.scale.setScalar(config.playerVisualSize * 1.5 * (1 + visualBeat * 0.15));
            shield.rotation.set(rTime * 1.2, rTime * 1.8, 0);
            shieldMat.opacity = 0.45 + Math.sin(frameCount * 0.2) * 0.2;

            const blinkMeter = player.invincibleTimer < 60 && frameCount % 10 < 5;
            meter.visible = !blinkMeter;
            const prog = Math.max(0, Math.min(1, player.invincibleTimer / player.maxInvincibleTimer));
            meter.geometry.setDrawRange(0, 6 * Math.round(METER_SEG * prog));
            meter.position.set(px, 2, pz);
            const mr = glazeR + 5;
            meter.scale.set(-mr, mr, mr);
            hsl(frameCount * 4, 1, 0.7, meterMat.color);
        }
    }

    // 衝撃波（HUD用 x=150,y=65 はHUDで描画）
    let si = 0;
    effects.forEach(e => {
        if (e.type !== 'shockwave' || e.hud || !efx) return;
        const s = shockPool[si++];
        if (!s) return;
        const progress = 1 - e.life / e.maxLife;
        const alpha = e.life / e.maxLife;
        const r = e.radius + progress * 300;
        s.ring.visible = s.sph.visible = true;
        s.ring.position.set(toX(e.x), 3, toZ(e.y));
        s.ring.scale.setScalar(r);
        s.ringMat.opacity = alpha * 0.9;
        s.sph.position.set(toX(e.x), 10, toZ(e.y));
        s.sph.scale.setScalar(e.radius + progress * 140);
        s.sph.rotation.y = progress * 2;
        s.sphMat.opacity = alpha * 0.55;
        s.sphMat.color.copy(themeCur.ui).lerp(COL_WHITE, 0.4);
    });
    for (; si < shockPool.length; si++) shockPool[si].ring.visible = shockPool[si].sph.visible = false;

    // 小節スイープ
    const bar = effects.find(e => e.type === 'barLine');
    if (bar && efx && gameState !== 'title') {
        const progress = 1 - bar.life / bar.maxLife;
        sweep.visible = true;
        sweep.position.set(0, 2, -H / 2 + H * progress);
        sweepMat.color.copy(themeCur.ui);
        sweepMat.opacity = Math.sin((1 - progress) * Math.PI) * 0.22;
    } else {
        sweep.visible = false;
    }

    // ロックオンライン
    linkPool.forEach(l => {
        if (l.life <= 0) { l.line.visible = false; return; }
        l.life -= dt;
        const a = Math.max(0, l.life / l.max);
        l.line.visible = true;
        const sx = toX(player.x), sz = toZ(player.y), tx = toX(l.tx), tz = toZ(l.ty);
        const mx = (sx + tx) / 2 + (tz - sz) * 0.35 * l.bend, mz = (sz + tz) / 2 - (tx - sx) * 0.35 * l.bend;
        for (let i = 0; i < LINK_PTS; i++) {
            const t = i / (LINK_PTS - 1);
            const it = 1 - t;
            l.pos[i * 3] = it * it * sx + 2 * it * t * mx + t * t * tx;
            l.pos[i * 3 + 1] = 12 + Math.sin(t * Math.PI) * 50;
            l.pos[i * 3 + 2] = it * it * sz + 2 * it * t * mz + t * t * tz;
        }
        l.line.geometry.attributes.position.needsUpdate = true;
        l.mat.color.setRGB(0.75, 0.38, 1).multiplyScalar(a * 1.4);
        l.mat.opacity = a;
        glow.add(tx, 8, tz, COL_GLAZE, 40 * a, a);
    });

    glow.end(); trails.end(); cometBodies.end(); cometWires.end(); bulletBodies.end(); debrisCubes.end(); gemBodies.end();

    if (!gl3dOK) return;
    adaptQuality(now);
    if (efx) {
        bloom.strength = (0.48 + visualBeat * (IS_MOBILE ? 0.12 : 0.28)) / (1 + comets.length / 260) * (1 - hyperK * (1 - hpLightK) * 0.45) + hyperK * 0.06 * hpLightK; // ハイパー中は光をにじませてネオン感を出す
        // 取ったら約1秒かけてじわっと変化し、切れたら約1秒かけて戻る（なめらかな曲線で）
        hyperLin = Math.max(0, Math.min(1, hyperLin + (hyperT > 0 ? 1 : -1) * (frozen ? 0 : dt) / 1.0));
        hyperK = hyperLin * hyperLin * (3 - 2 * hyperLin);
        if (hyperK < 0.002) hyperK = 0;
        const grayK = gameState === 'gameOver' && gameOverReason === 'energy' ? grayscaleAnimation.progress : 0;
        hyperGrade.uniforms.gray.value = grayK;
        hyperGrade.enabled = hyperK > 0 || grayK > 0;
        hyperGrade.uniforms.amt.value = hyperK * (0.7 + 0.3 * hpLightK); // 明るいステージでは色調変化も控えめ
        hyperGrade.uniforms.t.value = rTime;
        composer.render(dt);
    } else {
        renderer.render(scene, camera);
    }
}


// ---------------------------------
// タイトルのデモ: 今のハブ＋各ボスとそのステージのテーマをランダムに切り替えて見せる
// ---------------------------------
const titleDemo = { idx: -2, t: 0, group: null, cache: {} };
const DEMO_SPAN = 9; // 秒
function buildDemo(idx) {
    if (titleDemo.cache[idx]) return titleDemo.cache[idx];
    const grp = new THREE.Group();
    const obj = BOSS_BUILDERS[idx]();
    grp.add(obj);
    (obj.userData.extra || []).forEach(e => { scene.remove(e); grp.add(e); });
    grp.visible = false;
    scene.add(grp);
    return (titleDemo.cache[idx] = { grp, obj });
}
function updateTitleDemo(dt, showHub) {
    if (!showHub) {
        if (titleDemo.group) titleDemo.group.visible = false;
        titleDemo.idx = -2; // 次にタイトルへ来たら選び直す
        return;
    }
    titleDemo.t += dt;
    if (titleDemo.idx === -2 || titleDemo.t > DEMO_SPAN) {
        let n;
        do { n = Math.floor(Math.random() * (BOSS_BUILDERS.length + 1)) - 1; } while (n === titleDemo.idx);
        titleDemo.idx = n; titleDemo.t = 0;
        if (titleDemo.group) titleDemo.group.visible = false;
        titleDemo.group = null;
        // そのボスが出るステージのテーマ（ボスk番目は 3(k+1) 面）。ハブは1面のテーマ
        const ti = n < 0 ? 0 : (3 * n + 2) % themes.length;
        if (ti !== currentThemeIndex) { currentThemeIndex = ti; applyThemeStyles(themes[ti]); }
        if (n >= 0) { titleDemo.group = buildDemo(n).grp; titleDemo.group.visible = true; }
    }
    if (titleDemo.idx < 0 || !titleDemo.group) return;
    const d = titleDemo.cache[titleDemo.idx], t = rTime, k3 = Math.floor(t / 3) % 3;
    // アニメ用の仮のボス状態（ゲーム座標の中心＝グループの原点）
    const fb = { x: W / 2, y: H / 2, t: t * 60, alpha: 1, spin: t * 2, d: 140, open: Math.max(0, Math.sin(t * 1.5)), doors: Math.sin(t * 2) > 0 ? 1 : 0,
        charge: (Math.sin(t * 1.2) + 1) / 2, phase: k3, mode: '', telegraph: false, state: 'fight',
        hist: [0, 1, 2, 3, 4].map(i => ({ x: W / 2 + Math.sin(t * 2 - i * 0.3) * 30, y: H / 2 - i * 4 })),
        segs: Array.from({ length: 8 }, (_, k) => ({ x: W / 2 + Math.sin(t * 2.4 - (k + 1) * 0.55) * 46, y: H / 2 - (k + 1) * 30 })) };
    try { d.obj.userData.anim(d.obj, fb, t); } catch (e) {}
    d.obj.position.set(0, 0, 0);
    (d.obj.userData.extra || []).forEach(e => { if (e.userData.lift === undefined && e.geometry && e.geometry.type === 'PlaneGeometry') e.visible = false; });
    const g = titleDemo.group, b = visualBeat;
    g.position.copy(titleHub.position).add(new THREE.Vector3(0, 140, 0));
    g.rotation.y += dt * 0.45;
    g.rotation.x = Math.sin(t * 0.6) * 0.18;
    const appear = Math.min(1, titleDemo.t * 1.6), fade = Math.min(1, (DEMO_SPAN - titleDemo.t) * 2);
    g.scale.setScalar((IS_MOBILE ? 3.4 : 3.0) * (0.6 + 0.4 * Math.min(appear, fade)) * (1 + b * 0.08));
}

// =================================================================================
// ▼▼▼ HUD（2Dオーバーレイ）▼▼▼
// =================================================================================
function draw() {
    render3D();

    const renderCtx = ctx;
    const theme = themes[currentThemeIndex];
    renderCtx.setTransform(HUD_SCALE, 0, 0, HUD_SCALE, 0, 0);
    renderCtx.clearRect(0, 0, HUD_W, HUD_H);
    renderCtx.save();
    if (screenShake.intensity > 0 && gameState !== 'paused' && gameState !== 'confirmReset') { // 停止中は揺らさない
        renderCtx.translate((Math.random() - 0.5) * screenShake.intensity * 0.6, (Math.random() - 0.5) * screenShake.intensity * 0.6);
    }

    if (!gl3dOK) {
        renderCtx.fillStyle = '#ff3366';
        renderCtx.font = `600 14px ${config.fontFamily}`;
        renderCtx.textAlign = 'center';
        renderCtx.fillText(T('webgl'), HUD_W / 2, HUD_H - 60);
    }

    if (gameState === 'playing' || gameState === 'paused' || gameState === 'title') {
        applyThemeStyles(theme);
    }

    // タイトル画面の読みやすさ確保用ベール
    if (gameState === 'title' || gameState === 'confirmReset' || gameState === 'gameOver' || gameState === 'difficulty' || gameState === 'ranking' || gameState === 'nameEdit') {
        const g = renderCtx.createRadialGradient(HUD_W / 2, HUD_H / 2, 60, HUD_W / 2, HUD_H / 2, 560);
        g.addColorStop(0, gameState === 'title' ? 'rgba(5,0,18,0.7)' : 'rgba(5,0,18,0.55)');
        g.addColorStop(1, 'rgba(5,0,18,0.15)');
        renderCtx.fillStyle = g;
        renderCtx.fillRect(0, 0, HUD_W, HUD_H);
    }

    // ハイパーアイテムのラベルと、ハイパー中の残り時間
    // （アイテム上のHYPERの文字は表示しない）
    if (hyperT > 0 && (gameState === 'playing' || gameState === 'paused')) {
        const ratio = hyperT / HYPER_TIME, col = frameCount % 10 < 5 ? '#ffd400' : '#ff2d55';
        const tx = IS_MOBILE ? HUD_W - 20 : HUD_W / 2, ty = IS_MOBILE ? 156 : HUD_H - 50, bw = IS_MOBILE ? 150 : 180;
        renderCtx.save();
        renderCtx.textAlign = IS_MOBILE ? 'right' : 'center';
        renderCtx.font = `800 ${IS_MOBILE ? 22 : 16}px ${config.fontFamily}`;
        drawWithGlow(renderCtx, () => { renderCtx.fillStyle = col; renderCtx.fillText(`HYPER ×3  ${hyperT.toFixed(1)}`, tx, ty); }, col);
        const bx = IS_MOBILE ? tx - bw : tx - bw / 2;
        renderCtx.fillStyle = 'rgba(255,255,255,0.18)'; renderCtx.fillRect(bx, ty + 6, bw, 4);
        renderCtx.fillStyle = col; renderCtx.fillRect(bx, ty + 6, bw * ratio, 4);
        renderCtx.restore();
    }
    // スコアテキスト（3D位置をスクリーンに投影）
    if (scoreTexts.length > 0) {
        renderCtx.save();
        renderCtx.textAlign = 'center';
        scoreTexts.forEach(st => {
            const fontSize = (st.type === 'bonus' ? 14 : st.type === 'gem' ? 12 : 10) * (IS_MOBILE ? 1.5 : 1);
            renderCtx.font = `600 ${fontSize}px ${config.fontFamily}`;
            const alpha = st.type === 'gem' ? Math.min(1, st.life / 14) : st.life / 60.0;
            const hue = st.type === 'gem' ? 40 + (st.life * 7) % 30 : (frameCount * 5 + st.x) % 360;
            const scoreColor = `hsla(${hue}, 100%, 70%, ${alpha})`;
            const glowColor = `hsla(${hue}, 100%, 70%, ${alpha / 2})`;
            const sp = project(st.x, st.y, 24);
            renderCtx.globalAlpha = alpha;
            if (st.type === 'gem') {
                renderCtx.fillStyle = scoreColor;
                renderCtx.fillText(st.text, sp.x, sp.y);
            } else {
                drawWithGlow(renderCtx, () => {
                    renderCtx.fillStyle = scoreColor;
                    renderCtx.fillText(st.text, sp.x, sp.y);
                }, glowColor);
            }
        });
        renderCtx.restore();
    }

    // Draw UI
    const uiColor = theme.ui;
    const mainFontSize = (IS_MOBILE ? 25 : 20) + visualBeat * 2; // スマホは大きめ
    const subFontSize = (IS_MOBILE ? 22 : 18) + visualBeat * 2;

    // SCOREとタイマー表示 (タイトル画面以外で表示)
    if (gameState !== 'title' && gameState !== 'difficulty' && gameState !== 'confirmReset') {
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 ${mainFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            
            renderCtx.textAlign = 'left';
            renderCtx.fillText(`SCORE: ${IS_MOBILE ? shortNum(score) : score}`, 20, IS_MOBILE ? 46 : 40); // スマホは大きな数をK/Mで短く（タイムと重ならないように）

            renderCtx.textAlign = 'center';
            renderCtx.fillText(formatTime(elapsedTime), HUD_W / 2 + (IS_MOBILE ? 22 : 0), IS_MOBILE ? 46 : 40);
        }, uiColor, true);
    }

    // ゲームモードとSTAGE表示 (playing, paused, gameOver の時に表示)
    if (gameState === 'playing' || gameState === 'paused' || gameState === 'gameOver') {
        // ▼▼▼ このブロックを修正 ▼▼▼
        // ゲームモード名とハイスコアを交互に表示
        let textToDisplay;
        if (isShowingModeInGame) {
            textToDisplay = tutorial ? T('tut.label') : gameMode.replace(' MODE', '');
        } else {
            let currentHighScore;
            switch(gameMode) {
                case 'STANDARD MODE':
                    currentHighScore = highScoreStandard;
                    break;
                case 'JOURNEY MODE':
                    currentHighScore = highScoreJourney;
                    break;
                case 'STARTRAIL MODE':
                    currentHighScore = highScoreStartrail;
                    break;
                default:
                    currentHighScore = 0;
            }
            
            // ★ ここからが変更点 ★
            // 現在のスコアがハイスコアを上回っている場合、表示するスコアを現在のスコアにする
            const scoreToDisplay = Math.max(currentHighScore, score);
            textToDisplay = `HI: ${scoreToDisplay}`;
            // ★ 変更はここまで ★
        }
        
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 ${mainFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            if (IS_MOBILE) { // スマホ: 右上は一時停止ボタン。モード名はスコアの下、HIは右側の2段目
                const hiS = Math.max(gameMode === 'JOURNEY MODE' ? highScoreJourney : gameMode === 'STARTRAIL MODE' ? highScoreStartrail : highScoreStandard, score);
                renderCtx.font = `600 ${subFontSize}px ${config.fontFamily}`;
                renderCtx.textAlign = 'left';
                renderCtx.fillText(tutorial ? T('tut.label') : gameMode.replace(' MODE', ''), 20, 84);
                renderCtx.textAlign = 'right';
                renderCtx.fillText(`HI: ${shortNum(hiS)}`, HUD_W - 20, 84);
                return;
            }
            renderCtx.textAlign = 'right';
            renderCtx.fillText(textToDisplay, HUD_W - 20, 40);
        }, uiColor, true);
        // ▲▲▲ 修正はここまで ▲▲▲

        // STAGE表示
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 ${subFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            renderCtx.textAlign = 'center';
            renderCtx.fillText(`STAGE ${stage}`, HUD_W / 2, IS_MOBILE ? 84 : HUD_H - 20);
        }, uiColor, true);
    }

    if (tutorial && (gameState === 'playing' || gameState === 'paused')) drawTutorialPanel(renderCtx);

    // ボス: 警告とHPバー
    if (boss && (gameState === 'playing' || gameState === 'paused')) {
        renderCtx.save();
        renderCtx.textAlign = 'center';
        if (boss.state === 'enter') {
            renderCtx.globalAlpha = Math.floor(boss.enterT / 8) % 2 ? 1 : 0.35;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = '#ff3355';
                renderCtx.font = `600 40px ${config.fontFamily}`;
                renderCtx.fillText('WARNING', HUD_W / 2, HUD_H / 2 - 115 * CK); // 中央のMUTEKIより上
            }, '#ff3355');
            renderCtx.globalAlpha = 1;
            renderCtx.fillStyle = theme.ui;
            renderCtx.font = `600 14px ${config.fontFamily}`;
            renderCtx.fillText(T('hud.approach', { name: boss.def.name }), HUD_W / 2, HUD_H / 2 - 82 * CK);
        }
        const bw = 360, bh = 8, bx = HUD_W / 2 - bw / 2, by = tutorial ? tutPanelBottom + 28 : (IS_MOBILE ? 226 : 64); // スマホはMUTEKI・コンボ表示の下
        renderCtx.font = `600 ${IS_MOBILE ? 15 : 10}px ${config.fontFamily}`;
        renderCtx.textAlign = 'left';
        renderCtx.fillStyle = theme.ui;
        renderCtx.fillText(boss.def.name, bx, by - (IS_MOBILE ? 7 : 6));
        const seg = bw / boss.maxHp;
        for (let k = 0; k < boss.maxHp; k++) {
            const on = k < boss.hp;
            renderCtx.fillStyle = on ? (boss.flash > 0 ? '#ffffff' : '#ff3d6e') : 'rgba(255,255,255,0.15)';
            renderCtx.fillRect(bx + k * seg + 1, by, seg - 2, bh);
        }
        renderCtx.restore();
    }

    // シールド表示（エネルギーバーの右）
    if ((gameState === 'playing' || gameState === 'paused') && (!tutorial || tutorial.step === TUT_SHIELD)) { // チュートリアルはシールドのステップだけ表示
        const sx = gameMode === 'STARTRAIL MODE' ? 20 : (IS_MOBILE ? 240 : 236), sy = IS_MOBILE ? 109 : HUD_H - 29, HR = IS_MOBILE ? 11 : 9, HG = IS_MOBILE ? 28 : 24;
        renderCtx.save();
        renderCtx.textAlign = 'left';
        renderCtx.font = `600 ${IS_MOBILE ? 18 : 13}px ${config.fontFamily}`;
        renderCtx.fillStyle = theme.ui;
        renderCtx.fillText(DIFFS[difficultyIndex].id, sx, sy + (IS_MOBILE ? 6 : 5));
        const lx = sx + renderCtx.measureText(DIFFS[difficultyIndex].id).width + 12;
        if (maxShields === 0) {
            renderCtx.fillStyle = 'rgba(255,255,255,0.45)';
            renderCtx.fillText(T('hud.noshield'), lx, sy + (IS_MOBILE ? 6 : 5));
        }
        for (let k = 0; k < shieldCap(); k++) {
            const cx = lx + HR + k * HG, on = k < shields;
            renderCtx.beginPath();
            for (let v = 0; v < 6; v++) { const a = Math.PI / 6 + v * Math.PI / 3; renderCtx[v ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * HR, sy + Math.sin(a) * HR); }
            renderCtx.closePath();
            renderCtx.lineWidth = 1.6;
            renderCtx.strokeStyle = on ? '#7dffd0' : 'rgba(255,255,255,0.35)';
            if (on) {
                renderCtx.fillStyle = 'rgba(125,255,208,' + (0.45 + visualBeat * 0.35) + ')';
                drawWithGlow(renderCtx, () => { renderCtx.fill(); renderCtx.stroke(); }, '#7dffd0');
            } else {
                renderCtx.stroke();
            }
        }
        renderCtx.restore();
    }

    if (chainCount > 1 && player.invincibleTimer > 0) {
        drawChainComboText(renderCtx, chainCount, 1.0);
    }

    // ★ ここから追加 ★
    if (mutekiAnim.life > 0) {
        const lifeProgress = 1 - (mutekiAnim.life / mutekiAnim.maxLife);
        const chars = "!?#$ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let displayText = "";
        // 画面中央に表示。WARNINGやステージ表示が出ている間はその下へずらして重ならないように
        // MUTEKIは常に画面中央の固定位置（他の文字がこの上下に並ぶ）
        const mainTextY = HUD_H / 2 + (IS_MOBILE ? 12 : 8);
        const subTextY = mainTextY + (IS_MOBILE ? 36 : 25);
        mutekiTextBottom = subTextY;
        const transitionStart = 0.25;
        const transitionEnd = 0.75;

        if (lifeProgress < transitionStart) {
            displayText = "INVINCIBLE!!";
        } else if (lifeProgress < transitionEnd) {
            const toText = "MUTEKI!!";
            const transitionProgress = (lifeProgress - transitionStart) / (transitionEnd - transitionStart);
            const textChars = []; // 配列を使って高速化
            for (let i = 0; i < toText.length; i++) {
                if (transitionProgress > (i / toText.length) + (frameRand(i) * 0.1)) {
                    textChars.push(toText[i]);
                } else {
                    textChars.push(chars[Math.floor(frameRand(i + 50) * chars.length)]);
                }
            }
            displayText = textChars.join('');
        } else {
            displayText = "MUTEKI!!";
        }
        
        renderCtx.save();
        renderCtx.textAlign = 'center';
        renderCtx.font = `600 ${IS_MOBILE ? 38 : 24}px ${config.fontFamily}`;
        const totalWidth = renderCtx.measureText(displayText).width;
        let currentX = HUD_W / 2 - totalWidth / 2;

        for (let i = 0; i < displayText.length; i++) {
            const char = displayText[i];
            const charWidth = renderCtx.measureText(char).width;
            const hue = (frameCount * 5 + i * 25) % 360;
            const color = `hsl(${hue}, 100%, 70%)`;
            renderCtx.globalAlpha = 1;

            const effectiveHeight = w.offsetHeight + margin;
            const scaleX = r.clientWidth / effectiveWidth;

        });
        // 敵は種類ごとに3体ずつ先に作って使い回す（GPUへの転送もここで済ませる）
        const pooled = [];
        ['ufo', 'invader', 'looper', 'weaver', 'sentry', 'lance'].forEach(t => { for (let k = 0; k < 3; k++) { const o = buildMonsterObj({ type: t, vx: 1 }); scene.remove(o); tmp.add(o); pooled.push(o); } });
        prewarmGPU.pooled = pooled;
        // ハイパー時の背景ポリゴン（全種類の形）も先にGPUへ送っておく
        Object.values(hpGeo).forEach(list => list.forEach(v => { tmp.add(new THREE.Mesh(v.g, hpSolidMat)); tmp.add(new THREE.LineSegments(v.e, hpEdgeMat)); }));
        prewarmGPU.keep = tmp;
        const hidden = [];
        scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
        renderer.compile(scene, camera);
        renderer.compile(tmp, camera, scene);
        // 一度だけ小さな画面に実際に描いて、形やテクスチャのGPU転送も済ませる（初登場時のカクつき防止）
        const culled = [], rt = new THREE.WebGLRenderTarget(64, 64);
        const noCull = root => root.traverse(o => { if (o.frustumCulled) { culled.push(o); o.frustumCulled = false; } });
        noCull(scene); noCull(tmp);
        renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.render(tmp, camera); renderer.setRenderTarget(null);
        culled.forEach(o => { o.frustumCulled = true; }); rt.dispose();
        hidden.forEach(o => { o.visible = false; });
        (prewarmGPU.pooled || []).forEach(o => { tmp.remove(o); (monsterPool[o.userData.type] = monsterPool[o.userData.type] || []).push(o); });
        // ハイパーの色調シェーダー（普段は無効）も一度通しておく
        if (hyperGrade && composer) { hyperGrade.enabled = true; composer.render(); hyperGrade.enabled = false; }
    } catch (e) { console.warn('prewarm failed', e); }
}
prewarmGPU();
// BGMの予約は描画とは別のタイマーでも回す（スマホで描画が一瞬止まっても、音の予約が遅れてリズムがずれないように）
setInterval(() => { if (gameState === 'playing' && !document.hidden) audioHandler.scheduleBGM(); }, 40);
requestAnimationFrame(gameLoop);

</script>
