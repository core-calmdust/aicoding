    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            margin: 0;
            background-color: #07001a;
            font-family: 'Jura', 'M PLUS 1', sans-serif;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #fullscreen-root:fullscreen {
            background-color: #07001a;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body:not(.mobile) #game-wrapper { transform: scale(var(--scale-factor, 1)); transform-origin: center; }
        /* Gキー: 枠・説明なしの完全フルスクリーン */
        body.pure #topbar, body.pure #instructions-container { display: none !important; }
        body.pure #stage { border: none !important; box-shadow: none !important; }
        body.pure #fullscreen-root:fullscreen { background-color: #000; }
        #fullscreen-root:fullscreen #game-wrapper {
            transform: scale(var(--scale-factor, 1));
            transform-origin: center;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            will-change: transform;
        }
        #stage {
            position: relative;
            width: var(--gw, 1067px);
            height: var(--gh, 600px);
            background-color: #0b0220;
            border: 2px solid #0088cc;
            box-shadow: 0 0 20px #0088cc;
            transition: border-color 0.2s, box-shadow 0.2s, filter 1s ease-out, -webkit-filter 1s ease-out;
        }
        #stage canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--gw, 1067px);
            height: var(--gh, 600px);
            display: block;
        }
        #gameCanvas {
            pointer-events: none;
        }
        #instructions-container {
           color: #ccc;
           font-size: 13px;
           letter-spacing: 0.06em;
           width: var(--gw, 1067px);
           padding: 8px 15px;
           box-sizing: border-box;
           display: flex;
           justify-content: space-between;
           align-items: center;
           text-shadow: 0 0 10px #00ccff;
        }
        #extra-instruction {
            opacity: 0.8;
            padding-top: 4px;
        }
        /* フルスクリーン中、マウスを動かさないとポインタを隠す */
        #fullscreen-root.hide-cursor, #fullscreen-root.hide-cursor * { cursor: none !important; }
        #topbar {
            width: var(--gw, 1067px);
            height: 36px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px 6px;
            color: #00ccff;
            font-size: 13px;
            letter-spacing: 0.18em;
        }
        #topbar .brand b { font-weight: 700; color: #ff7ae0; letter-spacing: 0; }
        #topbar .tb-r { display: flex; align-items: center; gap: 8px; }
        .ib {
            width: 32px; height: 28px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 7px; border: 1px solid #00ccff; background: rgba(5, 0, 20, 0.45);
            color: #00ccff; cursor: pointer; opacity: 0.7; text-decoration: none;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .ib:hover, .ib:focus-visible { opacity: 1; background-color: var(--button-hover-bg, rgba(0, 204, 255, 0.2)); outline: none; }
        .ib svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .ib .off-x { display: none; }
        .ib:not(.on) { opacity: 0.45; }
        .ib:not(.on) .on-w { display: none; }
        .ib:not(.on) .off-x { display: inline; }
        #langSel {
            height: 28px; border-radius: 7px; border: 1px solid #00ccff; background: rgba(5, 0, 20, 0.45);
            color: #00ccff; font: inherit; font-size: 12px; letter-spacing: 0.04em; padding: 0 6px; cursor: pointer; opacity: 0.8;
        }
        #langSel option { background: #0b0220; color: #ffffff; }
        /* ---- スマホ（縦画面）---- */
        body.mobile { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        body.mobile #instructions-container { display: none; }
        body.mobile #fullscreen-root { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        body.mobile #game-wrapper { transform: scale(var(--fit, 1)); transform-origin: center; }
        body.mobile #stage { touch-action: none; }
        .mob-only { display: none !important; }
        body.mobile .mob-only { display: inline-flex !important; }
        body.mobile #topbar { display: none; }
        body.mobile #stage { border: none; box-shadow: none; }
        #m-pause, #m-title-ui, #m-tbtn { display: none; }
        body.mobile.show-tbtn #m-tbtn { display: block; position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); z-index: 6; white-space: nowrap;
            color: #00ccff; border: 1px solid #00ccff; border-radius: 12px; padding: 16px 34px; font: 600 24px 'Jura', 'M PLUS 1', sans-serif;
            letter-spacing: 0.1em; background: rgba(5, 0, 20, 0.6); box-shadow: 0 0 14px rgba(0, 204, 255, 0.35); }
        body.mobile.in-play #m-pause { display: inline-flex; position: absolute; top: 8px; right: 12px; width: 52px; height: 46px; border-radius: 12px; z-index: 5; }
        #m-pause svg { width: 28px; height: 28px; }
        body.mobile.on-title #m-title-ui { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        #m-tools { position: absolute; top: 16px; right: 16px; display: flex; gap: 12px; pointer-events: auto; }
        body.mobile #m-tools .ib { display: inline-flex !important; width: 56px; height: 48px; border-radius: 10px; }
        body.mobile #m-tools .ib svg { width: 26px; height: 26px; }
        body.mobile #langSel { height: 48px; font-size: 20px; border-radius: 10px; padding: 0 10px; }
        #m-home { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); pointer-events: auto; white-space: nowrap;
            color: #00ccff; border: 1px solid #00ccff; border-radius: 10px; padding: 12px 26px; font: 400 22px 'Jura', 'M PLUS 1', sans-serif;
            letter-spacing: 0.12em; text-decoration: none; background: rgba(5, 0, 20, 0.45); opacity: 0.85; }
        #touch-ui { position: absolute; inset: 0; pointer-events: none; display: none; }
        body.mobile.in-play #touch-ui { display: block; }
        .tbtn {
            position: absolute; bottom: 34px; width: 128px; height: 128px; border-radius: 50%;
            border: 2px solid var(--tb, #00ccff); background: rgba(5, 0, 25, 0.35); color: var(--tb, #00ccff);
            font: 600 20px 'Jura', 'M PLUS 1', sans-serif; letter-spacing: 0.12em; pointer-events: auto;
            display: flex; align-items: center; justify-content: center; opacity: 0.75; touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tbtn.down { opacity: 1; background: rgba(0, 204, 255, 0.28); transform: scale(0.95); }
        #t-shot { right: 26px; }
        #touch-ui.left #t-shot { right: auto; left: 26px; }
        #rotate-msg { position: fixed; inset: 0; z-index: 999; display: none; align-items: center; justify-content: center; text-align: center;
            background: #07001a; color: #00ccff; font: 600 20px 'Jura', 'M PLUS 1', sans-serif; letter-spacing: 0.1em; padding: 24px; }
        body.mobile.landscape #rotate-msg { display: flex; }
    </style>

// ---------------------------------

class AudioHandler {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.bgmOscillators = [];
        this.isInitialized = false;
        this.bgmPlaying = false;
        this.nextNoteTime = 0;
        this.current16th = 0;
        this.seq3ChordProgression = [0, -2, 3, 5];
        this.seq4Melody = [12, 10, 7, 5, 3, 0, -2, 0];
        this.seq4MelodyIndex = 0;
        this.seq5Melody = [12, null, 15, 10, null, 12, 7, null, 14, null, 17, 12, null, 10, 5, null];
        this.seq5MelodyIndex = 0;
        this.hiHatPanIndex = 0;
        this.isMuted = false;
        this.volume = 0.4;
        this.barTrigger = false;
    }

    initialize() {
        if (this.isInitialized) {
            return;
        }
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            try { this.ctx = new AC({ latencyHint: IS_MOBILE ? 'interactive' : 0 }); } catch (e) { this.ctx = new AC({ latencyHint: 'interactive' }); } // PCは最小の出力遅延、スマホは音飛びしない標準設定
            this.masterGain = this.ctx.createGain();
            // 音が重なっても割れないようにリミッターを通す
            this.limiter = this.ctx.createDynamicsCompressor();
            this.limiter.threshold.value = -8; this.limiter.knee.value = 6; this.limiter.ratio.value = 12;
            this.limiter.attack.value = 0.002; this.limiter.release.value = 0.12;
            this.masterGain.connect(this.limiter).connect(this.ctx.destination);
            this.masterGain.gain.value = this.isMuted ? 0 : this.volume;
            this.isInitialized = true;
            this.getNoise(); // ノイズ素材を先に作っておく
            // 無音を一瞬鳴らして音声出力を起こしておく（初回再生のもたつき防止）
            try { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); g.gain.value = 0; o.connect(g).connect(this.masterGain); o.start(); o.stop(this.ctx.currentTime + 0.05); } catch (e) {}
        } catch (e) {
            console.error("Web Audio API is not supported in this browser.");
        }
    }

    sfxOut() { // 効果音はまとめてこの音量ノードへ（ゲームオーバー時にまとめて止められるように）
        if (!this.sfxBus) { this.sfxBus = this.ctx.createGain(); this.sfxBus.connect(this.masterGain); }
        return this.sfxBus;
    }
    cutSfx() { // 鳴っている効果音を全部止める（警告音などが鳴りっぱなしにならないように）
        if (!this.sfxBus) return;
        const bus = this.sfxBus, t = this.ctx.currentTime;
        try { bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(bus.gain.value, t); bus.gain.linearRampToValueAtTime(0, t + 0.04); } catch (e) {}
        setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 150);
        this.sfxBus = null;
    }
    echoBus(t, fb) { // 同じ設定のエコーは1本を使い回す
        this._echo = this._echo || {};
        const key = t.toFixed(4) + '_' + fb;
        let e = this._echo[key];
        if (!e) {
            const d = this.ctx.createDelay(2), g = this.ctx.createGain();
            d.delayTime.value = t; g.gain.value = fb;
            d.connect(g).connect(d); d.connect(this.bgmBus || this.masterGain);
            e = this._echo[key] = d;
        }
        return e;
    }
    getNoise() {
        if (!this._noise) {
            const n = this.ctx.sampleRate;
            this._noise = this.ctx.createBuffer(1, n, n);
            const d = this._noise.getChannelData(0);
            for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        }
        return this._noise;
    }

    createSound(freq, dur, type, decay, vol, startTime, ramp) {
        if (!this.ctx) {
            return;
        }
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain).connect(this.sfxOut());
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        if (ramp) {
            osc.frequency.exponentialRampToValueAtTime(ramp.endFreq, startTime + dur);
        }
        gain.gain.setValueAtTime(vol, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur * decay);
        osc.start(startTime);
        osc.stop(startTime + dur);
    }

    async playBgm() {
        if (!this.isInitialized) {
            return;
        }

        // AudioContextが停止状態(suspended)なら、再開(resume)を試みる
        if (this.ctx.state === 'suspended') {
            try {
                // resume()が完了するのを待つ
                await this.ctx.resume();
            } catch (e) {
                console.error("AudioContext resume failed, cannot play BGM.", e);
                return; // 再開に失敗したらBGMは再生しない
            }
        }

        // すでに再生中なら何もしない（状態チェックはresumeの後に行う）
        if (this.bgmPlaying) {
            return;
        }

        this.stopBgm();
        // BGMは専用の音量ノードにまとめる（止めるときはこれごと消して、鳴り残りを出さない）
        this.bgmBus = this.ctx.createGain();
        this.bgmBus.connect(this.masterGain);
        this.bgmPlaying = true;
        this.current16th = 0; this.lastBgmStage = null; this.seq4Off = 0;
        this.seq4MelodyIndex = 0;
        this.seq5MelodyIndex = 0;
        this.hiHatPanIndex = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.1;
    }

    scheduleBGM() {
        if (!this.bgmPlaying || !this.bgmBus) {
            return;
        }
        // 再生済みの音のノードを溜め込まない（溜まるとスマホで処理落ちして音が割れる）
        if (this.bgmOscillators.length > 600) this.bgmOscillators.splice(0, this.bgmOscillators.length - 200);
        const bgmStage = ((stage - 1) % 6) + 1;
        const bpm = 130;
        const sixteenth = 60 / bpm / 4;
        const rootNote = 27.50;
        const createKick = time => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const noise = this.ctx.createBufferSource();
            const noiseGain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, time);
            osc.frequency.exponentialRampToValueAtTime(40, time + 0.15);
            gain.gain.setValueAtTime(1.0, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
            osc.connect(gain).connect(this.bgmBus);
            const bufSize = this.ctx.sampleRate * 0.05;
            const buf = this.getNoise();
            noise.buffer = buf;
            noiseGain.gain.setValueAtTime(0.3, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.02);
            noise.connect(noiseGain).connect(this.bgmBus);
            osc.start(time);
            osc.stop(time + 0.2);
            noise.start(time);
            noise.stop(time + 0.05);
            this.bgmOscillators.push(osc, gain, noise, noiseGain);
        };
        const createHiHat = (time, open = false) => {
            const noise = this.ctx.createBufferSource();
            const bufSize = this.ctx.sampleRate * 0.5;
            const buf = this.getNoise();
            noise.buffer = buf;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 8000;
            const panner = this.ctx.createStereoPanner();
            panner.pan.value = [-0.6, 0.6][this.hiHatPanIndex % 2];
            this.hiHatPanIndex++;
            const gain = this.ctx.createGain();
            const decayTime = open ? 0.3 : 0.05;
            gain.gain.setValueAtTime(open ? 0.3 : 0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + decayTime);
            noise.connect(filter).connect(panner).connect(gain).connect(this.bgmBus);
            noise.start(time);
            noise.stop(time + decayTime + 0.05);
            this.bgmOscillators.push(noise, filter, panner, gain);
        };
        const createSnare = time => {
            const noise = this.ctx.createBufferSource();
            const bufSize = this.ctx.sampleRate * 0.2;
            const buf = this.getNoise();
            noise.buffer = buf;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1500;
            filter.Q.value = 1;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.8, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            noise.connect(filter).connect(gain).connect(this.bgmBus);
            noise.start(time);
            noise.stop(time + 0.1);
            this.bgmOscillators.push(noise, filter, gain);
        };
        const createStereoBass = (time, note) => {
            const oscL = this.ctx.createOscillator();
            const oscR = this.ctx.createOscillator();
            const pannerL = this.ctx.createStereoPanner();
            const pannerR = this.ctx.createStereoPanner();
            const filter = this.ctx.createBiquadFilter();
            const gain = this.ctx.createGain();
            oscL.type = 'square';
            oscL.frequency.value = note;
            oscR.type = 'sawtooth';
            oscR.frequency.value = note * 1.01;
            filter.type = 'lowpass';
            filter.Q.value = 5;
            filter.frequency.setValueAtTime(800, time);
            filter.frequency.exponentialRampToValueAtTime(100, time + sixteenth * 0.8);
            gain.gain.setValueAtTime(0.6, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + sixteenth * 0.9);
            pannerL.pan.value = -0.8;
            oscL.connect(pannerL).connect(filter);
            pannerR.pan.value = 0.8;
            oscR.connect(pannerR).connect(filter);
            filter.connect(gain).connect(this.bgmBus);
            oscL.start(time);
            oscL.stop(time + sixteenth);
            oscR.start(time);
            oscR.stop(time + sixteenth);
            this.bgmOscillators.push(oscL, oscR, pannerL, pannerR, filter, gain);
        };
        const createSequence = (time, note) => {
            const osc = this.ctx.createOscillator();
            const panner = this.ctx.createStereoPanner();
            const gain = this.ctx.createGain();
            panner.pan.value = (Math.random() * 2 - 1) * 0.9;
            osc.type = 'triangle';
            osc.frequency.value = note;
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            osc.connect(panner).connect(gain);
            gain.connect(this.bgmBus);
            gain.connect(this.echoBus(sixteenth * 3, 0.5)); // 共有のエコー（音ごとに作ると処理が溜まって音が割れる）
            osc.start(time);
            osc.stop(time + 0.1);
            this.bgmOscillators.push(osc, panner, gain);
        };
        const createStereoPad = (time, note) => {
            const oscL = this.ctx.createOscillator();
            const oscR = this.ctx.createOscillator();
            const pannerL = this.ctx.createStereoPanner();
            const pannerR = this.ctx.createStereoPanner();
            const filter = this.ctx.createBiquadFilter();
            const gain = this.ctx.createGain();
            oscL.type = 'sawtooth';
            oscR.type = 'sawtooth';
            oscL.frequency.value = note;
            oscR.frequency.value = note;
            oscL.detune.value = -10;
            oscR.detune.value = 10;
            pannerL.pan.value = -1;
            pannerR.pan.value = 1;
            filter.type = 'lowpass';
            filter.Q.value = 1;
            filter.frequency.setValueAtTime(200, time);
            filter.frequency.linearRampToValueAtTime(1500, time + sixteenth * 64);
            filter.frequency.linearRampToValueAtTime(200, time + sixteenth * 128);
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.2, time + sixteenth * 4);
            gain.gain.setValueAtTime(0.2, time + sixteenth * 120);
            gain.gain.linearRampToValueAtTime(0, time + sixteenth * 128);
            oscL.connect(pannerL).connect(filter);
            oscR.connect(pannerR).connect(filter);
            filter.connect(gain).connect(this.bgmBus);
            oscL.start(time);
            oscL.stop(time + sixteenth * 128);
            oscR.start(time);
            oscR.stop(time + sixteenth * 128);
            this.bgmOscillators.push(oscL, oscR, pannerL, pannerR, filter, gain);
        };
        const createSequence2 = (time, note) => {
            const osc = this.ctx.createOscillator();
            const panner = this.ctx.createStereoPanner();
            const gain = this.ctx.createGain();
            panner.pan.value = (Math.random() * 2 - 1) * 0.7;
            osc.type = 'sine';
            osc.frequency.value = note;
            gain.gain.setValueAtTime(0.45, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + sixteenth * 1.5);
            osc.connect(panner).connect(gain).connect(this.bgmBus);
            osc.start(time);
            osc.stop(time + sixteenth * 1.5);
            this.bgmOscillators.push(osc, panner, gain);
        };
        const createSequence3 = (time, note) => {
            const osc = this.ctx.createOscillator();
            const panner = this.ctx.createStereoPanner();
            const gain = this.ctx.createGain();
            panner.pan.value = (Math.random() * 2 - 1) * 0.9;
            osc.type = 'triangle';
            osc.frequency.value = note;
            gain.gain.setValueAtTime(0.4, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + sixteenth * 2);
            osc.connect(panner).connect(gain);
            gain.connect(this.bgmBus);
            gain.connect(this.echoBus(sixteenth * 4, 0.5)); // 共有のエコー（音ごとに作ると処理が溜まって音が割れる）
            osc.start(time);
            osc.stop(time + sixteenth * 2);
            this.bgmOscillators.push(osc, panner, gain);
        };
        const createSequence4 = (time, note) => {
            const osc = this.ctx.createOscillator();
            const panner = this.ctx.createStereoPanner();
            const gain = this.ctx.createGain();
            panner.pan.value = (Math.random() * 2 - 1) * 0.9;
            osc.type = 'sine';
            osc.frequency.value = note;
            gain.gain.setValueAtTime(0.35, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + sixteenth * 3.5);
            osc.connect(panner).connect(gain);
            gain.connect(this.bgmBus);
            gain.connect(this.echoBus(sixteenth * 3, 0.4)); // 共有のエコー（音ごとに作ると処理が溜まって音が割れる）
            osc.start(time);
            osc.stop(time + sixteenth * 3.5);
            this.bgmOscillators.push(osc, panner, gain);
        };
        const createSequence5 = (time, note) => {
            const osc = this.ctx.createOscillator();
            const panner = this.ctx.createStereoPanner();
            const gain = this.ctx.createGain();
            panner.pan.value = (Math.random() * 2 - 1) * 0.9;
            osc.type = 'triangle';
            osc.frequency.value = note;
            gain.gain.setValueAtTime(0.4, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + sixteenth * 4);
            osc.connect(panner).connect(gain);
            gain.connect(this.bgmBus);
            gain.connect(this.echoBus(sixteenth * 6, 0.4)); // 共有のエコー（音ごとに作ると処理が溜まって音が割れる）
            osc.start(time);
            osc.stop(time + sixteenth * 4);
            this.bgmOscillators.push(osc, panner, gain);
        };
        // 予約済みのキック・小節頭が実際に鳴った時に演出を出す
        // 予約した音が実際に耳に届くのは currentTime から出力遅延ぶん後。スマホは遅延が大きいので、その分だけ演出を遅らせる
        // （以前は逆に早めていたため、遅延の大きいスマホで演出が音より先に出ていた）
        const outLat = (this.ctx.outputLatency || this.ctx.baseLatency || 0);
        const nowA = this.ctx.currentTime - Math.max(0, outLat - 0.016);
        while (this.kickQ && this.kickQ.length && this.kickQ[0] <= nowA) { this.kickQ.shift(); visualBeat = 1.0; }
        while (this.barQ && this.barQ.length && this.barQ[0] <= nowA) { this.barQ.shift(); this.barTrigger = true; }
        // 段階ごとに重なるパート（2〜5）。lo < 段階 <= hi のパートだけ鳴らす
        const layers = (beatInLoop, t, lo, hi) => {
            if (2 > lo && 2 <= hi) {
                if ((beatInLoop % 16) % 4 === 0) {
                    const degree = [0, 7, 3, 5][Math.floor((beatInLoop % 16) / 4)];
                    createSequence2(t, rootNote * 8 * Math.pow(2, degree / 12));
                }
            }
            if (3 > lo && 3 <= hi) {
                if (beatInLoop === 62) {
                    const chordIndex = 1;
                    const chordRootDegree = this.seq3ChordProgression[chordIndex];
                    const note = rootNote * 16 * Math.pow(2, (chordRootDegree + 7) / 12);
                    createSequence3(t, note);
                }
                if (beatInLoop === 126) {
                    const chordIndex = 3;
                    const chordRootDegree = this.seq3ChordProgression[chordIndex];
                    const note = rootNote * 16 * Math.pow(2, (chordRootDegree + 2) / 12);
                    createSequence3(t, note);
                }
            }
            if (4 > lo && 4 <= hi) {
                if ((beatInLoop - (this.seq4Off || 0) + 128) % 8 === 0) { // 入った拍から8分刻み（入りを待たせない）
                    // メロディの位置は拍の位置から決める（数えて進める方式だと、音の飛ばしや曲のループのたびにずれていく）
                    const degree = this.seq4Melody[Math.floor(((beatInLoop - (this.seq4Off || 0) + 128) % 128) / 8) % this.seq4Melody.length];
                    const note = rootNote * 16 * Math.pow(2, degree / 12);
                    createSequence4(t, note);
                }
            }
            if (5 > lo && 5 <= hi) {
                if (beatInLoop % 4 === 0) {
                    const degree = this.seq5Melody[(beatInLoop / 4) % this.seq5Melody.length]; // 小節に揃えた位置（ループしてもずれない）
                    if (degree !== null) {
                        const note = rootNote * 8 * Math.pow(2, degree / 12);
                        createSequence5(t, note);
                    }
                }
            }
        };
        // ステージが上がって新しいパートが加わったら、すでに先読みで予約済みの区間にも新パートの音を足す
        // （先読みの分だけ新パートの入りが遅れないように）
        if (this.lastBgmStage != null && bgmStage > this.lastBgmStage) {
            const steps = [];
            for (let j = 1; this.nextNoteTime - j * sixteenth >= this.ctx.currentTime - 0.005 && j < 16; j++) steps.unshift(j);
            // メロディのパートは常に小節の8分グリッドに揃えて鳴らす（入った拍に合わせて裏拍にずらすと、周回ごとに表/裏が入れ替わってずれて聞こえる）
            this.seq4Off = 0;
            steps.forEach(j => layers((this.current16th - j + 128) % 128, this.nextNoteTime - j * sixteenth, this.lastBgmStage, bgmStage));
        }
        this.lastBgmStage = bgmStage;
        // 処理が大きく止まって予約が遅れたときは、遅れた分を鳴らさずに飛ばす（まとめて鳴ってリズムが崩れるのを防ぐ）
        while (this.nextNoteTime < this.ctx.currentTime - 0.06) { this.nextNoteTime += sixteenth; this.current16th = (this.current16th + 1) % 128; }
        while (this.nextNoteTime < this.ctx.currentTime + (IS_MOBILE ? 0.3 : 0.1)) { // 先読み: PCは0.1秒。スマホは処理落ちで予約が間に合わず音がずれるので0.3秒
            const beatInLoop = this.current16th % 128;
            const noteInMeasure = beatInLoop % 16;
            if (noteInMeasure === 0) {
                (this.barQ = this.barQ || []).push(this.nextNoteTime);
            }
            if (noteInMeasure % 4 === 0) {
                createKick(this.nextNoteTime);
                (this.kickQ = this.kickQ || []).push(this.nextNoteTime); // 見た目のキックは実際に鳴る時刻に合わせる
            }
            if (noteInMeasure === 4 || noteInMeasure === 12) {
                createSnare(this.nextNoteTime);
            }
            if (noteInMeasure % 2 === 1) {
                createHiHat(this.nextNoteTime, false);
            }
            if (noteInMeasure === 14) {
                createHiHat(this.nextNoteTime, true);
            }
            if (beatInLoop === 0) {
                createStereoPad(this.nextNoteTime, rootNote * 2);
            }
            const measureIn8BarLoop = Math.floor(beatInLoop / 16);
            if (measureIn8BarLoop % 2 === 0) {
                if ([0, 8].includes(noteInMeasure)) {
                    createStereoBass(this.nextNoteTime, rootNote);
                }
            } else {
                if ([0, 6, 10, 14].includes(noteInMeasure)) {
                    createStereoBass(this.nextNoteTime, rootNote);
                }
            }
            if ([3, 7, 10, 15].includes(noteInMeasure)) {
                createSequence(this.nextNoteTime, [rootNote * 8, rootNote * 16][Math.floor(Math.random() * 2)]);
            }
            layers(beatInLoop, this.nextNoteTime, 1, bgmStage);
            this.nextNoteTime += sixteenth;
            this.current16th = (this.current16th + 1) % 128;
        }
    }

    stopBgm() {
        this.bgmPlaying = false;
        this.kickQ = []; this.barQ = [];
        if (this.bgmBus) { // BGMだけを素早くフェードアウトして切り離す（効果音はそのまま）
            const bus = this.bgmBus, t = this.ctx.currentTime;
            try { bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(bus.gain.value, t); bus.gain.linearRampToValueAtTime(0, t + 0.05); } catch (e) {}
            setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 200);
            this.bgmBus = null;
        }
        this.bgmOscillators.forEach(o => {
            try {
                o.disconnect();
                if (o.stop) {
                    o.stop(0);
                }
            } catch (e) {}
        });
        this.bgmOscillators = [];
        // 共有エコーの残響も止める（残すとゲームオーバー後もパッドの音が尾を引いて鳴り続ける）
        Object.values(this._echo || {}).forEach(d => { try { d.disconnect(); } catch (e) {} });
        this._echo = {};
    }

    playSound(type) {
        if (!this.isInitialized || this.isMuted) {
            return;
        }
        const now = this.ctx.currentTime;
        switch (type) {
            case 'itemGet':
                this.createSound(1046, 0.05, "triangle", 0.8, 0.7, now);
                setTimeout(() => this.createSound(1396, 0.1, "triangle", 0.7, 0.7, now + 0.08), 80);
                break;
            case 'waveClear':
                setTimeout(() => this.createSound(523, 0.1, 'sine', 0.9, 0.5, now), 0);
                setTimeout(() => this.createSound(659, 0.1, 'sine', 0.9, 0.5, now + 0.1), 100);
                setTimeout(() => this.createSound(783, 0.1, 'sine', 0.9, 0.5, now + 0.2), 200);
                setTimeout(() => this.createSound(1046, 0.2, 'sine', 0.8, 0.6, now + 0.3), 300);
                break;
            case 'start':
                [261.63, 329.63, 392].forEach((f, i) => this.createSound(f, 0.1, 'square', 0.9, 0.75, now + i * 0.08));
                break;
            case 'menu': { // タイトル・難易度選択のカーソル音: シリアスなサイバー系（低めの短い電子音＋データのノイズ）
                const c = this.ctx, out = this.sfxOut();
                // 低めの電子音: 下がっていく1音（上がる音は可愛くなるので使わない）
                const o = c.createOscillator(), g = c.createGain(), bp = c.createBiquadFilter();
                o.type = 'sawtooth'; o.frequency.setValueAtTime(330, now); o.frequency.exponentialRampToValueAtTime(140, now + 0.07);
                bp.type = 'bandpass'; bp.frequency.setValueAtTime(1400, now); bp.frequency.exponentialRampToValueAtTime(500, now + 0.07); bp.Q.value = 3;
                g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.55, now + 0.003); g.gain.exponentialRampToValueAtTime(0.0005, now + 0.09);
                o.connect(bp).connect(g).connect(out); o.start(now); o.stop(now + 0.1);
                // データが走るような短いノイズ
                const n = c.createBufferSource(); n.buffer = this.getNoise();
                const nf = c.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 3000; nf.Q.value = 1.5;
                const ng = c.createGain(); ng.gain.setValueAtTime(0.22, now); ng.gain.exponentialRampToValueAtTime(0.0005, now + 0.04);
                n.connect(nf).connect(ng).connect(out); n.start(now, Math.random() * 0.5, 0.05);
                break;
            }
            case 'glaze':
                this.createSound(880, 0.1, 'triangle', 0.8, 0.5, now, {endFreq: 1200});
                break;
            case 'explosion':
                const b = this.ctx.sampleRate * 0.5;
                const buf = this.getNoise();
                const s = this.ctx.createBufferSource();
                s.buffer = buf;
                const f = this.ctx.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.setValueAtTime(2000, now);
                f.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.7, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                s.connect(f).connect(g).connect(this.sfxOut());
                s.start(now);
                s.stop(now + 0.5);
                break;
            case 'invincibleHit':
                this.createSound(1568, 0.1, 'sine', 0.8, 0.8, now);
                setTimeout(() => this.createSound(2093, 0.15, 'sine', 0.7, 0.8, now + 0.07), 70);
                break;
            case 'lowEnergy':
                this.createSound(987, 0.1, 'sawtooth', 0.8, 0.5, now);
                setTimeout(() => this.createSound(987, 0.1, 'sawtooth', 0.8, 0.5, now + 0.15), 150);
                break;
            case 'bossWarning': { // サイレン風の警告音を4回（強く歪ませてビックリさせる）
                const c = this.ctx, out = this.sfxOut(), N = 4, L = 0.75, T = N * L + 0.3;
                if (!this._distCurve) { // ほぼ矩形まで潰す強いファズ（非対称で倍音を増やす）
                    const n = 2048, cv = new Float32Array(n), k = 60;
                    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; const y = Math.tanh(k * (x + 0.08)) ; cv[i] = Math.max(-0.85, Math.min(1, y)); }
                    this._distCurve = cv;
                }
                const ws = c.createWaveShaper(); ws.curve = this._distCurve; ws.oversample = 'none';
                const pre = c.createGain(); pre.gain.value = 3.5;
                const pk = c.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 2200; pk.Q.value = 1.2; pk.gain.value = 9; // 耳に刺さる帯域を強調
                const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500;
                pre.connect(ws).connect(pk);
                const ag = c.createGain(); ag.gain.value = 0;
                pk.connect(lp).connect(ag).connect(out);
                [['sawtooth', 0, 1], ['square', -25, 1], ['sawtooth', 0, 0.5]].forEach(([tp, dt, oct]) => {
                    const o = c.createOscillator(); o.type = tp; o.detune.value = dt;
                    for (let i = 0; i < N; i++) {
                        const t0 = now + i * L;
                        if (i === 0) o.frequency.setValueAtTime(480 * oct, t0);
                        o.frequency.exponentialRampToValueAtTime(1080 * oct, t0 + L * 0.5);
                        o.frequency.exponentialRampToValueAtTime(480 * oct, t0 + L);
                    }
                    const og = c.createGain(); og.gain.value = 0.5;
                    o.connect(og).connect(pre); o.start(now); o.stop(now + T);
                });
                // 途切れずに4回うねる（最初はいきなり鳴り、最後だけ消える）
                ag.gain.setValueAtTime(0.0001, now);
                ag.gain.exponentialRampToValueAtTime(0.12, now + 0.012); // 音量は控えめに
                ag.gain.setValueAtTime(0.12, now + N * L - 0.25);
                ag.gain.exponentialRampToValueAtTime(0.0001, now + N * L);
                break;
            }
            case 'bossHit':
                this.createSound(1400, 0.08, 'square', 0.8, 0.35, now, { endFreq: 600 });
                this.createSound(300, 0.12, 'triangle', 0.8, 0.4, now + 0.02, { endFreq: 120 });
                break;
            case 'playerShoot':
                this.createSound(2200, 0.1, 'sawtooth', 0.9, 0.4, now, {endFreq: 300});
                break;
            case 'enemyDestroy':
                this.createSound(200, 0.2, 'square', 0.8, 0.5, now, { endFreq: 50 });
                const noise = this.ctx.createBufferSource();
                const bufSize = this.ctx.sampleRate * 0.15;
                const noiseBuf = this.getNoise();
                noise.buffer = noiseBuf;
                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = 1200;
                noiseFilter.Q.value = 1;
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.6, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                noise.connect(noiseFilter).connect(noiseGain).connect(this.sfxOut());
                noise.start(now);
                noise.stop(now + 0.15);
                this.createSound(1000, 0.1, 'sine', 0.7, 0.3, now + 0.03);
                break;
        }
    }

    playGem(n) {
        if (!this.isInitialized || this.isMuted) return;
        const now = this.ctx.currentTime;
        const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
        const step = (n - 1) % scale.length, oct = Math.floor((n - 1) / scale.length) % 2;
        const f = 880 * Math.pow(2, (scale[step] + oct * 12) / 12);
        this.createSound(f, 0.09, 'triangle', 0.8, 0.28, now);
        this.createSound(f * 2, 0.05, 'sine', 0.7, 0.12, now + 0.02);
    }

    playJingle(type) {
        if (!this.isInitialized || this.isMuted) {
            return;
        }
        const now = this.ctx.currentTime;
        switch (type) {
            case 'gameOver':
                this.createSound(220, 0.8, 'sawtooth', 0.2, 0.8, now);
                setTimeout(() => this.createSound(110, 0.8, 'sawtooth', 0.4, 0.8, now + 0.1), 100);
                setTimeout(() => this.createSound(55, 0.8, 'sawtooth', 0.6, 0.8, now + 0.2), 200);
                break;
            case 'specialItemGet':
                [1046, 1318, 1567, 2093].forEach((f, i) => {
                    this.createSound(f, 0.15, 'triangle', 0.8, 0.6, now + i * 0.07);
                });
                break;
        }
    }

    toggleMute() {
        if (!this.isInitialized) {
            return;
        }
        this.isMuted = !this.isMuted;
        try { localStorage.setItem('atlas-sfx', this.isMuted ? '0' : '1'); } catch (e) {}
        this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime);
        return this.isMuted;
    }
}

        bossCount = Math.floor((stage - 1) / 3); currentCometSpeed += config.cometSpeedIncrease * (stage - 1) * STAGE_LENGTH_IN_FRAMES / 60;
        if (stage % 3 === 0) bossSpawnFrame = 150;
    }
    // Determine monster spawn counts for the first stage
    invaderSpawnCountForStage = Math.floor(stage / 2);
    invadersSpawnedThisStage = 0;
    hasUFOSpawnedThisStage = false;
    hasLooperSpawnedThisStage = false;
    looperSpawnFrame = -1; // 初回ステージでは出現しない

    audioHandler.playSound('start');
    // BGMの再生準備が非同期で完了するのを待つ
    await audioHandler.playBgm();
}

function updateInstructions() {

    controlsInstruction.textContent = TK('f.move');

}


function pollInput() {
    const gamepads = navigator.getGamepads();
    let gpLeft = false, gpRight = false, gpUp = false, gpDown = false;
    let gpStart = false, gpSlow = false, gpSelect = false, gpShoot = false, gpFace = [false, false, false, false];

    for (const gp of gamepads) {
        if (!gp) continue;
        if (gp.buttons.some(b => b.pressed) || gp.axes.some(a => Math.abs(a) > 0.1)) {
            lastInputDevice = 'gamepad';
        }
        gpLeft = gp.buttons[14]?.pressed || gp.axes[0] < -0.5;
        gpRight = gp.buttons[15]?.pressed || gp.axes[0] > 0.5;
        gpUp = gp.buttons[12]?.pressed || gp.axes[1] < -0.5;
        gpDown = gp.buttons[13]?.pressed || gp.axes[1] > 0.5;
        gpStart = gp.buttons[9]?.pressed;
        gpSlow = gp.buttons[0]?.pressed || gp.buttons[1]?.pressed;
        gpShoot = gp.buttons[2]?.pressed || gp.buttons[3]?.pressed;
        gpSelect = gp.buttons[8]?.pressed;
        gpFace = [0, 1, 2, 3].map(i => !!gp.buttons[i]?.pressed);
    }

    // Direct state for continuous actions (movement, slow)
    input.left = keyState['ArrowLeft'] || gpLeft;
    input.right = keyState['ArrowRight'] || gpRight;
    input.up = keyState['ArrowUp'] || gpUp;
    input.down = keyState['ArrowDown'] || gpDown;
    input.slow = keyState['ShiftLeft'] || keyState['ShiftRight'] || keyState['KeyZ'] || gpSlow || touchSlow;

    // Trigger states for single-press actions
    const isShootPressed = keyState['Space'] || keyState['KeyX'] || gpShoot || touchShot;
    input.shootTrigger = isShootPressed && !wasShootPressed;
    wasShootPressed = isShootPressed;

    // ★ ここから追加 ★
    // ハイスコアリセット関連のトリガー
    const isKPressed = keyState['KeyK'];
    const isYPressed = keyState['KeyY'];
    const isNPressed = keyState['KeyN'];

    if (gameState === 'title' && isKPressed && !wasKPressed) {
        input.resetTrigger = true;
    } else {
        input.resetTrigger = false;
    }

    if (gameState === 'confirmReset') {
        input.confirmYesTrigger = isYPressed && !wasYPressed;
        input.confirmNoTrigger = isNPressed && !wasNPressed;
    } else {
        input.confirmYesTrigger = false;
        input.confirmNoTrigger = false;
    }

    wasKPressed = isKPressed;
    wasYPressed = isYPressed;
    wasNPressed = isNPressed;
    // ★ ここまで追加 ★

    const isPPressed = keyState['KeyP'];
    const isStartPressed = gpStart;
    input.pauseTrigger = (isPPressed && !wasPPressed) || (isStartPressed && !wasStartPressed) || tapPauseReq;
    tapPauseReq = false;
    wasPPressed = isPPressed;
    
    const isEnterPressed = keyState['Enter'];
    const isQPressed = keyState['KeyQ'];
    const isSelectPressed = gpSelect;

    const enterTrigger = isEnterPressed && !wasEnterPressed;
    input.nameTrigger = gameState === 'title' && ((isSelectPressed && !wasSelectPressed) || (keyState['KeyN'] && !pollInput.wn)); pollInput.wn = !!keyState['KeyN']; // タイトル: SELECT/Nキーで名前の変更
    const qTrigger = isQPressed && !wasQPressed;
    const startTrigger = isStartPressed && !wasStartPressed;
    const selectTrigger = isSelectPressed && !wasSelectPressed;

    // gameStateに応じてトリガーを設定
    const isEscPressed = keyState['Escape'] || keyState['Backspace'];
    const escTrigger = isEscPressed && !wasEscPressed;
    wasEscPressed = isEscPressed;
    if (gameState === 'title') {
        input.replayTrigger = enterTrigger || startTrigger;
        input.titleTrigger = false;
    } else if (gameState === 'difficulty') {
        input.replayTrigger = enterTrigger || startTrigger;
        input.titleTrigger = qTrigger || selectTrigger || escTrigger;
    } else if (gameState === 'gameOver') {
        input.replayTrigger = enterTrigger || startTrigger;
        input.titleTrigger = nameEntry ? false : qTrigger || selectTrigger;
    } else if (gameState === 'nameEdit') {
        input.replayTrigger = enterTrigger || startTrigger;
        input.titleTrigger = selectTrigger; // パッドのSELECTでキャンセル（キーボードはEsc）
    } else if (gameState === 'ranking') {
        input.replayTrigger = enterTrigger || startTrigger;
        input.titleTrigger = qTrigger || selectTrigger || escTrigger;
    } else if (gameState === 'paused') {
        input.replayTrigger = false;
        input.titleTrigger = qTrigger || selectTrigger;
    } else { // playing
        input.replayTrigger = false;
        input.titleTrigger = false;
    }
     
    const isUpPressed = input.up;
    input.upTrigger = isUpPressed && !wasUpPressed;
    wasUpPressed = isUpPressed;

    const isDownPressed = input.down;
    input.downTrigger = isDownPressed && !wasDownPressed;
    wasDownPressed = isDownPressed;
    input.leftTrigger = input.left && !pollInput.wl; pollInput.wl = input.left;
    // パッドの A/X（文字入力）と B/Y（DEL）の押した瞬間（ネーム入力用）
    const wf = pollInput.wf || [false, false, false, false];
    input.padOk = (gpFace[0] && !wf[0]) || (gpFace[2] && !wf[2]);
    input.padDel = (gpFace[1] && !wf[1]) || (gpFace[3] && !wf[3]);
    pollInput.wf = gpFace;
    input.rightTrigger = input.right && !pollInput.wr; pollInput.wr = input.right;
    
    wasStartPressed = isStartPressed;
    wasEnterPressed = isEnterPressed;
    wasSelectPressed = isSelectPressed;
    wasQPressed = isQPressed;
    // タップをメニュー操作に変換（座標は表示キャンバス基準）
    tapSel = null; tapDiffSel = null; tapNameKey = null;
    while (tapQueue.length) {
        const tp = tapQueue.shift();
        if (gameState === 'ranking') { rankTaps.push(tp); continue; }
        if ((gameState === 'gameOver' || gameState === 'nameEdit') && nameEntry) { // ネーム登録の文字盤
            for (let k = 0; k < NAME_KEYS.length; k++) { const r = nameKeyRect(k); if (tp.x >= r.x - 2 && tp.x <= r.x + r.w + 2 && tp.y >= r.y - 3 && tp.y <= r.y + r.h + 3) { tapNameKey = k; break; } }
            continue;
        }
        const inBtn = k => { const r = titleBtnRect(k); return tp.x >= r.x - 6 && tp.x <= r.x + r.w + 6 && tp.y >= r.y - 8 && tp.y <= r.y + r.h + 8; };
        if (gameState === 'title' && inBtn(0)) { openRanking(); continue; }
        if (gameState === 'title' && inBtn(1)) { openNameEdit(); continue; }
        if (gameState === 'title') {
            const ty = TITLE_PIV + (tp.y - (MENU_DY - TITLE_UP) - TITLE_PIV) / TITLE_S;
            const i = Math.round((ty - 344 + 7) / 42);
            if (i >= 0 && i < titleMenuItems.length && Math.abs(ty - (344 + i * 42 - 7)) < 21) {
                if (i === titleMenuIndex) input.replayTrigger = true; else tapSel = i;
            } else if (ty > 500) input.replayTrigger = true;
        } else if (gameState === 'difficulty') {
            const ty = tp.y - (MENU_DY - 32);
            if (tp.x < 120 && ty < 150) { input.titleTrigger = true; continue; }
            const i = Math.round((ty - 236) / 92);
            if (i >= 0 && i < DIFFS.length && Math.abs(ty - (236 + i * 92)) < 44) {
                if (i === diffMenuIndex) input.replayTrigger = true; else tapDiffSel = i;
            }
        } else if (gameState === 'paused') { // タイトルへはボタンで。それ以外のタップは再開
            input.pauseTrigger = true;
        } else if (gameState === 'gameOver') { // タイトルへはボタンで。それ以外のタップはもう一度
            if (performance.now() - gameOverAt < 900) continue;
            input.replayTrigger = true;
        }
    }
    if (tapTitleReq) {
        tapTitleReq = false;
        if (gameState === 'paused' || (gameState === 'gameOver' && performance.now() - gameOverAt >= 900)) { input.titleTrigger = true; input.pauseTrigger = false; input.replayTrigger = false; }
    }
}

function triggerInvincibility(baseFrames) {
    if (player.invincibleTimer > 0) {
        chainCount++;
        // effects.push({ type: 'chainComboUpdate', life: 60, maxLife: 60 }); // ★ 変更点: effects配列への追加を削除
        chainComboAnim.life = chainComboAnim.maxLife; // ★ 変更点: 専用タイマーをリセットしてアニメーションを開始
        chainEffectPending = true;
    } else {
        chainCount = 1;
    }

    const chainLevelForTime = Math.floor((chainCount - 1) / 3);
    const timeReductionMultiplier = Math.pow(0.9, chainLevelForTime);
    const newItemInvincibleFrames = Math.floor(baseFrames * timeReductionMultiplier);

    let finalInvincibleTime;
    if (player.invincibleTimer > 0) {
        const longerTime = Math.max(player.invincibleTimer, newItemInvincibleFrames);
        finalInvincibleTime = longerTime + 30 * timeReductionMultiplier;
    } else {
        finalInvincibleTime = newItemInvincibleFrames;
    }
    player.invincibleTimer = finalInvincibleTime;
    player.maxInvincibleTimer = finalInvincibleTime;

    // ★ 変更点: 専用タイマーを更新
    mutekiAnim.life = finalInvincibleTime;
    mutekiAnim.maxLife = finalInvincibleTime;
}

function gameOver(reason) {
    if (gameState === 'gameOver') {
        return;
    }
    gameOverAt = performance.now();
    if (tutorial) { // チュートリアルではゲームオーバーにならない
        tutorialHit();
        return;
    }
    gameState = 'gameOver';
    gameOverReason = reason;

    isShowingModeInGame = true; // ★ 追加: ゲームオーバー時は必ずモード名を表示する

    audioHandler.stopBgm();
    if (audioHandler.isInitialized) audioHandler.cutSfx(); // ゲームオーバーの音以外は全部止める
    audioHandler.playJingle('gameOver');
    
    let currentHighScore;
    let highScoreKey;

    switch(gameMode) {
        case 'STANDARD MODE':
            currentHighScore = highScoreStandard;
            highScoreKey = config.highScoreKeyStandard;
            break;
        case 'JOURNEY MODE':
            currentHighScore = highScoreJourney;
            highScoreKey = config.highScoreKeyJourney;
            break;
        case 'STARTRAIL MODE':
            currentHighScore = highScoreStartrail;
            highScoreKey = config.highScoreKeyStartrail;
            break;
    }

    if (score > currentHighScore && !hasUsedInvincibility) {
        currentHighScore = score;
        try { localStorage.setItem(hsKey(highScoreKey), currentHighScore); } catch (e) {}
        
        switch(gameMode) {
            case 'STANDARD MODE':
                highScoreStandard = currentHighScore;
                break;
            case 'JOURNEY MODE':
                highScoreJourney = currentHighScore;
                break;
            case 'STARTRAIL MODE':
                highScoreStartrail = currentHighScore;
                break;
        }
        newHighScoreAchieved = true;
    }
    // ランキング: 上位100件に入ったらネーム登録
    rankResult = null; nameEntry = null;
    if (!hasUsedInvincibility) {
        const mi = RANK_MODES.findIndex(m => m[0] === gameMode);
        if (mi >= 0) { const k = rankKey(mi, difficultyIndex); if (RankLocal.qualifies(k, score)) { const en = { n: '', s: score, st: stage, t: Date.now() }; if (lastName()) registerRank(k, en); else startNameEntry(k, en); } } // 名前登録済みなら入力を省略
    }

if (reason === 'collision') {
        audioHandler.playSound('explosion');
        screenShake = { intensity: 20, duration: 20 }; // ★ 45フレームから約半分の22フレームに変更
        effects.push({ type: 'shockwave', x: player.x, y: player.y, life: 30, maxLife: 30, radius: 20 });
        effects.push({ type: 'screenFlash', life: 15, maxLife: 15 });

        // ▼▼▼ 爆発エフェクトを動画のように強化 ▼▼▼
        const particleCount = isEffectsEnabled ? (IS_MOBILE ? 140 : 240) : 70; // 多すぎると一瞬重くなるので控えめに // ★ 変更点: パーティクル数を増加
        
        // ★ 変更点: 爆発専用の鮮やかなカラーパレットを定義
        const explosionColors = ['#ff3344', '#ff8800', '#ffff00', '#88ff00', '#00ffff', '#4488ff', '#ff00ff', '#ffffff'];

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = (Math.random() * 18 + 6) * 60; // ★ 変更点: 速度に少し幅を持たせる
            
            particles.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: Math.random() * 120 + 90, // ★ 変更点: 少し長めに表示
                maxLife: 210,
                color: explosionColors[Math.floor(Math.random() * explosionColors.length)], // ★ 変更点: 専用パレットから色を選択
                size: Math.random() * 2.5 + 1, // ★ 追加: パーティクルのサイズをランダムに設定
                gravityMultiplier: Math.random() * 0.6 + 0.7,
            });
        }
    } else if (reason === 'energy') {
        effects.push({ type: 'energyGameOverFlash', life: 8, maxLife: 8 });
        grayscaleAnimation.isActive = true;
        grayscaleAnimation.progress = 0;
    }
}

function spawnWayComets() {
    const wayCount = Math.floor(Math.random() * (stage - 1)) + 2;
    const startX = Math.random() * config.canvasWidth;
    const startY = -config.cometCoreRadius * 2 - TOP_EXT;
    const targetX = player.x;
    const targetY = player.y;
    const angleToPlayer = Math.atan2(targetY - startY, targetX - startX);
    const speed = currentCometSpeed * 0.75;
    const spreadAngle = Math.PI / 8;
    const totalAngle = spreadAngle * (wayCount - 1);
    const startAngle = angleToPlayer - totalAngle / 2;

    for (let i = 0; i < wayCount; i++) {
        const angle = startAngle + i * spreadAngle;
        comets.push({
            x: startX,
            y: startY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: config.cometCoreRadius,
            isGlazed: false,
            isWay: true
        });
    }
}

function updateBackground(dt_sec) {
    if (gameState === 'playing' || gameState === 'title' || gameState === 'gameOver') {
        let speedRatio;
        if (gameState === 'playing') {
            speedRatio = currentCometSpeed / config.initialCometSpeed;
        } else { // title or gameOver
            speedRatio = 0.3;
        }

        if (speedRatio > 0 && !isNaN(dt_sec)) {
            stars.forEach(s => {
                s.y += s.speed * config.starScrollMultiplier * speedRatio * dt_sec;
                if (s.y > config.canvasHeight) {
                    s.y = 0;
                    s.x = Math.random() * config.canvasWidth;
                    s.isGlazed = false;
                }
            });
        }
    }
}

function updatePlayingState(dt_sec) {
    if (hurtTimer > 0) hurtTimer -= 60 * dt_sec;
    // ▼▼▼ このブロックを修正 ▼▼▼
    // 1小節ごとにUI表示を切り替え、小節線エフェクトを発生させる
    if (audioHandler.barTrigger) {
        // 表示を切り替える
        isShowingModeInGame = !isShowingModeInGame;
        
        // 小節線エフェクトを発生
        effects.push({ type: 'barLine', life: 30, maxLife: 30 });
        
        // トリガーをリセット
        audioHandler.barTrigger = false;
    }

    // Player invincibility timer
    if (player.invincibleTimer > 0) {
        player.invincibleTimer -= 60 * dt_sec;
        if (player.invincibleTimer <= 0) {
            player.invincibleTimer = 0;
            if (chainCount > 1) {
                effects.push({ type: 'comboFadeOut', life: 12, maxLife: 12, count: chainCount });
            }
            chainCount = 0;
        }
    }

    // Player Movement
    const isPlayerTemporarilyInvincible = player.invincibleTimer > 0;
    const isPlayerInvincible = isInvincible || isPlayerTemporarilyInvincible;
    let currentSpeed = (input.slow ? config.playerSpeed * config.playerSlowModeMultiplier : config.playerSpeed) * dt_sec;
    if (player.invincibleTimer > 0) {
        currentSpeed *= 1.1;
    }
    if (hyperT > 0) currentSpeed *= 1.1;
    if (IS_MOBILE) { // PCは描画フレームごとに実時間で動かす（movePlayerRT）
        if (input.left) player.x -= currentSpeed;
        if (input.right) player.x += currentSpeed;
    }
    if (touchDX) { player.x += touchDX; touchDX = 0; } // スワイプ移動
    player.x = Math.max(0, Math.min(config.canvasWidth, player.x));

    // Player Shooting (Both modes)
    if (input.shootTrigger && !playerBullet) {
        if (gameMode !== 'STARTRAIL MODE') {
            if (!lowEnergyWarningPlayed) {
                energy -= config.energyTotal / 15;
            }
        }

        playerBullet = {
            x: player.x,
            y: player.y - config.playerVisualSize,
            width: 3,
            height: 10,
        };
        audioHandler.playSound('playerShoot');
    }

    // Update Player Bullet
    if (playerBullet) {
        playerBullet.y -= config.playerBulletSpeed * dt_sec;
        if (playerBullet.y < -TOP_EXT) {
            playerBullet = null;
        }
    }

    // Score and Difficulty Progression
    const stageMultiplier = scoreMul();
    distScoreAcc += config.distanceScoreMultiplier * (currentCometSpeed / config.initialCometSpeed) * stageMultiplier;
    const distInt = Math.floor(distScoreAcc); score += distInt; distScoreAcc -= distInt;
    currentCometSpeed += config.cometSpeedIncrease * dt_sec;

    const stageSpeedMod = 1 + (stage - 1) * 0.08;
    if (tutorial) {
        updateTutorial(dt_sec);
    } else {
    // Energy Management (STARTRAIL MODEではスキップ)
    if (gameMode !== 'STARTRAIL MODE') {
        const baseEnergyMultiplier = 0.9;
        const energyDecreaseRate = Math.pow(1.10, stage - 1); // ステージごとに1.10倍ずつ（1.12は厳しく、1.08はぬるい）
        energy -= baseEnergyMultiplier * energyDecreaseRate * 60 * dt_sec;

        const energyThreshold = config.energyTotal / 3;
        if (energy <= energyThreshold && gameState === 'playing') {
            if (!lowEnergyWarningPlayed) lowEnergyWarningPlayed = true;
            if (frameCount % 60 === 0) {
                audioHandler.playSound('lowEnergy');
            }
        } else {
            if (lowEnergyWarningPlayed) lowEnergyWarningPlayed = false;
        }

        if (energy <= 0 && !isPlayerInvincible) {
            gameOver('energy');
            return;
        }
    }


    // Stage Progression
    if (frameCount >= stageClearFrame) {
        setupNewStage();
    }

    // Comet Spawning
    if (stage >= 2 && frameCount >= nextWayShotFrame) {
        spawnWayComets();
        const baseInterval = Math.max(3, 10 - stage) * 15;
        let randomInterval = baseInterval * (0.5 + Math.random());

        // STARTRAILモードの場合、発射間隔を3倍にする（頻度を1/3に）
        if (gameMode === 'STARTRAIL MODE') {
            randomInterval *= 3;
        }

        nextWayShotFrame = frameCount + randomInterval;
    }

    const spawnInterval = Math.max(3, Math.floor(config.cometSpawnInterval / (1 + (stage - 1) * 0.2)));
    if (frameCount % spawnInterval === 0) {
        cometSpawnCarry += config.cometSpawnAmount * (tutorial ? 1 : (DIFFS[difficultyIndex].cometMul || 1) * (IS_MOBILE ? 2 / 3 : 1)); // EASYは彗星2/3。スマホは全難易度をさらに2/3（ARCADEはSTANDARDと同じ密度）
        for (; cometSpawnCarry >= 1; cometSpawnCarry--) {
            comets.push({
                x: Math.random() * config.canvasWidth,
                y: -config.cometCoreRadius - TOP_EXT,
                radius: config.cometCoreRadius,
                isGlazed: false
            });
        }
    }
    
    // Monster Spawning (Standard Mode only)
    if (gameMode === 'STANDARD MODE') {
        // 同時に出る雑魚の上限（ボスとボスが呼んだ雑魚は数えない）: 1〜5面は2体 → 15面で5体
        const enemyCap = Math.min(5, 2 + Math.floor((stage - 1) * 3 / 14));
        const canSpawn = () => monsters.filter(m => !m.fromBoss).length < enemyCap;
        // Looper Spawning
        if (looperSpawnFrame !== -1 && frameCount >= looperSpawnFrame && !hasLooperSpawnedThisStage && canSpawn()) {
            hasLooperSpawnedThisStage = true;
            monsters.push({
                type: 'looper',
                hp: 1,
                angle: Math.random() * Math.PI * 2,
                speed: (1.5 + (stage * 0.1)) * (4/9), 
                direction: Math.random() < 0.5 ? 1 : -1,
                width: 14 * 4.2,
                height: 14 * 4.2,
                shootCooldown: 0,
                shootAngle: Math.random() * Math.PI * 2
            });
        }
        
        if (extraEnemy.length && frameCount >= extraEnemy[0].frame && !boss && bossSpawnFrame === -1 && canSpawn()) {
            const ty = extraEnemy.shift().type, W = config.canvasWidth;
            if (ty === 'weaver') { const d = Math.random() < 0.5 ? 1 : -1; monsters.push({ type: ty, x: d > 0 ? -40 : W + 40, y: 150, baseY: 120 + Math.random() * 120, vx: d * 170, vy: 0, t: 0, st: 0.5, k: 0, width: 80, height: 58, scoreK: 1.5 }); }
            else if (ty === 'sentry') monsters.push({ type: ty, x: W * (0.25 + Math.random() * 0.5), y: -30 - TOP_EXT, ty: 170 + Math.random() * 60, t: 0, st: 0, spin: Math.random() * 6, width: 56, height: 56, scoreK: 2.5 });
            else monsters.push({ type: ty, x: W * (0.2 + Math.random() * 0.6), y: -30 - TOP_EXT, t: 0, pt: 0, cyc: 0, ang: Math.PI / 2, aim: false, width: 40, height: 56, scoreK: 2 });
        }
        const spawnCheckInterval = 120;
        if (frameCount % spawnCheckInterval === 0) {
            // UFO Spawning
            if (stage % 3 === 2 && !hasUFOSpawnedThisStage && !boss && bossSpawnFrame === -1 && canSpawn() && Math.random() < 0.2) { // ボス面(3の倍数)と重なって出なくなっていたので、ボスの手前の面に
                hasUFOSpawnedThisStage = true;
                const startX = Math.random() < 0.5 ? -30 : config.canvasWidth + 30;
                const speedX = startX < 0 ? 250 : -250;
                monsters.push({
                    type: 'ufo',
                    x: startX,
                    y: 50 + Math.random() * 100,
                    vx: speedX,
                    vy: 0,
                    width: 14 * 4,
                    height: 14 * 4,
                    shootCooldown: 30 + Math.random() * 15,
                });
            }

            // Invader Spawning
            const hasInvaderOnScreen = monsters.some(m => m.type === 'invader');
            if (invadersSpawnedThisStage < invaderSpawnCountForStage && !hasInvaderOnScreen && canSpawn() && Math.random() < 0.5) {
                invadersSpawnedThisStage++;
                monsters.push({
                    type: 'invader',
                    x: Math.random() * config.canvasWidth,
                    y: -30 - TOP_EXT,
                    vx: 0,
                    vy: 150,
                    width: 14 * 4,
                    height: 14 * 4,
                    shootCooldown: 30 + Math.random() * 30,
                });
            }
        }
    }

    // ハイパーアイテム（STARTRAILも含む全モード）
    if (!tutorial) {
        if (hyperT > 0) { hyperT -= dt_sec; if (hyperT <= 0) { hyperT = 0; effects.push({ type: 'hyperMsg', text: 'HYPER END', life: 60, maxLife: 60, end: true }); } }
        while (score >= nextHyperScore) {
            if (hyperT <= 0 && !items.some(it => it.type === 'hyper')) items.push({ x: 60 + Math.random() * (config.canvasWidth - 120), y: -20 - TOP_EXT, type: 'hyper' });
            nextHyperScore += config.energyItemScoreSpecial * 2.5 / HYPER_TEST_RATE * Math.pow(1.1, stage - 1) * DIFFS[difficultyIndex].mult * (hyperT > 0 ? 3 : 1);
        }
    } else if (hyperT > 0) {
        hyperT = Math.max(0, hyperT - dt_sec);
    }

    // Energy Item Spawning (STARTRAIL MODEではスキップ)
    if (gameMode !== 'STARTRAIL MODE') {
        // チェイン中はアイテムの間隔をチェイン数に応じて広げる（アイテムが出続けて無限チェインになるのを防ぐ）
        // チェインが切れて、画面内のアイテムが無くなったら即元の間隔に戻す
        // 大きなチェイン（CHAIN_LAG_LINE以上）の後は、戻るまでにタイムラグを入れる（すぐ戻ると出過ぎるため）
        // 保険: 無敵が切れてから長く経っても画面にアイテムが残り続けている場合（ボス撃破後など）は、残っていても「落ち着いた」とみなす
        if (player.invincibleTimer <= 0) itemDryT += dt_sec; else itemDryT = 0;
        const clear = player.invincibleTimer <= 0 && (!items.some(it => it.type !== 'hyper') || itemDryT > cometScrollSec() * (stage >= 14 ? 1 : 2));
        if (!clear) { itemLagPeak = Math.max(itemLagPeak, chainCount); itemLagT = -1; }
        else if (itemLagT < 0) itemLagT = itemLagPeak >= CHAIN_LAG_LINE ? cometScrollSec() * (stage >= 14 ? 0.25 : 0.9) : 0; // 切れた瞬間にラグを決める（彗星が画面を0.9回流れる時間。STAGE14以降は死活問題なので0.25回・保険も1回に短縮）
        if (clear && itemLagT > 0) itemLagT -= dt_sec;
        const settled = clear && itemLagT <= 0;
        if (settled) itemLagPeak = 0;
        const comboMultiplier = !settled && chainCount > 1 ? Math.pow(1.1, chainCount - 1) : 1;
        const totalMultiplier = stageMultiplier * comboMultiplier;
        const currentNormalThreshold = config.energyItemScoreNormal * totalMultiplier;
        const currentSpecialThreshold = config.energyItemScoreSpecial * totalMultiplier;
        if (settled) {
            nextItemScore = Math.min(nextItemScore, score + currentNormalThreshold);
            nextSpecialItemScore = Math.min(nextSpecialItemScore, score + currentSpecialThreshold);
        }

        if (!hasSpawned5000PointItem && score >= 5000 * DIFFS[difficultyIndex].mult) {
            items.push({ x: Math.random() * config.canvasWidth, y: -20, type: 'normal' });
            hasSpawned5000PointItem = true;
        }
        const nItemsBefore = items.length;
        while (score >= nextSpecialItemScore) {
            items.push({ x: Math.random() * config.canvasWidth, y: -20, type: 'special' });
            nextSpecialItemScore += currentSpecialThreshold;
            nextItemScore = Math.floor(score / currentNormalThreshold) * currentNormalThreshold + currentNormalThreshold;
        }
        while (score >= nextItemScore) {
            if (nextItemScore < nextSpecialItemScore) {
                items.push({ x: Math.random() * config.canvasWidth, y: -20, type: 'normal' });
            }
            nextItemScore += currentNormalThreshold;
        }
        // 15面以降: エネルギーが尽きる時間の半分が経ってもアイテムが出ていなければ1個降らせる
        if (items.length > nItemsBefore) itemGapT = 0; else itemGapT += dt_sec;
        if (stage >= ITEM_FLOOR_STAGE) {
            const emptySec = config.energyTotal / (0.9 * Math.pow(1.10, stage - 1) * 60);
            if (itemGapT >= emptySec / 2) { items.push({ x: 60 + Math.random() * (config.canvasWidth - 120), y: -20, type: 'normal' }); itemGapT = 0; }
        }
    }


    }

    // Update Comets
    for (let i = comets.length - 1; i >= 0; i--) {
        const c = comets[i];
        if (c.vx !== undefined && c.vy !== undefined) {
            c.x += c.vx * dt_sec * HY();
            c.y += c.vy * dt_sec * HY();
        } else {
            c.y += currentCometSpeed * stageSpeedMod * dt_sec * HY() * MOB_FALL; // ハイパー中は1.25倍。スマホはやや速く
        }

        if (c.y - c.radius > config.canvasHeight || c.x < -c.radius || c.x > config.canvasWidth + c.radius) {
            comets.splice(i, 1);
            continue;
        }

        const dx = player.x - c.x;
        const dy = player.y - c.y;
        const d = Math.sqrt(dx * dx + dy * dy);

        if (isPlayerInvincible) {
            if (d < config.playerVisualSize + c.radius) {
                const baseBonusScore = 1500;
                const comboMultiplier = chainCount > 1 ? Math.pow(1.1, chainCount - 1) : 1;
                const bonusScore = Math.floor(baseBonusScore * stageMultiplier * comboMultiplier);
                score += bonusScore;
                scoreTexts.push({ x: player.x, y: player.y - 30, text: `+${bonusScore}`, life: 60, type: 'bonus' });
                audioHandler.playSound('invincibleHit');
                if (tutorial) tutorial.smash++;
                comets.splice(i, 1);
                continue;
            }
        } else {
            if (hurtTimer <= 0 && d < player.radius + c.radius) {
                takeHit();
                return;
            }
        }

        const currentGlazeDistance = player.invincibleTimer > 0 ? config.glazeDistance * INV_GLAZE_K : config.glazeDistance;
        if (!c.isGlazed && d < player.radius + c.radius + currentGlazeDistance) {
            c.isGlazed = true;
            if (tutorial) tutorial.glazes++;
            const points = Math.floor(config.glazeScore * stageMultiplier);
            score += points;
            scoreTexts.push({ x: c.x, y: c.y, text: `+${points}`, life: 60, type: 'glaze' });
            audioHandler.playSound('glaze');
        }
    }
    
    // Update Monsters (Standard Mode only)
    if (gameMode === 'STANDARD MODE') {
        for (let i = monsters.length - 1; i >= 0; i--) {
            const m = monsters[i];
            if (!m._sized) { m._sized = true; m.width *= ES; m.height *= ES; }
            
            // Movement Update
            if (m.type === 'looper') {
                m.angle += m.speed * m.direction * dt_sec * ENEMY_SPD;
                m.x = config.canvasWidth / 2 + Math.cos(m.angle) * (config.canvasWidth / 2.5);
                m.y = (config.canvasHeight / 4) + Math.sin(m.angle) * (config.canvasHeight / 5);
            } else if (m.type === 'weaver' || m.type === 'sentry' || m.type === 'lance') {
                updateExtraEnemy(m, dt_sec);
            } else {
                m.x += m.vx * dt_sec * ENEMY_SPD;
                m.y += m.vy * dt_sec * ENEMY_SPD;
            }

            // Monster shooting
            if (m.shootCooldown !== undefined) {
                m.shootCooldown -= 60 * dt_sec * (hyperT > 0 ? 2 : 1); // ハイパー中は2倍撃ってくる
                if (m.shootCooldown <= 0) {
                     if (m.type === 'looper') {
			// ▼▼▼ ループド攻撃パターン変更 ▼▼▼
                        m.shootAngle += (Math.PI / 6); // 30度ずつ回転
                        const bulletSpeed = 200;
                        enemyBullets.push({
                            x: m.x, y: m.y, 
                            vx: bulletSpeed * Math.cos(m.shootAngle), 
                            vy: bulletSpeed * Math.sin(m.shootAngle), 
                            radius: 4, isGlazed: false
                        });
                        // 1秒に16発になるようにクールダウンを設定 (1/16=0.0625)
                        m.shootCooldown = 60 * 0.0625;
                        // ▲▲▲ ループド攻撃パターン変更 ▲▲▲
                    } else if (m.type === 'ufo') {
                        const angles = [-0.4, -0.2, 0, 0.2, 0.4]; // 5-way
                        angles.forEach(angle => {
                            enemyBullets.push({x: m.x, y: m.y, vx: 250 * Math.sin(angle), vy: 250 * Math.cos(angle), radius: 4, isGlazed: false});
                        });
                        m.shootCooldown = 45 + Math.random() * 15;
                    } else if (m.type === 'invader') {
                        const angleToPlayer = Math.atan2(player.y - m.y, player.x - m.x);
                        const spread = Math.PI / 8;
                        const angles = [angleToPlayer - spread, angleToPlayer, angleToPlayer + spread];
                        const bulletSpeed = 350;
                        angles.forEach(angle => {
                            enemyBullets.push({
                                x: m.x, y: m.y, 
                                vx: bulletSpeed * Math.cos(angle), 
                                vy: bulletSpeed * Math.sin(angle), 
                                radius: 4, isGlazed: false
                            });
                        });
                        m.shootCooldown = 90 + Math.random() * 40;
                    }
                }
            }

            // Check collision with player bullet
            if (playerBullet) {
                const R = config.playerBulletHitRadius;
                if (playerBullet.x > m.x - m.width / 2 - R && playerBullet.x < m.x + m.width / 2 + R &&
                    playerBullet.y > m.y - m.height / 2 - R && playerBullet.y < m.y + m.height / 2 + R) {
                    
                    playerBullet = null;
                    audioHandler.playSound('invincibleHit');
                    const comboMultiplier = chainCount > 1 ? Math.pow(1.1, chainCount - 1) : 1;
                    
                    if (m.hp) {
                        m.hp--;
                        if (m.hp <= 0) {
                             const baseScore = config.monsterLooperBaseScore;
                             const earnedScore = Math.floor(baseScore * stageMultiplier * comboMultiplier);
                             score += earnedScore;
                             scoreTexts.push({ x: m.x, y: m.y, text: `+${earnedScore}`, life: 60, type: 'bonus' });
                             audioHandler.playSound('enemyDestroy');
                             screenShake = { intensity:8, duration: 20 };
                             effects.push({ type: 'shockwave', x: m.x, y: m.y, life: 15, maxLife: 15, radius: 10 });
                             monsters.splice(i, 1);
                             triggerSpecialItemEffect();
                        }
                    } else {
                        const baseScore = (m.type === 'ufo' ? config.monsterUFOBaseScore : config.monsterInvaderBaseScore) * (m.scoreK || 1);
                        const earnedScore = Math.floor(baseScore * stageMultiplier * comboMultiplier);
                        score += earnedScore;
                        scoreTexts.push({ x: m.x, y: m.y, text: `+${earnedScore}`, life: 60, type: 'bonus' });
                        
                        audioHandler.playSound('enemyDestroy');
                        if(m.type === 'ufo') {
                            screenShake = { intensity: 8, duration: 20 };
                        }
                        effects.push({ type: 'shockwave', x: m.x, y: m.y, life: 15, maxLife: 15, radius: 10 });
                        monsters.splice(i, 1);
                        if (tutorial) tutorial.kills++;
                        
                        if (m.type === 'ufo') {
                            triggerSpecialItemEffect();
                        } else {
                            triggerNormalItemEffect();
                        }
                    }
                    continue;
                }
            }
            
            // Check collision with player
            const dx = player.x - m.x;
            const dy = player.y - m.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (isPlayerInvincible) {
                if (dist < player.radius + m.width / 2) {
                    const comboMultiplier = chainCount > 1 ? Math.pow(1.1, chainCount - 1) : 1;
                    const bonusScore = Math.floor(config.monsterCollisionBonus * stageMultiplier * comboMultiplier);
                    score += bonusScore;
                    scoreTexts.push({ x: player.x, y: player.y - 30, text: `+${bonusScore}`, life: 60, type: 'bonus' });
                    audioHandler.playSound('invincibleHit');
                    if (m.type === 'ufo' || m.type === 'looper') {
                        screenShake = { intensity: 8, duration: 20 };
                        triggerSpecialItemEffect();
                    } else {
                        triggerNormalItemEffect();
                    }
                    monsters.splice(i, 1);
                    continue;
                }
            } else {
                 if (hurtTimer <= 0 && dist < player.radius + m.width / 2) {
                    takeHit();
                    return;
                }
            }

            // Despawn if off-screen (for UFO and Invader)
            if (m.type !== 'looper' && (m.y > config.canvasHeight + 50 || m.x < -50 || m.x > config.canvasWidth + 50 || (m.leave && m.y < -60 - TOP_EXT))) {
                monsters.splice(i, 1);
            }
        }

        if (updateBoss(isPlayerInvincible)) return;

        // Update Enemy Bullets
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const eb = enemyBullets[i];
            eb.x += eb.vx * dt_sec * HY();
            eb.y += eb.vy * dt_sec * HY();

            const dx = player.x - eb.x;
            const dy = player.y - eb.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (isPlayerInvincible) {
                 if (dist < config.playerVisualSize + eb.radius) {
                    const baseBonusScore = 1500 * Math.pow(1.1, stage - 1); // 敵弾への体当たりはステージごとに1.1倍
                    const comboMultiplier = chainCount > 1 ? Math.pow(1.1, chainCount - 1) : 1;
                    const bonusScore = Math.floor(baseBonusScore * stageMultiplier * comboMultiplier);
                    if (tutorial) tutorial.bsmash = (tutorial.bsmash || 0) + 1;
                    score += bonusScore;
                    scoreTexts.push({ x: player.x, y: player.y - 30, text: `+${bonusScore}`, life: 60, type: 'bonus' });
                    audioHandler.playSound('invincibleHit');
                    enemyBullets.splice(i, 1);
                    continue;
                }
            } else {
                if (hurtTimer <= 0 && dist < player.radius + eb.radius) {
                    takeHit();
                    return;
                }
            }

            const currentGlazeDistance = player.invincibleTimer > 0 ? config.glazeDistance * INV_GLAZE_K : config.glazeDistance;
            if (!eb.isGlazed && dist < player.radius + eb.radius + currentGlazeDistance) {
                eb.isGlazed = true;
                if (tutorial) tutorial.glazes++;
                const points = Math.floor(config.glazeScore * stageMultiplier);
                score += points;
                scoreTexts.push({ x: eb.x, y: eb.y, text: `+${points}`, life: 60, type: 'glaze' });
                audioHandler.playSound('glaze');
            }

            if (eb.y > config.canvasHeight + 20 || eb.y < -20 - TOP_EXT || eb.x < -20 || eb.x > config.canvasWidth + 20) {
                enemyBullets.splice(i, 1);
            }
        }
    }


    // Update Items
    for (let index = items.length - 1; index >= 0; index--) {
        const item = items[index];
        if (item.phys) {
            // ボスから弾け飛んだアイテム: 放物線を描いてから通常の落下へ
            item.vx *= 0.97;
            item.vy = Math.min(config.energyItemSpeed * 0.7, item.vy + 520 * dt_sec);
            item.x = Math.max(16, Math.min(config.canvasWidth - 16, item.x + item.vx * dt_sec));
            item.y += item.vy * dt_sec;
        } else {
            item.y += config.energyItemSpeed * (item.type === 'hyper' ? 0.75 : 1) * MOB_ITEM_FALL * dt_sec;
            if (item.type === 'hyper') { // ハイパーは左右に大きく、ゆっくり揺れながら落ちてくる
                const A = Math.min(200, config.canvasWidth / 2 - 50);
                if (item.x0 == null) { item.x0 = Math.max(50 + A, Math.min(config.canvasWidth - 50 - A, item.x)); item.t = 0; }
                item.t += dt_sec;
                item.x = item.x0 + Math.sin(item.t * 1.25) * A;
            }
        }
        const dist = Math.sqrt(Math.pow(player.x - item.x, 2) + Math.pow(player.y - item.y, 2));

        if (item.type === 'hyper' ? shipTouches(item.x, item.y, 40 * VS * 0.95) // ハイパーはPC・スマホとも見た目（刃の先まで）どうしが触れたら取得
            : IS_MOBILE ? shipTouches(item.x, item.y, 20 * VS * 0.85) : dist < config.playerVisualSize + config.energyItemSize) {
            if (tutorial) tutorial.items++;
            if (item.type === 'hyper') {
                activateHyper();
            } else if (item.type === 'special') {
                gainShield();
                triggerSpecialItemEffect();
            } else {
                triggerNormalItemEffect();
            }
            items.splice(index, 1);
            continue;
        }
        if (item.y > config.canvasHeight + 20) {
            items.splice(index, 1);
        }
    }

    // Update Gems（得点アイテム）
    if (gemComboTimer > 0 && --gemComboTimer === 0) gemCombo = 0;
    for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        g.age += dt_sec;
        const dx = player.x - g.x, dy = player.y - g.y, d = Math.hypot(dx, dy) || 1;
        if (g.age > 0.25 && d < 120) {
            // 近づいたものだけ一気に吸い込む
            const sp = 1100 + (120 - d) * 12;
            g.vx = dx / d * sp;
            g.vy = dy / d * sp;
        } else {
            // 弾けた勢いはすぐ収まり、ゆっくり落ちていく
            g.vx *= 0.92;
            g.vy = g.vy * 0.92 + (1 - 0.92) * 150;
        }
        g.x += g.vx * dt_sec; g.y += g.vy * dt_sec;
        if (g.x < 12 || g.x > config.canvasWidth - 12) { g.vx *= -0.6; g.x = Math.max(12, Math.min(config.canvasWidth - 12, g.x)); }
        if (g.y < 12) { g.vy = Math.abs(g.vy) * 0.6; g.y = 12; }
        if (g.y > config.canvasHeight + 20) { gems.splice(i, 1); continue; }
        if (IS_MOBILE ? shipTouches(g.x, g.y, 16) : d < config.playerVisualSize + 16) {
            score += g.value;
            gemCombo++;
            gemComboTimer = 40;
            // CAVE風: 得点がジャラジャラと飛び散る
            scoreTexts.push({ x: player.x + (Math.random() - 0.5) * 60, y: player.y - 20 - Math.random() * 30, text: `${g.value}`, life: 32, type: 'gem', vx: (Math.random() - 0.5) * 2.5 });
            audioHandler.playGem(gemCombo);
            gems.splice(i, 1);
        }
    }

    // Update Score Texts
    for (let i = scoreTexts.length - 1; i >= 0; i--) {
        const st = scoreTexts[i];
        st.life--;
        if (st.type === 'gem') { st.y -= 2.6; st.x += st.vx || 0; } else st.y -= 0.5;
        if (st.life <= 0) {
            scoreTexts.splice(i, 1);
        }
    }
}
