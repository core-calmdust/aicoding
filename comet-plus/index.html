function updateMotifs(dt, ws, now) {
    // ステージ変更の検出
    if (currentThemeIndex !== lastThemeIdx) {
        const next = motifs[MOTIF_FOR_THEME[currentThemeIndex % MOTIF_FOR_THEME.length]];
        const animate = lastThemeIdx !== -1 && gameState === 'playing';
        lastThemeIdx = currentThemeIndex;
        if (next !== motifCur) {
            if (motifOld) motifOld.group.visible = false;
            motifOld = animate ? motifCur : null;
            if (!animate) motifCur.group.visible = false;
            motifCur = next;
            motifCur.group.visible = true;
            motifCur.items.forEach(it => motifCur.place(it, motifCur.initZ ? motifCur.initZ(it) : rand(WORLD_FAR, WORLD_NEAR)));
            motifTrans = animate ? 0 : 1;
        }
        if (animate) { warpT = 0; warpBoost = 1; }
    }
    if (motifTrans < 1) {
        motifTrans = Math.min(1, motifTrans + dt / 1.6);
        const e = 1 - Math.pow(1 - motifTrans, 3);
        // 新モチーフは床下から跳ね上がり、旧モチーフは沈んで消える
        const back = 1 + 2.2 * Math.pow(motifTrans - 1, 3) + 1.2 * Math.pow(motifTrans - 1, 2);
        motifCur.group.position.y = -900 * (1 - back);
        motifCur.group.scale.set(1, Math.max(0.05, back), 1);
        if (motifOld) {
            motifOld.group.position.y = -1100 * e;
            motifOld.group.scale.set(1 + e * 0.4, Math.max(0.02, 1 - e), 1 + e * 0.4);
            if (motifTrans >= 1) { motifOld.group.visible = false; motifOld.group.position.y = 0; motifOld.group.scale.set(1, 1, 1); motifOld = null; }
        }
    } else {
        motifCur.group.position.y = 0;
        motifCur.group.scale.set(1, 1, 1);
    }
    [motifCur, motifOld].forEach(m => {
        if (!m) return;
        m.items.forEach(it => {
            it.obj.position.z += ws * dt;
            if (it.obj.position.z > WORLD_NEAR) m.place(it, it.obj.position.z - WORLD_SPAN);
            if (m.animate) m.animate(it, rTime);
        });
    });

    // 切り替え演出
    warpBoost = Math.max(0, warpBoost - dt * 0.8);
    warpT += dt;
    const wt = warpT;
    if (wt < 1.6) {
        const p = wt / 1.6;
        warpRing.visible = warpRing2.visible = true;
        warpRing.scale.setScalar(100 + p * 3200);
        warpRing2.scale.setScalar(60 + Math.max(0, p - 0.12) * 2600);
        warpRingMat.opacity = Math.pow(1 - p, 1.5) * 0.9;
        warpRingMat.color.copy(themeCur.ui);
    } else {
        warpRing.visible = warpRing2.visible = false;
    }
    warpBeams.forEach(b => {
        const lt = wt - b.delay;
        if (lt < 0 || lt > 1.1) { b.beam.visible = false; return; }
        b.beam.visible = true;
        const p = lt / 1.1;
        b.beam.scale.set(1 + p * 0.5, Math.min(1, p * 4), 1);
        b.mat.opacity = Math.sin(p * Math.PI) * 0.55;
        b.mat.color.copy(themeCur.comet).lerp(COL_WHITE, 0.3);
    });
}

const FRAME_N = 640;
const framePerim = 2 * (W + H);
const frameBase = new Float32Array(FRAME_N * 3);
const frameS = new Float32Array(FRAME_N); // 下辺中央からの周回距離（左右対称）
const frameNx = new Float32Array(FRAME_N), frameNz = new Float32Array(FRAME_N); // 外向き法線
for (let i = 0; i < FRAME_N; i++) {
    let d = (i / FRAME_N) * framePerim; // 下辺中央から時計回り
    let x, z;
    const hw = W / 2, hh = H / 2;
    if (d < hw) { x = -d; z = hh; }
    else if ((d -= hw) < H) { x = -hw; z = hh - d; }
    else if ((d -= H) < W) { x = -hw + d; z = -hh; }
    else if ((d -= W) < H) { x = hw; z = -hh + d; }
    else { d -= H; x = hw - d; z = hh; }
    frameBase[i * 3] = x; frameBase[i * 3 + 2] = z;
    if (Math.abs(Math.abs(z) - hh) < 0.01) { frameNx[i] = 0; frameNz[i] = Math.sign(z); }
    else { frameNx[i] = Math.sign(x); frameNz[i] = 0; }
    const sd = (i / FRAME_N) * framePerim;
    frameS[i] = Math.min(sd, framePerim - sd);
}

function buildVoxelModel(art, px, heights) {
    const group = new THREE.Group();
    const rows = art.length, cols = art[0].length;
    const byCode = {};
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const code = art[r][c];
            if (!code) continue;
            const h = px * (heights[code] || 1);
            const box = new THREE.BoxGeometry(px * 0.94, h, px * 0.94);
            box.translate((c - cols / 2 + 0.5) * px, h / 2, (r - rows / 2 + 0.5) * px);
            (byCode[code] = byCode[code] || []).push(box);
        }
    }
    const mats = {};
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    Object.keys(byCode).forEach(code => {
        const geo = mergeGeometries(byCode[code]);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x000000, flatShading: true, metalness: 0.35, roughness: 0.35 });
        mats[code] = mat;
        group.add(new THREE.Mesh(geo, mat));
        group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
    });
    return { group, mats, edgeMat };
}

let bossObj = null, bossObjFor = null;
function renderBoss(dt) {
    if (bossObj && bossObjFor !== boss) {
        // ボスが消えた: 撃破なら破片
        if (!boss && bossObjFor && bossObjFor.hp <= 0) {
            const b = bossObjFor;
            spawnBurst(b.x, b.y, themeCur.ui, 90, { speed: 600, up: 800, minSize: 4, maxSize: 14 });
            spawnBurst(b.x, b.y, COL_WHITE, 40, { speed: 400, up: 600, minSize: 3, maxSize: 8 });
        }
        scene.remove(bossObj);
        (bossObj.userData.extra || []).forEach(e => scene.remove(e));
        bossObj = null; bossObjFor = null;
    }
    if (!boss) return;
    if (!bossObj) {
        bossObj = BOSS_BUILDERS[boss.idx]();
        bossObj.userData.mats = [];
        const collect = o => o.traverse(c => { if (c.material && c.material.emissive) bossObj.userData.mats.push({ m: c.material, base: c.material.emissiveIntensity }); });
        collect(bossObj);
        (bossObj.userData.extra || []).forEach(collect);
        bossObjFor = boss;
        bossObj.scale.setScalar(BS);
        scene.add(bossObj);
    }
    const b = boss;
    bossObj.position.set(toX(b.x), 50 + Math.sin(rTime * 2) * 8, toZ(b.y));
    bossObj.userData.anim(bossObj, b, rTime);
    const fl = b.flash > 0 ? 3.5 : 0;
    bossObj.userData.mats.forEach(({ m, base }) => { m.emissiveIntensity = base + fl + visualBeat * 0.25; });
    if (b.invuln && b.state === 'fight') bossObj.userData.mats.forEach(({ m }) => { m.emissiveIntensity *= 0.4; });
    if (isEffectsEnabled) glow.add(bossObj.position.x, 20, bossObj.position.z, themeCur.ui, 380, 0.12 + visualBeat * 0.08);
}

        debris.push({
            x: toX(x), y: opts.h || 10, z: toZ(y),
            vx: Math.cos(a) * sp, vy: rand(120, opts.up || 420), vz: Math.sin(a) * sp,
            life: rand(0.5, 1.1), max: 1.1,
            color: color.clone ? color.clone() : hexColor(color).clone(),
            size: rand(opts.minSize || 3, opts.maxSize || 7),
            cube: opts.cube !== false && Math.random() < 0.6,
            rx: rand(0, 6), ry: rand(0, 6), spin: rand(-8, 8),
        });
    }
}

// ---------------------------------
// テーマ色の補間
// ---------------------------------
const themeCur = { grid: new THREE.Color(0xff00ff), player: new THREE.Color(0x00ffff), comet: new THREE.Color(0x00aaff), ui: new THREE.Color(0x00ccff) };
const PALE_BLUE = new THREE.Color(0x8fb4ff);
const COL_WHITE = new THREE.Color(0xffffff);
const COL_GLAZE = new THREE.Color(0xffffaa);
const COL_CYAN = new THREE.Color(0x00ffff);
const COL_ORANGE = new THREE.Color(0xff8a20);

// ---------------------------------
// 描画ステート
// ---------------------------------
let rLast = performance.now();
let prevBeatR = 0;
let simDtR = 0;
let rTime = 0;
let camFollow = 0;
let shipBank = 0;
let worldSpeedSmooth = 80;
const seenTexts = new WeakSet();
const particleH = new WeakMap();
const _engC = new THREE.Color();

function project(x, y, h = 0) {
    _v.set(toX(x), h, toZ(y)).project(camera);
    return { x: (_v.x + 1) / 2 * HUD_W, y: (1 - _v.y) / 2 * VH };
}

// ---------------------------------
// 動的解像度: 60fpsを保てないときは描画解像度を下げる
// ---------------------------------
const Q_MAX = PR, Q_MIN = 0.55;
let quality = PR, qCeil = PR;
const perf = { t0: 0, frames: 0, good: 0, lastRaise: -1e9 };
function applyQuality() {
    renderer.setPixelRatio(quality);
    renderer.setSize(VW, VH, false);
    composer.setPixelRatio(quality);
    composer.setSize(VW, VH);
    glowMat.uniforms.uScale.value = GLOW_BASE * quality;
}
function adaptQuality(now) {
    if (!perf.t0) { perf.t0 = now; return; }
    if (now - perf.lastFrame > 500) { perf.t0 = now; perf.frames = 0; } // タブ復帰などの長い空白は無視
    perf.lastFrame = now;
    perf.frames++;
    const span = now - perf.t0;
    if (span < 1000) return;
    const fps = perf.frames * 1000 / span;
    perf.t0 = now; perf.frames = 0;
    if (fps < 54 && quality > Q_MIN) {
        if (now - perf.lastRaise < 6000) qCeil = Math.max(Q_MIN, quality - 0.1); // 上げてすぐ落ちたら上限を下げる
        quality = Math.max(Q_MIN, quality - 0.15);
        perf.good = 0;
        applyQuality();
    } else if (fps >= 58) {
        perf.good++;
        if (perf.good >= 5 && quality < Math.min(Q_MAX, qCeil)) {
            quality = Math.min(Q_MAX, qCeil, quality + 0.1);
            perf.good = 0;
            perf.lastRaise = now;
            applyQuality();
        }
    } else {
        perf.good = 0;
    }
}

function render3D() {
    const now = performance.now();
    let dt = Math.min(0.05, (now - rLast) / 1000);
    rLast = now;
    const frozen = gameState === 'paused' || gameState === 'confirmReset';
    const simDt = frozen ? 0 : dt;
    simDtR = simDt;
    rTime += simDt;

    const theme = themes[currentThemeIndex];
    const k = 1 - Math.exp(-dt * 3);
    themeCur.grid.lerp(hexColor(theme.grid), k);
    themeCur.player.lerp(hexColor(theme.player), k);
    themeCur.comet.lerp(hexColor(theme.comet), k);
    themeCur.ui.lerp(hexColor(theme.ui), k);

    // 背景とワールドの色
    _tmpC.copy(BG_BASE).lerp(themeCur.grid, 0.012);
    scene.background.copy(_tmpC);
    scene.fog.color.copy(_tmpC);
    floorMat.color.copy(themeCur.grid).lerp(PALE_BLUE, 0.4).multiplyScalar(0.6);
    floorMat.opacity = 0.18 + visualBeat * 0.15;
    buildingMatA.color.copy(PALE_BLUE).lerp(themeCur.grid, 0.3);
    buildingMatA.opacity = 0.26 + visualBeat * 0.2;
    buildingMatB.color.copy(themeCur.comet).lerp(COL_ORANGE, 0.5);
    fieldGridMat.color.copy(themeCur.grid);
    fieldGridMat.opacity = 0.08 + visualBeat * 0.1;
    borderMat.color.copy(themeCur.ui);
    borderMat.color.copy(themeCur.ui);
    borderMat.opacity = 0.55;
    if (visualBeat > prevBeatR + 0.3) onKick();
    prevBeatR = visualBeat;
    updateFrame(simDtR);
    shipMat.color.copy(themeCur.player);
    shipMat.emissive.copy(themeCur.player);
    shipMat.emissiveIntensity = 0.3 + visualBeat * 0.5;

    // ワールドのスクロール
    let speedRatio;
    if (gameState === 'playing') speedRatio = currentCometSpeed / config.initialCometSpeed;
    else if (frozen) speedRatio = 0;
    else speedRatio = 0.3;
    const targetSpeed = 360 * speedRatio * (1 + (stage - 1) * 0.05);
    worldSpeedSmooth += (targetSpeed - worldSpeedSmooth) * Math.min(1, dt * 2);
    const ws = frozen ? 0 : worldSpeedSmooth * (1 + warpBoost * 3.5);

    floorGrid.position.z = (floorGrid.position.z + ws * dt) % 100;
    updateMotifs(dt, ws, now);
    flows.forEach(f => {
        const t = rTime * f.speed + f.phase;
        for (let i = 0; i < f.n; i++) {
            const z = WORLD_FAR + (i / (f.n - 1)) * WORLD_SPAN;
            const zz = z - rTime * ws * 0.5;
            f.pos[i * 3] = f.x0 + Math.sin(zz * f.freq + t) * f.amp;
            f.pos[i * 3 + 1] = f.y0 + Math.sin(zz * f.freq * 0.7 + t * 1.3) * f.amp * 0.35;
            f.pos[i * 3 + 2] = z;
        }
        f.line.geometry.attributes.position.needsUpdate = true;
    });
    starData.forEach((s, i) => {
        s.z += ws * s.sp * 1.6 * dt;
        if (s.z > WORLD_NEAR) { s.z -= WORLD_SPAN; s.x = rand(-1500, 1500); }
        const len = s.len * (0.5 + speedRatio);
        const o = i * 6;
        starPos[o] = s.x; starPos[o + 1] = s.y; starPos[o + 2] = s.z - len;
        starPos[o + 3] = s.x; starPos[o + 4] = s.y; starPos[o + 5] = s.z;
    });
    starGeo.attributes.position.needsUpdate = true;

    fieldScroll = (fieldScroll + ws * 0.35 * dt) % H;
    updateFieldGrid();
    cornerGems.forEach((g, i) => { g.rotation.y = rTime * 2 + i; g.scale.setScalar(0.8 + visualBeat * 0.3); });

    // タイトル用ハブ
    const showHub = gameState === 'title' || gameState === 'confirmReset';
    titleHub.visible = titleHubInner.visible = kickRing.visible = showHub;
    orbitRings.forEach(o => { o.ring.visible = showHub; });
    field.visible = !showHub; // タイトルではフィールド枠を見せない
    if (showHub) {
        const b = visualBeat;
        const hueBase = rTime * 60;
        // 外側のハブ: 回転＋タンブル、キックで膨らむ
        titleHub.rotation.y += dt * (0.9 + b * 5);
        titleHub.rotation.x = Math.sin(rTime * 0.7) * 0.55;
        titleHub.rotation.z = Math.cos(rTime * 0.5) * 0.4;
        titleHub.scale.setScalar(2.6 * (1 + b * 0.16));
        hsl(hueBase, 1, 0.6, titleHub.userData.lineMat.color);
        hsl(hueBase + 180, 1, 0.55 + b * 0.35, titleHub.userData.eyeMat.color);
        titleHub.userData.arms.forEach(a => {
            const ext = Math.sin(rTime * 3 + a.i * 0.9) * 14 + b * 28;
            a.parts.forEach(pt => { pt.position.z = 63 + ext; });
            a.arm.rotation.x = a.baseX + Math.sin(rTime * 1.6 + a.i) * 0.45;
        });
        // 内側のハブ: 逆回転
        titleHubInner.rotation.y -= dt * (2.2 + b * 8);
        titleHubInner.rotation.z = Math.sin(rTime * 1.1) * 0.8;
        titleHubInner.scale.setScalar(1.3 * (1 + b * 0.3));
        hsl(hueBase + 120, 1, 0.65, titleHubInner.userData.lineMat.color);
        titleHubInner.userData.arms.forEach(a => {
            a.parts.forEach(pt => { pt.position.z = 63 + Math.sin(rTime * 5 + a.i) * 18; });
        });
        // 周回リング
        orbitRings.forEach((o, k) => {
            o.ring.rotation.x = rTime * (0.4 + k * 0.25) + k;
            o.ring.rotation.y = rTime * (0.3 - k * 0.2);
            o.ring.scale.setScalar(1 + b * (0.08 + k * 0.04));
            hsl(hueBase + k * 90, 1, 0.6, o.mat.color);
            o.mat.opacity = 0.35 + b * 0.5;
        });
        // キックで床に広がるリング
        if (b > 0.95 && kickRingLife < 0.6) kickRingLife = 1;
        kickRingLife = Math.max(0, kickRingLife - dt * 1.8);
        kickRing.scale.setScalar(120 + (1 - kickRingLife) * 900);
        kickRingMat.opacity = kickRingLife * 0.8;
        hsl(hueBase + 60, 1, 0.7, kickRingMat.color);
    }

    // カメラ
    const inGame = gameState === 'playing' || gameState === 'paused' || gameState === 'gameOver';
    const followTarget = inGame ? 0 : Math.sin(rTime * 0.25) * 40;
    camFollow += (followTarget - camFollow) * Math.min(1, dt * 2.5);
    let shakeX = 0, shakeY = 0;
    if (screenShake.intensity > 0) {
        shakeX = (Math.random() - 0.5) * 2 * screenShake.intensity * 0.9;
        shakeY = (Math.random() - 0.5) * 2 * screenShake.intensity * 0.9;
    }
    const beatPush = visualBeat * 7;
    camera.position.set(CAM_BASE.x + camFollow + shakeX, CAM_BASE.y - beatPush + shakeY, CAM_BASE.z - beatPush * 0.7);
    camera.lookAt(CAM_LOOK.x + camFollow + shakeX * 0.5, CAM_LOOK.y, CAM_LOOK.z);

    // ---- エンティティ ----
    glow.begin(); trails.begin(); cometBodies.begin(); cometWires.begin(); bulletBodies.begin(); debrisCubes.begin();

    if (showHub) {
        const b = visualBeat, hueBase = rTime * 60;
        // 周回する光の粒
        const hp = titleHub.position;
        for (let k = 0; k < 36; k++) {
            const a = rTime * (1.2 + (k % 3) * 0.5) + k * 0.7;
            const r = 330 + (k % 4) * 60 + b * 60;
            const tilt = (k % 5) * 0.5;
            glow.add(hp.x + Math.cos(a) * r, hp.y + Math.sin(a * 1.3 + tilt) * 160, hp.z + Math.sin(a) * r,
                hsl(hueBase + k * 10, 1, 0.6), 34 + b * 30, 1.1);
        }
    }
    const efx = isEffectsEnabled;

    // スコアテキストからロックオン演出を検出
    scoreTexts.forEach(st => {
        if (seenTexts.has(st)) return;
        seenTexts.add(st);
        if (st.type === 'glaze') {
            spawnLink(st.x, st.y);
        } else if (st.type === 'bonus') {
            const nearPlayer = Math.abs(st.x - player.x) < 1 && Math.abs(st.y - (player.y - 30)) < 1;
            spawnBurst(st.x, nearPlayer ? player.y - 10 : st.y, nearPlayer ? COL_WHITE : themeCur.comet, nearPlayer ? 10 : 18, { cube: !nearPlayer });
        }
    });

    // 彗星
    const stageSpeedMod = 1 + (stage - 1) * 0.08;
    comets.forEach(c => {
        if (c._r === undefined) c._r = Math.random() * 100;
        const baseColor = c.isWay ? themeCur.player : themeCur.comet;
        const color = c.isGlazed ? COL_GLAZE : baseColor;
        const x = toX(c.x), z = toZ(c.y), y = 7;
        const rot = rTime * 3 + c._r;
        const s = c.radius * 1.7 * (1 + visualBeat * 0.2);
        cometBodies.add(x, y, z, s, s, s, rot, rot * 0.7, c._r, color);
        cometWires.add(x, y, z, s * 1.5, s * 1.5, s * 1.5, -rot * 0.8, rot, 0, color);
        glow.add(x, y, z, color, 14 + visualBeat * 8, 0.4);
        if (efx) {
            let vx, vy;
            if (c.vx !== undefined) { vx = c.vx; vy = c.vy; } else { vx = 0; vy = currentCometSpeed * stageSpeedMod; }
            const sp = Math.hypot(vx, vy) || 1;
            const len = 34 + sp * 0.09;
            trails.add(x - vx / sp * len, y, z - vy / sp * len, x, y, z, 13, color, 0.75);
        }
    });

    // アイテム
    let ii = 0;
    items.forEach(it => {
        const obj = itemPool[ii++];
        if (!obj) return;
        obj.visible = true;
        obj.position.set(toX(it.x), 14, toZ(it.y));
        const c = it.type === 'special' ? hsl(frameCount * 4, 1, 0.65) : hexColor('#00ff88');
        const u = obj.userData;
        u.edgeMat.color.copy(c); u.coreMat.emissive.copy(c); u.ringMat.color.copy(c);
        u.box.rotation.set(rTime * 1.3, rTime * 1.7, 0);
        u.core.rotation.y = -rTime * 3;
        u.ring.rotation.z = rTime * 2;
        const sc = 1 + visualBeat * 0.2;
        obj.scale.setScalar(sc);
        glow.add(obj.position.x, obj.position.y, obj.position.z, c, 34, 0.5);
    });
    for (; ii < itemPool.length; ii++) itemPool[ii].visible = false;

    // モンスター
    const alive = new Set();
    if (gameMode === 'STANDARD MODE') {
        const hue1 = (frameCount * 2) % 360;
        const mm = monsterModels;
        const setMat = (mat, h, s, l, e = 0.18) => { hsl(h, s, l, mat.color); mat.emissive.copy(mat.color).multiplyScalar(e); };
        setMat(mm.ufo.mats[1], hue1, 0.85, 0.55); setMat(mm.ufo.mats[2], hue1, 0.6, 0.32, 0.1);
        setMat(mm.ufo.mats[3], hue1, 0.7, 0.8, 0.25); setMat(mm.ufo.mats[4], hue1 + 180, 1, 0.55, 0.6);
        setMat(mm.invader.mats[1], hue1, 1, 0.55); setMat(mm.invader.mats[2], hue1 + 120, 1, 0.5); setMat(mm.invader.mats[3], hue1 + 240, 1, 0.6, 0.7);
        mm.looper.mats[1].color.set('#9400D3'); mm.looper.mats[1].emissive.set('#4a0070');
        mm.looper.mats[2].color.set('#ffffff'); mm.looper.mats[2].emissive.set('#ffffff');
        mm.looper.mats[3].color.set('#FFD700'); mm.looper.mats[3].emissive.set('#a07000');
        monsters.forEach(m => {
            alive.add(m);
            let obj = monsterObjs.get(m);
            if (!obj) { obj = makeMonsterObj(m); monsterObjs.set(m, obj); }
            obj.userData.lastX = m.x; obj.userData.lastY = m.y;
            const sd = obj.userData.seed;
            obj.position.set(toX(m.x), 6 + Math.sin(rTime * 3 + sd) * 4, toZ(m.y));
            obj.userData.body.rotation.z = Math.sin(rTime * 2.4 + sd) * 0.18;
            obj.userData.body.rotation.x = Math.sin(rTime * 1.7 + sd) * 0.1;
            const sc = 1 + visualBeat * 0.12;
            obj.scale.setScalar(sc);
            if (obj.userData.hub) {
                obj.userData.hub.rotation.y = rTime * 1.5;
                obj.userData.hub.userData.lineMat.color.copy(themeCur.ui);
            }
            const gc = hsl(hue1, 1, 0.7);
            glow.add(obj.position.x, obj.position.y + 4, obj.position.z, gc, m.type === 'looper' ? 110 : 70, 0.14);
        });
        enemyBullets.forEach(eb => {
            if (eb._r === undefined) eb._r = Math.random() * 10;
            const c = eb.isGlazed ? COL_GLAZE : hsl(Date.now() / 10 + eb.y, 1, 0.62);
            const x = toX(eb.x), z = toZ(eb.y), y = 16;
            const pulse = 1 + Math.sin(rTime * 14 + eb._r) * 0.15;
            const s = eb.radius * 2.4 * pulse;
            bulletBodies.add(x, y, z, s, s * 1.2, s, rTime * 4 + eb._r, rTime * 6 + eb._r, 0, c);
            glow.add(x, y, z, c, eb.radius * 11, 0.85);     // 色のハロー
            glow.add(x, y + 2, z, COL_WHITE, eb.radius * 4, 1.8);   // 白い芯
            if (efx) {
                const sp = Math.hypot(eb.vx, eb.vy) || 1;
                trails.add(x - eb.vx / sp * 26, y, z - eb.vy / sp * 26, x, y, z, 8, c, 0.6);
            }
        });
    }
    // 消えたモンスター: 撃破ならボクセル片を散らす
    monsterObjs.forEach((obj, m) => {
        if (alive.has(m)) return;
        const lx = obj.userData.lastX, ly = obj.userData.lastY;
        if (lx > -20 && lx < W + 20 && ly > -20 && ly < H + 20 && gameState !== 'title') {
            const c = obj.userData.type === 'looper' ? hexColor('#9400D3') : hsl(frameCount * 2, 1, 0.65, new THREE.Color());
            spawnBurst(lx, ly, c, obj.userData.type === 'invader' ? 34 : 60, { speed: 420, up: 520, minSize: 3, maxSize: 8 });
        }
        scene.remove(obj);
        monsterObjs.delete(m);
    });

    renderBoss(dt);

    // プレイヤー弾
    if (playerBullet) {
        const x = toX(playerBullet.x), z = toZ(playerBullet.y), y = 8;
        trails.add(x, y, z + 70, x, y, z - 6, 9, COL_CYAN, 1.6);
        trails.add(x, y, z + 40, x, y, z - 4, 3, COL_WHITE, 1.5);
        glow.add(x, y, z, COL_CYAN, 34, 1.4);
    }

    // パーティクル（爆発）: 3Dの高さを与える
    particles.forEach(p => {
        let st = particleH.get(p);
        if (!st) { st = { vy: rand(80, 520), h: 6, t: 0 }; particleH.set(p, st); }
        st.t += simDt;
        st.h = Math.max(0, 6 + st.vy * st.t - 260 * st.t * st.t);
        const a = p.life / p.maxLife;
        glow.add(toX(p.x), st.h, toZ(p.y), hexColor(p.color), (p.size || 2) * 7 * (0.4 + a), a * 1.3);
    });

    // レンダラー側のデブリ
    for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.life -= simDt;
        if (d.life <= 0) { debris.splice(i, 1); continue; }
        d.vy -= 900 * simDt;
        d.x += d.vx * simDt; d.y += d.vy * simDt; d.z += d.vz * simDt;
        if (d.y < 0) { d.y = 0; d.vy *= -0.45; d.vx *= 0.7; d.vz *= 0.7; }
        d.rx += d.spin * simDt; d.ry += d.spin * 0.7 * simDt;
        const a = Math.min(1, d.life / d.max * 1.6);
        if (d.cube) {
            const s = d.size * a;
            debrisCubes.add(d.x, d.y, d.z, s, s, s, d.rx, d.ry, 0, d.color);
        }
        glow.add(d.x, d.y, d.z, d.color, d.size * 4, a);
    }

    // プレイヤー
    const showPlayer = (gameState === 'playing' || gameState === 'paused' || (gameState === 'gameOver' && gameOverReason === 'energy'));
    const playerVisible = showPlayer && !(gameState === 'gameOver' && gameOverReason === 'collision');
    playerGroup.visible = playerVisible;
    glazeDisc.visible = glazeRing.visible = showPlayer;
    shield.visible = meter.visible = false;
    if (showPlayer) {
        const px = toX(player.x), pz = toZ(player.y);
        const bankTarget = frozen ? shipBank : (input.left && !input.right ? 0.55 : input.right && !input.left ? -0.55 : 0);
        shipBank += (bankTarget - shipBank) * Math.min(1, dt * 10);
        playerGroup.position.set(px, 12 + Math.sin(rTime * 4) * 2, pz);
        shipPivot.rotation.z = shipBank;
        shipPivot.rotation.x = -0.12;
        playerGroup.scale.setScalar(1 + visualBeat * 0.18);

        const glazeR = player.radius + (player.invincibleTimer > 0 ? config.glazeDistance * 1.5 : config.glazeDistance);
        glazeDisc.position.set(px, 1, pz); glazeDisc.scale.setScalar(glazeR);
        glazeRing.position.set(px, 1.5, pz); glazeRing.scale.setScalar(glazeR);
        glazeFillMat.color.copy(themeCur.player);
        glazeRingMat.color.copy(themeCur.player);
        glazeFillMat.opacity = efx ? 0.025 + visualBeat * 0.04 : 0.0;
        glazeRingMat.opacity = efx ? 0.16 + visualBeat * 0.22 : 0.3;

        // エンジン
        if (playerVisible) {
                        const flick = 0.8 + Math.random() * 0.4;
            [-6, 6].forEach(off => {
                const ex = px + off * Math.cos(shipBank), ez = pz + 13;
                glow.add(ex, 12, ez, themeCur.player, 18 * flick, 1.2);
                if (efx) trails.add(ex, 11, ez + 34 * flick, ex, 11, ez, 7, themeCur.player, 0.9);
            });
            // 当たり判定とスローマーカー
            glow.add(px, 22, pz, hsl(frameCount * 10, 1, 0.7, _engC), 9, 1.6);
            if (input.slow) glow.add(px, 23, pz, COL_WHITE, 16, 1.4);
        }

        if (player.invincibleTimer > 0) {
            const blinkShield = player.invincibleTimer < 30 && frameCount % 10 < 5;
            shield.visible = !blinkShield;
            shield.position.set(px, 12, pz);
            shield.scale.setScalar(config.playerVisualSize * 1.5 * (1 + visualBeat * 0.15));
            shield.rotation.set(rTime * 1.2, rTime * 1.8, 0);
            shieldMat.opacity = 0.45 + Math.sin(frameCount * 0.2) * 0.2;

            const blinkMeter = player.invincibleTimer < 60 && frameCount % 10 < 5;
            meter.visible = !blinkMeter;
            const prog = Math.max(0, Math.min(1, player.invincibleTimer / player.maxInvincibleTimer));
            meter.geometry.setDrawRange(0, 6 * Math.round(METER_SEG * prog));
            meter.position.set(px, 2, pz);
            const mr = glazeR + 5;
            meter.scale.set(-mr, mr, mr);
            hsl(frameCount * 4, 1, 0.7, meterMat.color);
        }
    }

    // 衝撃波（HUD用 x=150,y=65 はHUDで描画）
    let si = 0;
    effects.forEach(e => {
        if (e.type !== 'shockwave' || e.hud || !efx) return;
        const s = shockPool[si++];
        if (!s) return;
        const progress = 1 - e.life / e.maxLife;
        const alpha = e.life / e.maxLife;
        const r = e.radius + progress * 300;
        s.ring.visible = s.sph.visible = true;
        s.ring.position.set(toX(e.x), 3, toZ(e.y));
        s.ring.scale.setScalar(r);
        s.ringMat.opacity = alpha * 0.9;
        s.sph.position.set(toX(e.x), 10, toZ(e.y));
        s.sph.scale.setScalar(e.radius + progress * 140);
        s.sph.rotation.y = progress * 2;
        s.sphMat.opacity = alpha * 0.55;
        s.sphMat.color.copy(themeCur.ui).lerp(COL_WHITE, 0.4);
    });
    for (; si < shockPool.length; si++) shockPool[si].ring.visible = shockPool[si].sph.visible = false;

    // 小節スイープ
    const bar = effects.find(e => e.type === 'barLine');
    if (bar && efx && gameState !== 'title') {
        const progress = 1 - bar.life / bar.maxLife;
        sweep.visible = true;
        sweep.position.set(0, 2, -H / 2 + H * progress);
        sweepMat.color.copy(themeCur.ui);
        sweepMat.opacity = Math.sin((1 - progress) * Math.PI) * 0.22;
    } else {
        sweep.visible = false;
    }

    // ロックオンライン
    linkPool.forEach(l => {
        if (l.life <= 0) { l.line.visible = false; return; }
        l.life -= dt;
        const a = Math.max(0, l.life / l.max);
        l.line.visible = true;
        const sx = toX(player.x), sz = toZ(player.y), tx = toX(l.tx), tz = toZ(l.ty);
        const mx = (sx + tx) / 2 + (tz - sz) * 0.35 * l.bend, mz = (sz + tz) / 2 - (tx - sx) * 0.35 * l.bend;
        for (let i = 0; i < LINK_PTS; i++) {
            const t = i / (LINK_PTS - 1);
            const it = 1 - t;
            l.pos[i * 3] = it * it * sx + 2 * it * t * mx + t * t * tx;
            l.pos[i * 3 + 1] = 12 + Math.sin(t * Math.PI) * 50;
            l.pos[i * 3 + 2] = it * it * sz + 2 * it * t * mz + t * t * tz;
        }
        l.line.geometry.attributes.position.needsUpdate = true;
        l.mat.color.setRGB(0.75, 0.38, 1).multiplyScalar(a * 1.4);
        l.mat.opacity = a;
        glow.add(tx, 8, tz, COL_GLAZE, 40 * a, a);
    });

    glow.end(); trails.end(); cometBodies.end(); cometWires.end(); bulletBodies.end(); debrisCubes.end();

    if (!gl3dOK) return;
    adaptQuality(now);
    if (efx) {
        bloom.strength = 0.55 + visualBeat * 0.35;
        composer.render(dt);
    } else {
        renderer.render(scene, camera);
    }
}


// =================================================================================
// ▼▼▼ HUD（2Dオーバーレイ）▼▼▼
// =================================================================================
function draw() {
    render3D();

    const renderCtx = ctx;
    const theme = themes[currentThemeIndex];
    renderCtx.setTransform(HUD_SCALE, 0, 0, HUD_SCALE, 0, 0);
    renderCtx.clearRect(0, 0, HUD_W, HUD_H);
    renderCtx.save();
    if (screenShake.intensity > 0) {
        renderCtx.translate((Math.random() - 0.5) * screenShake.intensity * 0.6, (Math.random() - 0.5) * screenShake.intensity * 0.6);
    }

    if (!gl3dOK) {
        renderCtx.fillStyle = '#ff3366';
        renderCtx.font = `14px ${config.fontFamily}`;
        renderCtx.textAlign = 'center';
        renderCtx.fillText('WebGL is not available on this browser.', HUD_W / 2, HUD_H - 60);
    }

    if (gameState === 'playing' || gameState === 'paused' || gameState === 'title') {
        applyThemeStyles(theme);
    }

    // タイトル画面の読みやすさ確保用ベール
    if (gameState === 'title' || gameState === 'confirmReset' || gameState === 'gameOver') {
        const g = renderCtx.createRadialGradient(HUD_W / 2, HUD_H / 2, 60, HUD_W / 2, HUD_H / 2, 560);
        g.addColorStop(0, 'rgba(5,0,18,0.55)');
        g.addColorStop(1, 'rgba(5,0,18,0.15)');
        renderCtx.fillStyle = g;
        renderCtx.fillRect(0, 0, HUD_W, HUD_H);
    }

    // スコアテキスト（3D位置をスクリーンに投影）
    if (scoreTexts.length > 0) {
        renderCtx.save();
        renderCtx.textAlign = 'center';
        scoreTexts.forEach(st => {
            const fontSize = st.type === 'bonus' ? 14 : 10;
            renderCtx.font = `${fontSize}px ${config.fontFamily}`;
            const alpha = st.life / 60.0;
            const hue = (frameCount * 5 + st.x) % 360;
            const scoreColor = `hsla(${hue}, 100%, 70%, ${alpha})`;
            const glowColor = `hsla(${hue}, 100%, 70%, ${alpha / 2})`;
            const sp = project(st.x, st.y, 24);
            renderCtx.globalAlpha = alpha;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = scoreColor;
                renderCtx.fillText(st.text, sp.x, sp.y);
            }, glowColor);
        });
        renderCtx.restore();
    }

    // Draw UI
    const uiColor = theme.ui;
    const mainFontSize = 20 + visualBeat * 2;
    const subFontSize = 18 + visualBeat * 2;

    // SCOREとタイマー表示 (タイトル画面以外で表示)
    if (gameState !== 'title') {
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `${mainFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            
            renderCtx.textAlign = 'left';
            renderCtx.fillText(`SCORE: ${score}`, 20, 40);

            renderCtx.textAlign = 'center';
            renderCtx.fillText(formatTime(elapsedTime), HUD_W / 2, 40);
        }, uiColor, true);
    }

    // ゲームモードとSTAGE表示 (playing, paused, gameOver の時に表示)
    if (gameState === 'playing' || gameState === 'paused' || gameState === 'gameOver') {
        // ▼▼▼ このブロックを修正 ▼▼▼
        // ゲームモード名とハイスコアを交互に表示
        let textToDisplay;
        if (isShowingModeInGame) {
            textToDisplay = gameMode.replace(' MODE', '');
        } else {
            let currentHighScore;
            switch(gameMode) {
                case 'STANDARD MODE':
                    currentHighScore = highScoreStandard;
                    break;
                case 'JOURNEY MODE':
                    currentHighScore = highScoreJourney;
                    break;
                case 'STARTRAIL MODE':
                    currentHighScore = highScoreStartrail;
                    break;
                default:
                    currentHighScore = 0;
            }
            
            // ★ ここからが変更点 ★
            // 現在のスコアがハイスコアを上回っている場合、表示するスコアを現在のスコアにする
            const scoreToDisplay = Math.max(currentHighScore, score);
            textToDisplay = `HI: ${scoreToDisplay}`;
            // ★ 変更はここまで ★
        }
        
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `${mainFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            renderCtx.textAlign = 'right';
            renderCtx.fillText(textToDisplay, HUD_W - 20, 40);
        }, uiColor, true);
        // ▲▲▲ 修正はここまで ▲▲▲

        // STAGE表示
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `${subFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            renderCtx.textAlign = 'center';
            renderCtx.fillText(`STAGE ${stage}`, HUD_W / 2, HUD_H - 20);
        }, uiColor, true);
    }

    // ボス: 警告とHPバー
    if (boss && (gameState === 'playing' || gameState === 'paused')) {
        renderCtx.save();
        renderCtx.textAlign = 'center';
        if (boss.state === 'enter') {
            renderCtx.globalAlpha = Math.floor(boss.enterT / 8) % 2 ? 1 : 0.35;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = '#ff3355';
                renderCtx.font = `40px ${config.fontFamily}`;
                renderCtx.fillText('WARNING', HUD_W / 2, HUD_H / 2 - 20);
            }, '#ff3355');
            renderCtx.globalAlpha = 1;
            renderCtx.fillStyle = theme.ui;
            renderCtx.font = `14px ${config.fontFamily}`;
            renderCtx.fillText(`${boss.def.name} APPROACHING`, HUD_W / 2, HUD_H / 2 + 20);
        }
        const bw = 360, bh = 8, bx = HUD_W / 2 - bw / 2, by = 64;
        renderCtx.font = `10px ${config.fontFamily}`;
        renderCtx.textAlign = 'left';
        renderCtx.fillStyle = theme.ui;
        renderCtx.fillText(boss.def.name, bx, by - 6);
        const seg = bw / boss.maxHp;
        for (let k = 0; k < boss.maxHp; k++) {
            const on = k < boss.hp;
            renderCtx.fillStyle = on ? (boss.flash > 0 ? '#ffffff' : '#ff3d6e') : 'rgba(255,255,255,0.15)';
            renderCtx.fillRect(bx + k * seg + 1, by, seg - 2, bh);
        }
        renderCtx.restore();
    }

    if (chainCount > 1 && player.invincibleTimer > 0) {
        drawChainComboText(renderCtx, chainCount, 1.0);
    }

    // ★ ここから追加 ★
    if (mutekiAnim.life > 0) {
        const lifeProgress = 1 - (mutekiAnim.life / mutekiAnim.maxLife);
        const chars = "!?#$ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let displayText = "";
        const mainTextY = HUD_H / 2 + 30;
        const subTextY = mainTextY + 25;
        const transitionStart = 0.25;
        const transitionEnd = 0.75;

        if (lifeProgress < transitionStart) {
            displayText = "INVINCIBLE!!";
        } else if (lifeProgress < transitionEnd) {
            const toText = "MUTEKI!!";
            const transitionProgress = (lifeProgress - transitionStart) / (transitionEnd - transitionStart);
            const textChars = []; // 配列を使って高速化
            for (let i = 0; i < toText.length; i++) {
                if (transitionProgress > (i / toText.length) + (Math.random() * 0.1)) {
                    textChars.push(toText[i]);
                } else {
                    textChars.push(chars[Math.floor(Math.random() * chars.length)]);
                }
            }
            displayText = textChars.join('');
        } else {
            displayText = "MUTEKI!!";
        }
        
        renderCtx.save();
        renderCtx.textAlign = 'center';
        renderCtx.font = `24px ${config.fontFamily}`;
        const totalWidth = renderCtx.measureText(displayText).width;
        let currentX = HUD_W / 2 - totalWidth / 2;

        for (let i = 0; i < displayText.length; i++) {
            const char = displayText[i];
            const charWidth = renderCtx.measureText(char).width;
            const hue = (frameCount * 5 + i * 25) % 360;
            const color = `hsl(${hue}, 100%, 70%)`;
            renderCtx.globalAlpha = 1;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = color;
                renderCtx.fillText(char, currentX + charWidth / 2, mainTextY);
            }, color);
            currentX += charWidth;
        }

        renderCtx.font = `10px ${config.fontFamily}`;
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = theme.ui;
            renderCtx.fillText("Bonus Points for Hitting a Comet!!", HUD_W / 2, subTextY);
        }, theme.ui);
        renderCtx.restore();
    }
    // ★ ここまで追加 ★

    if ((gameState === 'playing' || gameState === 'paused') && gameMode !== 'STARTRAIL MODE') {
        const barW = 200, barH = 12, x = 20, y = HUD_H - 35, r = 5;
        const energyRatio = Math.max(0, energy / config.energyTotal);
        const hue = energyRatio * 120;
        let energyColor = `hsl(${hue},100%,50%)`;

        if (lowEnergyWarningPlayed && frameCount % 10 < 5) {
            energyColor = '#FFFFFF';
        }

        renderCtx.strokeStyle = 'rgba(255,255,255,0.5)';
        renderCtx.lineWidth = 2;
        drawRoundRect(renderCtx, x, y, barW, barH, r);
        renderCtx.stroke();
        renderCtx.fillStyle = 'rgba(0,0,0,0.5)';
        drawRoundRect(renderCtx, x, y, barW, barH, r);
        renderCtx.fill();
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = energyColor;
            if (barW * energyRatio > 0) {
                renderCtx.beginPath();
                drawRoundRect(renderCtx, x, y, barW * energyRatio, barH, r);
                renderCtx.fill()
            }
        }, energyColor, true);

        if (player.invincibleTimer > 0) {
            const invincBarY = y + barH + 5;
            const invincBarH = 6;
            const invincRatio = player.invincibleTimer / player.maxInvincibleTimer;
            const invincColor = '#FFFFFF';
            renderCtx.strokeStyle = 'rgba(255,255,255,0.5)';
            renderCtx.lineWidth = 1;
            drawRoundRect(renderCtx, x, invincBarY, barW, invincBarH, r - 2);
            renderCtx.stroke();
            renderCtx.fillStyle = 'rgba(0,0,0,0.5)';
            drawRoundRect(renderCtx, x, invincBarY, barW, invincBarH, r - 2);
            renderCtx.fill();
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = invincColor;
                if (barW * invincRatio > 0) {
                    renderCtx.beginPath();
                    drawRoundRect(renderCtx, x, invincBarY, barW * invincRatio, invincBarH, r - 2);
                    renderCtx.fill()
                }
            }, invincColor, true);
        }
    }

    if (isInvincible) {
        let mutekiY = HUD_H - 50;
        if (player.invincibleTimer > 0 && gameMode !== 'STARTRAIL MODE') {
            mutekiY = HUD_H - 50 - 12 - 5 - 6;
        }
        const mutekiColor = `hsl(${(frameCount*3)%360},100%,70%)`;
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = mutekiColor;
            renderCtx.font = `16px ${config.fontFamily}`;
            renderCtx.textAlign = 'left';
            renderCtx.fillText('MUTEKI', 20, mutekiY);
        }, mutekiColor, true);
    }
    

    // Draw Effects (HUD側)
    effects.forEach(e => {
        if (e.type === 'stageClear' && gameState !== 'gameOver') {
            const l = e.life / e.maxLife;
            const a = Math.sin(l * Math.PI);
            renderCtx.globalAlpha = a;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = theme.ui;
                renderCtx.font = `32px ${config.fontFamily}`;
                renderCtx.textAlign = 'center';
                renderCtx.fillText(e.text, HUD_W / 2, HUD_H / 2);
            }, theme.ui, true);
            renderCtx.globalAlpha = 1;
        } else if (e.type === 'shockwave' && e.hud && isEffectsEnabled) {
            const progress = 1 - e.life / e.maxLife;
            const radius = e.radius + progress * 300;
            const alpha = e.life / e.maxLife;
            renderCtx.save();
            renderCtx.globalAlpha = alpha * 0.8;
            renderCtx.strokeStyle = '#ffffff';
            renderCtx.lineWidth = 3 + (1 - alpha) * 5;
            renderCtx.beginPath();
            renderCtx.arc(e.x, e.y, radius, 0, Math.PI * 2);
            renderCtx.stroke();
            renderCtx.restore();
        } else if (e.type === 'bossDefeated') {
            const a = Math.min(1, e.life / 40);
            renderCtx.save();
            renderCtx.globalAlpha = a;
            renderCtx.textAlign = 'center';
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = `hsl(${(frameCount * 6) % 360}, 100%, 70%)`;
                renderCtx.font = `28px ${config.fontFamily}`;
                renderCtx.fillText(`${e.name} DESTROYED`, HUD_W / 2, HUD_H / 2 - 60);
            }, '#ffffff');
            renderCtx.restore();
        } else if (e.type === 'comboFadeOut' && isEffectsEnabled) {
            drawChainComboText(renderCtx, e.count, e.life / e.maxLife);
        } else if (e.type === 'screenFlash' && isEffectsEnabled) {
            const alpha = e.life / e.maxLife;
            renderCtx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
            renderCtx.fillRect(-20, -20, HUD_W + 40, HUD_H + 40);
        } else if (e.type === 'energyGameOverFlash') {
            const progress = 1.0 - (e.life / e.maxLife);
            const alpha = Math.sin((1.0 - progress) * Math.PI) * 0.8;
            renderCtx.fillStyle = `rgba(224, 224, 224, ${alpha})`;
            renderCtx.fillRect(-20, -20, HUD_W + 40, HUD_H + 40);
        }
    });
    // Draw UI Screens (Paused, Confirm, Title, Game Over)
    if (gameState === 'paused') {
        renderCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        renderCtx.fillRect(0, 0, HUD_W, HUD_H);
        
        const pauseMsg = 'PAUSED';
        const resumeKey = lastInputDevice === 'keyboard' ? 'P' : 'START';
        const quitMsg = `Press ${lastInputDevice === 'keyboard' ? 'Q' : 'Select'} to Title`;
        const resumeMsg = `Press ${resumeKey} to Resume`;
        
        renderCtx.font = `48px ${config.fontFamily}`;
        renderCtx.textAlign = 'center';
        
        const totalWidth = renderCtx.measureText(pauseMsg).width;
        let currentX = HUD_W / 2 - totalWidth / 2;

        for (let i = 0; i < pauseMsg.length; i++) {
            const char = pauseMsg[i];
            const charWidth = renderCtx.measureText(char).width;
            const hue = (Date.now() / 15 + i * 30) % 360;
            const gamingColor = `hsl(${hue}, 100%, 70%)`;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = gamingColor;
                renderCtx.fillText(char, currentX + charWidth / 2, HUD_H / 2 - 40);
            }, gamingColor);
            currentX += charWidth;
        }

        renderCtx.fillStyle = theme.ui;
        renderCtx.font = `20px ${config.fontFamily}`;
        drawWithGlow(renderCtx, () => {
            renderCtx.fillText(resumeMsg, HUD_W / 2, HUD_H / 2 + 30);
            renderCtx.fillText(quitMsg, HUD_W / 2, HUD_H / 2 + 60);
        }, theme.ui, true);

    } else if (gameState === 'confirmReset') {
        // 背景を暗くして確認画面を目立たせる
        renderCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        renderCtx.fillRect(0, 0, HUD_W, HUD_H);

        const msg1 = "RESET ALL HIGH SCORES?";
        const msg2 = "(Y/N)";
        const msgColor = '#ff3333'; // 警告を示す赤色

        renderCtx.textAlign = 'center';
        renderCtx.textBaseline = 'middle';

        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = msgColor;
            renderCtx.font = `24px ${config.fontFamily}`;
            renderCtx.fillText(msg1, HUD_W / 2, HUD_H / 2 - 20);
        }, msgColor);
        
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = '#ffffff';
            renderCtx.font = `20px ${config.fontFamily}`;
            renderCtx.fillText(msg2, HUD_W / 2, HUD_H / 2 + 25);
        }, '#ffffff');
        
        renderCtx.textBaseline = 'alphabetic'; // デフォルトに戻す
    
    } else if (gameState === 'title') {
        renderCtx.textAlign = 'center';
        const titleColor = theme.player;
        const uiColor = theme.ui;

        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = titleColor;
            renderCtx.font = `60px ${config.fontFamily}`;
            renderCtx.fillText('COMET', HUD_W / 2, HUD_H / 2 - 120);
        }, titleColor);
        
        const outburstY = HUD_H / 2 - 75;
        const outburstFont = `16px ${config.fontFamily}`;
        drawTitleTextMorph(renderCtx, HUD_W / 2, outburstY, outburstFont, uiColor);

        // Draw Menu
        titleMenuItems.forEach((item, index) => {
            const y = HUD_H / 2 + index * 40;
            if (index === titleMenuIndex) {
                const selectorColor = `hsl(${(frameCount * 3) % 360}, 100%, 70%)`;
                drawWithGlow(renderCtx, () => {
                    renderCtx.fillStyle = selectorColor;
                    renderCtx.font = `22px ${config.fontFamily}`;
                    renderCtx.fillText(`> ${item} <`, HUD_W / 2, y);
                }, selectorColor, true);
            } else {
                renderCtx.fillStyle = '#cccccc';
                renderCtx.font = `20px ${config.fontFamily}`;
                renderCtx.fillText(item, HUD_W / 2, y);
            }
        });
        
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = '#ffffff';
            renderCtx.font = `18px ${config.fontFamily}`;
            if (titleBottomText === "") {
                titleBottomText = lastInputDevice === 'keyboard' ? 'Press Enter to Start' : 'Press Start Button to Start';
            }
            renderCtx.fillText(titleBottomText, HUD_W / 2, HUD_H / 2 + 160);
        }, '#ffffff');
        
        const highScoreY = HUD_H / 2 + 220;
        const highScoreCycle = frameCount % 360; 
        if (highScoreCycle < 120) {
             drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = theme.ui;
                renderCtx.font = `14px ${config.fontFamily}`;
                renderCtx.fillText(`HI-SCORE (STANDARD): ${highScoreStandard}`, HUD_W / 2, highScoreY);
            }, theme.ui);
        } else if (highScoreCycle < 240) {
             drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = theme.ui;
                renderCtx.font = `14px ${config.fontFamily}`;
                renderCtx.fillText(`HI-SCORE (JOURNEY): ${highScoreJourney}`, HUD_W / 2, highScoreY);
            }, theme.ui);
        } else {
             drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = theme.ui;
                renderCtx.font = `14px ${config.fontFamily}`;
                renderCtx.fillText(`HI-SCORE (STARTRAIL): ${highScoreStartrail}`, HUD_W / 2, highScoreY);
            }, theme.ui);
        }

    } else if (gameState === 'gameOver') {
        renderCtx.textAlign = 'center';
        renderCtx.textBaseline = 'middle';
        const gameOverColor = '#ff3333';
        const gameOverY = HUD_H / 2 - 150;
        
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = gameOverColor;
            renderCtx.font = `60px ${config.fontFamily}`;
            renderCtx.fillText('GAME OVER', HUD_W / 2, gameOverY);
        }, gameOverColor);

        if (newHighScoreAchieved) {
            const newRecordColor = `hsl(${(frameCount*3)%360},100%,70%)`;
            const newRecordY = gameOverY + 80;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = newRecordColor;
                renderCtx.font = `30px ${config.fontFamily}`;
                renderCtx.fillText('NEW RECORD!', HUD_W / 2, newRecordY);
            }, newRecordColor);
        }
        
        const scoreY = HUD_H / 2;
        let currentHighScore;
        switch(gameMode) {
            case 'STANDARD MODE': currentHighScore = highScoreStandard; break;
            case 'JOURNEY MODE': currentHighScore = highScoreJourney; break;
            case 'STARTRAIL MODE': currentHighScore = highScoreStartrail; break;
            default: currentHighScore = 0;
        }

        drawWithGlow(renderCtx, () => {
            renderCtx.font = `30px ${config.fontFamily}`;
            renderCtx.fillStyle = theme.ui;
            renderCtx.fillText(`SCORE: ${score}`, HUD_W / 2, scoreY);
        }, theme.ui);
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `20px ${config.fontFamily}`;
            renderCtx.fillStyle = theme.ui;
            renderCtx.fillText(`HI-SCORE: ${currentHighScore}`, HUD_W / 2, scoreY + 50);
        }, theme.ui);
        
        let titleText, replayText;
        if (lastInputDevice === 'keyboard') {
            titleText = 'Press Q to Title';
            replayText = 'Press Enter to Replay';
        } else {
            titleText = 'Press Select Button to Title';
            replayText = 'Press Start Button to Replay';
        }
        const replayY = scoreY + 120;
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `18px ${config.fontFamily}`;
            renderCtx.fillStyle = '#ffffff';
            renderCtx.fillText(replayText, HUD_W / 2, replayY);
            renderCtx.fillText(titleText, HUD_W / 2, replayY + 30);
        }, '#ffffff');

        renderCtx.textBaseline = 'alphabetic';
    }

    if (gameState === 'gameOver' && gameOverReason === 'energy') {
        const progress = grayscaleAnimation.progress;
        const filterValue = `grayscale(${progress}) brightness(${1 - progress * 0.2})`;
        stageEl.style.filter = filterValue;
        stageEl.style.webkitFilter = filterValue;
    } else {
        if (stageEl.style.filter !== 'none') {
            stageEl.style.filter = 'none';
            stageEl.style.webkitFilter = 'none';
        }
    }

    renderCtx.restore();

    if (gameState === 'playing' && player.invincibleTimer > 0) {
        if (player.invincibleTimer < 30 && frameCount % 10 < 5) {} else {
            renderCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            renderCtx.fillRect(0, 0, HUD_W, HUD_H);
        }
    }
}

// ゲーム進行は固定60Hzで回す（オリジナルの60fps時と同じテンポを保つ。描画fpsや画面のリフレッシュレートに左右されない）
const SIM_STEP = 1000 / 60;
let simRealLast = null;
let simAcc = 0;
let simTime = 0;
function gameLoop(timestamp) {
    if (timestamp !== undefined) {
        if (simRealLast === null) simRealLast = timestamp;
        simAcc += Math.min(250, timestamp - simRealLast);
        simRealLast = timestamp;
        let steps = 0;
        while (simAcc >= SIM_STEP && steps < 6) {
            simTime += SIM_STEP;
            update(simTime);
            simAcc -= SIM_STEP;
            steps++;
        }
        if (steps >= 6) simAcc = 0;
    }
    draw();
    requestAnimationFrame(gameLoop);
}

soundToggleButton.addEventListener('click', () => {
    if (!audioHandler.isInitialized) {
        audioHandler.initialize();
    }
    const isMuted = audioHandler.toggleMute();
    soundToggleButton.textContent = isMuted ? 'SOUND OFF' : 'SOUND ON';
});

effectsToggleButton.addEventListener('click', () => {
    isEffectsEnabled = !isEffectsEnabled;
    effectsToggleButton.textContent = isEffectsEnabled ? 'EFX ON' : 'EFX OFF';
});

function toggleFullScreen() {
    const e = document.getElementById('fullscreen-root');
    if (!document.fullscreenElement) {
        e.requestFullscreen().catch(err => {
            alert(`フルスクリーンモードにできませんでした: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}

function updateScale() {
    const r = document.getElementById('fullscreen-root');
    const w = document.getElementById('game-wrapper');

    // スケール計算とスタイル適用を次の描画フレームに同期させる
    requestAnimationFrame(() => {
        if (document.fullscreenElement === r) {
            const instructionHeight = document.getElementById('instructions-container').offsetHeight;
            const totalGameHeight = document.getElementById('gameCanvas').offsetHeight + instructionHeight;
            const margin = 20;
            const effectiveWidth = w.offsetWidth + margin;
            const effectiveHeight = totalGameHeight + margin;
            const scaleX = r.clientWidth / effectiveWidth;
            const scaleY = r.clientHeight / effectiveHeight;
            const scale = Math.min(scaleX, scaleY);
            w.style.setProperty('--scale-factor', scale);
        } else {
            w.style.removeProperty('--scale-factor');
        }
    });
}

// フルスクリーン状態が変わった時にスケールを更新
window.addEventListener('fullscreenchange', updateScale);

// ウィンドウリサイズ時の処理を最適化
window.addEventListener('resize', () => {
    // 既にリクエストがあればキャンセル
    if (resizeRequest) {
        cancelAnimationFrame(resizeRequest);
    }
    // 次のフレームでupdateScaleを実行するようにリクエスト
    resizeRequest = requestAnimationFrame(updateScale);
});

init();
requestAnimationFrame(gameLoop);

</script>
