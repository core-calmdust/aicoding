    if (st.comets) {
        const interval = 0.42 / st.comets;
        while (t.spawnT > interval) {
            t.spawnT -= interval;
            const near = t.step === 3 && Math.random() < 0.5;
            comets.push({ x: near ? player.x + (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 30) : Math.random() * config.canvasWidth, y: -10, vx: 0, vy: 230, radius: config.cometCoreRadius, isGlazed: false });
        }
    }
    if (t.step === 4 && !monsters.some(m => m.type === 'invader')) {
        monsters.push({ type: 'invader', x: config.canvasWidth * (0.3 + Math.random() * 0.4), y: -30, vx: 0, vy: 45, width: 56, height: 56, shootCooldown: 1e9 });
    }
    if (t.step === 5 && items.length === 0 && t.items < 2) {
        items.push({ x: Math.max(80, Math.min(config.canvasWidth - 80, player.x + (Math.random() < 0.5 ? -1 : 1) * 220)), y: -20, type: t.items === 0 ? 'normal' : 'special' });
    }
    if (t.step === 8 && !(t.hyper >= 1) && !items.some(it => it.type === 'hyper')) {
        items.push({ x: Math.max(80, Math.min(config.canvasWidth - 80, player.x + (Math.random() < 0.5 ? -1 : 1) * 200)), y: -20, type: 'hyper' });
    }
    if (t.step === 6) {
        if (player.invincibleTimer < 40) triggerInvincibility(240);
        energy = config.energyTotal;
    }

    if (st.goal(t)) {
        t.clearT = 1.4;
        audioHandler.playSound('itemGet');
    }
}

// 幅に合わせて折り返す（スペースの無い日本語・中国語は文字単位）
function wrapLines(c, text, maxW, flags) {
    const out = [];
    text.split('\n').forEach(par => {
        const hl = par.startsWith('★'); // ★で始まる段落は強調表示
        const n0 = out.length;
        let line = '';
        const tokens = par.match(/[\u3000-\u9fff\uff00-\uffef\uac00-\ud7af]|[^\s\u3000-\u9fff\uff00-\uffef\uac00-\ud7af]+\s*|\s+/g) || [''];
        tokens.forEach(tk => {
            if (line && c.measureText(line + tk).width > maxW) { out.push(line.trimEnd()); line = tk.trimStart(); }
            else line += tk;
        });
        out.push(line.trimEnd());
        if (flags) for (let k = n0; k < out.length; k++) flags[k] = hl;
    });
    return out;
}

function update(timestamp) {
    if (gameState !== 'paused') {
        if (!lastTimestamp) {
            lastTimestamp = timestamp;
        }
        const dt_ms = timestamp - lastTimestamp;
        const dt_sec = Math.min(dt_ms / 1000, 1 / 30);
        lastTimestamp = timestamp;

        pollInput();
        updateInstructions();

        // ★ ここから追加 ★
        mutekiTextBottom = 0;
    if (mutekiAnim.life > 0 && gameState !== 'paused' && gameState !== 'gameOver') {
            mutekiAnim.life -= 60 * dt_sec; // フレームレートに依存しないようにdt_secで減算
            if (mutekiAnim.life < 0) mutekiAnim.life = 0;
        }
        // ★ ここまで追加 ★

        if (chainComboAnim.life > 0) {
            chainComboAnim.life--;
        }
        
        if (screenShake.duration > 0) {
            screenShake.duration--;
            if (screenShake.duration <= 0) {
                screenShake.intensity = 0;
            }
        }

        if (grayscaleAnimation.isActive && grayscaleAnimation.progress < 1) {
            grayscaleAnimation.progress += dt_sec / 1.0;
            if (grayscaleAnimation.progress > 1) {
                grayscaleAnimation.progress = 1;
            }
        }

        if (gameState === 'playing' && input.pauseTrigger) {
            pauseGame();
            return;
        }

        // Toggle invincibility cheat
        const isMPressed = keyState['KeyM'];
        if (isMPressed && !wasMPressed) {
            if (gameState === 'playing') {
                isInvincible = !isInvincible;
                if (isInvincible) hasUsedInvincibility = true;
            }
        }
        wasMPressed = isMPressed;


        const previousVisualBeat = visualBeat;
        visualBeat *= 0.85;
        if (visualBeat < 0.01) {
            visualBeat = 0;
        }

        updateBackground(dt_sec);
        
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life--;
            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                if (p.gravityMultiplier) {
                    p.vy += config.gravity * p.gravityMultiplier * dt_sec;
                }
                p.x += p.vx * dt_sec;
                p.y += p.vy * dt_sec;
            }
        }
        
        for (let i = effects.length - 1; i >= 0; i--) {
            const e = effects[i];
            e.life--;
            if (e.life <= 0) {
                effects.splice(i, 1);
            }
        }

        if (gameState === 'playing') {
            frameCount++;
            audioHandler.scheduleBGM();
            elapsedTime += dt_ms;
            updatePlayingState(dt_sec);
            if (pendingHitClear) {
                pendingHitClear = false;
                const far = o => Math.hypot(o.x - player.x, o.y - player.y) > 150;
                comets = comets.filter(far);
                enemyBullets = enemyBullets.filter(far);
            }

            if (chainEffectPending && visualBeat >= 1.0 && previousVisualBeat < 1.0) {
                effects.push({ type: 'shockwave', x: 150, y: IS_MOBILE ? 184 : 65, life: 20, maxLife: 20, radius: 20, hud: true });
                effects.push({ type: 'screenFlash', life: 8, maxLife: 8 });
                chainEffectPending = false; // ★ 変更点: この行は元々ありましたが、この変更がパフォーマンス改善の鍵となります
            }

        } else if (gameState === 'confirmReset') { // ★ この else if ブロックを追加
            if (input.confirmYesTrigger) {
                resetHighScores();
                gameState = 'title';
            } else if (input.confirmNoTrigger) {
                gameState = 'title';
            }
        } else if (gameState === 'title') {
            // ★ ここから追加 ★
            if (input.resetTrigger) {
                gameState = 'confirmReset';
                return; // 状態が変わったので、このフレームの残りの更新はスキップ
            }
            frameCount++;

            // --- タイマー更新 ---
            if (effectTimer > 0) {
                effectTimer--;
            }
            if (descriptionTimer > 0) {
                descriptionTimer--;
                if (descriptionTimer === 0) {
                    // 説明表示期間が完全に終了したので、元のテキストに戻るためのエフェクトを開始
                    effectTimer = EFFECT_DURATION;
                }
            }

            // --- 入力処理 ---
            const prevMenuIndex = titleMenuIndex;
            if (input.upTrigger) {
                titleMenuIndex = (titleMenuIndex - 1 + titleMenuItems.length) % titleMenuItems.length;
            }
            if (input.downTrigger) {
                titleMenuIndex = (titleMenuIndex + 1) % titleMenuItems.length;
            }
            if (tapSel !== null) titleMenuIndex = tapSel;

            if (prevMenuIndex !== titleMenuIndex) {
                audioHandler.playSound('menu'); // カーソル音
                // メニューが変更されたので、エフェクトと説明タイマーを開始
                effectTimer = EFFECT_DURATION;
                descriptionTimer = DESCRIPTION_DISPLAY_DURATION;
            }

            // --- 表示テキストの決定 ---
            let targetText;
            if (descriptionTimer > 0) {
                targetText = T('md.' + titleMenuIndex);
            } else {
                targetText = TK('start');
            }

            if (effectTimer > 0) {
                let randomText = '';
                // 表示されるテキストの長さに合わせてランダムな文字列を生成
                for (let i = 0; i < targetText.length; i++) {
                    randomText += RANDOM_CHARS[Math.floor(Math.random() * RANDOM_CHARS.length)];
                }
                titleBottomText = randomText;
            } else {
                titleBottomText = targetText;
            }
            
            // --- ゲーム開始処理 ---
            if (input.replayTrigger) {
                audioHandler.initialize();
                if (titleMenuItems[titleMenuIndex] === 'TUTORIAL') startTutorial();
                else {
                    // モードを選んだら難易度選択へ
                    pendingMode = titleMenuItems[titleMenuIndex];
                    diffMenuIndex = difficultyIndex;
                    gameState = 'difficulty';
                    audioHandler.playSound('menu');
                }
            }
        } else if (gameState === 'difficulty') {
            frameCount++;
            if (input.upTrigger) { diffMenuIndex = (diffMenuIndex + DIFFS.length - 1) % DIFFS.length; audioHandler.playSound('menu'); }
            if (input.downTrigger) { diffMenuIndex = (diffMenuIndex + 1) % DIFFS.length; audioHandler.playSound('menu'); }
            if (tapDiffSel !== null) { diffMenuIndex = tapDiffSel; audioHandler.playSound('menu'); }
            if (input.titleTrigger) {
                gameState = 'title';
            } else if (input.replayTrigger) {
                difficultyIndex = diffMenuIndex;
                try { localStorage.setItem('cometPlusDifficulty', difficultyIndex); } catch (e) {}
                loadHighScores();
                startGame(pendingMode);
            }
        } else if (gameState === 'gameOver') {
            frameCount++; // Keep frameCount running for animations
            if (input.titleTrigger) {
                 gameState = 'title';
                 init();
            } else if (input.replayTrigger) {
                startGame(gameMode);
            }
        }
    } else { // Paused
        pollInput();
        updateInstructions();
        if (input.pauseTrigger) {
            gameState = 'playing';
            lastTimestamp = 0;
            resumeAudioClock();
        } else if (input.titleTrigger) {
             audioHandler.stopBgm();
             resumeAudioClock();
             gameState = 'title';
             init();
        }
    }
}


function drawRoundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawWithGlow(ctx, drawFunc, color, useBeat = false) {
    // ▼▼▼ このブロックを修正 ▼▼▼
    if (!isEffectsEnabled) {
        drawFunc(); // EFX OFF時はグローを適用せず、描画関数のみ実行
        return;
    }
    // ▲▲▲ 修正はここまで ▲▲▲
    if (IS_MOBILE || (typeof quality !== 'undefined' && quality < 0.9)) { drawFunc(); return; } // 重い時は文字のグローを省く
    const blurAmount = useBeat ? (config.glowBlur + Math.round(visualBeat * 4) * 2) : config.glowBlur;
    ctx.shadowColor = color;
    ctx.shadowBlur = blurAmount;
    drawFunc();
    ctx.shadowBlur = 0;
}

function formatTime(ms) {
    if (isNaN(ms)) ms = 0;
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const msec = Math.floor(ms % 1000);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(msec).padStart(3,'0')}`;
}

function drawChainComboText(renderCtx, count, alpha = 1.0) {
    const comboText = `${count} CHAIN COMBO!!`;
    const baseFontSize = IS_MOBILE ? 22 : 16;
    const sizeStep = 2;
    const maxChainForSizing = 30;
    const chainLevel = Math.floor((Math.min(count, maxChainForSizing) - 1) / 5);
    let fontSize = baseFontSize + chainLevel * sizeStep;
    
    // ★ 変更点: effects.find() をやめ、専用のタイマーを参照する
    const comboEffect = chainComboAnim.life > 0 ? chainComboAnim : null;
    let textToDraw = comboText;

    if (comboEffect && alpha === 1.0) {
        const progress = 1 - (comboEffect.life / comboEffect.maxLife);
        fontSize = fontSize * 1.2 - (fontSize * 0.2) * progress;

        const chars = "!?#$ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        // ★ 変更点: 文字列の直接連結をやめ、配列を使って高速化
        const textChars = [];
        for (let i = 0; i < comboText.length; i++) {
            if (progress > (i / comboText.length) * 0.5 + (frameRand(i) * 0.1)) {
                textChars.push(comboText[i]);
            } else {
                textChars.push(chars[Math.floor(frameRand(i + 50) * chars.length)]);
            }
        }
        textToDraw = textChars.join('');
    }

    renderCtx.save();
    renderCtx.globalAlpha = alpha;
    renderCtx.font = `600 ${fontSize}px ${config.fontFamily}`;
    renderCtx.textAlign = 'left';

    const textMetrics = renderCtx.measureText(textToDraw);
    const gradient = renderCtx.createLinearGradient(20, 0, 20 + textMetrics.width, 0);
    const numColors = 12;
    for (let i = 0; i < numColors; i++) {
        const hue = (rTime * 1000 / 15 + i * (360 / numColors)) % 360; // ゲーム内時間（停止中は止まる）
        gradient.addColorStop(Math.max(0, Math.min(1, i / (numColors - 1))), `hsl(${hue}, 100%, 70%)`);
    }

    renderCtx.fillStyle = gradient;

    drawWithGlow(renderCtx, () => {
        renderCtx.fillText(textToDraw, 20, IS_MOBILE ? 190 : 70);
    }, '#ffffcc', true);

    renderCtx.restore();
}

function drawTitleTextMorph(renderCtx, x, y, font, color) {
    const originalText = 'outburst+';
    const chars = "!?#$@%&<>*=/+abcdefghijklmnopqrstuvwxyz0123456789";
    const now = Date.now();
    const cycle = 2000; // 2秒周期
    const timeInCycle = now % cycle;
    let textToShow = '';

    // 0-999ms: 静的表示
    if (timeInCycle < 1000) {
        textToShow = originalText;
    } else {
        // 1000-2000ms: アニメーション
        const animProgress = (timeInCycle - 1000) / 1000; // 0.0 ~ 1.0

        if (animProgress > 0.8) {
            // 最後の0.2秒で収束
            const convergeProgress = (animProgress - 0.8) / 0.2; // 0.0 ~ 1.0
            const len = originalText.length + Math.round(originalText.length * (1 - convergeProgress));
            for(let i = 0; i < len; i++) {
                textToShow += chars[Math.floor(Math.random() * chars.length)];
            }
        } else {
            // 最初の0.8秒は倍の長さ
            const expandedLength = originalText.length * 2;
            for(let i = 0; i < expandedLength; i++) {
                textToShow += chars[Math.floor(Math.random() * chars.length)];
            }
        }
    }

    drawWithGlow(renderCtx, () => {
        renderCtx.font = font;
        renderCtx.fillStyle = color;
        renderCtx.fillText(textToShow, x, y);
    }, color);
}

                float cs = cos(h), sn = sin(h);
                yiq.yz = mat2(cs, sn, -sn, cs) * yiq.yz * (1.0 + 0.08 * amt);
                vec3 g = toR * yiq;
                // ネオン感: 暗部は深い紫へ沈め、光っている所だけを強く・白熱させる
                float l = dot(g, vec3(0.299, 0.587, 0.114));
                vec3 sh = vec3(0.13, 0.03, 0.28);
                g = mix(sh * (0.1 + l * 2.0) + g * 0.55, g, smoothstep(0.08, 0.4, l));
                g = pow(max(g, 0.0), vec3(1.15)) * 1.1;
                g += smoothstep(0.55, 1.0, l) * vec3(0.09, 0.035, 0.12) * (0.8 + 0.2 * sin(t * 7.0)); // 明部にピンクの白熱
                float vig = 1.0 - amt * 0.3 * smoothstep(0.35, 0.85, length(vUv - 0.5));
                gl_FragColor = vec4(mix(c.rgb, g * vig, clamp(amt, 0.0, 1.0)), c.a);
            }`
    });
    hyperGrade.enabled = false;
    composer.addPass(hyperGrade);
    composer.addPass(new OutputPass());
}

function makeTrailTexture() {
    const c = document.createElement('canvas');
    c.width = 32; c.height = 128;
    const g = c.getContext('2d');
    const img = g.createImageData(32, 128);
    for (let y = 0; y < 128; y++) {
        const along = Math.pow(1 - y / 127, 1.7);
        for (let x = 0; x < 32; x++) {
            const dx = (x - 15.5) / 15.5;
            const across = Math.exp(-dx * dx * 4.0);
            const a = Math.min(1, along * across * 1.1);
            const i = (y * 32 + x) * 4;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
            img.data[i + 3] = a * 255;
        }
    }
    g.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
}

function gridLines(size, step, y) {

function towerGeometry(w, d, h, step, taper = 1) {
    const p = [];
    const ring = (y, s) => {
        const x0 = -w / 2 * s, x1 = w / 2 * s, z0 = -d / 2 * s, z1 = d / 2 * s;
        p.push(x0, y, z0, x1, y, z0, x1, y, z0, x1, y, z1, x1, y, z1, x0, y, z1, x0, y, z1, x0, y, z0);
    };
    const levels = Math.max(1, Math.floor(h / step));
    for (let i = 0; i <= levels; i++) {
        const y = (i / levels) * h;
        ring(y, 1 + (taper - 1) * (i / levels));
    }
    const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    corners.forEach(([sx, sz]) => {
        p.push(sx * w / 2, 0, sz * d / 2, sx * w / 2 * taper, h, sz * d / 2 * taper);
    });
    // 窓のような縦線
    for (let k = 1; k < 3; k++) {
        const fx = -w / 2 + (w * k) / 3;
        p.push(fx, 0, d / 2, fx * taper, h, d / 2 * taper, fx, 0, -d / 2, fx * taper, h, -d / 2 * taper);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    return g;
}
function spireGeometry(r, h) {
    const p = [];
    const sides = 4;
    for (let i = 0; i < sides; i++) {
        const a0 = (i / sides) * Math.PI * 2 + Math.PI / 4, a1 = ((i + 1) / sides) * Math.PI * 2 + Math.PI / 4;
        p.push(Math.cos(a0) * r, 0, Math.sin(a0) * r, 0, h, 0);
        for (let lv = 0; lv < 8; lv++) {
            const t = lv / 8, s = 1 - t;
            p.push(Math.cos(a0) * r * s, h * t, Math.sin(a0) * r * s, Math.cos(a1) * r * s, h * t, Math.sin(a1) * r * s);
        }
        // クロスブレース
        p.push(Math.cos(a0) * r, 0, Math.sin(a0) * r, Math.cos(a1) * r * 0.5, h * 0.5, Math.sin(a1) * r * 0.5);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    return g;
}

function addGlass(obj, w, d, h, step, count) {
    const floors = Math.max(1, Math.floor(h / step));
    for (let n = 0; n < count; n++) {
        const face = Math.floor(Math.random() * 4), fw = face % 2 ? d : w;
        const k0 = Math.floor(Math.random() * floors), len = Math.min(floors - k0, 1 + Math.floor(Math.random() * 4)); // 1〜4階分の帯
        const m = new THREE.Mesh(_glassGeo, glassMats[Math.floor(Math.random() * glassMats.length)]);
        const part = Math.random() < 0.5 ? 1 : 0.5, off = part < 1 ? (Math.random() < 0.5 ? -0.25 : 0.25) * fw : 0;
        m.scale.set(fw * part * 0.94, step * len * 0.9, 1);
        const y = (k0 + len / 2) * step;
        if (face === 0) m.position.set(off, y, d / 2 + 0.5);
        else if (face === 2) m.position.set(off, y, -d / 2 - 0.5);
        else { m.position.set((face === 1 ? 1 : -1) * (w / 2 + 0.5), y, off); m.rotation.y = Math.PI / 2; }

function buildVoxelModel(art, px, heights) {
    const group = new THREE.Group();
    const rows = art.length, cols = art[0].length;
    const byCode = {};
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const code = art[r][c];
            if (!code) continue;
            const h = px * (heights[code] || 1);
            const box = new THREE.BoxGeometry(px * 0.94, h, px * 0.94);
            box.translate((c - cols / 2 + 0.5) * px, h / 2, (r - rows / 2 + 0.5) * px);
            (byCode[code] = byCode[code] || []).push(box);
        }
    }
    const mats = {};
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    Object.keys(byCode).forEach(code => {
        const geo = mergeGeometries(byCode[code]);
        const mat = new StdMat({ color: 0xffffff, emissive: 0x000000, flatShading: true, metalness: 0.35, roughness: 0.35 });
        mats[code] = mat;
        group.add(new THREE.Mesh(geo, mat));
        group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
    });
    return { group, mats, edgeMat };
}

let bossObj = null, bossObjFor = null;
// 当たり判定がない間（登場中・無敵中）はドット状のモザイクで半透明にする
const bossMosaicU = { value: 0 };
function applyMosaic(mat) {
    if (mat.userData.mosaic) return;
    mat.userData.mosaic = true;
    mat.transparent = true;
    mat.customProgramCacheKey = () => 'bossMosaic';
    mat.onBeforeCompile = sh => {
        sh.uniforms.uMosaic = bossMosaicU;
        sh.fragmentShader = 'uniform float uMosaic;\n' + sh.fragmentShader.replace('#include <tonemapping_fragment>', `
            if (uMosaic > 0.001) {
                float cs = mix(1.5, 7.0, uMosaic);
                vec2 f = fract(gl_FragCoord.xy / cs) - 0.5;
                if (length(f) > mix(0.75, 0.34, uMosaic)) discard;
                gl_FragColor.a *= mix(1.0, 0.5, uMosaic);
                gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(dot(gl_FragColor.rgb, vec3(0.3333))), 0.35 * uMosaic);
            }
            #include <tonemapping_fragment>`);
    };
    mat.needsUpdate = true;
}

let quality = PR, qCeil = PR;
const perf = { t0: 0, frames: 0, good: 0, lastRaise: -1e9 };
function applyQuality() {
    renderer.setPixelRatio(quality);
    renderer.setSize(VW, VH, false);

}
function adaptQuality(now) {
    if (!perf.t0) { perf.t0 = now; return; }
    if (now - perf.lastFrame > 500) { perf.t0 = now; perf.frames = 0; } // タブ復帰などの長い空白は無視
    perf.lastFrame = now;
    perf.frames++;
    const span = now - perf.t0;
    if (span < 1000) return;
    const fps = perf.frames * 1000 / span;
    perf.t0 = now; perf.frames = 0;
    perf.bad = fps < 54 ? (perf.bad || 0) + 1 : 0;
    if (perf.bad >= 3 && quality > Q_MIN) {
        perf.bad = 0;
        if (now - perf.lastRaise < 20000) qCeil = Math.max(Q_MIN, quality - 0.05); // 上げてすぐ落ちたら上限を固定（行ったり来たりを防ぐ）
        quality = Math.max(Q_MIN, quality - 0.15);

    } else if (fps >= 58) {

}

            }
            const gc = hsl(hue1, 1, 0.7);
            glow.add(obj.position.x, obj.position.y + 4, obj.position.z, gc, (m.type === 'looper' ? 110 : 70) * ES, 0.14);
        });
        enemyBullets.forEach(eb => {
            if (eb._r === undefined) eb._r = Math.random() * 10;
            const c = eb.isGlazed ? COL_GLAZE : hsl(rTime * 100 + eb.y, 1, 0.72);
            const x = toX(ix(eb)), z = toZ(iy(eb)), y = 16;
            const pulse = 1 + Math.sin(rTime * 14 + eb._r) * 0.15;
            const s = eb.radius * 2.4 * (IS_MOBILE ? 1.3 : 1) * pulse;
            bulletBodies.add(x, y, z, s, s * 1.2, s, rTime * 4 + eb._r, rTime * 6 + eb._r, 0, c);
            glow.add(x, y, z, c, eb.radius * (loadLv >= 2 ? 9 : 13), 1.25);     // 色のハロー
            if (loadLv < 1) glow.add(x, y + 2, z, COL_WHITE, eb.radius * 5, 2.2);   // 白い芯
            if (efx && loadLv < 1) {
                const sp = Math.hypot(eb.vx, eb.vy) || 1;
                trails.add(x - eb.vx / sp * 26, y, z - eb.vy / sp * 26, x, y, z, 8, c, 0.6);
            }
        });
    }
    // 消えたモンスター: 撃破ならボクセル片を散らす
    monsterObjs.forEach((obj, m) => {
        if (alive.has(m)) return;
        const lx = obj.userData.lastX, ly = obj.userData.lastY;
        if (lx > -20 && lx < W + 20 && ly > -20 && ly < H + 20 && gameState !== 'title') {
            const c = obj.userData.type === 'looper' ? hexColor('#9400D3') : hsl(frameCount * 2, 1, 0.65, new THREE.Color());
            spawnBurst(lx, ly, c, obj.userData.type === 'invader' ? 34 : 60, { speed: 420, up: 520, minSize: 3, maxSize: 8 });
        }
        scene.remove(obj);
        monsterObjs.delete(m);
    });

    renderBoss(dt);

    // 得点アイテム（金色の宝石）
    gems.forEach((g, k) => {
        const x = toX(ix(g)), z = toZ(iy(g)), y = 18 + Math.sin(rTime * 6 + k) * 4;
        const c = hsl(45 + Math.sin(rTime * 3 + k) * 15, 1, g.big ? 0.75 : 0.6);
        const sz = g.big ? 9 : 6;
        gemBodies.add(x, y, z, sz, sz * 1.5, sz, 0, rTime * 5 + k, 0, c);
        glow.add(x, y, z, c, sz * 6, 0.9);
        if (isEffectsEnabled && loadLv < 1 && Math.hypot(g.vx, g.vy) > 60) {
            const sp = Math.hypot(g.vx, g.vy);
            trails.add(x - g.vx / sp * 26, y, z - g.vy / sp * 26, x, y, z, 6, c, 0.7);
        }
    });

    // プレイヤー弾
    if (playerBullet) {
        const x = toX(ix(playerBullet)), z = toZ(iy(playerBullet)), y = 8;
        const R = config.playerBulletHitRadius;
        trails.add(x, y, z + 80, x, y, z - R, R * 2, COL_CYAN, 1.6);
        trails.add(x, y, z + 50, x, y, z - R * 0.6, R * 0.8, COL_WHITE, 1.5);
        glow.add(x, y, z, COL_CYAN, R * 4.5, 1.4);
        glow.add(x, y, z, COL_WHITE, R * 1.6, 1.6);
    }

    // パーティクル（爆発）: 3Dの高さを与える
    particles.forEach(p => {
        let st = particleH.get(p);
        if (!st) { st = { vy: rand(80, 520), h: 6, t: 0 }; particleH.set(p, st); }
        st.t += simDt;
        st.h = Math.max(0, 6 + st.vy * st.t - 260 * st.t * st.t);
        const a = p.life / p.maxLife;
        glow.add(toX(ix(p)), st.h, toZ(iy(p)), hexColor(p.color), (p.size || 2) * 7 * (0.4 + a), a * 1.3);
    });

    // レンダラー側のデブリ
    for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.life -= simDt;
        if (d.life <= 0) { debris.splice(i, 1); continue; }
        d.vy -= 900 * simDt;
        d.x += d.vx * simDt; d.y += d.vy * simDt; d.z += d.vz * simDt;
        if (d.y < 0) { d.y = 0; d.vy *= -0.45; d.vx *= 0.7; d.vz *= 0.7; }
        d.rx += d.spin * simDt; d.ry += d.spin * 0.7 * simDt;
        const a = Math.min(1, d.life / d.max * 1.6);
        if (d.cube) {
            const s = d.size * a;
            debrisCubes.add(d.x, d.y, d.z, s, s, s, d.rx, d.ry, 0, d.color);
        }
        glow.add(d.x, d.y, d.z, d.color, d.size * 4, a);
    }

    // プレイヤー
    const showPlayer = (gameState === 'playing' || gameState === 'paused' || (gameState === 'gameOver' && gameOverReason === 'energy'));
    const playerVisible = showPlayer && !(gameState === 'gameOver' && gameOverReason === 'collision');
    playerGroup.visible = playerVisible && !(hurtTimer > 0 && Math.floor(hurtTimer / 4) % 2 === 0);
    // 残りシールドを自機のまわりを回る光で表示
    if (playerVisible && shields > 0) {
        for (let k = 0; k < shields; k++) {
            const a = rTime * 3.2 + k * Math.PI * 2 / shields;
            glow.add(toX(player.x) + Math.cos(a) * 30, 18, toZ(player.y) + Math.sin(a) * 30, COL_CYAN, 22, 1.3);
        }
    }
    glazeDisc.visible = glazeRing.visible = showPlayer;
    shield.visible = meter.visible = false;
    hitDot.visible = false;
    if (showPlayer) {
        // 自機は補間せず最新位置で描く（PCは移動も毎フレーム実時間なので、見た目・当たり判定・弾の位置が一致）
        const px = toX(player.x), pz = toZ(player.y);
        const bankTarget = frozen ? shipBank : (input.left && !input.right ? 0.55 : input.right && !input.left ? -0.55 : 0);
        shipBank += (bankTarget - shipBank) * Math.min(1, dt * 10);
        playerGroup.position.set(px, 12 + Math.sin(rTime * 4) * 2, pz);
        shipPivot.rotation.z = shipBank;
        shipModel.userData.ring.rotation.z = rTime * 1.4; if (shipModel.userData.prop) shipModel.userData.prop.rotation.z = -rTime * 3.2; // 推進ユニットを時計回りに回す
        shipWireMat.color.copy(themeCur.player).lerp(COL_WHITE, 0.45); shipModel.userData.glowC.color.copy(themeCur.player).lerp(COL_WHITE, 0.25); shipModel.userData.core.scale.setScalar(1 + visualBeat * 0.35 + Math.sin(rTime * 9) * 0.06);
        shipCageMat.color.copy(themeCur.player).lerp(COL_WHITE, 0.3); shipCageMat.opacity = 0.36 + visualBeat * 0.35; // ワイヤーの外殻は拍に合わせて光る
        shipPivot.rotation.x = -0.12;
        playerGroup.scale.setScalar(VS * (1 + visualBeat * 0.18));

        const glazeR = player.radius + (player.invincibleTimer > 0 ? config.glazeDistance * 1.5 : config.glazeDistance);
        glazeDisc.position.set(px, 11, pz); glazeDisc.scale.setScalar(glazeR);
        glazeRing.position.set(px, 11.5, pz); glazeRing.scale.setScalar(glazeR);
        glazeFillMat.color.copy(themeCur.player);
        glazeRingMat.color.copy(themeCur.player);
        glazeFillMat.opacity = efx ? 0.025 + visualBeat * 0.04 : 0.0;
        glazeRingMat.opacity = efx ? 0.16 + visualBeat * 0.22 : 0.3;

        // エンジン
        if (playerVisible) {
                        const flick = 0.8 + Math.random() * 0.4;
            [0].forEach(off => { // 推進ユニットの噴射口（2枚の羽の間）
                const ex = px + off * VS * Math.cos(shipBank), ez = pz + 14 * VS;
                glow.add(ex, 12, ez, themeCur.player, 24 * flick * VS, 1.5);
                if (efx) trails.add(ex, 11, ez + 46 * flick * VS, ex, 11, ez, 9 * VS, themeCur.player, 1.0);
            });
            // 当たり判定とスローマーカー
            // 当たり判定の円だけを、色を回して表示
            hitDot.visible = true;
            hitDot.position.set(px, 12, pz); // 機体・円と同じ高さに置き、遠近で中心がずれないように
            hitDot.scale.setScalar(config.playerHitboxRadius);
            hsl(frameCount * 10, 1, 0.6, hitDotMat.color);
        }

        if (player.invincibleTimer > 0) {
            const blinkShield = player.invincibleTimer < 30 && frameCount % 10 < 5;
            shield.visible = !blinkShield;
            shield.position.set(px, 12, pz);
            shield.scale.setScalar(config.playerVisualSize * 1.5 * (1 + visualBeat * 0.15));
            shield.rotation.set(rTime * 1.2, rTime * 1.8, 0);
            shieldMat.opacity = 0.45 + Math.sin(frameCount * 0.2) * 0.2;

            const blinkMeter = player.invincibleTimer < 60 && frameCount % 10 < 5;
            meter.visible = !blinkMeter;
            const prog = Math.max(0, Math.min(1, player.invincibleTimer / player.maxInvincibleTimer));
            meter.geometry.setDrawRange(0, 6 * Math.round(METER_SEG * prog));
            meter.position.set(px, 2, pz);
            const mr = glazeR + 5;
            meter.scale.set(-mr, mr, mr);
            hsl(frameCount * 4, 1, 0.7, meterMat.color);
        }
    }

    // 衝撃波（HUD用 x=150,y=65 はHUDで描画）
    let si = 0;
    effects.forEach(e => {
        if (e.type !== 'shockwave' || e.hud || !efx) return;
        const s = shockPool[si++];
        if (!s) return;
        const progress = 1 - e.life / e.maxLife;
        const alpha = e.life / e.maxLife;
        const r = e.radius + progress * 300;
        s.ring.visible = s.sph.visible = true;
        s.ring.position.set(toX(e.x), 3, toZ(e.y));
        s.ring.scale.setScalar(r);
        s.ringMat.opacity = alpha * 0.9;
        s.sph.position.set(toX(e.x), 10, toZ(e.y));
        s.sph.scale.setScalar(e.radius + progress * 140);
        s.sph.rotation.y = progress * 2;
        s.sphMat.opacity = alpha * 0.55;
        s.sphMat.color.copy(themeCur.ui).lerp(COL_WHITE, 0.4);
    });
    for (; si < shockPool.length; si++) shockPool[si].ring.visible = shockPool[si].sph.visible = false;

    // 小節スイープ
    const bar = effects.find(e => e.type === 'barLine');
    if (bar && efx && gameState !== 'title') {
        const progress = 1 - bar.life / bar.maxLife;
        sweep.visible = true;
        sweep.position.set(0, 2, -H / 2 + H * progress);
        sweepMat.color.copy(themeCur.ui);
        sweepMat.opacity = Math.sin((1 - progress) * Math.PI) * 0.22;
    } else {
        sweep.visible = false;
    }

    // ロックオンライン
    linkPool.forEach(l => {
        if (l.life <= 0) { l.line.visible = false; return; }
        l.life -= dt;
        const a = Math.max(0, l.life / l.max);
        l.line.visible = true;
        const sx = toX(player.x), sz = toZ(player.y), tx = toX(l.tx), tz = toZ(l.ty);
        const mx = (sx + tx) / 2 + (tz - sz) * 0.35 * l.bend, mz = (sz + tz) / 2 - (tx - sx) * 0.35 * l.bend;
        for (let i = 0; i < LINK_PTS; i++) {
            const t = i / (LINK_PTS - 1);
            const it = 1 - t;
            l.pos[i * 3] = it * it * sx + 2 * it * t * mx + t * t * tx;
            l.pos[i * 3 + 1] = 12 + Math.sin(t * Math.PI) * 50;
            l.pos[i * 3 + 2] = it * it * sz + 2 * it * t * mz + t * t * tz;
        }
        l.line.geometry.attributes.position.needsUpdate = true;
        l.mat.color.setRGB(0.75, 0.38, 1).multiplyScalar(a * 1.4);
        l.mat.opacity = a;
        glow.add(tx, 8, tz, COL_GLAZE, 40 * a, a);
    });

    glow.end(); trails.end(); cometBodies.end(); cometWires.end(); bulletBodies.end(); debrisCubes.end(); gemBodies.end();

    if (!gl3dOK) return;
    adaptQuality(now);
    if (efx) {
        bloom.strength = (0.48 + visualBeat * 0.28) / (1 + comets.length / 260) * (1 - hyperK * (1 - hpLightK) * 0.45) + hyperK * 0.06 * hpLightK; // ハイパー中は光をにじませてネオン感を出す
        hyperK += ((hyperT > 0 ? 1 : 0) - hyperK) * Math.min(1, dt * (hyperT > 0 ? 4 : 2.5)); // ふわっと変わり、切れたら戻る
        if (hyperK < 0.002) hyperK = 0;
        hyperGrade.enabled = hyperK > 0;
        hyperGrade.uniforms.amt.value = hyperK * (0.7 + 0.3 * hpLightK); // 明るいステージでは色調変化も控えめ hyperGrade.uniforms.t.value = rTime;
        composer.render(dt);
    } else {
        renderer.render(scene, camera);
    }
}


// ---------------------------------
// タイトルのデモ: 今のハブ＋各ボスとそのステージのテーマをランダムに切り替えて見せる
// ---------------------------------
const titleDemo = { idx: -2, t: 0, group: null, cache: {} };
const DEMO_SPAN = 9; // 秒
function buildDemo(idx) {
    if (titleDemo.cache[idx]) return titleDemo.cache[idx];
    const grp = new THREE.Group();
    const obj = BOSS_BUILDERS[idx]();
    grp.add(obj);
    (obj.userData.extra || []).forEach(e => { scene.remove(e); grp.add(e); });
    grp.visible = false;
    scene.add(grp);
    return (titleDemo.cache[idx] = { grp, obj });
}
function updateTitleDemo(dt, showHub) {
    if (!showHub) {
        if (titleDemo.group) titleDemo.group.visible = false;
        titleDemo.idx = -2; // 次にタイトルへ来たら選び直す
        return;
    }
    titleDemo.t += dt;
    if (titleDemo.idx === -2 || titleDemo.t > DEMO_SPAN) {
        let n;
        do { n = Math.floor(Math.random() * (BOSS_BUILDERS.length + 1)) - 1; } while (n === titleDemo.idx);
        titleDemo.idx = n; titleDemo.t = 0;
        if (titleDemo.group) titleDemo.group.visible = false;
        titleDemo.group = null;
        // そのボスが出るステージのテーマ（ボスk番目は 3(k+1) 面）。ハブは1面のテーマ
        const ti = n < 0 ? 0 : (3 * n + 2) % themes.length;
        if (ti !== currentThemeIndex) { currentThemeIndex = ti; applyThemeStyles(themes[ti]); }
        if (n >= 0) { titleDemo.group = buildDemo(n).grp; titleDemo.group.visible = true; }
    }
    if (titleDemo.idx < 0 || !titleDemo.group) return;
    const d = titleDemo.cache[titleDemo.idx], t = rTime, k3 = Math.floor(t / 3) % 3;
    // アニメ用の仮のボス状態（ゲーム座標の中心＝グループの原点）
    const fb = { x: W / 2, y: H / 2, t: t * 60, alpha: 1, spin: t * 2, d: 140, open: Math.max(0, Math.sin(t * 1.5)), doors: Math.sin(t * 2) > 0 ? 1 : 0,
        charge: (Math.sin(t * 1.2) + 1) / 2, phase: k3, mode: '', telegraph: false, state: 'fight',
        hist: [0, 1, 2, 3, 4].map(i => ({ x: W / 2 + Math.sin(t * 2 - i * 0.3) * 30, y: H / 2 - i * 4 })),
        segs: Array.from({ length: 8 }, (_, k) => ({ x: W / 2 + Math.sin(t * 2.4 - (k + 1) * 0.55) * 46, y: H / 2 - (k + 1) * 30 })) };
    try { d.obj.userData.anim(d.obj, fb, t); } catch (e) {}
    d.obj.position.set(0, 0, 0);
    (d.obj.userData.extra || []).forEach(e => { if (e.userData.lift === undefined && e.geometry && e.geometry.type === 'PlaneGeometry') e.visible = false; });
    const g = titleDemo.group, b = visualBeat;
    g.position.copy(titleHub.position).add(new THREE.Vector3(0, 140, 0));
    g.rotation.y += dt * 0.45;
    g.rotation.x = Math.sin(t * 0.6) * 0.18;
    const appear = Math.min(1, titleDemo.t * 1.6), fade = Math.min(1, (DEMO_SPAN - titleDemo.t) * 2);
    g.scale.setScalar((IS_MOBILE ? 3.4 : 3.0) * (0.6 + 0.4 * Math.min(appear, fade)) * (1 + b * 0.08));
}

// =================================================================================
// ▼▼▼ HUD（2Dオーバーレイ）▼▼▼
// =================================================================================
function draw() {
    render3D();

    const renderCtx = ctx;
    const theme = themes[currentThemeIndex];
    renderCtx.setTransform(HUD_SCALE, 0, 0, HUD_SCALE, 0, 0);
    renderCtx.clearRect(0, 0, HUD_W, HUD_H);
    renderCtx.save();
    if (screenShake.intensity > 0 && gameState !== 'paused' && gameState !== 'confirmReset') { // 停止中は揺らさない
        renderCtx.translate((Math.random() - 0.5) * screenShake.intensity * 0.6, (Math.random() - 0.5) * screenShake.intensity * 0.6);
    }

    if (!gl3dOK) {
        renderCtx.fillStyle = '#ff3366';
        renderCtx.font = `600 14px ${config.fontFamily}`;
        renderCtx.textAlign = 'center';
        renderCtx.fillText(T('webgl'), HUD_W / 2, HUD_H - 60);
    }

    if (gameState === 'playing' || gameState === 'paused' || gameState === 'title') {
        applyThemeStyles(theme);
    }

    // タイトル画面の読みやすさ確保用ベール
    if (gameState === 'title' || gameState === 'confirmReset' || gameState === 'gameOver' || gameState === 'difficulty') {
        const g = renderCtx.createRadialGradient(HUD_W / 2, HUD_H / 2, 60, HUD_W / 2, HUD_H / 2, 560);
        g.addColorStop(0, gameState === 'title' ? 'rgba(5,0,18,0.7)' : 'rgba(5,0,18,0.55)');
        g.addColorStop(1, 'rgba(5,0,18,0.15)');
        renderCtx.fillStyle = g;
        renderCtx.fillRect(0, 0, HUD_W, HUD_H);
    }

    // ハイパーアイテムのラベルと、ハイパー中の残り時間
    // （アイテム上のHYPERの文字は表示しない）
    if (hyperT > 0 && (gameState === 'playing' || gameState === 'paused')) {
        const ratio = hyperT / HYPER_TIME, col = frameCount % 10 < 5 ? '#ffd400' : '#ff2d55';
        const tx = IS_MOBILE ? HUD_W - 20 : HUD_W / 2, ty = IS_MOBILE ? 156 : HUD_H - 50, bw = IS_MOBILE ? 150 : 180;
        renderCtx.save();
        renderCtx.textAlign = IS_MOBILE ? 'right' : 'center';
        renderCtx.font = `800 ${IS_MOBILE ? 22 : 16}px ${config.fontFamily}`;
        drawWithGlow(renderCtx, () => { renderCtx.fillStyle = col; renderCtx.fillText(`HYPER ×3  ${hyperT.toFixed(1)}`, tx, ty); }, col);
        const bx = IS_MOBILE ? tx - bw : tx - bw / 2;
        renderCtx.fillStyle = 'rgba(255,255,255,0.18)'; renderCtx.fillRect(bx, ty + 6, bw, 4);
        renderCtx.fillStyle = col; renderCtx.fillRect(bx, ty + 6, bw * ratio, 4);
        renderCtx.restore();
    }
    // スコアテキスト（3D位置をスクリーンに投影）
    if (scoreTexts.length > 0) {
        renderCtx.save();
        renderCtx.textAlign = 'center';
        scoreTexts.forEach(st => {
            const fontSize = (st.type === 'bonus' ? 14 : st.type === 'gem' ? 12 : 10) * (IS_MOBILE ? 1.5 : 1);
            renderCtx.font = `600 ${fontSize}px ${config.fontFamily}`;
            const alpha = st.type === 'gem' ? Math.min(1, st.life / 14) : st.life / 60.0;
            const hue = st.type === 'gem' ? 40 + (st.life * 7) % 30 : (frameCount * 5 + st.x) % 360;
            const scoreColor = `hsla(${hue}, 100%, 70%, ${alpha})`;
            const glowColor = `hsla(${hue}, 100%, 70%, ${alpha / 2})`;
            const sp = project(st.x, st.y, 24);
            renderCtx.globalAlpha = alpha;
            if (st.type === 'gem') {
                renderCtx.fillStyle = scoreColor;
                renderCtx.fillText(st.text, sp.x, sp.y);
            } else {
                drawWithGlow(renderCtx, () => {
                    renderCtx.fillStyle = scoreColor;
                    renderCtx.fillText(st.text, sp.x, sp.y);
                }, glowColor);
            }
        });
        renderCtx.restore();
    }

    // Draw UI
    const uiColor = theme.ui;
    const mainFontSize = (IS_MOBILE ? 25 : 20) + visualBeat * 2; // スマホは大きめ
    const subFontSize = (IS_MOBILE ? 22 : 18) + visualBeat * 2;

    // SCOREとタイマー表示 (タイトル画面以外で表示)
    if (gameState !== 'title' && gameState !== 'difficulty' && gameState !== 'confirmReset') {
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 ${mainFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            
            renderCtx.textAlign = 'left';
            renderCtx.fillText(`SCORE: ${score}`, 20, IS_MOBILE ? 46 : 40);

            renderCtx.textAlign = 'center';
            renderCtx.fillText(formatTime(elapsedTime), HUD_W / 2 + (IS_MOBILE ? 22 : 0), IS_MOBILE ? 46 : 40);
        }, uiColor, true);
    }

    // ゲームモードとSTAGE表示 (playing, paused, gameOver の時に表示)
    if (gameState === 'playing' || gameState === 'paused' || gameState === 'gameOver') {
        // ▼▼▼ このブロックを修正 ▼▼▼
        // ゲームモード名とハイスコアを交互に表示
        let textToDisplay;
        if (isShowingModeInGame) {
            textToDisplay = tutorial ? T('tut.label') : gameMode.replace(' MODE', '');
        } else {
            let currentHighScore;
            switch(gameMode) {
                case 'STANDARD MODE':
                    currentHighScore = highScoreStandard;
                    break;
                case 'JOURNEY MODE':
                    currentHighScore = highScoreJourney;
                    break;
                case 'STARTRAIL MODE':
                    currentHighScore = highScoreStartrail;
                    break;
                default:
                    currentHighScore = 0;
            }
            
            // ★ ここからが変更点 ★
            // 現在のスコアがハイスコアを上回っている場合、表示するスコアを現在のスコアにする
            const scoreToDisplay = Math.max(currentHighScore, score);
            textToDisplay = `HI: ${scoreToDisplay}`;
            // ★ 変更はここまで ★
        }
        
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 ${mainFontSize}px ${config.fontFamily}`;
            renderCtx.fillStyle = uiColor;
            if (IS_MOBILE) { // スマホ: 右上は一時停止ボタン。モード名はスコアの下、HIは右側の2段目

    if (tutorial && (gameState === 'playing' || gameState === 'paused')) drawTutorialPanel(renderCtx);

    // ボス: 警告とHPバー
    if (boss && (gameState === 'playing' || gameState === 'paused')) {

    // シールド表示（エネルギーバーの右）
    if ((gameState === 'playing' || gameState === 'paused') && !tutorial) {
        const sx = gameMode === 'STARTRAIL MODE' ? 20 : (IS_MOBILE ? 240 : 236), sy = IS_MOBILE ? 109 : HUD_H - 29, HR = IS_MOBILE ? 11 : 9, HG = IS_MOBILE ? 28 : 24;

            renderCtx.closePath();

    if (chainCount > 1 && player.invincibleTimer > 0) {

    // ★ ここから追加 ★
    if (mutekiAnim.life > 0) {

        renderCtx.save();
        renderCtx.textAlign = 'center';

        renderCtx.font = `600 ${IS_MOBILE ? 17 : 10}px ${config.fontFamily}`;
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = theme.ui;
            renderCtx.fillText(T('hud.bonus'), HUD_W / 2, subTextY, HUD_W - 24);
        }, theme.ui);
        renderCtx.restore();
    }
    // ★ ここまで追加 ★

    if ((gameState === 'playing' || gameState === 'paused') && gameMode !== 'STARTRAIL MODE') {
        const barW = 200, barH = IS_MOBILE ? 14 : 12, x = 20, y = IS_MOBILE ? 102 : HUD_H - 35, r = 5;
        const energyRatio = Math.max(0, energy / config.energyTotal);
        const hue = energyRatio * 120;
        let energyColor = `hsl(${hue},100%,50%)`;

        if (lowEnergyWarningPlayed && frameCount % 10 < 5) {

        }

        renderCtx.strokeStyle = 'rgba(255,255,255,0.5)';
        renderCtx.lineWidth = 2;
        drawRoundRect(renderCtx, x, y, barW, barH, r);
        renderCtx.stroke();
        renderCtx.fillStyle = 'rgba(0,0,0,0.5)';
        drawRoundRect(renderCtx, x, y, barW, barH, r);
        renderCtx.fill();
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = energyColor;
            if (barW * energyRatio > 0) {
                renderCtx.beginPath();
                drawRoundRect(renderCtx, x, y, barW * energyRatio, barH, r);
                renderCtx.fill()
            }
        }, energyColor, true);

        if (player.invincibleTimer > 0) {
            const invincBarY = y + barH + 5;
            const invincBarH = 6;
            const invincRatio = player.invincibleTimer / player.maxInvincibleTimer;

            renderCtx.lineWidth = 1;
            drawRoundRect(renderCtx, x, invincBarY, barW, invincBarH, r - 2);

            renderCtx.fillStyle = 'rgba(0,0,0,0.5)';
            drawRoundRect(renderCtx, x, invincBarY, barW, invincBarH, r - 2);
            renderCtx.fill();
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = invincColor;
                if (barW * invincRatio > 0) {
                    renderCtx.beginPath();
                    drawRoundRect(renderCtx, x, invincBarY, barW * invincRatio, invincBarH, r - 2);
                    renderCtx.fill()
                }
            }, invincColor, true);

    }

    if (isInvincible) {
        let mutekiY = HUD_H - 50;
        if (player.invincibleTimer > 0 && gameMode !== 'STARTRAIL MODE') {

        if (IS_MOBILE) mutekiY = 156; // スマホはボタンと重ならないよう上部のゲージ下に
        const mutekiColor = `hsl(${(frameCount*3)%360},100%,70%)`;
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = mutekiColor;
            renderCtx.font = `600 ${IS_MOBILE ? 22 : 16}px ${config.fontFamily}`;
            renderCtx.textAlign = 'left';
            renderCtx.fillText('MUTEKI', 20, mutekiY);
        }, mutekiColor, true);
    }
    

    // Draw Effects (HUD側)
    effects.forEach(e => {
        if (e.type === 'stageClear' && gameState !== 'gameOver') {

            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = theme.ui;

                renderCtx.fillText(e.text, HUD_W / 2, HUD_H / 2 - 50 * CK); // 中央のMUTEKIより上
            }, theme.ui, true);
            renderCtx.globalAlpha = 1;
        } else if (e.type === 'shockwave' && e.hud && isEffectsEnabled) {
            const progress = 1 - e.life / e.maxLife;
            const radius = e.radius + progress * 300;
            const alpha = e.life / e.maxLife;
            renderCtx.save();
            renderCtx.globalAlpha = alpha * 0.8;
            renderCtx.strokeStyle = '#ffffff';
            renderCtx.lineWidth = 3 + (1 - alpha) * 5;
            renderCtx.beginPath();
            renderCtx.arc(e.x, e.y, radius, 0, Math.PI * 2);
            renderCtx.stroke();
            renderCtx.restore();
        } else if (e.type === 'bossDefeated') {
            const a = Math.min(1, e.life / 40);
            renderCtx.save();
            renderCtx.globalAlpha = a;
            renderCtx.textAlign = 'center';
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = `hsl(${(frameCount * 6) % 360}, 100%, 70%)`;
                renderCtx.font = `600 28px ${config.fontFamily}`;
                renderCtx.fillText(T('hud.destroyed', { name: e.name }), HUD_W / 2, HUD_H / 2 - 160 * CK, HUD_W - 24);
            }, '#ffffff');
            renderCtx.restore();
        } else if (e.type === 'hyperMsg') {
            const a = Math.min(1, e.life / 20), k = 1 - e.life / e.maxLife;
            renderCtx.save();
            renderCtx.globalAlpha = a;
            renderCtx.textAlign = 'center';
            const fs = (e.end ? 26 : 46) * (IS_MOBILE ? 1.25 : 1) * (e.end ? 1 : 1 + Math.max(0, 0.35 - k) * 1.2);
            renderCtx.font = `800 ${fs}px ${config.fontFamily}`;
            const col = e.end ? '#9aa4c8' : (frameCount % 6 < 3 ? '#ffd400' : '#ff2d55');
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = col;
                renderCtx.fillText(e.text, HUD_W / 2, HUD_H / 2 - 92 * CK, HUD_W - 24); // 中央のMUTEKIより上
            }, col);
            renderCtx.restore();
        } else if (e.type === 'shieldMsg') {
            const a = Math.min(1, e.life / 25);
            renderCtx.save();
            renderCtx.globalAlpha = a;
            renderCtx.textAlign = 'center';
            renderCtx.font = `700 ${IS_MOBILE ? 28 : 22}px ${config.fontFamily}`;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = e.color;
                renderCtx.fillText(e.text, HUD_W / 2, HUD_H / 2 + (IS_MOBILE ? 112 : 90), HUD_W - 24); // 中央のMUTEKIより下
            }, e.color);
            renderCtx.restore();
        } else if (e.type === 'comboFadeOut' && isEffectsEnabled) {
            drawChainComboText(renderCtx, e.count, e.life / e.maxLife);
        } else if (e.type === 'screenFlash' && isEffectsEnabled) {
            const alpha = e.life / e.maxLife;
            renderCtx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
            renderCtx.fillRect(-20, -20, HUD_W + 40, HUD_H + 40);
        } else if (e.type === 'energyGameOverFlash') {
            const progress = 1.0 - (e.life / e.maxLife);
            const alpha = Math.sin((1.0 - progress) * Math.PI) * 0.8;
            renderCtx.fillStyle = `rgba(224, 224, 224, ${alpha})`;
            renderCtx.fillRect(-20, -20, HUD_W + 40, HUD_H + 40);
        }
    });
    // Draw UI Screens (Paused, Confirm, Title, Game Over)
    if (gameState === 'paused') {
        renderCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        renderCtx.fillRect(0, 0, HUD_W, HUD_H);
        
        const pauseMsg = 'PAUSED';
        const resumeKey = lastInputDevice === 'keyboard' ? 'P' : 'START';
        const quitMsg = TK('p.quit');
        const resumeMsg = TK('p.resume');
        
        renderCtx.font = `600 48px ${config.fontFamily}`;
        renderCtx.textAlign = 'center';
        
        const totalWidth = renderCtx.measureText(pauseMsg).width;
        let currentX = HUD_W / 2 - totalWidth / 2;

        for (let i = 0; i < pauseMsg.length; i++) {
            const char = pauseMsg[i];
            const charWidth = renderCtx.measureText(char).width;
            const hue = (Date.now() / 15 + i * 30) % 360;
            const gamingColor = `hsl(${hue}, 100%, 70%)`;

                renderCtx.fillStyle = gamingColor;

            currentX += charWidth;
        }

        renderCtx.fillStyle = theme.ui;
        renderCtx.font = `600 20px ${config.fontFamily}`;
        drawWithGlow(renderCtx, () => {
            renderCtx.fillText(resumeMsg, HUD_W / 2, HUD_H / 2 + 30);
            if (!IS_MOBILE) renderCtx.fillText(quitMsg, HUD_W / 2, HUD_H / 2 + 60); // スマホはボタン
        }, theme.ui, true);

    } else if (gameState === 'confirmReset') {
        // 背景を暗くして確認画面を目立たせる
        renderCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        renderCtx.fillRect(0, 0, HUD_W, HUD_H);

        const msg1 = T('reset.msg');
        const msg2 = "(Y/N)";
        const msgColor = '#ff3333'; // 警告を示す赤色

        renderCtx.textAlign = 'center';
        renderCtx.textBaseline = 'middle';

        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = msgColor;
            renderCtx.font = `600 24px ${config.fontFamily}`;
            renderCtx.fillText(msg1, HUD_W / 2, HUD_H / 2 - 20);
        }, msgColor);
        
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = '#ffffff';
            renderCtx.font = `600 20px ${config.fontFamily}`;
            renderCtx.fillText(msg2, HUD_W / 2, HUD_H / 2 + 25);
        }, '#ffffff');
        
        renderCtx.textBaseline = 'alphabetic'; // デフォルトに戻す
    
    } else if (gameState === 'difficulty') {
        const cx = HUD_W / 2;
        const hasLS = 'letterSpacing' in renderCtx;
        renderCtx.save();
        renderCtx.translate(0, MENU_DY - 32); // 画面の上下中央に揃える
        renderCtx.textAlign = 'center';
        if (hasLS) renderCtx.letterSpacing = LS('16px');
        renderCtx.font = `300 34px ${config.logoFontFamily}`;
        drawWithGlow(renderCtx, () => { renderCtx.fillStyle = '#ffffff'; renderCtx.fillText(T('diff.title'), cx + 8, 132); }, theme.player, true);
        if (hasLS) renderCtx.letterSpacing = LS('8px');
        renderCtx.font = `400 14px ${config.fontFamily}`;
        renderCtx.fillStyle = hexToRgba(theme.ui, 0.9);
        renderCtx.fillText((pendingMode || '').toLowerCase(), cx + 4, 166);
        DIFFS.forEach((d, i) => {

                bg.addColorStop(0.5, hexToRgba(theme.ui, 0.22 + visualBeat * 0.12));
                bg.addColorStop(1, 'rgba(255,255,255,0)');
                renderCtx.fillStyle = bg;
                renderCtx.fillRect(cx - w, y - 34, w * 2, 72);

                renderCtx.moveTo(cx + w - 14, y - 34); renderCtx.lineTo(cx + w, y - 34); renderCtx.lineTo(cx + w, y + 38); renderCtx.lineTo(cx + w - 14, y + 38);
                renderCtx.stroke();

            if (hasLS) renderCtx.letterSpacing = LS('10px');
            renderCtx.font = `${sel ? 600 : 400} ${sel ? 26 : 22}px ${config.fontFamily}`;
            renderCtx.fillStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.45)';
            if (sel) drawWithGlow(renderCtx, () => renderCtx.fillText(d.id.toLowerCase(), cx + 5, y), theme.ui, true);
            else renderCtx.fillText(d.id.toLowerCase(), cx + 5, y);
            // シールドのアイコン
            for (let k = 0; k < 2; k++) {
                const hx = cx + 196 + k * 26, hy = y - 8, on = k < d.shields, bonus = !on && k < (d.cap || 0); // EASYのボーナスシールドは点滅
                const blink = Math.floor(performance.now() / 350) % 2;
                renderCtx.beginPath();
                for (let v = 0; v < 6; v++) { const a = Math.PI / 6 + v * Math.PI / 3; renderCtx[v ? 'lineTo' : 'moveTo'](hx + Math.cos(a) * 10, hy + Math.sin(a) * 10); }
                renderCtx.closePath();
                renderCtx.lineWidth = 1.5;
                renderCtx.strokeStyle = on ? (sel ? '#7dffd0' : 'rgba(125,255,208,0.5)') : bonus ? (blink ? (sel ? '#ffe27a' : 'rgba(255,226,122,0.5)') : 'rgba(255,226,122,0.12)') : 'rgba(255,255,255,0.18)';
                if (on) { renderCtx.fillStyle = sel ? 'rgba(125,255,208,0.55)' : 'rgba(125,255,208,0.2)'; renderCtx.fill(); }
                if (bonus && blink) { renderCtx.fillStyle = sel ? 'rgba(255,226,122,0.35)' : 'rgba(255,226,122,0.12)'; renderCtx.fill(); }
                renderCtx.stroke();

            if (hasLS) renderCtx.letterSpacing = LS('2px');
            renderCtx.font = `400 13px ${config.fontFamily}`;
            renderCtx.fillStyle = sel ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.35)';
            renderCtx.fillText(T('diff.' + d.id), cx, y + 26, HUD_W - 30);
        });
        if (hasLS) renderCtx.letterSpacing = LS('4px');
        renderCtx.font = `400 13px ${config.fontFamily}`;
        renderCtx.fillStyle = 'rgba(255,255,255,0.6)';
        renderCtx.fillText(TK('diff.keys'), cx, 530, HUD_W - 30);
        if (IS_MOBILE) {
            renderCtx.textAlign = 'left';
            renderCtx.font = `500 22px ${config.fontFamily}`;
            renderCtx.fillStyle = hexToRgba(theme.ui, 0.95);
            renderCtx.fillText('‹ ' + T('back'), 22, 70);
            renderCtx.textAlign = 'center';
        }
        renderCtx.fillStyle = hexToRgba(theme.ui, 0.75);
        renderCtx.fillText(T('diff.special'), cx, 562, HUD_W - 30);
        if (hasLS) renderCtx.letterSpacing = LS('0px');
        renderCtx.restore();

    } else if (gameState === 'title') {
        const cx = HUD_W / 2;
        const hasLS = 'letterSpacing' in renderCtx;
        // 最下部のコピーライト表記
        renderCtx.save();
        renderCtx.textAlign = 'center'; renderCtx.textBaseline = 'alphabetic';
        renderCtx.font = `500 ${IS_MOBILE ? 13 : 11}px ${config.fontFamily}`;
        if (hasLS) renderCtx.letterSpacing = '1.5px';
        renderCtx.fillStyle = 'rgba(200,210,255,0.55)';
        renderCtx.fillText('(C) 2026 Archetypes Inc. / CALMDUST', cx, HUD_H - (IS_MOBILE ? 14 : 10));
        renderCtx.restore();
        renderCtx.save();
        renderCtx.translate(0, MENU_DY - 40); // 画面の上下中央に揃える
        if (IS_MOBILE) { renderCtx.translate(cx, TITLE_PIV); renderCtx.scale(TITLE_S, TITLE_S); renderCtx.translate(-cx, -TITLE_PIV); }
        const tMaxW = HUD_W / TITLE_S - 24;
        renderCtx.textAlign = 'center';
        renderCtx.textBaseline = 'alphabetic';
        // ロゴ: Rez風の細い小文字ロゴ
        if (hasLS) renderCtx.letterSpacing = IS_MOBILE ? '12px' : '34px';
        renderCtx.font = `300 112px ${config.logoFontFamily}`;
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = '#ffffff';
            renderCtx.fillText('comet', cx + (IS_MOBILE ? 6 : 17), 196);
        }, theme.player, true);
        if (hasLS) renderCtx.letterSpacing = IS_MOBILE ? '10px' : '22px';
        drawTitleTextMorph(renderCtx, cx + (IS_MOBILE ? 5 : 11), 248, `300 26px ${config.logoFontFamily}`, theme.ui);
        renderCtx.strokeStyle = 'rgba(255,255,255,0.55)';
        renderCtx.lineWidth = 1;
        renderCtx.beginPath();
        const lw = IS_MOBILE ? 200 : 300;
        renderCtx.moveTo(cx - lw, 266); renderCtx.lineTo(cx + lw, 266);
        renderCtx.stroke();
        if (hasLS) renderCtx.letterSpacing = '12px';
        renderCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        renderCtx.font = `400 12px ${config.fontFamily}`;
        renderCtx.fillText('3d edition · beta', cx + 6, 290);

        // メニュー
        const menuY = 344, menuGap = 42;
        titleMenuItems.forEach((item, index) => {
            const y = menuY + index * menuGap;
            const label = item.replace(' MODE', '').toLowerCase();
            if (index === titleMenuIndex) {
                const w2 = 150 + Math.sin(frameCount * 0.1) * 4;
                renderCtx.strokeStyle = hexToRgba(theme.ui, 0.75 + visualBeat * 0.25);
                renderCtx.lineWidth = 1;
                renderCtx.beginPath();
                // 細いブラケット [ ]
                renderCtx.moveTo(cx - w2 + 10, y - 22); renderCtx.lineTo(cx - w2, y - 22); renderCtx.lineTo(cx - w2, y + 6); renderCtx.lineTo(cx - w2 + 10, y + 6);
                renderCtx.moveTo(cx + w2 - 10, y - 22); renderCtx.lineTo(cx + w2, y - 22); renderCtx.lineTo(cx + w2, y + 6); renderCtx.lineTo(cx + w2 - 10, y + 6);
                renderCtx.stroke();
                if (hasLS) renderCtx.letterSpacing = '10px';
                renderCtx.font = `500 22px ${config.fontFamily}`;
                drawWithGlow(renderCtx, () => {
                    renderCtx.fillStyle = '#ffffff';
                    renderCtx.fillText(label, cx + 5, y);
                }, theme.ui, true);
            } else {
                if (hasLS) renderCtx.letterSpacing = '10px';
                renderCtx.font = `300 18px ${config.fontFamily}`;
                renderCtx.fillStyle = 'rgba(255, 255, 255, 0.42)';
                renderCtx.fillText(label, cx + 5, y);
            }
        });

        if (hasLS) renderCtx.letterSpacing = LS('6px');
        if (titleBottomText === "") {
            titleBottomText = TK('start');
        }
        renderCtx.font = `400 15px ${config.fontFamily}`;
        renderCtx.globalAlpha = 0.65 + Math.sin(frameCount * 0.08) * 0.35;
        renderCtx.fillStyle = '#ffffff';
        renderCtx.fillText(titleBottomText, cx, 530, tMaxW);
        renderCtx.globalAlpha = 1;

        const highScoreCycle = frameCount % 360;
        const hsDiff = '  ·  ' + DIFFS[difficultyIndex].id;
        const hsText = (highScoreCycle < 120 ? `HI-SCORE  STANDARD  ${highScoreStandard}` : highScoreCycle < 240 ? `HI-SCORE  JOURNEY  ${highScoreJourney}` : `HI-SCORE  STARTRAIL  ${highScoreStartrail}`) + hsDiff;
        renderCtx.font = `400 13px ${config.fontFamily}`;
        renderCtx.fillStyle = hexToRgba(theme.ui, 0.85);
        renderCtx.fillText(hsText.toLowerCase(), cx, 566, tMaxW);
        if (hasLS) renderCtx.letterSpacing = '0px';
        renderCtx.restore();

    } else if (gameState === 'gameOver') {
        renderCtx.textAlign = 'center';
        renderCtx.textBaseline = 'middle';
        const gameOverColor = '#ff3333';
        const gameOverY = HUD_H / 2 - 150;
        
        drawWithGlow(renderCtx, () => {
            renderCtx.fillStyle = gameOverColor;
            renderCtx.font = `600 60px ${config.fontFamily}`;
            renderCtx.fillText('GAME OVER', HUD_W / 2, gameOverY);
        }, gameOverColor);

        if (newHighScoreAchieved) {
            const newRecordColor = `hsl(${(frameCount*3)%360},100%,70%)`;
            const newRecordY = gameOverY + 80;
            drawWithGlow(renderCtx, () => {
                renderCtx.fillStyle = newRecordColor;
                renderCtx.font = `600 30px ${config.fontFamily}`;
                renderCtx.fillText('NEW RECORD!', HUD_W / 2, newRecordY);
            }, newRecordColor);
        }
        
        const scoreY = HUD_H / 2;
        let currentHighScore;
        switch(gameMode) {
            case 'STANDARD MODE': currentHighScore = highScoreStandard; break;
            case 'JOURNEY MODE': currentHighScore = highScoreJourney; break;
            case 'STARTRAIL MODE': currentHighScore = highScoreStartrail; break;
            default: currentHighScore = 0;
        }

        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 30px ${config.fontFamily}`;
            renderCtx.fillStyle = theme.ui;
            renderCtx.fillText(`SCORE: ${score}`, HUD_W / 2, scoreY);
        }, theme.ui);
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 20px ${config.fontFamily}`;
            renderCtx.fillStyle = theme.ui;
            renderCtx.fillText(`HI-SCORE (${DIFFS[difficultyIndex].id}): ${currentHighScore}`, HUD_W / 2, scoreY + 50);
        }, theme.ui);
        
        let titleText, replayText;
        if (lastInputDevice === 'touch') {
            titleText = T('go.title_touch');
            replayText = T('go.replay_touch');
        } else if (lastInputDevice === 'keyboard') {
            titleText = T('go.title_kb');
            replayText = T('go.replay_kb');
        } else {
            titleText = T('go.title_pad');
            replayText = T('go.replay_pad');
        }
        const replayY = scoreY + 120;
        drawWithGlow(renderCtx, () => {
            renderCtx.font = `600 18px ${config.fontFamily}`;
            renderCtx.fillStyle = '#ffffff';
            renderCtx.fillText(replayText, HUD_W / 2, replayY);
            if (!IS_MOBILE) renderCtx.fillText(titleText, HUD_W / 2, replayY + 30); // スマホはボタン
        }, '#ffffff');

        renderCtx.textBaseline = 'alphabetic';
    }

    if (gameState === 'gameOver' && gameOverReason === 'energy') {
        const progress = grayscaleAnimation.progress;
        const filterValue = `grayscale(${progress}) brightness(${1 - progress * 0.2})`;
        stageEl.style.filter = filterValue;
        stageEl.style.webkitFilter = filterValue;
    } else {
        if (stageEl.style.filter !== 'none') {
            stageEl.style.filter = 'none';
            stageEl.style.webkitFilter = 'none';
        }
    }

    renderCtx.restore();

    // フレーム時間の記録と表示（Gキー）
    const nowT = performance.now();
    if (perfLastT) { perfHist.push(nowT - perfLastT); if (perfHist.length > 120) perfHist.shift(); }
    perfLastT = nowT;
    if (showPerf && perfHist.length > 2) {
        const avg = perfHist.reduce((a, b) => a + b, 0) / perfHist.length;
        const mx = Math.max(...perfHist);
        renderCtx.save();
        renderCtx.fillStyle = 'rgba(0,0,0,0.6)';
        renderCtx.fillRect(HUD_W - 250, HUD_H - 140, 240, 92);
        renderCtx.font = `600 13px ${config.fontFamily}`;
        renderCtx.fillStyle = '#ffffff';
        renderCtx.textAlign = 'left';
        renderCtx.fillText(`fps ${(1000 / avg).toFixed(1)}  max ${mx.toFixed(1)}ms  res x${quality.toFixed(2)}`, HUD_W - 242, HUD_H - 122);
        perfHist.forEach((v, k) => {
            const hgt = Math.min(60, v * 1.8);
            renderCtx.fillStyle = v > 20 ? '#ff4466' : v > 17.5 ? '#ffcc44' : '#44ff99';
            renderCtx.fillRect(HUD_W - 242 + k * 1.9, HUD_H - 52 - hgt, 1.5, hgt);
        });
        renderCtx.restore();
    }

    if (gameState === 'playing' && player.invincibleTimer > 0) {
        if (player.invincibleTimer < 30 && frameCount % 10 < 5) {} else {
            renderCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            renderCtx.fillRect(0, 0, HUD_W, HUD_H);
        }
    }
}

// ゲーム進行は固定60Hzで回す（オリジナルの60fps時と同じテンポを保つ。描画fpsや画面のリフレッシュレートに左右されない）
const SIM_STEP = 1000 / 60;
let inputDirty = false;
// 描画補間: 直前の更新時の位置と現在位置の間を、端数時間ぶん補間して描く
// （120Hz/144Hzなどの画面でも動きが滑らかになる）
let simAlpha = 1;
function snapshotPrev() {
    const sp = o => { o._px = o.x; o._py = o.y; };
    if (player) sp(player);
    if (playerBullet) sp(playerBullet);
    if (boss) sp(boss);
    if (comets) comets.forEach(sp);
    if (enemyBullets) enemyBullets.forEach(sp);
    if (items) items.forEach(sp);
    if (monsters) monsters.forEach(sp);
    if (particles) particles.forEach(sp);
    if (gems) gems.forEach(sp);
}
function ix(o) { if (o._px === undefined) return o.x; const d = o.x - o._px; return Math.abs(d) > 120 ? o.x : o._px + d * simAlpha; }
function iy(o) { if (o._py === undefined) return o.y; const d = o.y - o._py; return Math.abs(d) > 120 ? o.y : o._py + d * simAlpha; }
let simRealLast = null;
let simAcc = 0;
let simTime = 0;
// PC: HUDの2Dキャンバスを3D画面に重ねて描き、画面を1枚にする（2枚の合成待ちをなくして表示遅延を減らす）
const HUD_IN_GL = !IS_MOBILE && gl3dOK;
let hudTex = null, hudScene = null, hudCam = null, hudInGlOn = true;
if (HUD_IN_GL) {
    hudTex = new THREE.CanvasTexture(canvas);
    hudTex.colorSpace = THREE.SRGBColorSpace;
    hudTex.generateMipmaps = false; hudTex.minFilter = THREE.LinearFilter; hudTex.magFilter = THREE.LinearFilter;
    hudScene = new THREE.Scene();
    hudCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    hudScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthTest: false, depthWrite: false, toneMapped: false })));
    canvas.style.opacity = '0'; // 2Dキャンバスは描画用（表示は3D側で）
}
function renderHudOverlay() {
    hudTex.needsUpdate = true;
    const ac = renderer.autoClear;
    renderer.autoClear = false;
    renderer.setRenderTarget(null);
    renderer.render(hudScene, hudCam);
    renderer.autoClear = ac;
}
// ゲームパッドは毎フレーム読む（自機移動用）
function gpDir() {
    let l = false, r = false, slow = false;
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
        if (!gp) continue;
        l = l || gp.buttons[14]?.pressed || gp.axes[0] < -0.5;
        r = r || gp.buttons[15]?.pressed || gp.axes[0] > 0.5;
        slow = slow || gp.buttons[0]?.pressed || gp.buttons[1]?.pressed;
    }
    return { l, r, slow };
}
// PCの自機移動: 固定60Hzの計算を待たず、毎フレーム実時間で動かす（当たり判定・弾の位置も描画と一致）
function movePlayerRT(ms) {
    if (gameState !== 'playing' || ms <= 0) return;
    const g = gpDir();
    const kl = keyState['ArrowLeft'] || g.l, kr = keyState['ArrowRight'] || g.r;
    if (kl === kr) return;
    const slow = keyState['ShiftLeft'] || keyState['ShiftRight'] || keyState['KeyZ'] || g.slow;
    const sp = config.playerSpeed * (slow ? config.playerSlowModeMultiplier : 1) * (player.invincibleTimer > 0 ? 1.1 : 1) * (hyperT > 0 ? 1.1 : 1);
    player.x = Math.max(0, Math.min(config.canvasWidth, player.x + (kr ? 1 : -1) * sp * ms / 1000));
}
function gameLoop(timestamp) {
    if (window.__bootBusy) { simRealLast = null; requestAnimationFrame(gameLoop); return; } // 起動ロゴ表示中はゲームの描画を止めてロゴを滑らかに
    if (timestamp !== undefined) {
        if (simRealLast === null) simRealLast = timestamp;
        let delta = Math.min(250, timestamp - simRealLast);
        // 高リフレッシュレート画面では、入力の変化があれば半ステップ以上溜まった時点で前倒しで進める
        if (inputDirty && simAcc + delta >= SIM_STEP * 0.5 && simAcc + delta < SIM_STEP) { simAcc = SIM_STEP - delta; }
        inputDirty = false;
        simRealLast = timestamp;
        // 60Hz付近の揺らぎは1ステップ分に吸着させる（0回/2回更新が交互に起きるカクつき防止）
        if (Math.abs(delta - SIM_STEP) < 1.6) delta = SIM_STEP;
        else if (Math.abs(delta - SIM_STEP * 2) < 2.0) delta = SIM_STEP * 2;
        if (!IS_MOBILE) movePlayerRT(Math.min(50, timestamp - (gameLoop._lt || timestamp)));
        gameLoop._lt = timestamp;
        simAcc += delta;
        let steps = 0;
        while (simAcc >= SIM_STEP && steps < 6) {
            simTime += SIM_STEP;
            snapshotPrev();
            update(simTime);
            simAcc -= SIM_STEP;
            steps++;
        }
        if (steps >= 6) simAcc = 0;
        simAlpha = Math.min(1, simAcc / SIM_STEP);
    }
    draw();
    if (HUD_IN_GL) {
        // 最高画質で動いている間だけHUDを3D画面に重ねる（解像度が下がったらHUDがぼやけないよう従来の2枚表示に戻す）
        const on = quality >= Q_MAX - 0.01;
        if (on !== hudInGlOn) { hudInGlOn = on; canvas.style.opacity = on ? '0' : '1'; }
        if (on) renderHudOverlay();
    }
    requestAnimationFrame(gameLoop);
}

soundToggleButton.classList.toggle('on', !audioHandler.isMuted);
soundToggleButton.addEventListener('click', () => {
    if (!audioHandler.isInitialized) {
        audioHandler.initialize();
    }
    const isMuted = audioHandler.toggleMute();
    soundToggleButton.classList.toggle('on', !isMuted);

effectsToggleButton.addEventListener('click', () => {
    isEffectsEnabled = !isEffectsEnabled;
    effectsToggleButton.classList.toggle('on', isEffectsEnabled);
});

function togglePureFullScreen() {
    const root = document.getElementById('fullscreen-root');
    if (document.fullscreenElement && document.body.classList.contains('pure')) { document.exitFullscreen(); return; }
    document.body.classList.add('pure');
    if (!document.fullscreenElement) root.requestFullscreen().catch(() => { document.body.classList.remove('pure'); updateScale(); });
    updateScale();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('pure'); });
function toggleFullScreen() {
    const e = document.getElementById('fullscreen-root');
    // 画面のみモード中にFを押したら、説明ありのフルスクリーンに切り替える
    if (document.fullscreenElement && document.body.classList.contains('pure')) { document.body.classList.remove('pure'); updateScale(); return; }
    if (!document.fullscreenElement) {
        e.requestFullscreen().catch(err => {
            alert(`フルスクリーンモードにできませんでした: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}

function updateScale() {
    const r = document.getElementById('fullscreen-root');
    const w = document.getElementById('game-wrapper');

    // スケール計算とスタイル適用を次の描画フレームに同期させる
    requestAnimationFrame(() => {
        if (document.fullscreenElement === r) {
            // 上部バー・画面・下の説明を含めたゲーム全体の大きさで縮尺を決める
            const margin = document.body.classList.contains('pure') ? 0 : 20;
            const effectiveWidth = w.offsetWidth + margin;
            const effectiveHeight = w.offsetHeight + margin;
            const scaleX = r.clientWidth / effectiveWidth;
            const scaleY = r.clientHeight / effectiveHeight;
            const scale = Math.min(scaleX, scaleY);
            w.style.setProperty('--scale-factor', scale);
        } else if (!IS_MOBILE) {
            // 通常表示でもブラウザいっぱいに拡大（全体が収まる最大の倍率）
            const scale = Math.min(window.innerWidth / (w.offsetWidth + 24), window.innerHeight / (w.offsetHeight + 24));
            w.style.setProperty('--scale-factor', Math.max(0.3, scale));
        } else {
            w.style.removeProperty('--scale-factor');
        }
    });
}

// フルスクリーン状態が変わった時にスケールを更新
window.addEventListener('fullscreenchange', updateScale);

// ウィンドウリサイズ時の処理を最適化
window.addEventListener('resize', () => {
    // 既にリクエストがあればキャンセル
    if (resizeRequest) {
        cancelAnimationFrame(resizeRequest);
    }
    // 次のフレームでupdateScaleを実行するようにリクエスト
    resizeRequest = requestAnimationFrame(updateScale);
});
updateScale(); // 起動時にも合わせる
if (document.fonts) document.fonts.ready.then(updateScale);
window.addEventListener('load', updateScale);
setTimeout(updateScale, 1500);

document.getElementById('langSel').addEventListener('change', e => {
    LANG = e.target.value;
    try { localStorage.setItem('aicoding-lang', LANG); } catch (_) {}
    applyLang();
    e.target.blur(); // キー操作がゲームに戻るように
});
document.querySelectorAll('#topbar button').forEach(b => b.addEventListener('mouseup', () => b.blur()));
// フルスクリーン中はマウスポインタを隠す（動かすと1.5秒だけ表示）
{
    const root = document.getElementById('fullscreen-root');
    let hideT = 0;
    const arm = () => {
        root.classList.remove('hide-cursor');
        clearTimeout(hideT);
        if (document.fullscreenElement) hideT = setTimeout(() => root.classList.add('hide-cursor'), 1500);
    };
    document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) root.classList.add('hide-cursor'); else { clearTimeout(hideT); root.classList.remove('hide-cursor'); } });
    root.addEventListener('mousemove', arm);
}
// ---- タッチ操作（スマホ）----
if (IS_MOBILE) {
    const stage = document.getElementById('stage');
    const tui = document.getElementById('touch-ui');
    try { if (localStorage.getItem('cometPlusBtnLeft') !== '0') tui.classList.add('left'); } catch (e) {}
    const toHud = e => { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * HUD_W, y: (e.clientY - r.top) / r.height * HUD_H, w: r.width }; };
    const drag = new Map(); // pointerId -> {x, y, sx, sy}
    const wake = () => { lastInputDevice = 'touch'; if (!audioHandler.isInitialized) audioHandler.initialize(); else if (audioHandler.ctx && audioHandler.ctx.state === 'suspended' && gameState !== 'paused') audioHandler.ctx.resume(); };
    stage.addEventListener('pointerdown', e => {
        if (e.target.closest('.tbtn, .notap')) return;
        e.preventDefault(); wake();
        drag.set(e.pointerId, { x: e.clientX, sx: e.clientX, sy: e.clientY, moved: 0 });
        try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    });
    stage.addEventListener('pointermove', e => {
        const d = drag.get(e.pointerId); if (!d) return;
        e.preventDefault();
        const r = stage.getBoundingClientRect();
        const dx = e.clientX - d.x; d.x = e.clientX;
        d.moved = Math.max(d.moved, Math.hypot(e.clientX - d.sx, e.clientY - d.sy));
        if (gameState === 'playing') touchDX += dx / r.width * config.canvasWidth * 1.15; // 指の移動量＝自機の移動量
    });
    const end = e => {
        const d = drag.get(e.pointerId); if (!d) return;
        drag.delete(e.pointerId);
        if (e.type === 'pointerup' && d.moved < 14) tapQueue.push(toHud(e));
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
    const hold = (id, set) => {
        const el = document.getElementById(id);
        const on = e => { e.preventDefault(); wake(); el.classList.add('down'); set(true); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
        const off = () => { el.classList.remove('down'); set(false); };
        el.addEventListener('pointerdown', on);
        el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
    };
    hold('t-shot', v => { touchShot = v; });
    const mt = document.getElementById('m-tools'); mt.append(document.getElementById('swap-button'), document.getElementById('langSel'));
    document.getElementById('m-tbtn').addEventListener('click', e => { e.stopPropagation(); tapTitleReq = true; });
    document.getElementById('m-pause').addEventListener('click', () => { if (gameState === 'playing' || gameState === 'paused') tapPauseReq = true; });
    document.getElementById('pause-button').addEventListener('click', () => { if (gameState === 'playing' || gameState === 'paused') tapPauseReq = true; });
    // 左右入れ替えボタン: スマホの絵の中で、SHOTボタンが今どちら側にあるかを表示
    const swapBtn = document.getElementById('swap-button');
    const drawSwap = () => {
        const left = tui.classList.contains('left');
        swapBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><circle cx="${left ? 9.5 : 14.5}" cy="16.5" r="2.4" fill="currentColor" stroke="none"/></svg>`;
    };
    drawSwap();
    swapBtn.addEventListener('click', () => {
        const left = tui.classList.toggle('left');
        try { localStorage.setItem('cometPlusBtnLeft', left ? '1' : '0'); } catch (e) {}
        drawSwap();
    });
    // 画面全体に収まるように縮小、横向きでは案内を出して一時停止
    const fit = () => {
        const land = innerWidth > innerHeight;
        document.body.classList.toggle('landscape', land);
        if (land && gameState === 'playing') pauseGame();
        const w = document.getElementById('game-wrapper');
        w.style.setProperty('--fit', Math.min(innerWidth / HUD_W, innerHeight / HUD_H));
    };
    addEventListener('resize', fit); addEventListener('orientationchange', fit); fit();
    // プレイ中だけボタンを出す
    let lastState = '';
    setInterval(() => {
        if (gameState === lastState) return; lastState = gameState;
        document.body.classList.toggle('in-play', gameState === 'playing' || gameState === 'paused');
        document.body.classList.toggle('on-title', gameState === 'title');
        document.body.classList.toggle('show-tbtn', gameState === 'paused' || gameState === 'gameOver');
        if (gameState !== 'playing') { touchShot = touchSlow = false; touchDX = 0; document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('down')); }
    }, 100);
    document.documentElement.style.setProperty('--tb', '#00ccff');
}
applyLang();
init();
// 先読み: ボス・敵・タイトル用モデルを作ってシェーダーを事前にコンパイルしておく（ゲーム中に初登場した瞬間のカクつき防止）
function prewarmGPU() {
    if (!gl3dOK) return;
    try {
        for (let i = 0; i < BOSS_BUILDERS.length; i++) buildDemo(i);
        const tmp = new THREE.Scene();
        BOSS_BUILDERS.forEach(f => {
            const o = f();
            o.traverse(c => { if (c.material) applyMosaic(c.material); });
            (o.userData.extra || []).forEach(e => { scene.remove(e); o.add(e); });
            tmp.add(o);
        });
        ['ufo', 'invader', 'looper'].forEach(t => { const o = makeMonsterObj({ type: t }); scene.remove(o); tmp.add(o); });
        prewarmGPU.keep = tmp;
        const hidden = [];
        scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
        renderer.compile(scene, camera);
        renderer.compile(tmp, camera, scene);
        hidden.forEach(o => { o.visible = false; });
    } catch (e) { console.warn('prewarm failed', e); }
}
prewarmGPU();
requestAnimationFrame(gameLoop);
