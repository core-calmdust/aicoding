          <div class="card" id="spdExtra"></div>
        </div>
        <div class="card" id="spdCal"></div>
      </div>

          <button class="tool" id="tAuto"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M16 12h.01M8 16h.01M12 16h.01" stroke-width="3"/><path d="M12 12h.01" stroke-width="3" opacity=".3"/></svg><span data-i18n="t.auto">自動メモ</span><i class="badge" id="autoN">3</i></button>

        </div>
        <div class="pad" id="pad"></div>
        <div class="help" id="kbHelp"></div>
      </div>
    </section>
  </main>
