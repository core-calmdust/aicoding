<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ur rules tour demo</title>
<style>
  :root{--text:#efe8d6;--muted:#a9a6c4;--line:rgba(255,255,255,.12);--accent:#e8c66a;--panel2:#1f2a5a}
  html,body{margin:0;height:100%;background:#0d1433;color:var(--text);font:14px 'Zen Kaku Gothic New',system-ui,sans-serif}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px 16px;background:rgba(5,8,25,.6)}
  .modal{width:min(480px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:linear-gradient(180deg,#1b2557,#121a40);border:1px solid rgba(232,198,106,.35);border-radius:18px;padding:16px;box-sizing:border-box}
  .ls-tabs{display:flex;gap:4px;margin-bottom:10px}.ls-tabs button{flex:1;padding:7px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted);font:inherit}
  .ls-tabs button.sel{background:var(--panel2);color:var(--accent)}
  #rulesBody{flex:1;min-height:0;display:flex;flex-direction:column}
  #rulesBody > .rt{flex:1;min-height:0}
  @media (max-width:520px){.overlay{padding:6px}.modal{padding:12px 10px}}
  @media (hover: hover) and (pointer: fine) and (min-width: 820px){
    #rulesOverlay .modal{width:min(1000px, calc(100vw - 64px));height:min(880px, calc(100vh - 20px));max-height:calc(100vh - 20px);padding:16px 28px 18px}
    #rulesOverlay .ls-tabs{margin-bottom:12px}
  }
</style></head>
<body>
<div class="overlay show" id="rulesOverlay">
  <div class="modal">
    <div class="ls-tabs"><button class="sel">ルール</button><button>レッスン</button><button>パズル</button></div>
    <div id="rulesBody"></div>
  </div>
</div>
<script src="../../shared/ruletour.js"></script>
<script src="../engine.js"></script>
<script src="../board2d.js"></script>
<script src="../tour.js"></script>
<script>
/* ?lang=ja&page=0&design=museum&pieces=orig */
const q = new URLSearchParams(location.search), L = q.get('lang') || 'ja';
document.documentElement.lang = L; if (L === 'ar') document.documentElement.dir = 'rtl';
window.__log = [];
UrTour.open({ mount: '#rulesBody', lang: () => L, design: q.get('design') || 'museum', pieces: q.get('pieces') || 'orig', page: +(q.get('page') || 0),
  onPlay: () => __log.push('play'), onLessons: () => __log.push('lessons'), onClose: () => __log.push('close'), sound: k => __log.push('snd:' + k), speed: +(q.get('speed') || 1) });
</script>
</body></html>
