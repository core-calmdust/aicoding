<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="../shared/latinfs.js?v=1l14"></script>
<meta name="theme-color" content="#130f22">
<meta name="description" content="インド生まれの「パチーシ」と、そこから生まれた世界的な「ルード」。2〜4人で遊べるすごろく。サイコロのルードと、タカラガイを投げる十字盤のパチーシ。AI（Lv.1–20）と対戦。">
<title>ルード・パチーシ — 世界のボドゲ大百科</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23130f22'/%3E%3Crect x='6' y='6' width='22' height='22' rx='4' fill='%23e2403a'/%3E%3Crect x='36' y='6' width='22' height='22' rx='4' fill='%23f2c12e'/%3E%3Crect x='6' y='36' width='22' height='22' rx='4' fill='%232fa65a'/%3E%3Crect x='36' y='36' width='22' height='22' rx='4' fill='%232f7ad8'/%3E%3C/svg%3E">
<meta property="og:title" content="ルード・パチーシ — インド生まれのすごろく">
<meta property="og:description" content="サイコロのルードと、タカラガイを投げる十字盤のパチーシ。2〜4人、AI対戦。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://core-calmdust.github.io/aicoding/ludo/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================================================================ ルード・パチーシ — 藍の夜にマリーゴールドと朱（インドの更紗） */
:root{
  --bg:#130f22; --bg2:#1b1630; --panel:#1d1834; --panel2:#272046; --line:#3d3466;
  --text:#f3eefe; --muted:#c3b8e6; --dim:#8a7fb2;
  --accent:#f4b042; --accent2:#c27b14; --rose:#e2507a; --good:#7fd6a4; --red:#ff7a66;
  --pad:16px; --side:360px;
  --font:'Zen Kaku Gothic New','Noto Sans Devanagari','Noto Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 700px at 25% -10%, #2c2160 0%, transparent 60%), radial-gradient(900px 600px at 110% 110%, #3a1730 0%, transparent 60%), var(--bg);min-height:100lvh}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.app{display:flex;flex-direction:column;gap:8px;padding:10px var(--pad) 24px;max-width:1500px;margin:0 auto}
/* ---------- brand / menu (phones: on top; PC: HeaderBar moves them into the bar) ---------- */
.side,.top{display:flex;flex-direction:column;gap:8px;min-width:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-l{min-width:0}
.series{display:block;font-size:11px;letter-spacing:.14em;color:var(--dim);text-decoration:none}
.brand h1{margin:2px 0 0;font-family:'Cormorant Garamond','Shippori Mincho B1',serif;font-size:26px;font-weight:700;letter-spacing:.06em;line-height:1.1;color:#fff;white-space:nowrap}
.brand h1 small{font-size:15px;margin-left:8px;color:var(--accent);letter-spacing:.08em}
.brand-r{display:flex;align-items:center;gap:6px}
.snd{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);text-decoration:none}
.snd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd.off .on-w{display:none}.snd:not(.off) .off-x{display:none}
#langSel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:0 8px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.controls{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:linear-gradient(180deg,#f6c25c,#e09a2a);border-color:#f8d07e;color:#2a1600;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
/* ---------- board ---------- */
.board-area{display:flex;justify-content:center;align-items:center;padding:6px 0}
.frame{position:relative;width:min(100%, calc(100lvh - 260px), 760px);aspect-ratio:1;min-width:280px}
#bsvg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
#bsvg .pc{cursor:default;transition:filter .15s}
#bsvg .pc.can{cursor:pointer}
#bsvg .pc.can .pcg{animation:bob 1s ease-in-out infinite}
#bsvg .pc.hint .pcg{filter:drop-shadow(0 0 .25px #fff) drop-shadow(0 0 .35px var(--accent))}
@keyframes bob{50%{transform:translateY(-.12px)}}
#bsvg .dest{cursor:pointer}
#bsvg .dest circle{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
#bsvg .cnt{font:700 .34px var(--font);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:.06px}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);padding:10px 22px;border-radius:999px;background:rgba(19,15,34,.9);border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* ---------- players ---------- */
.seats{display:flex;flex-direction:column;gap:6px;padding:8px}
.seat{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.03)}
.seat.on{border-color:var(--accent);background:rgba(244,176,66,.1);box-shadow:0 0 0 1px rgba(244,176,66,.3) inset}
.seat .dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.15)}
.seat .nm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sb{font-size:12px;color:var(--muted)}
.seat .hm{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.seat .tm{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
/* ---------- the throw ---------- */
.throw{display:flex;align-items:center;gap:12px;padding:10px 12px}
.throw .shown{width:76px;height:76px;flex:none;display:grid;place-items:center}
.throw .shown.cw{width:120px;height:80px}
.throw .shown svg{width:100%;height:100%;display:block}
.throw .shown.roll svg{animation:shake .45s ease-in-out}
@keyframes shake{20%{transform:rotate(-14deg) translateY(-6px)}45%{transform:rotate(10deg)}70%{transform:rotate(-5deg) translateY(-2px)}}
.throw .tv{flex:1;min-width:0}
.throw .val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--accent);line-height:1}
.throw .vsub{font-size:12px;color:var(--muted);margin-top:3px}
.throw .acts{display:flex;flex-direction:column;gap:6px}
.rollbtn{height:46px;min-width:108px;padding:0 16px;border-radius:13px;border:1px solid #f8d07e;background:linear-gradient(180deg,#f6c25c,#e09a2a);color:#2a1600;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #9a6410}
.rollbtn:disabled{filter:grayscale(.7);opacity:.5;cursor:default;box-shadow:none}
.passbtn{height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:13px}
.status{font-size:14px;color:var(--muted);padding:2px 4px;min-height:22px}
.kifu-card .label{font-size:12px;letter-spacing:.12em;color:var(--dim)}
.kifu{max-height:180px;overflow-y:auto;font-size:13px;line-height:1.7;margin-top:6px;display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted)}
.kifu .k{white-space:nowrap}.kifu .k i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:1px}
/* ---------- PC: board left, info right ---------- */
@media (min-width:1040px) and (min-aspect-ratio:3/4){
  .app{display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-areas:"top top" "board side";gap:18px 24px;align-items:start;padding-top:18px}
  .top{grid-area:top}
  html.hb-on .top{display:none}
  .board-area{grid-area:board;position:sticky;top:12px}
  .side{grid-area:side}
  .frame{width:min(100%, calc(100vh - 110px), 860px)}
  html.hb-on .frame{width:min(100%, calc(100vh - var(--hb-h, 56px) - 70px), 860px)}
}
/* ---------- dialogs ---------- */
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(8,6,16,.62);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(720px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:linear-gradient(180deg,#2a2348,#1b1631);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.modal h2{margin:0 0 14px;font-size:20px;font-family:'Shippori Mincho B1','Cormorant Garamond',serif;letter-spacing:.06em}
.field{margin:0 0 14px}
.field > label{display:block;font-size:12px;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:#2a1600;font-weight:700}
.seg button:disabled{opacity:.35;cursor:default}
.ng-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.ng-cols{grid-template-columns:1fr;gap:0}}
.ngt-gcards{display:grid;grid-template-columns:repeat(var(--ngt-cols,2),minmax(0,1fr));gap:10px}
.ngt-gcard{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
.ngt-gcard.sel{border-color:var(--accent);background:rgba(244,176,66,.1)}
.ngt-gcard .gart{height:96px;border-radius:10px;overflow:hidden;background:#0d0a18;display:grid;place-items:center}
.ngt-gcard .gart svg{width:78%;height:auto;max-height:100%}
.ngt-gcard b{font-size:16px}.ngt-gcard p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.level-wrap{display:flex;align-items:center;gap:12px}
.level-wrap input{flex:1;accent-color:var(--accent)}
.level-name{min-width:64px;text-align:right;font-weight:700;color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--muted)}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;line-height:1.5}
.checks input{accent-color:var(--accent);margin-top:3px}
.dsg{display:flex;gap:10px}
.dsg button{width:92px;padding:6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.dsg button.on{border-color:var(--accent);color:var(--text)}
.dsg button svg{width:76px;height:76px;border-radius:8px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.mbtn{height:44px;min-width:120px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:15px;font-weight:600}
.mbtn.go{background:linear-gradient(180deg,#f6c25c,#e09a2a);border-color:#f8d07e;color:#2a1600;font-weight:800}
.result-big{font-family:'Shippori Mincho B1','Cormorant Garamond',serif;font-size:30px;text-align:center;margin:6px 0 4px}
.result-sub{text-align:center;color:var(--muted);margin-bottom:10px}
.result-dots{display:flex;justify-content:center;gap:8px;margin-bottom:4px}
.result-dots i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
#resultOverlay .modal{width:min(440px,100%)}
html[dir=rtl] .ngt-gcard{text-align:right}
/* ---------- learning ---------- */
.lmodal{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px) and (min-height:561px){.lmodal{width:min(1000px,calc(100vw - 64px));height:min(880px,calc(100dvh - 32px))}}
@media not all and (min-width:900px) and (min-height:561px){.lmodal{width:100%;height:calc(100dvh - 20px)}}
#learnBody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
#rulesBody{flex:1;min-height:0;display:flex;flex-direction:column}
#rulesBody > .rt{flex:1;min-height:0}
.ls-rule{width:min(320px,100%)}
.lclose{margin-top:0}
.ls-cat{margin:6px 0 8px;font-size:13px;letter-spacing:.12em;color:var(--dim)}
.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media (max-width:640px){.ls-grid{grid-template-columns:1fr}}
.ls-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;text-align:start}
.ls-card.pass{border-color:rgba(127,214,164,.6)}
.ls-ic{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.ls-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}.ls-tx b{font-size:15.5px}.ls-tx small{font-size:12.5px;color:var(--muted);line-height:1.5}
.ls-sc{font-size:12.5px;color:var(--good);white-space:nowrap}
.pz-head{color:var(--muted);font-size:13px;margin:4px 0 10px}
.pz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.pz-t{height:64px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pz-t b{font-size:17px}.pz-t small{font-size:10px;color:var(--accent);letter-spacing:-.05em}
.pz-t.done{border-color:rgba(127,214,164,.7);background:rgba(127,214,164,.1)}
.lsbar{display:flex;flex-direction:column;gap:8px;border-color:var(--accent)}
.ls-h{display:flex;align-items:center;justify-content:space-between;gap:10px}.ls-h b{font-size:16px}
.ls-dots{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--accent)}.ls-dots span{color:var(--muted);margin-right:6px}
.ls-dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.15)}.ls-dots i.cur{background:var(--accent)}.ls-dots i.ok{background:var(--good)}.ls-dots i.half{background:#e6c35c}.ls-dots i.ng{background:var(--red)}
.ls-task{font-size:14px;color:var(--muted);line-height:1.6}
.ls-msg{font-size:15px;font-weight:700;line-height:1.55}.ls-msg.ok{color:var(--good)}.ls-msg.ng{color:#ffb39c}.ls-msg small{font-weight:400;color:var(--muted);font-size:13px}.ls-msg .pts{margin-left:6px;color:var(--accent)}
.ls-final{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;display:flex;align-items:baseline;gap:12px}.ls-final small{font-family:var(--font);font-size:15px;color:var(--muted)}.ls-final.ok{color:var(--good)}
.ls-acts{display:flex;gap:8px;justify-content:flex-end}
body.in-learn #players, body.in-learn .kifu-card, body.in-learn #status{display:none}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-l"><a class="series" href="../" data-i18n="series"></a><h1><span data-i18n="title"></span><small data-i18n="sub"></small></h1></div>
      <span class="brand-r"><button id="btnSound" class="snd" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on-w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off-x" d="M16 9l6 6M22 9l-6 6"/></svg></button><select id="langSel" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="zh-TW">繁體中文</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="id">Indonesian</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select><a href="../" class="snd home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a></span>
    </div>
    <div class="card controls">
      <button class="btn primary" id="btnNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="btn.new"></span></button>
      <button class="btn" id="btnUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="btn.undo"></span></button>
      <button class="btn" id="btnResign"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg><span></span></button>
      <button class="btn" id="btnHint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg><span data-i18n="btn.hint"></span></button>
      <button class="btn" id="btnRules"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 8h8M8 12h6"/></svg><span data-i18n="btn.rules"></span></button>
      <button class="btn" id="btnLesson"><svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg><span data-i18n="btn.lesson"></span></button>
      <button class="btn" id="btnPuzzle"><svg viewBox="0 0 24 24"><path d="M9 3h6v3a2 2 0 1 0 4 0h2v6h-3a2 2 0 1 0 0 4h3v5H9v-3a2 2 0 1 0-4 0v3H3V9h3a2 2 0 1 0 0-4H3V3z"/></svg><span data-i18n="btn.puzzle"></span></button>
    </div>
  </header>
  <div class="board-area" id="boardArea">
    <div class="frame" id="frame">
      <svg id="bsvg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <aside class="side">
    <div class="card lsbar hidden" id="lsBar"></div>
    <div class="card throw" id="throwCard">
      <div class="shown" id="shown"></div>
      <div class="tv"><div class="val" id="tval">—</div><div class="vsub" id="tsub"></div></div>
      <div class="acts"><button class="rollbtn" id="btnRoll"></button><button class="passbtn hidden" id="btnPass" data-i18n="btn.pass"></button></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="card seats" id="players"></div>
    <div class="card kifu-card"><div class="label" data-i18n="kifu"></div><div class="kifu" id="kifu"></div></div>
  </aside>
</div>

<!-- new game -->
<div class="overlay" id="newOverlay">
  <div class="modal">
    <h2 data-i18n="ng.title"></h2>
    <div class="field" id="fRules" data-ng="game">
      <label data-i18n="ng.rule"></label>
      <div class="ngt-gcards few" id="ruleCards" style="--ngt-cols:2"></div>
    </div>
    <div class="field" id="fMode">
      <label data-i18n="ng.mode"></label>
      <div class="seg" id="segMode"><button data-v="ai" data-i18n="ng.ai"></button><button data-v="pvp" data-i18n="ng.pvp"></button><button data-v="watch" data-i18n="ng.watch"></button></div>
    </div>
    <div class="ng-cols"><div class="ng-col">

      <div class="field" id="fDesign" data-ng="design"><label data-i18n="bd.title"></label><div class="dsg" id="bdRow"></div></div>
    </div></div>
    <div class="modal-actions"><button class="mbtn" id="btnCancelNew" data-i18n="close"></button><button class="mbtn go" id="btnStart" data-i18n="start"></button></div>
