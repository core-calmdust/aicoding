<style>
/* ================================================================ ルドー・パチーシ — 藍の夜にマリーゴールドと朱（インドの更紗） */
:root{
  --bg:#130f22; --bg2:#1b1630; --panel:#1d1834; --panel2:#272046; --line:#3d3466;
  --text:#f3eefe; --muted:#c3b8e6; --dim:#8a7fb2;
  --accent:#f4b042; --accent2:#c27b14; --rose:#e2507a; --good:#7fd6a4; --red:#ff7a66;
  --pad:16px; --side:360px;
  --font:'Zen Kaku Gothic New','Noto Sans Devanagari','Noto Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 700px at 25% -10%, #2c2160 0%, transparent 60%), radial-gradient(900px 600px at 110% 110%, #3a1730 0%, transparent 60%), var(--bg);min-height:100lvh}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.app{display:flex;flex-direction:column;gap:8px;padding:10px var(--pad) 24px;max-width:1500px;margin:0 auto}
/* ---------- brand / menu (phones: on top; PC: HeaderBar moves them into the bar) ---------- */
.side,.top{display:flex;flex-direction:column;gap:8px;min-width:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-l{min-width:0}
.series{display:block;font-size:11px;letter-spacing:.14em;color:var(--dim);text-decoration:none}
.brand h1{margin:2px 0 0;font-family:'Cormorant Garamond','Shippori Mincho B1',serif;font-size:26px;font-weight:700;letter-spacing:.06em;line-height:1.1;color:#fff;white-space:nowrap}
.brand h1 small{font-size:15px;margin-left:8px;color:var(--accent);letter-spacing:.08em}
.brand-r{display:flex;align-items:center;gap:6px}
.snd{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);text-decoration:none}
.snd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd.off .on-w{display:none}.snd:not(.off) .off-x{display:none}
#langSel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:0 8px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 14px}
/* menu (common spec: one row under the title on phones, icon above a short label — same as senet / shogi) */
.controls{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;padding:8px}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.btn.primary{color:var(--text);border-color:rgba(244,176,66,.5)}
@media (pointer: coarse) and (max-width: 760px){.controls .btn{font-size:10.5px;padding:7px 0}.controls .btn svg{width:18px;height:18px}.board-area{padding:0}}
.btn:disabled{opacity:.45;cursor:default}
/* ---------- board ---------- */
.board-area{display:flex;justify-content:center;align-items:center;padding:6px 0}
.frame{position:relative;width:min(100%, calc(100lvh - 260px), 760px);aspect-ratio:1;min-width:280px}
#bsvg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
#frame.zoomed #bsvg{overflow:hidden;border-radius:12px}
.zbtn{position:absolute;z-index:3;right:6px;top:6px;width:38px;height:38px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.9);color:#2b2540;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer}.zbtn svg{width:20px;height:20px}.zbtn[hidden]{display:none}.zbtn.off{color:#e0662a}
#bsvg .pc{cursor:default;transition:filter .15s}
#bsvg .pc.can{cursor:pointer}
#bsvg .pc.can .pcg{animation:bob 1s ease-in-out infinite}
#bsvg .pc.hint .pcg{filter:drop-shadow(0 0 .25px #fff) drop-shadow(0 0 .35px var(--accent))}
@keyframes bob{50%{transform:translateY(-.12px)}}
/* the dice cup (app.js cupDraw) */
#bsvg #gCup .cup{transform-box:fill-box;transform-origin:50% 90%}
#bsvg #gCup .cup.ready{cursor:pointer;animation:cupBob 1.1s ease-in-out infinite}
#bsvg #gCup .cup.ready .cupb{filter:drop-shadow(0 0 .08px #fff) drop-shadow(0 0 .22px #ffd36b)}
#bsvg #gCup .cup.slide{animation:cupSlide .38s cubic-bezier(.3,.7,.3,1)}
#bsvg #gCup .cup.ready.slide{animation:cupSlide .38s cubic-bezier(.3,.7,.3,1),cupBob 1.1s ease-in-out .38s infinite}
#bsvg #gCup .cup.shake{animation:cupShake calc(.21s * var(--k,1)) ease-in-out infinite}
#bsvg #gCup .cup.flip{transform-origin:50% 50%;animation:cupFlip calc(.26s * var(--k,1)) cubic-bezier(.5,0,.6,1) forwards}
#bsvg #gCup .cup.down{animation:cupDown calc(.17s * var(--k,1)) ease-out}
#bsvg #gCup .cup.lift{animation:cupLift calc(.45s * var(--k,1)) cubic-bezier(.3,.6,.3,1) forwards;pointer-events:none}
#bsvg #gCup .cupd{animation:cupDice .35s ease-out}
@keyframes cupBob{50%{transform:translateY(-.1px) scale(1.04)}}
@keyframes cupSlide{from{transform:translate(var(--dx),var(--dy)) scale(.7);opacity:.4}}
@keyframes cupShake{0%{transform:translateY(-.25px) rotate(0)}25%{transform:translate(-.12px,-.4px) rotate(-16deg)}50%{transform:translateY(-.3px) rotate(0)}75%{transform:translate(.12px,-.4px) rotate(16deg)}100%{transform:translateY(-.25px) rotate(0)}}
@keyframes cupFlip{0%{transform:translateY(-.25px) rotate(0)}45%{transform:translateY(-.75px) rotate(100deg)}100%{transform:translateY(0) rotate(180deg)}}
@keyframes cupDown{0%{transform:scale(1.08,.88)}60%{transform:scale(.97,1.04)}100%{transform:none}}
@keyframes cupLift{0%{transform:translateY(-.25px)}100%{transform:translate(.75px,-1.05px) rotate(28deg) scale(.82);opacity:0}}
@keyframes cupDice{from{transform:scale(.6);opacity:0}}
#bsvg #gCup .cuphint{pointer-events:none}
#bsvg #gCup .cuphint .chb{transform-box:fill-box;transform-origin:50% 100%;animation:chIn .35s cubic-bezier(.3,1.4,.5,1) both,chFloat 1.8s ease-in-out .35s infinite}
#bsvg #gCup .cuphint .chr{fill:#fffdf6;stroke:#f0b43c;stroke-width:.035;stroke-linejoin:round}
#bsvg #gCup .cuphint .chb{filter:drop-shadow(0 .05px .08px rgba(60,40,10,.35))}
#bsvg #gCup .cuphint .chx{font-size:.33px;font-weight:900;fill:#3a2a10;font-family:inherit}
@keyframes chIn{from{transform:translateY(.2px) scale(.6);opacity:0}}
@keyframes chFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-.12px)}}
#bsvg .dest{cursor:pointer}
#bsvg .dest circle{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
#bsvg .cnt{font:700 .34px var(--font);fill:#fff;paint-order:stroke;stroke:#000;stroke-width:.06px}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);padding:10px 22px;border-radius:999px;background:rgba(19,15,34,.9);border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* ---------- players ---------- */
.seats{display:flex;flex-direction:column;gap:6px;padding:8px}
.seat{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.03)}
.seat.on{border-color:var(--accent);background:rgba(244,176,66,.1);box-shadow:0 0 0 1px rgba(244,176,66,.3) inset}
.seat .dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.15)}
.seat .nm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sb{font-size:12px;color:var(--muted)}
.seat .hm{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.seat .tm{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
/* the players card is compact (common spec): one line per seat — name, colour in small, home count */
.seat > div{display:flex;align-items:baseline;gap:7px;min-width:0}
.seats{gap:3px;padding:6px}
.seat{padding:5px 9px}
.seat .dot{width:16px;height:16px}
.seat .nm{font-size:14px}
html.hb-on .throw .shown:not(.cw){width:60px;height:60px}html.hb-on .throw .shown.cw{width:104px;height:66px}html.hb-on .throw{padding:8px 12px}
/* ---------- the throw ---------- */
.throw{display:flex;align-items:center;gap:12px;padding:10px 12px}
.throw .shown{width:76px;height:76px;flex:none;display:grid;place-items:center}
.throw .shown.cw{width:120px;height:80px}
.throw .shown svg{width:100%;height:100%;display:block}
.throw .shown.roll svg{animation:shake .45s ease-in-out}
@keyframes shake{20%{transform:rotate(-14deg) translateY(-6px)}45%{transform:rotate(10deg)}70%{transform:rotate(-5deg) translateY(-2px)}}
.throw .tv{flex:1;min-width:0}
.throw .val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--accent);line-height:1}
.throw .vsub{font-size:12px;color:var(--muted);margin-top:3px}
.throw .acts{display:flex;flex-direction:column;gap:6px}
.rollbtn{height:46px;min-width:108px;padding:0 16px;border-radius:13px;border:1px solid #f8d07e;background:linear-gradient(180deg,#f6c25c,#e09a2a);color:#2a1600;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #9a6410}
.rollbtn:disabled{filter:grayscale(.7);opacity:.5;cursor:default;box-shadow:none}
.passbtn{height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:13px}
.status{font-size:14px;color:var(--muted);padding:2px 4px;min-height:22px}
.kifu-card .label{font-size:12px;letter-spacing:.12em;color:var(--dim)}
.kifu{max-height:180px;overflow-y:auto;font-size:13px;line-height:1.7;margin-top:6px;display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted)}
.kifu .k{white-space:nowrap}.kifu .k i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:1px}
/* ---------- PC: board left, info right (common spec: the board as large as the window allows, the board + the 360px info column
   centred together, the info column exactly as tall as the board; the online dock's 46px bar along the bottom) ---------- */
@media (min-width:1040px) and (min-aspect-ratio:3/4){
  .app{display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-areas:"top top" "board side";gap:18px 24px;align-items:start;padding-top:18px}
  .top{grid-area:top}
  .board-area{grid-area:board;position:sticky;top:12px}
  .side{grid-area:side}
  .frame{width:min(100%, calc(100vh - 110px), 860px)}
  html:is(.hb-on,.hb-atlas){--vh:calc(100vh - var(--hb-h, 56px));--bd:min(calc(var(--vh) - 40px), calc(100vw - var(--side) - 24px - 64px), 1040px)}
  html:is(.hb-on,.hb-atlas).ol-dock{--vh:calc(100vh - var(--hb-h, 56px) - 46px)}
  @supports (height:100dvh){html:is(.hb-on,.hb-atlas){--vh:calc(100dvh - var(--hb-h, 56px))}html:is(.hb-on,.hb-atlas).ol-dock{--vh:calc(100dvh - var(--hb-h, 56px) - 46px)}}
  html:is(.hb-on,.hb-atlas) body{overflow:hidden}
  html:is(.hb-on,.hb-atlas) .top{display:none}
  html:is(.hb-on,.hb-atlas) .app{max-width:none;margin:0;height:var(--vh);grid-template-columns:var(--bd) var(--side);grid-template-areas:"board side";justify-content:center;align-content:center;align-items:stretch;gap:0 24px;padding:20px 32px}
  html:is(.hb-on,.hb-atlas) .board-area{position:static;padding:0;align-self:center}
  html:is(.hb-on,.hb-atlas) .frame{width:var(--bd);min-width:0}
  html:is(.hb-on,.hb-atlas) .side{height:var(--bd);max-height:var(--bd);align-self:center;overflow-y:auto;overscroll-behavior:contain}
  html:is(.hb-on,.hb-atlas) .side > *{flex:none}
  html:is(.hb-on,.hb-atlas) .side > :is(#coachCard, .review-card.show){flex:1 1 auto;min-height:140px;overflow-y:auto}
  html:is(.hb-on,.hb-atlas) .kifu{max-height:96px}
  html:is(.hb-on,.hb-atlas) .graph{height:40px}
  /* the portal skin (?skin=atlas): its bar is 64px, and the 3D board's wooden frame reaches a little past the SVG board */
  html.hb-atlas{--hb-h:64px;--bd:min(calc(var(--vh) - 84px), calc(100vw - var(--side) - 24px - 120px), 1000px)}
}
/* ---------- the online dock (online-soon.js): 準備中 — a bar along the bottom off touch screens; phones: the オンライン tab ---------- */
.dock{display:none}
@media not all and (pointer: coarse){
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;height:46px;background:linear-gradient(180deg,#221b3d,#130f22);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.4)}
}
.dock-bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 18px;cursor:pointer;flex:1;min-width:0}
.dk-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dk-title{font-size:13px;letter-spacing:.08em;white-space:nowrap;font-weight:700}
.dk-stat{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dk-sp{flex:1}
.dk-btn{font-size:12.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);white-space:nowrap;flex:none}
.dk-btn:hover{border-color:var(--accent)}
@media (pointer: coarse){
  body:not(.no-online) .mtabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(50px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
  .mtabs button{flex:1;font-size:13px;letter-spacing:.06em}
  body:not(.no-online) .app{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
}
#olSoon p{font-size:14.5px;line-height:1.8;color:var(--muted);margin:0 0 10px}#olSoon .ols-1{color:var(--text);font-weight:600}
/* ---------- dialogs ---------- */
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(8,6,16,.62);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(720px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:linear-gradient(180deg,#2a2348,#1b1631);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.modal h2{margin:0 0 14px;font-size:20px;font-family:'Shippori Mincho B1','Cormorant Garamond',serif;letter-spacing:.06em}
.field{margin:0 0 14px}
.field > label{display:block;font-size:12px;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:#2a1600;font-weight:700}
.seg button:disabled{opacity:.35;cursor:default}
.ng-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.ng-cols{grid-template-columns:1fr;gap:0}}
.ngt-gcards{display:grid;grid-template-columns:repeat(var(--ngt-cols,2),minmax(0,1fr));gap:10px}
@media (hover: hover) and (pointer: fine) and (min-width: 820px){
  #newOverlay .modal{width:min(980px, calc(100vw - 64px))!important;max-width:none!important;padding:20px 28px 18px}   /* (common: the wide dialog of the other games) */
}
.ngt-gcard{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
.ngt-gcard.sel{border-color:var(--accent);background:rgba(244,176,66,.1)}
.ngt-gcard .gart{height:96px;border-radius:10px;overflow:hidden;background:#0d0a18;display:grid;place-items:center}
.ngt-gcard .gart svg{width:78%;height:auto;max-height:100%}
.ngt-gcard b{font-size:16px}.ngt-gcard p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.level-wrap{display:flex;flex-direction:column-reverse;gap:6px}
.level-wrap input{width:100%;margin:0;accent-color:var(--accent);height:32px;touch-action:pan-y}
.level-name{font-weight:700;color:var(--accent);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:22px}
.level-name small{font-weight:400;font-size:11px;color:var(--dim)}
.checks{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--muted)}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;line-height:1.5}
.checks input{accent-color:var(--accent);margin-top:3px}
.dsg{display:flex;flex-wrap:wrap;gap:10px}
.dsg button{width:92px;padding:6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.dsg button.on{border-color:var(--accent);color:var(--text)}
.dsg button svg{width:76px;height:76px;border-radius:8px}
/* (2026-11-10) the Luxury dialog (shared/nglux.js): on PC the デザイン tab's boards are its big picture tiles (the grid of nglux) —
   no fixed width here; the ゲーム tab's two boards drawn big in their cards */
#newOverlay > .modal.ngl.ngt-pc #bdRow.dsg > button{width:auto}
#newOverlay > .modal.ngl.ngt-pc #bdRow.dsg > button svg{width:100%;height:auto;aspect-ratio:1/1}

.lx-t{font-family:"Shippori Mincho B1",serif;font-size:15px}
.lx-sub{font-size:12px;color:var(--accent);opacity:.9}
.lx-desc{font-size:12px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lx-card .lx-bar{margin-top:auto;height:4px}
@media (min-width: 900px) and (min-height: 561px){ .lx-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .lx-desc{-webkit-line-clamp:3} .lx-th{width:150px} }
@media (max-width:560px){ .ls-cats button{flex-direction:column;gap:2px;padding:7px 4px;font-size:11.5px} .ls-cats button .ic{width:22px;height:22px} .lx-banner{flex-wrap:wrap;padding:10px 12px} .lx-banner .pg{width:100%;text-align:start} .lx-th{width:104px} }
/* mini boards cut out of the board: the cut sides fade out */
.mb{display:block;position:relative}
.mb > svg{display:block;width:100%;height:auto;border-radius:8px}
.mb.cut-l > svg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%);mask-image:linear-gradient(90deg,transparent,#000 14%)}
.mb.cut-r > svg{-webkit-mask-image:linear-gradient(270deg,transparent,#000 14%);mask-image:linear-gradient(270deg,transparent,#000 14%)}
.mb.cut-l.cut-r > svg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
/* puzzle home: bigger boards */
#pzLevels .pbh-th .pbh-bd{width:100%!important;max-width:220px}
@media (max-width:560px){ #pzLevels .pbh-th{width:132px!important} }
#pzLevels .pbh-bd > .mb > svg{max-height:none}
#pzLevels .pbh-daily .th{width:110px}
#pzLevels .pbh-daily .th .mb > svg{max-height:none;box-shadow:none}
#pzGrid .pb-tile .th .mb > svg{border-radius:4px}
.lesson-intro{font-size:14px;line-height:1.85;color:var(--text)}
.lesson-intro p{margin-bottom:8px}
.lesson-intro b{color:var(--accent)}
.lesson-intro .dg{max-width:520px;margin:10px auto}
.pz-grid,#pzGrid{margin-top:8px}
.pb-tile .th svg{display:block;width:100%;height:auto}

.ls-lead{font-size:13px;color:var(--muted);margin:-8px 0 14px;line-height:1.7}
.ls-rule{width:min(320px,100%);margin:-6px 0 10px}
.overlay .modal h2{margin:0 0 12px}
.hidden{display:none!important}
.lesson-card,.puzzle-card{border-color:var(--accent)}
body:is(.in-lesson,.in-puzzle) #players, body:is(.in-lesson,.in-puzzle) .kifu-card, body:is(.in-lesson,.in-puzzle) #status, body:is(.in-lesson,.in-puzzle) #coachCard, body:is(.in-lesson,.in-puzzle) #reviewCard{display:none}
body:is(.in-lesson,.in-puzzle) .side > :is(.lesson-card,.puzzle-card){order:-1}
.pz-dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
@media (max-width:560px){.ls-cats{grid-auto-flow:row;grid-template-columns:1fr 1fr}.ls-cats button{flex-direction:row!important;justify-content:flex-start;padding:7px 8px!important}.ls-cats button .nm{flex:1;text-align:start}}

</style>

        <button data-n="first"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 6 10 12l8 6z"/></svg></button>
        <button data-n="prev"><svg viewBox="0 0 24 24"><path d="M15 6 8 12l7 6z"/></svg></button>
        <button data-n="play" id="navPlay"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
