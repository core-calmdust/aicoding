<!doctype html>
<!-- Dev tool: the pictures of the shogi 3D boards (images/atlas/shogi3d/*.webp, 2026-11-11).
     Serve the repo root (python3 -m http.server 8765), then python3 atlas/tools/shogi-tex.py — or open
     shogi-tex.html?t=side-makie to see one. window.GEN(name) → a webp data URL; window.NAMES = every picture.
     Boards: makie (黒漆の側面に蒔絵) · grain (新榧, the 2D 木目) · ink (漆黒, the 2D 漆黒) · yosegi (箱根寄木細工) · sakura (山桜と樺細工).
     The top of 本榧 / 蒔絵 is images/atlas/shogi-kaya.webp (unchanged). Per board: top-<b> (the playing surface with its rim),
     side-<b> (the long faces), end-<b> (the short faces), stand-<b> (駒台 / the page's stands), and for the lacquer
     the -m maps (R = height for the bump, G = roughness, B = metalness). -->
<html><head><meta charset="utf-8"><title>shogi 3D board textures</title>
<style>body{margin:0;background:#333;color:#ddd;font:13px system-ui}img{max-width:100%;display:block;margin:6px 0}</style></head>
<body><div id="out"></div>
<script>
(function () {
  'use strict';
  /* ---------- noise ---------- */
  function hash(i, j, s) { let h = (i * 374761393 + j * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
  function vnoise(x, y, s) {
    const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(i, j, s), b = hash(i + 1, j, s), c = hash(i, j + 1, s), d = hash(i + 1, j + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, s, o = 4) { let t = 0, a = .5, f = 1, n = 0; for (let k = 0; k < o; k++) { t += vnoise(x * f, y * f, s + k * 17) * a; n += a; a *= .5; f *= 2.03; } return t / n; }
  let seed = 1; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const R = (a, b) => a + (b - a) * rnd();
  const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;
  const mix = (a, b, t) => a + (b - a) * t;

  /* ---------- 2D boards (shogi/index.html body.skin-grain / skin-ink): the same gradient + SVG grain, so 3D = 2D ---------- */
  let SRC = null;
  const page = () => SRC || (SRC = fetch('../../shogi/index.html').then(r => r.text()));
  const svgOf = (txt, sel) => { const i = txt.indexOf(sel); const m = txt.slice(i).match(/url\("(data:image\/svg\+xml,[^"]+)"\)/); return decodeURIComponent(m[1].slice('data:image/svg+xml,'.length)); };
  const loadImg = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
  async function top2d(kind) {
    const W = 1800, H = 1980, c = cv(W, H), g = c.getContext('2d'), txt = await page();
    const stops = kind === 'grain' ? [['#e4c48e', 0], ['#dbb780', .38], ['#d3ac72', .7], ['#c9a066', 1]] : [['#2b2622', 0], ['#1f1b18', 1]];
    const a = (kind === 'grain' ? 172 : 170) * Math.PI / 180, dx = Math.sin(a), dy = -Math.cos(a), L = Math.abs(W * dx) + Math.abs(H * dy);
    const gr = g.createLinearGradient(W / 2 - dx * L / 2, H / 2 - dy * L / 2, W / 2 + dx * L / 2, H / 2 + dy * L / 2);
    stops.forEach(([col, t]) => gr.addColorStop(t, col)); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // the inner shadow of the 2D board (inset 0 0 26px)
    const sh = kind === 'grain' ? 'rgba(120,72,20,.22)' : 'rgba(0,0,0,.45)';
    [[0, 0, W, 0, 0, 1], [0, H, W, H, 0, -1], [0, 0, 0, H, 1, 0], [W, 0, W, H, -1, 0]].forEach(([x0, y0, x1, y1, nx, ny]) => {
      const lg = g.createLinearGradient(x0, y0, x0 + nx * 70, y0 + ny * 70); lg.addColorStop(0, sh); lg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = lg; g.fillRect(0, 0, W, H); });
    const svg = svgOf(txt, kind === 'grain' ? 'body.skin-grain .board::after' : 'body.skin-ink .board::after');
    const im = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/width='900' height='990'/, "width='1800' height='1980'")));
    g.save(); g.globalAlpha = kind === 'grain' ? .24 : .09 * 2.2; g.globalCompositeOperation = kind === 'grain' ? 'multiply' : 'screen'; g.drawImage(im, 0, 0, W, H); g.restore();
    return c;
  }

  /* ---------- a wood field by pixels: f(u, v) → [r, g, b] ---------- */
  function pix(W, H, f) { const c = cv(W, H), g = c.getContext('2d'), im = g.createImageData(W, H), d = im.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const o = f(x, y), i = (y * W + x) * 4; d[i] = clamp(o[0]); d[i + 1] = clamp(o[1]); d[i + 2] = clamp(o[2]); d[i + 3] = 255; }
    g.putImageData(im, 0, 0); return c; }
  // straight grain along x (柾目): thin late-wood lines, uneven, broadly warped; fibres; colour from light a → dark b
  function straight(x, y, W, H, s, a, b, rings = 60, str = 1, vert = false, warp = 1) {
    const u = vert ? y / H : x / W, v = vert ? x / W : y / H;   // u along the grain, v across
    const ph = v * rings + (fbm(u * 1.3, v * 1.1, s, 3) - .5) * 3.2 * warp + (fbm(u * 5, v * 3, s + 5, 2) - .5) * .4 * warp + (warp > 1 ? Math.exp(-Math.pow((v - .5 - (fbm(u * .7, 3, s + 9, 2) - .5) * .6) / .22, 2)) * Math.sin(u * 7 + s) * warp * .9 : 0);
    const k = Math.floor(ph), f = ph - k, pos = .5 + hash(k, 7, s) * .4, st = (.35 + hash(k, 13, s) * .65) * str, w0 = .6 + hash(k, 3, s) * .8;
    const line = Math.exp(-Math.pow((f - pos) / (.03 * w0), 2)) * st + Math.exp(-Math.pow((f - pos) / (.12 * w0), 2)) * st * .25;
    const fib = (vnoise(u * 6, v * 520, s + 9) - .5) * .09 + (vnoise(u * 180, v * 9, s + 11) - .5) * .05;
    const tone = (fbm(u * 1.5, v * 1.2, s + 21, 2) - .5) * .22;
    const t = Math.max(0, Math.min(1, .15 + line * .6 + fib * 1.5 + tone));
    return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
  }
  // end grain (木口): tight rings arching across the face, centre (cx, cy) off the face
  function endg(x, y, W, H, s, a, b, cx, cy, k, n = 60) {
    const u = x / W, v = y / H, dx = (u - cx) * k, dy = v - cy;
    const r = Math.sqrt(dx * dx + dy * dy) * n + fbm(u * 4, v * 4, s, 3) * 3 + vnoise(u * 40, v * 40, s + 3) * .2;
    const f = r % 1, late = Math.exp(-Math.pow((f - .8) / .08, 2)), pores = vnoise(u * 900, v * 300, s + 7) > .86 ? .12 : 0;
    const t = Math.max(0, Math.min(1, .2 + late * .45 + (fbm(u * 2, v * 2, s + 2, 2) - .5) * .25 + pores));
    return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
  }
  const vignette = (g, W, H, col, k = .6) => { const r = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.hypot(W, H) * .55); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, col); g.save(); g.globalAlpha = k; g.fillStyle = r; g.fillRect(0, 0, W, H); g.restore(); };

  /* ---------- 蒔絵 (maki-e, 2026-11-11 v2 — the level of real 蒔絵盤: dense scenes, ぼかし powder, 付描 lines) ----------
     Long faces: 山水楼閣図 (a pavilion on stilts over the water, pines on gold-powdered hills, a distant pagoda, waves, birds, mist).
     Short faces: 扇流し (open fans floating on flowing water, plum painted on the fans). 駒台: 唐草 with a plum roundel.
     Drawn as masks, then composed by pixels: powder layers are densities (each grain on / off), the raised gold lit from the upper left. */
  const GOLD = [240, 194, 102], AOKIN = [212, 202, 150], AKAKIN = [212, 160, 102], SILVER = [200, 202, 206], BLUE = [126, 146, 176], RED = [170, 60, 38];
  const LAYERS = ['pao', 'pgold', 'flat', 'akakin', 'blue', 'silver', 'raised', 'aokin', 'red', 'line', 'cut', 'flake'];
  function masks(W, H) { const o = {}; LAYERS.forEach(k => { o[k] = cv(W, H); }); return o; }
  const ctx = c => c.getContext('2d');
  const G = (m, k) => { const g = ctx(m[k]); g.fillStyle = g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round'; return g; };
  // a ridge line: points from x0 to x1, y from a profile with noise
  function ridge(x0, x1, yb, hgt, s, peaks = 2) { const P = []; for (let k = 0; k <= 60; k++) { const t = k / 60, x = x0 + (x1 - x0) * t;
    const prof = Math.pow(Math.sin(Math.PI * t), .8) * (.6 + .4 * Math.sin(t * Math.PI * peaks + s)) + (fbm(t * 6, s, s * 7 | 0, 3) - .5) * .35; P.push([x, yb - hgt * Math.max(0, prof)]); } return P; }
  const path = (g, P) => { g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };
  // a hill: gold powder densest along the ridge, thinning downwards (ぼかし); the ridge drawn in gold; 皴 strokes inside
  function hill(m, W, H, x0, x1, yb, hgt, s, k = 1, layer = 'pgold') {
    const P = ridge(x0, x1, yb, hgt, s), sc = W / 3072, g = G(m, layer);
    const yz = yb >= H * .98 ? H + 10 : yb + 6 * sc; g.save(); path(g, P); g.lineTo(x1, yz); g.lineTo(x0, yz); g.closePath(); g.clip();
    g.globalAlpha = .1 * k; g.fillRect(0, 0, W, H);
    g.globalAlpha = .95 * k; g.filter = `blur(${14 * sc}px)`; g.lineWidth = 46 * sc; path(g, P.map(([x, y]) => [x, y + 16 * sc])); g.stroke();
    g.filter = `blur(${26 * sc}px)`; g.globalAlpha = .45 * k; g.lineWidth = 120 * sc; path(g, P.map(([x, y]) => [x, y + 60 * sc])); g.stroke();
    g.restore();
    const l = G(m, 'line'); l.lineWidth = 2.4 * sc; path(l, P); l.stroke();
    // 付描: contour strokes following the ridge, broken
    l.lineWidth = 1.3 * sc;
    for (let r = 1; r <= 5; r++) { const off = r * 15 * sc; for (let i = 2; i < P.length - 3; i += 5) { if (rnd() < .35) continue; l.globalAlpha = .75; l.beginPath(); l.moveTo(P[i][0], P[i][1] + off); l.lineTo(P[i + 1][0], P[i + 1][1] + off); l.lineTo(P[i + 2][0], P[i + 2][1] + off * 1.05); l.stroke(); } }
    // 皴: short hooked strokes on the slope
    for (let i = 0; i < 26 * (x1 - x0) / W * 3; i++) { const t = R(.1, .9), j = Math.floor(t * 60), x = P[j][0], y = P[j][1] + R(20, 90) * sc; l.globalAlpha = R(.5, .9); l.beginPath(); l.moveTo(x, y); l.quadraticCurveTo(x + 10 * sc, y + 6 * sc, x + R(18, 32) * sc, y + R(2, 14) * sc); l.stroke(); }
    l.globalAlpha = 1;
    return P;
  }
  // a pine: a twisting trunk in raised gold with bark cut in, branches ending in flat pads of needles (gold, the needles cut in)
  function pineTree(m, W, H, x, y, h, lean, s) {
    const sc = W / 3072, g = G(m, 'raised'), c = G(m, 'cut');
    const T = []; for (let k = 0; k <= 12; k++) { const t = k / 12; T.push([x + lean * h * t + Math.sin(t * 5 + s) * h * .06, y - h * t]); }
    for (let k = 0; k < 12; k++) { g.lineWidth = (26 - k * 1.6) * sc * h / 300; g.beginPath(); g.moveTo(...T[k]); g.lineTo(...T[k + 1]); g.stroke(); }
    c.lineWidth = 1.3 * sc; for (let k = 0; k < 30; k++) { const t = R(.05, .85), i = Math.floor(t * 12), [px, py] = T[i], w = (24 - i * 1.6) * sc * h / 300; c.beginPath(); c.moveTo(px - w * .4, py + R(-4, 4)); c.quadraticCurveTo(px, py + R(-6, 6), px + w * .4, py + R(-4, 4)); c.stroke(); }
    const pad = (cx, cy, w, hh) => {   // 葉叢: a flat rounded pad, needles as fans cut into the gold, a gold rim
      g.beginPath(); g.ellipse(cx, cy, w, hh, 0, 0, Math.PI * 2); g.fill();
      c.lineWidth = 1.1 * sc; for (let f = -w * .8; f <= w * .8; f += 9 * sc) { const bx = cx + f, by = cy + hh * .55; for (let a = -1; a <= 1; a += .25) { c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + Math.sin(a) * hh * 1.1, by - Math.cos(a) * hh * 1.05); c.stroke(); } }
      const l = G(m, 'line'); l.lineWidth = 1.6 * sc; l.beginPath(); l.ellipse(cx, cy, w + 1.5 * sc, hh + 1.5 * sc, 0, Math.PI * 1.05, Math.PI * 1.95); l.stroke();
    };
    const tiers = 4 + (h > 300 ? 1 : 0);
    for (let k = 0; k < tiers; k++) {
      const t = .45 + k * (.55 / tiers), i = Math.min(12, Math.floor(t * 12)), [bx, by] = T[i], side = k & 1 ? 1 : -1, len = h * R(.28, .42) * (1 - k * .1);
      const ex = bx + side * len, ey = by - R(4, 22) * sc;
      g.lineWidth = (11 - k * 1.5) * sc * h / 300; g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo((bx + ex) / 2, by - 24 * sc, ex, ey); g.stroke();
      pad(ex, ey - 12 * sc, h * R(.17, .23), h * R(.055, .07)); if (rnd() < .7) pad((bx + ex) / 2 + side * 10 * sc, ey - 34 * sc, h * R(.11, .15), h * .045);
    }
    pad(T[12][0], T[12][1] - 8 * sc, h * .2, h * .065);
  }
  // 楼閣: a pavilion on stilts — hip roof with tiles, bracketed eaves, red-gold panels between the pillars, a railing
  function pavilion(m, W, H, x, y, w, s) {
    const sc = W / 3072, f = G(m, 'flat'), r = G(m, 'raised'), a = G(m, 'akakin'), l = G(m, 'line'), c = G(m, 'cut');
    const fl = y, hgt = w * .34, roofH = w * .3;
    // stilts into the water
    l.lineWidth = 3 * sc; for (let k = 0; k <= 8; k++) { const px = x + w * k / 8; l.beginPath(); l.moveTo(px, fl); l.lineTo(px, fl + w * .28); l.stroke(); }
    l.lineWidth = 1.8 * sc; for (let k = 0; k < 8; k++) { const px = x + w * k / 8; l.beginPath(); l.moveTo(px, fl + w * .08); l.lineTo(px + w / 8, fl + w * .2); l.moveTo(px + w / 8, fl + w * .08); l.lineTo(px, fl + w * .2); l.stroke(); }
    f.fillRect(x - w * .04, fl - 6 * sc, w * 1.08, 12 * sc);   // the floor
    // railing
    l.lineWidth = 2 * sc; l.beginPath(); l.moveTo(x - w * .04, fl - 26 * sc); l.lineTo(x + w * 1.04, fl - 26 * sc); l.stroke();
    l.lineWidth = 1.2 * sc; for (let px = x; px <= x + w; px += 9 * sc) { l.beginPath(); l.moveTo(px, fl - 26 * sc); l.lineTo(px, fl - 6 * sc); l.stroke(); }
    // walls: pillars and panels (red gold / bare lacquer windows with lattice)
    const cols = 6, cw = w / cols;
    for (let k = 0; k < cols; k++) { const px = x + k * cw; if (k % 2 === 0) { a.fillRect(px + 3 * sc, fl - hgt, cw - 6 * sc, hgt - 30 * sc); } else { l.lineWidth = 1 * sc; for (let q = 1; q < 5; q++) { l.beginPath(); l.moveTo(px + cw * q / 5, fl - hgt); l.lineTo(px + cw * q / 5, fl - 30 * sc); l.stroke(); } for (let q = 1; q < 6; q++) { l.beginPath(); l.moveTo(px, fl - hgt + (hgt - 30 * sc) * q / 6); l.lineTo(px + cw, fl - hgt + (hgt - 30 * sc) * q / 6); l.stroke(); } } }
    f.save(); for (let k = 0; k <= cols; k++) f.fillRect(x + k * cw - 3 * sc, fl - hgt, 6 * sc, hgt - 26 * sc); f.restore();
    f.fillRect(x - w * .02, fl - hgt - 8 * sc, w * 1.04, 10 * sc);   // beam
    // the roof: a curved hip roof with upturned eaves
    const ey = fl - hgt - 10 * sc, ex0 = x - w * .2, ex1 = x + w * 1.2, ry = ey - roofH;
    r.beginPath(); r.moveTo(ex0 - 14 * sc, ey - 20 * sc); r.quadraticCurveTo(ex0 + w * .1, ey + 4 * sc, ex0 + w * .25, ey); r.lineTo(ex1 - w * .25, ey); r.quadraticCurveTo(ex1 - w * .1, ey + 4 * sc, ex1 + 14 * sc, ey - 20 * sc);
    r.quadraticCurveTo(ex1 - w * .2, ey - roofH * .5, x + w * .85, ry); r.lineTo(x + w * .15, ry); r.quadraticCurveTo(ex0 + w * .2, ey - roofH * .5, ex0 - 14 * sc, ey - 20 * sc); r.closePath(); r.fill();
    c.lineWidth = 1.2 * sc; for (let t = .04; t < .97; t += .022) { const bx = ex0 + (ex1 - ex0) * t, tx = x + w * .15 + w * .7 * Math.min(1, Math.max(0, (t - .12) / .76)); c.beginPath(); c.moveTo(bx, ey - 2 * sc); c.lineTo(tx, ry + 3 * sc); c.stroke(); }
    c.lineWidth = 2 * sc; c.beginPath(); c.moveTo(ex0 + w * .1, ey - 8 * sc); c.lineTo(ex1 - w * .1, ey - 8 * sc); c.stroke();
    // ridge with 鴟尾
    f.fillRect(x + w * .12, ry - 7 * sc, w * .76, 9 * sc); r.beginPath(); r.ellipse(x + w * .12, ry - 12 * sc, 7 * sc, 13 * sc, -.4, 0, 7); r.ellipse(x + w * .88, ry - 12 * sc, 7 * sc, 13 * sc, .4, 0, 7); r.fill();
  }
  // a distant pagoda (五重塔), smaller, in pale gold
  function pagoda(m, W, H, x, y, w, tiers = 5) {
    const sc = W / 3072, a = G(m, 'aokin'), l = G(m, 'line'); let yy = y, ww = w;
    for (let k = 0; k < tiers; k++) {
      const bh = w * .28;
      l.lineWidth = 1.2 * sc; l.strokeRect(x - ww * .3, yy - bh, ww * .6, bh); for (let q = 1; q < 3; q++) { l.beginPath(); l.moveTo(x - ww * .3 + ww * .6 * q / 3, yy - bh); l.lineTo(x - ww * .3 + ww * .6 * q / 3, yy); l.stroke(); }
      yy -= bh; a.beginPath(); a.moveTo(x - ww * .75, yy - 6 * sc); a.quadraticCurveTo(x - ww * .4, yy + 2 * sc, x - ww * .3, yy); a.lineTo(x + ww * .3, yy); a.quadraticCurveTo(x + ww * .4, yy + 2 * sc, x + ww * .75, yy - 6 * sc); a.lineTo(x + ww * .25, yy - w * .2); a.lineTo(x - ww * .25, yy - w * .2); a.closePath(); a.fill();
      yy -= w * .2; ww *= .86;
    }
    l.lineWidth = 2 * sc; l.beginPath(); l.moveTo(x, yy); l.lineTo(x, yy - w * .9); l.stroke();
    for (let k = 1; k <= 9; k++) { l.lineWidth = 1 * sc; l.beginPath(); l.moveTo(x - 6 * sc, yy - w * .08 * k); l.lineTo(x + 6 * sc, yy - w * .08 * k); l.stroke(); }
  }
  // waves: many fine gold lines rolling across, with small crests (波頭) breaking here and there
  function waves(m, W, H, y0, y1, s, dens = 1) {
    const sc = W / 3072, l = G(m, 'line');
    for (let y = y0; y < y1; y += 9 * sc / dens) {
      l.lineWidth = R(.9, 1.6) * sc; l.globalAlpha = R(.6, .95); l.beginPath(); let started = false;
      for (let x = -10; x < W + 10; x += 5 * sc) { const yy = y + Math.sin(x / (60 * sc) + y * .05 + s) * 4 * sc + Math.sin(x / (210 * sc) + s * 2) * 6 * sc;
        if (vnoise(x / (90 * sc), y / (20 * sc), s * 3 | 0) < .3) { if (started) { l.stroke(); l.beginPath(); started = false; } continue; }
        started ? l.lineTo(x, yy) : (l.moveTo(x, yy), started = true); }
      if (started) l.stroke();
    }
    l.globalAlpha = 1;
    // crests: little curling heads with spray
    for (let k = 0; k < 40 * dens; k++) { const cx = R(0, W), cy = R(y0, y1), r = R(7, 14) * sc; l.lineWidth = 1.4 * sc; l.beginPath(); l.arc(cx, cy, r, Math.PI * .9, Math.PI * 2.1); l.stroke(); l.beginPath(); l.arc(cx + r * .45, cy - r * .1, r * .45, Math.PI, Math.PI * 2.3); l.stroke();
      const f = G(m, 'flake'); for (let q = 0; q < 5; q++) { f.beginPath(); f.arc(cx + r + R(0, 10) * sc, cy - r + R(-6, 6) * sc, R(1, 2) * sc, 0, 7); f.fill(); } }
  }

  /* ---------- 螺鈿の桜 (2026-11-11 v3, ユーザーの参考写真：黒・朱の漆に貝の桜、金の平蒔絵の線) ----------

  // 鶯: plump body, head, wing and tail as separate shell pieces, an eye and beak in black, engraved feathers

    const e = ctx(m.eye); e.fillStyle = '#fff'; T(e, g => { g.beginPath(); g.arc(56, -26, 4.6, 0, 7); g.fill(); g.beginPath(); g.moveTo(68, -24); g.lineTo(86, -20); g.lineTo(68, -15); g.closePath(); g.fill(); });

      for (let k = 0; k < 7; k++) { g.beginPath(); g.moveTo(-40 + k * 9, -6 + k * .5); g.quadraticCurveTo(-30 + k * 9, 4, -46 + k * 9, 14); g.stroke(); }   // feathers on the wing
      for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(-64, 8 + k * 6); g.lineTo(-108, 28 + k * 2); g.stroke(); }                                // tail barbs

      let r = mix(G1[0], G0[0], lq), gg = mix(G1[1], G0[1], lq), b = mix(G1[2], G0[2], lq), h = 0, rough = 22, met = 0;
      const fa = F[i + 3] / 255; if (fa) { const L = 1 + (hash(x, y, s) - .5) * .3; r = mix(r, 236 * L, fa); gg = mix(gg, 190 * L, fa); b = mix(b, 98 * L, fa); rough = mix(rough, 60, fa); met = mix(met, 255, fa); h = 30 * fa; }

        const n1 = fbm(x * .004 + sid * .37, y * .016 + sid * .11, s + 3, 4), n2 = vnoise(x * .03 + sid, y * .06, s + 5), sp = hash(x, y, s + 9) > .996 ? .5 : 0;
        const flash = Math.max(0, Math.min(1, (n1 - .44) * 3.6)), hueSel = vnoise(x * .006 + sid, y * .01, s + 7);

        else if (kind === 3) base = [mix(244, 230, n2), mix(176, 140, n2), mix(196, 170, n2)];        // bud, a little deeper
        else if (kind === 1) base = [mix(206, 176, n2), mix(212, 184, n2), mix(222, 200, n2)];        // silvery branch
        else if (kind === 2) base = [mix(176, 140, n2), mix(206, 176, n2), mix(140, 110, n2)];        // olive-green bird

  const RD = {};
  function raden(kind) {

    const W = kind === 'stand' ? 1024 : 3072, H = kind === 'stand' ? 1024 : 800, m = radenMasks(W, H), sc = W / 3072, blooms = [];
    const bloomAll = (big) => blooms.forEach(([x, y, a], i) => { const n = 2 + Math.floor(rnd() * 3);

  const LONG = [2048, 532];
