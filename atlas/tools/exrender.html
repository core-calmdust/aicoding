<!doctype html><html><head><meta charset="utf-8"><title>exhibit render (museum)</title></head><body style="margin:0;background:#000">
<!-- Renders one museum exhibit (atlas/museum/ex/<id>.js) for comparison with a photograph of the real object (tools/museum-similarity.py).
     ?id=ottoman&view=top&w=56.5&d=56.3&px=1024        orthographic top view of a w × d cm area centred on the origin
     ?id=senet&cam=60,40,80&t=0,15,0&fov=30&px=1024    a perspective view (camera position, target)
     &flip=1 turns the piece over (two-sided boards); light: even, like a museum photograph on a copy stand -->
<script src="../vendor/three-r186.min.js?v=1"></script><script src="../vendor/three-compat.js?v=15"></script>
<script src="../table3d.js"></script><script src="../museum/gallery.js"></script>
<script>
const q = new URLSearchParams(location.search), id = q.get('id'), PX = +(q.get('px') || 1024), num = k => (q.get(k) || '').split(',').map(Number);
const s = document.createElement('script'); s.src = '../museum/ex/' + id + '.js?' + Date.now(); s.onload = async () => {
  const B = AtlasEx[id]; if (B.ready) await B.ready();
  const top = q.get('view') === 'top', W = +(q.get('w') || 50), D = +(q.get('d') || 50);
  const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(1);
  R.setSize(top ? PX : PX, top ? Math.round(PX * D / W) : Math.round(PX * .75)); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = +(q.get('exp') || .85);
  document.body.appendChild(R.domElement);
  const S = new THREE.Scene(); S.background = new THREE.Color(q.get('bg') || '#bebebe');
  S.add(new THREE.HemisphereLight(0xffffff, 0x808080, +(q.get('amb') || 1.2))); const d = new THREE.DirectionalLight(0xffffff, +(q.get('key') || .9)); d.position.set(4, 30, 10); S.add(d);
  const pm = new THREE.PMREMGenerator(R), es = new THREE.Scene(); es.add(new THREE.Mesh(new THREE.BoxGeometry(20, 12, 20), new THREE.MeshBasicMaterial({ color: 0x9a9a9a, side: THREE.BackSide })));
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })); pl.position.y = 5.9; pl.rotation.x = Math.PI / 2; es.add(pl); S.environment = pm.fromScene(es, .04).texture; S.environmentIntensity = +(q.get('env') || .25);
  const o = B.build(THREE, window.Table3D, AtlasGallery.kit); if (q.get('flip')) o.rotation.z = Math.PI; S.add(o);
  let C;
  if (top) { C = new THREE.OrthographicCamera(-W / 2, W / 2, D / 2, -D / 2, .1, 500); C.position.set(0, 200, 0); C.up.set(0, 0, -1); C.lookAt(0, 0, 0); }
  else { C = new THREE.PerspectiveCamera(+(q.get('fov') || 30), 4 / 3, .1, 2000); C.position.set(...num('cam')); C.lookAt(...num('t')); }
  R.render(S, C); window.done = 1; };
document.head.appendChild(s);
</script></body></html>
