<!doctype html>
<!-- Dev tool: renders every board model in table3d.js to a transparent PNG for the portal's 3D icons.
     Open via a local server: http://localhost:8000/atlas/tools/icons.html?id=reversi  → window.SHOT holds the data URL.
     The repo's images/atlas/<id>.webp files were made with this page (headless Chromium) — rerun after changing a model.
     Post-process for game icons (320×320): atlas/tools/icon-post.py (crop, contain-fit, the widest row = the plinth's corners at y = 204,
     the solid plinth centred across, the floor shadow faded at the edge). With a software GPU (headless swiftshader) render larger
     (S = 1920 below): supersampling keeps the wood grain as soft as on a real GPU. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../img/tex/baked.js?v=2"></script>
<script src="../table3d.js"></script>
<script src="../models/shanghai.js"></script>
<script src="../icons3d.js"></script>
<script src="../avatars3d.js"></script>
<script src="../avatars/sp-games.js"></script>
<script src="../avatars/sp-a.js"></script>
<script src="../avatars/sp-b.js"></script>
<script src="../avatars/sp-c.js"></script>
<script src="../avatars/sp-d.js"></script>
<script src="../avatars/sp-e.js"></script>
<script src="../npc/roster.js"></script>
<script src="../avatars/sp-boss.js"></script>
<script>
// (上海: the tile faces wait for their font — Noto Serif JP — before the scene is drawn)
((window.Table3D && Table3D.shanghai) ? Table3D.shanghai.ready() : Promise.resolve()).then(function () {
  const id = new URLSearchParams(location.search).get('id') || 'reversi', S = 640;
  const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  R.setPixelRatio(1); R.setSize(S, S); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
  R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.1;
  document.body.appendChild(R.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0x7a5a40, .75));
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(-7, 16, 9); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); key.shadow.bias = -.0005;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xcfe6ff, .55); rim.position.set(9, 5, -9); scene.add(rim);
  // shadow catcher only (transparent floor)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: .28 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const q = new URLSearchParams(location.search); let kind = q.get('kind') || 'icon';
  const avm = kind === 'av' && id.match(/^(.+)-(\d)$/);
  const g = avm ? Avatars3D.make(avm[1], +avm[2]) : kind === 'mon' ? Icons3D.MONS[id]() : kind === 'piece' ? Icons3D.PIECES[id]() : (Icons3D.ICONS[id] || Table3D.MODELS[id])(); scene.add(g);
  if (kind === 'av') kind = 'mon';
  g.rotation.y = kind === 'mon' ? (+q.get('ry') || .45) : kind === 'piece' ? (+q.get('ry') || -0.5) : Math.PI / 4;   // icons: corner-on → diamond
  // fit: bounding sphere
  g.updateMatrixWorld(true);
  const box = new THREE.Box3(); g.children.forEach(ch => { if (!ch.userData.fx) box.expandByObject(ch); }); if (box.isEmpty()) box.setFromObject(g);
  const c = box.getCenter(new THREE.Vector3()), r = box.getBoundingSphere(new THREE.Sphere()).radius;
  // icons: orthographic, isometric-ish (≈32° down) so the square base reads as a clean diamond
  let cam;
  if (kind === 'mon' && q.get('shot') === 'bust') {
    // speech-bubble guide portrait: 3/4 view, camera close on the head (userData.head = [y, r] in model space)
    g.rotation.y = +q.get('ry') || .78; g.updateMatrixWorld(true);
    const hd = g.userData.head || [c.y, r * .5, 0], hp = g.localToWorld(new THREE.Vector3(0, hd[0], hd[2] || 0)), hr = hd[1] * g.scale.y;
    cam = new THREE.PerspectiveCamera(26, 1, .1, 200);
    const fit = hr * 1.5, dist = fit / Math.tan(13 * Math.PI / 180);
    cam.position.set(hp.x + dist * .06, hp.y + dist * .16, hp.z + dist * .985); cam.lookAt(hp.x, hp.y - hr * .22, hp.z);
    floor.visible = false;
  } else if (kind === 'piece' || kind === 'mon') {
    cam = new THREE.PerspectiveCamera(24, 1, .1, 200);
    const dist = r / Math.sin(13 * Math.PI / 180) * .84;
    if (kind === "mon") { cam.position.set(c.x + dist * .04, c.y + dist * .3, c.z + dist * .95); cam.lookAt(c.x, c.y, c.z); } else { cam.position.set(c.x + dist * .05, c.y + dist * .62, c.z + dist * .78); cam.lookAt(c.x, c.y - r * .04, c.z); }
  } else {
    cam = new THREE.OrthographicCamera(-r, r, r, -r, .1, 200);
    const el = 35.26 * Math.PI / 180;   // true isometric
    cam.position.set(c.x, c.y + 40 * Math.sin(el), c.z + 40 * Math.cos(el)); cam.lookAt(c.x, c.y, c.z); cam.updateProjectionMatrix();
  }
  // ?part=base | top (an icon in two layers, framed alike — the portal's ランダム tile bobs its die): base = the die unseen
  // (it still casts its shadow on the plinth), top = the die alone
  const part = q.get('part');
  if (part) g.traverse(o => {
    let p = null; for (let x = o; x && !p; x = x.parent) p = x.userData && x.userData.part;
    if (!o.isMesh || !p || p === part) return;
    if (part === 'base') { const ms = Array.isArray(o.material) ? o.material : [o.material]; o.material = ms.map(m => { const c = m.clone(); c.colorWrite = false; c.depthWrite = false; return c; }); if (o.material.length === 1) o.material = o.material[0]; }
    else o.visible = false;
  });
  if (part === 'top') floor.visible = false;
  R.render(scene, cam);
  window.SHOT = R.domElement.toDataURL('image/png');
});
</script>
</body></html>
