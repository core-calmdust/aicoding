<!doctype html><html><head><meta charset="utf-8"><title>exhibit icon</title></head><body style="margin:0;background:#888">
<!-- A museum exhibit as a portal icon: the real model, seen from a corner like the portal's toy icons, on a transparent ground.
     ?id=senet[&yaw=0.7&pit=0.62&zoom=1&hide=1]  (hide: leave out the exhibit's first mesh — its plinth or cloth)  → a 640 px canvas; saved at 320 px as images/atlas/mu-<id>.webp -->
<script src="../vendor/three-r186.min.js?v=1"></script><script src="../vendor/three-compat.js?v=15"></script>
<script src="../table3d.js"></script><script src="../museum/gallery.js"></script>
<script>
const q = new URLSearchParams(location.search), id = q.get('id'), PX = 640;
const s = document.createElement('script'); s.src = '../museum/ex/' + id + '.js?' + Date.now(); s.onload = async () => {
  const B = AtlasEx[id]; if (B.ready) await B.ready();
  const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(PX, PX); R.setClearColor(0, 0);
  R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.25; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(R.domElement);
  const S = new THREE.Scene(); S.add(new THREE.HemisphereLight(0xffffff, 0x9a8a78, 1.5));
  const o = B.build(THREE, window.Table3D, AtlasGallery.kit); S.add(o);
  if (q.get('hide')) { let n = +q.get('hide'); o.traverse(m => { if (m.isMesh && n-- > 0) m.visible = false; }); }
  const box = new THREE.Box3(); o.traverse(m => { if (m.isMesh && m.visible) box.expandByObject(m); }); const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3()), r = sz.length() / 2;
  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(c.x - r * 1.2, c.y + r * 2.4, c.z + r * 1.4); d.target.position.copy(c); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
  Object.assign(d.shadow.camera, { left: -r * 1.3, right: r * 1.3, top: r * 1.3, bottom: -r * 1.3, near: .1, far: r * 8 }); d.shadow.bias = -.0006; d.shadow.normalBias = .05; S.add(d, d.target);
  const yaw = +(q.get('yaw') || .72), pit = +(q.get('pit') || .62), k = r * 1.02 / +(q.get('zoom') || 1);
  const C = new THREE.OrthographicCamera(-k, k, k, -k, .1, r * 20); C.position.set(c.x + r * 6 * Math.cos(pit) * Math.sin(yaw), c.y + r * 6 * Math.sin(pit), c.z + r * 6 * Math.cos(pit) * Math.cos(yaw)); C.lookAt(c);
  R.render(S, C); window.done = 1; };
document.head.appendChild(s);
</script></body></html>
