  <path d="M110 134 C106 120 112 110 120 104 M118 135 C120 122 128 114 138 112 M126 138 C132 128 142 124 150 126" fill="none" stroke="#e0a81c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="104" r="4.5" fill="#d0122a"/><circle cx="138" cy="112" r="4.5" fill="#d0122a"/><circle cx="150" cy="126" r="4.5" fill="#d0122a"/>
  <!-- the feet on the branch -->
  <path d="M138 236 L136 254 M130 254 h14 M158 238 L158 256 M152 256 h14" fill="none" stroke="#d0122a" stroke-width="4" stroke-linecap="round"/>
