       atlas/tools/shanghai-glyphs.py art が shanghai-art.png のセル9にこれを描き込む -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the bamboo: a stalk with three nodes, a branch, leaves -->
    <path d="M60 372 L60 34" stroke="#127040" stroke-width="17"/>
    <path d="M51 112 h18 M51 204 h18 M51 296 h18" stroke="#fafaf6" stroke-width="4"/>
    <path d="M64 258 C110 252 170 262 236 282" stroke="#127040" stroke-width="9"/>
