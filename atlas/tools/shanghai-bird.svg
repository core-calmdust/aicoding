    <path d="M64 120 C88 108 104 92 116 72 C112 98 96 116 66 132 Z" fill="#127040" stroke="#127040" stroke-width="3"/>
    <path d="M56 160 C34 146 24 126 22 104 C38 120 50 134 58 150 Z" fill="#127040" stroke="#127040" stroke-width="3"/>
    <path d="M236 282 C248 300 252 318 250 340 C240 324 232 306 230 288 Z" fill="#127040" stroke="#127040" stroke-width="3"/>
    <path d="M206 274 C222 292 226 312 222 334 C212 316 206 298 204 280 Z" fill="#127040" stroke="#127040" stroke-width="3"/>
  </g>
