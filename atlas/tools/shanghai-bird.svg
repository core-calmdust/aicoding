  </g>
  <!-- the body, the red breast, the green wing with white feather lines -->
  <ellipse cx="150" cy="204" rx="50" ry="38" transform="rotate(-18 150 204)" fill="#1c3c86"/>
  <ellipse cx="128" cy="218" rx="30" ry="25" transform="rotate(-18 128 218)" fill="#d0122a"/>
  <path d="M128 192 C150 176 188 178 208 198 C196 220 168 232 136 222 C142 212 140 200 128 192 Z" fill="#127040"/>
  <path d="M150 196 C166 192 182 196 194 206 M146 208 C162 206 176 210 186 218 M144 219 C156 220 166 223 174 228" fill="none" stroke="#fafaf6" stroke-width="3.2" stroke-linecap="round"/>
