  <path d="M94 170 C100 182 116 186 128 178 C120 176 108 172 100 164 Z" fill="#fafaf6"/>
  <circle cx="104" cy="154" r="8" fill="#fafaf6"/>
  <circle cx="102.5" cy="154" r="4.2" fill="#141414"/>
