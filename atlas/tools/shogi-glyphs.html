<!doctype html>
<!-- Dev tool: the inscription sheets of the 3D shogi pieces (images/atlas/shogi-glyphs-<set>.png, 2026-11-11), cut out of the 2D piece
     SVGs (shogi/pieces/<folder>/0<code>.svg; licences in shogi/pieces/README.md). Each cell 256×296 (5 columns × 3 rows, the order
     of SHEET_KEYS in atlas/models/shogi.js): alpha = the lacquer, rgb = grey (dark = the crown of the raised stroke). The 盛り上げ
     sheet (2kanji_3d, images/atlas/shogi-glyphs.png) is the original. Serve the repo root, then python3 atlas/tools/shogi-glyphs.py. -->
<html><head><meta charset="utf-8"><title>shogi glyph sheets</title><style>body{background:#555;margin:0}img{display:block;max-width:100%}</style></head>
<body><div id="out"></div>
<script>
(function () {
  'use strict';
  const SETS = { ichiji: '1kanji_3d', kinki: 'kinki', minase: 'minase', ryoko: 'ryoko', kaisho: 'orangain' };
  const CODES = ['FU', 'KY', 'KE', 'GI', 'KA', 'HI', 'KI', 'GY', 'TO', 'NY', 'NK', 'NG', 'UM', 'RY', 'OU'];
  const S = 720, CW = 256, CH = 296;
  const img = txt => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(txt); });
  async function cell(folder, code) {
    const txt = await (await fetch('../../shogi/pieces/' + folder + '/0' + code + '.svg')).text();
    const im = await img(txt), c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(im, 0, 0, S, S); const d = g.getImageData(0, 0, S, S).data;
    // the piece's own outline: the opaque pixels → its bounding box and an eroded inside (the edge / border strokes are not ink)
    let x0 = S, y0 = S, x1 = 0, y1 = 0; for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 128) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const bw = x1 - x0, bh = y1 - y0, inset = bw * .06;
    const inside = (x, y) => { for (const [dx, dy] of [[inset, 0], [-inset, 0], [0, inset], [0, -inset], [inset * .7, inset * .7], [-inset * .7, inset * .7], [inset * .7, -inset * .7], [-inset * .7, -inset * .7]]) { const xx = Math.round(x + dx), yy = Math.round(y + dy); if (xx < 0 || yy < 0 || xx >= S || yy >= S || d[(yy * S + xx) * 4 + 3] < 128) return false; } return true; };
    // ink: dark (black lacquer) or red (the promoted pieces) on the light wood face
    const red = /TO|NY|NK|NG|UM|RY/.test(code), M = new Float32Array(S * S);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const i = (y * S + x) * 4; if (d[i + 3] < 128 || !inside(x, y) || y > y0 + bh * .875 || y < y0 + bh * .04) continue;   // (the border's bits at the bottom / tip)
      const r = d[i], gg = d[i + 1], b = d[i + 2], lum = (r * .3 + gg * .55 + b * .15) / 255;
      M[y * S + x] = red ? Math.max(0, Math.min(1, (r - gg - 50) / 70)) : Math.max(0, Math.min(1, (.55 - lum) / .22)); }
    // height: the ink blurred (a rounded stroke, highest in its middle)
    const Hh = new Float32Array(S * S), R = 5;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { if (!M[y * S + x]) continue; let s = 0, n = 0; for (let dy = -R; dy <= R; dy += 1) for (let dx = -R; dx <= R; dx += 1) { s += M[(y + dy) * S + x + dx] || 0; n++; } Hh[y * S + x] = s / n; }
    // into the 256×296 cell, the piece's box filling it (as the 盛り上げ sheet)
    const o = document.createElement('canvas'); o.width = CW; o.height = CH; const og = o.getContext('2d'), od = og.createImageData(CW, CH);
    for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) { const sx = Math.round(x0 + x / CW * bw), sy = Math.round(y0 + y / CH * bh), j = sy * S + sx, a = M[j] || 0, h = Math.pow(Hh[j] || 0, .7), i = (y * CW + x) * 4;
      const v = Math.round(255 * (1 - h)); od.data[i] = od.data[i + 1] = od.data[i + 2] = v; od.data[i + 3] = Math.round(a * 255); }
    og.putImageData(od, 0, 0); return o;
  }
  window.SETS = Object.keys(SETS);
  window.SHEET = async set => {
    const c = document.createElement('canvas'); c.width = CW * 5; c.height = CH * 3; const g = c.getContext('2d');
    for (let i = 0; i < CODES.length; i++) g.drawImage(await cell(SETS[set], CODES[i]), (i % 5) * CW, (i / 5 | 0) * CH);
    return c.toDataURL('image/png');
  };
  const q = new URLSearchParams(location.search).get('set');
  if (q) SHEET(q).then(u => { const im = new Image(); im.src = u; document.getElementById('out').appendChild(im); });
  window.READY = true;
})();
</script></body></html>
