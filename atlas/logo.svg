<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- World Board Game Atlas mark: a compass rose (the "atlas") whose needle points are game pieces:
       N = pawn, E = die, S = disc, W = shogi piece -->
  <circle cx="32" cy="32" r="30" fill="#111"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2.2 2.6"/>
  <!-- 4 short points -->
  <g fill="#fff" opacity=".9"><path d="M32 32 41 23 36 32z"/><path d="M32 32 41 41 32 36z"/><path d="M32 32 23 41 28 32z"/><path d="M32 32 23 23 32 28z"/></g>
  <!-- 4 long points -->
  <g fill="#fff"><path d="M32 13 36 32H28z"/><path d="M51 32 32 36V28z"/><path d="M32 51 28 32h8z"/><path d="M13 32 32 28v8z"/></g>
  <g fill="#111"><path d="M32 13 32 32H28z"/><path d="M51 32 32 32V28z"/><path d="M32 51 32 32h4z"/><path d="M13 32 32 32v4z"/></g>
  <!-- piece tips -->
  <g fill="#fff" stroke="#111" stroke-width="1.4">
    <circle cx="32" cy="8.6" r="3.3"/>
    <rect x="52.2" y="28.8" width="6.4" height="6.4" rx="1.6"/>
    <ellipse cx="32" cy="55.6" rx="4" ry="2.6"/>
    <path d="M8.6 27.6l2.6 1.4.7 5.6H5.3l.7-5.6z"/>
  </g>
  <circle cx="32" cy="32" r="3.4" fill="#fff" stroke="#111" stroke-width="1.6"/>
</svg>
