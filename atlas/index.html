<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界のボドゲ大全 — World Board Game Atlas</title>
<meta name="description" content="世界のボドゲ大全のポータル。更新されたゲーム、実績、ショップ、ガチャ。">
<meta name="theme-color" content="#fff4dc">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff6e2; --paper:#fffdf7; --ink:#2b3044; --ink2:#6a7088; --line:#efe3c8;
  --coral:#ff5d5d; --coral2:#d93c3c; --sky:#36b4ff; --sky2:#1789d6; --sun:#ffc928; --sun2:#e09a00;
  --mint:#3ccf91; --mint2:#1ea36c; --grape:#8d6bff; --grape2:#6a49d9; --pink:#ff7fbe;
  --r0:#9aa3b5; --r1:#3ccf91; --r2:#36b4ff; --r3:#b46bff; --r4:#ffb21e;
  --shadow:0 2px 0 rgba(43,48,68,.06), 0 10px 24px -12px rgba(120,80,20,.28);
  --font:'Zen Maru Gothic','Fredoka','Noto Sans Devanagari','Noto Sans Arabic',system-ui,sans-serif;
  --round:'Fredoka','Zen Maru Gothic','Noto Sans Devanagari','Noto Sans Arabic',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--cream);
  background-image:radial-gradient(circle at 1px 1px,rgba(200,150,60,.16) 1.4px,transparent 1.6px);background-size:22px 22px;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.round{font-family:var(--round)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(255,246,226,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand img{flex:none;width:48px;height:48px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
.brand .wm{display:flex;flex-direction:column;line-height:1.1;min-width:0;overflow:hidden}
.brand .wm b,.brand .wm small{overflow:hidden;text-overflow:ellipsis}
.brand .wm b{font-family:'RocknRoll One',var(--round);font-weight:400;font-size:20px;letter-spacing:.03em;white-space:nowrap;color:#111}

.brand .wm small{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:4px;letter-spacing:.08em;white-space:nowrap}
.hd .sp{flex:1}
.coin{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:4px 12px 4px 5px;font-family:var(--round);font-weight:700;font-size:17px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.coin i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc928 45%,#e09a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-style:normal;font-size:12px;color:#a66a00}
.coin.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.15)}}
.icbtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.icbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#langSel{display:none}
.lbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 9px;border-radius:99px;border:2px solid var(--line);background:#fff;box-shadow:0 2px 0 var(--line);font-family:var(--round);font-weight:700;font-size:14px;color:var(--ink);transition:transform .1s}
.lbtn svg{width:20px;height:20px}
.lbtn:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.lbtn[aria-expanded=true]{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 2px 0 #161a28}
.hd{position:relative}
.lpop{position:absolute;top:62px;inset-inline-end:60px;z-index:60;width:276px;padding:8px;border-radius:24px;background:#fffdf7;border:2px solid var(--line);box-shadow:0 6px 0 var(--line),0 24px 40px -18px rgba(80,40,0,.5);display:grid;grid-template-columns:1fr 1fr;gap:6px;transform-origin:85% 0;animation:lpIn .22s cubic-bezier(.3,1.5,.5,1)}
.lpop[hidden]{display:none}
@keyframes lpIn{from{opacity:0;transform:scale(.85) translateY(-6px)}}
.lpop button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;border-radius:16px;background:#f6efdd;padding:9px 12px;text-align:start;cursor:pointer;transition:background .12s,transform .1s}
.lpop button:hover{background:#ffe9b0}
.lpop button:active{transform:scale(.96)}
.lpop button b{font-size:15px;font-weight:900;line-height:1.2}
.lpop button small{white-space:nowrap;font-family:var(--round);font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
.lpop button[aria-selected=true]{background:var(--sun);box-shadow:0 3px 0 var(--sun2)}
.lpop button[aria-selected=true] small{color:#6a4200}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;justify-content:center;padding:12px 0 4px}
.tab{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:9px 16px;border-radius:99px;font-weight:900;font-size:15px;color:var(--ink2);transition:background .15s,color .15s}
.tab svg{width:22px;height:22px}
.tab[aria-selected=true]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #161a28}
.tab:not([aria-selected=true]):hover{background:#fff}
@media (max-width:760px){
  /* a backdrop-filter on the sticky header would make it the containing block of the fixed tab bar */
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff6e2}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;justify-content:space-around}
  .tab{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;border-radius:14px;flex:1;max-width:84px}
  .tab[aria-selected=true]{background:transparent;color:var(--coral2);box-shadow:none}
  .tab[aria-selected=true] svg{transform:translateY(-2px) scale(1.12)}
  .brand .wm b{font-size:16px}.brand img{width:40px;height:40px}.brand .wm small{font-size:10px}
  .lbtn{width:40px;padding:0;justify-content:center}.lbtn b{display:none}
  .lpop{top:56px;inset-inline-end:56px;width:min(260px,calc(100vw - 32px))}
  .hd{gap:8px;height:60px}
  .coin{font-size:15px}
}
@media (min-width:761px){ body{padding-bottom:40px} .coin.mob{display:none} }
/* phones: the coin pill leaves the header (the title needs the room) and sits on the hero / shop / gacha */
@media (max-width:760px){ #coinPill{display:none} .heroCoin{position:absolute;top:12px;inset-inline-end:12px;z-index:3;font-size:14px;padding:3px 10px 3px 4px} .heroCoin i{width:20px;height:20px} }

/* ---------- shared bits ---------- */
section.pg{display:none;padding:14px 0 24px}
section.pg.on{display:block;animation:pgIn .35s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}}
h2.h{font-family:var(--round);font-weight:700;font-size:22px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
h2.h::before{content:'';width:10px;height:22px;border-radius:5px;background:var(--coral);box-shadow:14px 0 0 var(--sun),28px 0 0 var(--sky);margin-right:30px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 22px;font-weight:900;font-size:16px;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral2);text-decoration:none;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral2)}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 var(--sky2)}.btn.sky:active{box-shadow:0 1px 0 var(--sky2)}
.btn.sun{background:var(--sun);color:#5a3a00;box-shadow:0 4px 0 var(--sun2)}.btn.sun:active{box-shadow:0 1px 0 var(--sun2)}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 var(--mint2)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:#d7dbe5;box-shadow:0 4px 0 #b9bfcd;color:#fff;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:7px;font-family:var(--round);font-weight:700;font-size:11.5px;letter-spacing:.06em;color:#fff}
.badge.new{background:var(--coral);box-shadow:0 2px 0 var(--coral2)}
.badge.update{background:var(--sky);box-shadow:0 2px 0 var(--sky2)}
.badge.beta{background:var(--grape);box-shadow:0 2px 0 var(--grape2)}
.badge.premium{background:linear-gradient(135deg,#ffe07a,#ffb21e);color:#6a4200;box-shadow:0 2px 0 #d48a00}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 6px;border-radius:99px;font-size:12px;font-weight:700;background:#fff;border:1.5px solid color-mix(in srgb,var(--c) 45%,#fff);color:color-mix(in srgb,var(--c) 85%,#000)}
.tag svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gicon{width:56px;height:56px;border-radius:16px;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.bar{height:10px;border-radius:99px;background:#efe8d6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--mint));transition:width .6s}

/* ---------- home hero: white stage, black & white title, floating toy pieces ---------- */
.hero{position:relative;margin-top:6px;border-radius:32px;overflow:hidden;height:420px;background:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.06),0 24px 40px -26px rgba(60,40,10,.45);display:grid;place-items:center}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 45%,#fff 40%,#f3f3f1 100%)}
.props{position:absolute;inset:0}
.props img{position:absolute;width:var(--w);left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--r));filter:drop-shadow(0 12px 10px rgba(0,0,0,.16));
  will-change:transform;cursor:pointer;transition:filter .2s;-webkit-user-drag:none;user-select:none}
.props img:hover{filter:drop-shadow(0 18px 14px rgba(0,0,0,.22)) brightness(1.04)}
@keyframes float{from{transform:translate(-50%,-50%) rotate(var(--r)) translateY(0)}to{transform:translate(-50%,-50%) rotate(calc(var(--r) + 6deg)) translateY(-12px)}}
.ttl{position:relative;z-index:2;margin:0;width:min(640px,96%);line-height:0;filter:drop-shadow(0 14px 18px rgba(0,0,0,.12))}
.ttl svg{width:100%;height:auto;overflow:visible}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){.hero{height:330px;border-radius:24px}.ttl{width:104%}}

/* ---------- home: updated row + icon grid ---------- */
.updrow{display:flex;gap:16px;overflow-x:auto;padding:30px 4px 16px;margin-top:-18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.updrow::-webkit-scrollbar{display:none}
/* featured update card: colour panel + 3D board popping out */
.ut{--c:#ff5d5d;flex:none;width:330px;scroll-snap-align:start;display:flex;flex-direction:column;border:0;padding:0;border-radius:28px;background:#fff;text-align:start;cursor:pointer;position:relative;
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,#3a2a10),0 18px 30px -16px rgba(80,40,0,.5);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.ut:hover{transform:translateY(-4px) rotate(-.6deg)}
.ut:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 55%,#3a2a10)}
.ut .pan{position:relative;height:150px;border-radius:28px 28px 0 0;overflow:visible;
  background:radial-gradient(120% 120% at 30% 0%,color-mix(in srgb,var(--c) 45%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000) 100%)}
.ut .pan::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:.18;background-image:radial-gradient(circle at 2px 2px,#fff 1.6px,transparent 2px);background-size:16px 16px}
.ut .pan img{position:absolute;left:50%;bottom:-4px;width:196px;z-index:1;transform:translateX(-50%);filter:drop-shadow(0 10px 8px rgba(0,0,0,.28));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ut:hover .pan img{transform:translateX(-50%) translateY(-8px) scale(1.04)}
.ut .new{position:absolute;top:12px;inset-inline-start:14px;display:flex;gap:5px;z-index:2}
.ut .dt{position:absolute;z-index:2;top:12px;inset-inline-end:14px;font-family:var(--round);font-weight:700;font-size:12px;color:#fff;background:rgba(0,0,0,.22);border-radius:99px;padding:3px 10px}
.ut .tx{padding:12px 16px 16px}
.ut b{display:block;font-size:18px;font-weight:900;line-height:1.25}
.ut p{margin:5px 0 0;font-size:13px;font-weight:700;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
@media (max-width:560px){.ut{width:270px}.ut .pan{height:124px}.ut .pan img{width:160px}}

/* game icons: the diamond-based 3D icon stands on its own, name below (phone: 4 per row) */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 12px;padding:10px 0 6px}
.ic{--c:#ff5d5d;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;padding:4px 2px;background:none;text-align:center;cursor:pointer;border-radius:20px}
.ic .art{position:relative;width:100%;aspect-ratio:1}
.ic .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(60,30,0,.18));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ic:hover .art img,.ic:focus-visible .art img{transform:translateY(-8px) scale(1.05)}
.ic:active .art img{transform:scale(.94)}
.ic .art img.flat{inset:14%;width:72%;height:72%;border-radius:24%}
.ic .no{display:none}
.ic .bdg{position:absolute;top:2px;inset-inline-end:0;z-index:3;display:flex;gap:4px}
.ic .bdg .badge{height:19px;font-size:10px;padding:0 6px}
.ic .lab{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.ic span.n{font-weight:900;font-size:14px;line-height:1.25}
.ic .pr{width:56%;height:6px;border-radius:9px;background:#efe6d0;overflow:hidden}
.ic .pr i{display:block;height:100%;background:var(--c);border-radius:9px}
@media (max-width:560px){
  .igrid{grid-template-columns:repeat(4,1fr);gap:12px 4px}
  .ic{gap:3px;padding:2px 0}
  .ic span.n{font-size:10.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ic .bdg{top:-2px;inset-inline-end:-2px}.ic .bdg .badge{height:15px;font-size:8px;padding:0 4px;border-radius:5px}
  .ic .pr{height:4px;width:60%}
}

/* small 3D tile used in cards / viewer */
.g3{--c:#ff5d5d;flex:none;width:58px;height:58px;border-radius:17px;position:relative;overflow:visible;
  background:radial-gradient(110% 110% at 30% 0%,color-mix(in srgb,var(--c) 40%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 72%,#000));box-shadow:0 3px 0 color-mix(in srgb,var(--c) 50%,#3a2a10)}
.g3 img{position:absolute;left:50%;top:50%;width:112%;transform:translate(-50%,-46%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.g3 img.flat{width:76%;border-radius:22%}

/* ---------- board viewer (3D) ---------- */
.bv{position:fixed;inset:0;z-index:70;display:none;background:#b57a45}
.bv.on{display:block;animation:fadeIn .25s}
#gl{position:absolute;inset:0;touch-action:none}
#gl canvas{display:block;width:100%!important;height:100%!important}
.bv .x{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:14px;z-index:3}
/* info card: always docked at the bottom; on wide screens it spans the width in two columns */
.bvi{position:absolute;z-index:2;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1080px,calc(100% - 24px));padding:16px 18px;border-radius:26px;background:rgba(255,253,247,.95);backdrop-filter:blur(8px);border:2px solid #fff;box-shadow:0 18px 40px -18px rgba(80,40,0,.55);transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.bv.playing .bvi{transform:translateX(-50%) translateY(140%);opacity:0;pointer-events:none}
.bvi .cols{display:block}
.bvi .row{display:flex;gap:12px;align-items:center}
.bvi h3{margin:0;font-size:22px;font-weight:900}
.bvi .bd{display:flex;gap:5px;margin-top:4px}
.bvi .tags{margin-top:10px}
.bvi .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bvi label{font-size:12px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:6px}
.bvi select{height:38px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:0 8px;font-weight:900}
.bvi .act{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.bvi .act .btn.big{font-size:19px;padding:14px 34px}
.bvi .soon{font-size:13px;font-weight:700;color:var(--ink2);margin-top:10px}
.bvi .pgl{margin-top:10px}
@media (min-width:820px){
  .bvi{padding:24px 30px;border-radius:30px;bottom:24px}
  .bvi .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 36px;align-items:center}
  .bvi .R{border-inline-start:2px dashed var(--line);padding-inline-start:32px;display:flex;flex-direction:column;justify-content:center}
  .bvi h3{font-size:32px}
  .bvi .g3{width:76px;height:76px;border-radius:22px}
  .bvi .ring{width:64px;height:64px;font-size:15px}
  .bvi .badge{height:25px;font-size:13px;padding:0 11px}
  .bvi .tags{margin-top:14px;gap:7px}.bvi .tag{height:30px;font-size:14.5px;padding:0 12px 0 8px}.bvi .tag svg{width:17px;height:17px}
  .bvi .pgl{margin-top:14px;font-size:15px;gap:8px 12px}.bvi .pgl b{font-size:15px}.bvi .pgl .bar{height:12px}
  .bvi .opts{margin-top:0;gap:14px 22px}
  .bvi label{font-size:15px;gap:10px}
  .bvi select{height:48px;font-size:17px;padding:0 14px;border-radius:14px;min-width:120px}
  .bvi .act{margin-top:18px;gap:14px}
  .bvi .act .btn.big{font-size:24px;padding:18px 48px;flex:1;max-width:340px}
  .bvi .act .btn.sm{font-size:16px;padding:12px 20px}
  .bvi .soon{font-size:16px;margin-top:0}
}
.hud{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-160%);display:flex;align-items:center;gap:8px;padding:6px;border-radius:99px;background:rgba(255,253,247,.95);border:2px solid #fff;box-shadow:0 10px 24px -12px rgba(80,40,0,.5);transition:transform .45s cubic-bezier(.3,1.3,.5,1);max-width:calc(100% - 120px)}
.bv.playing .hud{transform:translateX(-50%)}
@media (max-width:560px){
  .hud{top:auto;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(160%);max-width:calc(100% - 20px)}
  .hud .hs{padding:6px 10px;font-size:13px}.hud .hm{min-width:0;font-size:12px}
}
.hud .hs{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-weight:900;font-size:14px;white-space:nowrap}
.hud .hs.on{background:var(--sun);box-shadow:0 3px 0 var(--sun2)}
.hud .hs b{font-family:var(--round);font-size:20px;min-width:24px;text-align:center}
.hud .hm{font-weight:900;font-size:13px;color:var(--ink2);padding:0 6px;white-space:nowrap;min-width:60px;text-align:center}
.dk{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.dk.b{background:#24262d}.dk.w{background:#f6f3ea;border:1px solid #d9d2bf}
.bv .quit{position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top));inset-inline-start:14px;display:none}
.bv.playing .quit{display:inline-flex}
.magic{position:fixed;inset:0;z-index:95;pointer-events:none}
.magic i{position:absolute;display:block;background:currentColor;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px currentColor)}
.magic b{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,248,220,.5) 45%,rgba(255,255,255,0))}
.magic .smoke{position:absolute;width:0;height:0}
.magic .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(255,250,225,.85) 40%,rgba(255,240,200,.35) 75%,rgba(255,255,255,0))}
.magic .rays{position:absolute;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.75) 0 6deg,rgba(255,236,160,0) 6deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 15%,rgba(0,0,0,.6) 45%,transparent 70%);mask:radial-gradient(closest-side,#000 15%,rgba(0,0,0,.6) 45%,transparent 70%)}
.magic .smoke span{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff 0 48%,#f2f0f6 70%,#d6d0e2 100%);box-shadow:inset -6px -8px 0 rgba(150,135,185,.22),0 0 0 3px rgba(255,255,255,.9)}
.magic .smoke .core{background:radial-gradient(circle at 40% 35%,#fff 0 55%,#f3f0f8 80%,#e2dcec 100%);box-shadow:inset -10px -12px 0 rgba(150,135,185,.2)}
.burst{position:fixed;z-index:3;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:10px solid #fff;animation:bRing .5s cubic-bezier(.2,.8,.3,1) forwards}
.burst b{position:absolute;left:-5px;top:-5px;width:10px;height:44px;border-radius:6px;background:#fff;transform:rotate(var(--a)) translateY(-70px);animation:bRay .45s cubic-bezier(.2,.8,.3,1) forwards;box-shadow:0 0 0 3px rgba(255,201,40,.7)}
@keyframes bRing{from{transform:scale(.25);opacity:1}to{transform:scale(1.9);opacity:0;border-width:2px}}
@keyframes bRay{from{transform:rotate(var(--a)) translateY(-40px) scaleY(.4);opacity:1}to{transform:rotate(var(--a)) translateY(-190px) scaleY(1);opacity:0}}
.endc{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:10px;padding:22px 26px;border-radius:28px;background:rgba(255,253,247,.97);border:3px solid #fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);text-align:center;min-width:260px}
.endc.on{display:flex;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.endc h3{margin:0;font-family:var(--round);font-size:30px}
.endc .sc{font-family:var(--round);font-weight:700;font-size:20px;color:var(--ink2)}
/* ---------- home: compact profile (one update-card wide) + today's game ---------- */
.toprow{display:grid;grid-template-columns:503px minmax(0,1fr);gap:16px;margin-top:18px}   /* the gap sits under the centre of the 2nd update card (330 + 16 + 165 − 8) */
.prof{position:relative;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:10px;border-radius:28px;border:0!important;box-shadow:0 6px 0 #e9dcc0,0 14px 28px -14px rgba(120,80,20,.4)!important}   /* same solid edge as Today's game, so both read the same size */
.prof .bgfill{position:absolute;inset:0;opacity:.9}
.prof .bgfill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,253,247,.15) 0%,rgba(255,253,247,.93) 38%)}
[dir=rtl] .prof .bgfill::after{background:linear-gradient(270deg,rgba(255,253,247,.15) 0%,rgba(255,253,247,.93) 38%)}
.prof > *{position:relative}
.prof .pr1{display:flex;gap:12px;align-items:center}
.prof .who{flex:1;min-width:0}
.av{flex:none;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.1);display:grid;place-items:center;border:0;padding:0;position:relative}
.av .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font:700 11px var(--round);color:#fff;background:var(--grape);border-radius:99px;padding:1px 7px;box-shadow:0 2px 0 var(--grape2);white-space:nowrap}
.prof input{border:0;border-bottom:2px dashed #d8c9a6;background:transparent;font-size:18px;font-weight:900;width:100%;padding:1px 0;outline:none}
.prof input:focus{border-bottom-color:var(--sky)}
.stats{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;align-items:center}
.stats .coin{font-size:13.5px;padding:2px 8px 2px 3px;box-shadow:none;gap:4px}.stats .coin i{width:18px;height:18px;font-size:10px}
.stats .st{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 7px;border-radius:99px;background:#fff;border:2px solid var(--line);font:700 12.5px var(--round);white-space:nowrap}
.stats .st small{font-size:11px;color:var(--ink2)}
.strk{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:900;color:var(--ink2);background:rgba(255,255,255,.75);border-radius:12px;padding:5px 10px}
.strk .wk{display:flex;gap:4px}
.strk .wk i{width:11px;height:11px;border-radius:50%;background:#efe3c8}
.strk .wk i.on{background:var(--sun);box-shadow:0 1.5px 0 var(--sun2)}
.strk .wk i.big{border-radius:3px;transform:rotate(45deg) scale(.9)}.strk .wk i.big.on{background:linear-gradient(135deg,#ff9bd0,#a78bff);box-shadow:none}
.acc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.acc img{width:22px;height:22px;border-radius:50%}
.acc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.gbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px 4px 8px;font-weight:900;font-size:12.5px;box-shadow:0 2px 0 var(--line)}
.gbtn svg{width:16px;height:16px}
.acc .ok{color:var(--mint2)}
.acc .btn.sm{padding:4px 10px;font-size:12px}
/* today's game: colour panel with the 3D icon + a short history; the whole card opens the board */
.today{--c:#ff5d5d;display:flex;align-items:stretch;padding:0;border:0;text-align:start;cursor:pointer;overflow:visible;border-radius:28px;background:#fff;color:inherit;
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,#3a2a10),0 18px 30px -16px rgba(80,40,0,.5);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.today:hover{transform:translateY(-3px)}
.today:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 55%,#3a2a10)}
.today .pan{flex:none;width:250px;position:relative;border-radius:28px 0 0 28px;
  background:radial-gradient(120% 120% at 30% 0%,color-mix(in srgb,var(--c) 45%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000) 100%)}
[dir=rtl] .today .pan{border-radius:0 28px 28px 0}
.today .pan::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:.18;background-image:radial-gradient(circle at 2px 2px,#fff 1.6px,transparent 2px);background-size:16px 16px}
.today .pan img{position:absolute;left:50%;top:50%;width:208px;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 8px rgba(0,0,0,.28));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.today:hover .pan img{transform:translate(-50%,-56%) scale(1.05) rotate(-3deg)}
.today .tx{flex:1;min-width:0;padding:14px 20px 16px;display:flex;flex-direction:column;gap:6px}
.today .kk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.today .lbl{font:900 12.5px var(--font);letter-spacing:.06em;color:#fff;background:var(--coral);border-radius:99px;padding:3px 11px;box-shadow:0 2px 0 var(--coral2);white-space:nowrap}
.today .dt{font:700 12px var(--round);color:var(--ink2);white-space:nowrap}
.today b{font-size:24px;font-weight:900;line-height:1.2}
.today .hs{font-size:13.5px;font-weight:700;color:#4a5068;line-height:1.65}
.today .ft{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.today .ft .tags{flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent)}
.today .ft .tags > *{flex:none;white-space:nowrap}
.today .ft .btn{flex:none;margin-inline-start:auto}
@media (max-width:860px){.toprow{grid-template-columns:minmax(0,1fr);gap:14px}.toprow > *{min-width:0}}
@media (max-width:600px){
  .toprow{margin-top:14px}
  .prof{padding:12px 14px;gap:8px;border-radius:22px}
  .today{border-radius:22px;flex-direction:column}
  .today .pan{width:auto;height:96px;border-radius:22px 22px 0 0}
  [dir=rtl] .today .pan{border-radius:22px 22px 0 0}
  .today .pan img{width:132px;top:auto;bottom:-14px;transform:translateX(-50%)}
  .today:hover .pan img{transform:translateX(-50%) translateY(-4px)}
  .today .tx{padding:12px 14px 14px}
  .today b{font-size:20px}.today .hs{font-size:13px;line-height:1.6}
}
/* home game list: category chips + search */
.gfilter{display:flex;align-items:center;gap:10px;margin:-2px 0 4px}
.gfilter .cats{flex:1;min-width:0;padding-bottom:4px}
.chip.cat{padding:6px 13px}
.gsearch{flex:none;display:flex;align-items:center;gap:6px;width:240px;height:40px;padding:0 12px;border-radius:99px;background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);margin-bottom:4px}
.gsearch:focus-within{border-color:var(--sky)}
.gsearch span{display:grid;color:var(--ink2)}
.gsearch svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.gsearch input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:14.5px;font-weight:700;height:100%}
.gnone{text-align:center;font-weight:900;color:var(--ink2);padding:22px 0}
.gnone[hidden]{display:none}
@media (max-width:760px){.gfilter{flex-direction:column-reverse;align-items:stretch;gap:8px}.gsearch{width:auto;margin:0}.gfilter .cats{margin:0 -16px;padding:2px 16px 4px}}
/* random tile */
.ic.rnd .art svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 6px rgba(60,30,0,.18));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ic.rnd:hover .art svg{transform:translateY(-8px) scale(1.05)}
.ic.rnd .cube{transform-origin:100px 90px;animation:dieIdle 3.2s ease-in-out infinite}
@keyframes dieIdle{0%,70%,100%{transform:none}78%{transform:translateY(-12px) rotate(-8deg)}86%{transform:translateY(0) rotate(4deg)}92%{transform:rotate(0)}}
.ic.rnd .pr i{background:linear-gradient(90deg,var(--coral),var(--sun),var(--mint),var(--sky),var(--grape))}
.ic.rnd.roll .art svg{animation:dieRoll .3s ease-in forwards}
@keyframes dieRoll{40%{transform:translateY(-22px) rotate(-14deg) scale(1.06)}100%{transform:translateY(0) scale(.2);opacity:0}}
.ic.rnd .rimg[hidden]{display:none}
/* login bonus popup: a guide character pops up with a speech bubble */
.sheet.lbs{width:min(420px,100%);padding:0 0 22px;overflow:hidden}
.lbp h3{margin:12px 0 10px}
.lb-sky{position:relative;height:210px;background:radial-gradient(120% 100% at 50% 0%,#fff6c9 0%,#ffd76a 55%,#ffb43d 100%);overflow:hidden}
.lb-sky .rays{position:absolute;left:50%;top:62%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.5) 0 8deg,rgba(255,255,255,0) 8deg 22deg);animation:spin 14s linear infinite;-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 75%);mask:radial-gradient(closest-side,#000 20%,transparent 75%)}
.lb-ch{position:absolute;left:24px;bottom:-14px;width:170px;height:170px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(120,60,0,.3));transform-origin:50% 100%;animation:lbPop .7s cubic-bezier(.3,1.6,.5,1) both,lbBob 2.4s .8s ease-in-out infinite}
@keyframes lbPop{0%{transform:translateY(110%) scale(.6)}60%{transform:translateY(-6%) scale(1.06,.96)}100%{transform:none}}
@keyframes lbBob{50%{transform:translateY(-6px) rotate(-2deg)}}
.lb-bub{position:absolute;right:16px;top:26px;width:min(200px,calc(100% - 196px));background:#fff;border-radius:20px;padding:10px 13px;text-align:start;font-size:14px;font-weight:900;line-height:1.5;color:var(--ink);box-shadow:0 4px 0 rgba(150,90,0,.25);animation:lbBub .45s .45s cubic-bezier(.3,1.6,.5,1) both}
.lb-bub::before{content:'';position:absolute;left:-12px;bottom:22px;border:9px solid transparent;border-right:14px solid #fff;border-left:0}
.lb-bub b{display:block;font-size:11px;letter-spacing:.06em;color:var(--sun2);margin-bottom:1px}
[dir=rtl] .lb-ch{left:auto;right:24px}[dir=rtl] .lb-bub{right:auto;left:16px}[dir=rtl] .lb-bub::before{left:auto;right:-12px;border-right:0;border-left:14px solid #fff}
@keyframes lbBub{from{transform:scale(.3) translateY(20px);opacity:0}}
.lb-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 20px}
.lb-week span{aspect-ratio:1;border-radius:12px;background:#f4ecd8;display:grid;place-items:center;font:700 14px var(--round);color:#b8a77e}
.lb-week span.on{background:var(--sun);color:#6a4200;box-shadow:0 3px 0 var(--sun2)}
.lb-week span.big{background:linear-gradient(135deg,#ffd5ec,#d8c8ff);color:var(--grape2)}
.lb-week span.big.on{background:linear-gradient(135deg,#ff9bd0,#a78bff);color:#fff;box-shadow:0 3px 0 var(--grape2)}
.lb-week span.now{animation:lbNow .6s .7s cubic-bezier(.3,1.8,.5,1) both;outline:3px solid #fff;outline-offset:-3px}
@keyframes lbNow{0%{transform:scale(.4) rotate(-20deg)}100%{transform:none}}
.lb-st{font-size:12.5px;font-weight:900;color:var(--ink2);margin:10px 16px 0}
.lbp .total{margin:10px 0 14px}
.lbp .total i{animation:lbCoin 1.2s ease-in-out infinite}
@keyframes lbCoin{50%{transform:rotateY(180deg)}}
.lbp .btn.big{font-size:18px;padding:13px 40px}
.flycoin{position:fixed;z-index:120;width:26px;height:26px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc928 45%,#e09a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),0 0 10px rgba(255,210,60,.8)}
@media (max-width:420px){.lb-sky{height:190px}.lb-ch{width:148px;height:148px;left:10px}.lb-bub{width:calc(100% - 160px);font-size:13px;right:12px}}
.sfxb.off{color:var(--ink2)}
.sfxb.off svg path:first-child{opacity:.6}

/* ---------- game cards ---------- */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gc{padding:14px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:transform .15s}
.gc:hover{transform:translateY(-3px)}
.gc .top{display:flex;gap:12px;align-items:center}
.gc h4{margin:0;font-size:17px;font-weight:900;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gc .bd{display:flex;gap:4px;margin-top:4px}
.gc .bd .badge{height:19px;font-size:10px;padding:0 6px}
.ring{flex:none;margin-left:auto;width:52px;height:52px;position:relative;display:grid;place-items:center;font-family:var(--round);font-weight:700;font-size:13px}
[dir=rtl] .ring{margin-left:0;margin-right:auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pgl{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink2)}
.pgl b{font-family:var(--round);color:var(--ink);font-size:12.5px;text-align:end}
.gc .about{margin:0;font-size:13px;font-weight:700;color:#4a5068;background:#f7f0de;border-radius:12px;padding:8px 11px;line-height:1.6}
.gc .ft{display:flex;align-items:center;gap:8px;margin-top:auto}
.gc .ft .btn{margin-inline-start:auto}

/* ---------- achievements ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.hsc{position:relative}
.hsn{position:absolute;top:calc(50% - 4px);transform:translateY(-50%);z-index:2;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(43,48,68,.42);color:#fff;font:900 22px/1 var(--round);display:grid;place-items:center;padding:0 0 3px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 3px 10px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .2s,background .15s}
.hsn.l{left:-6px}.hsn.r{right:-6px}
.hsn.on{opacity:1;pointer-events:auto}
.hsn:hover{background:rgba(43,48,68,.68)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px 5px 6px;font-weight:900;font-size:13.5px;box-shadow:0 2px 0 var(--line)}
.chip img{width:24px;height:24px;border-radius:7px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 2px 0 #161a28}
.chip em{font-style:normal;font-family:var(--round);font-size:12px;opacity:.7}
.achsum{display:flex;gap:10px;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px}
.ach.todo{background:#fbf7ee;box-shadow:none}
.medal{flex:none;width:46px;height:46px;position:relative}
.ach.todo .medal{filter:grayscale(1);opacity:.45}
.ach .tx{flex:1;min-width:0}
.ach .t1{font-weight:900;font-size:14.5px;line-height:1.35}
.ach .t2{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--round);font-size:12px;color:var(--ink2)}
.ach .t2 .bar{flex:1;height:8px}
.ach .rw{flex:none;font-family:var(--round);font-weight:700;font-size:13px;color:#a66a00;display:flex;align-items:center;gap:3px}
.ach .rw i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc928 45%,#e09a00)}
.ach .gi{width:20px;height:20px;border-radius:6px;vertical-align:-4px;margin-inline-end:5px}

/* ---------- items (shop / dress / gacha results) ---------- */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{position:relative;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border-radius:22px}
.item .art{width:100%;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;background:#f6efdd;overflow:hidden}
.item .art svg{width:82%;height:82%}
.item[data-kind=bg] .art svg{width:100%;height:100%}
.item .nm{font-weight:900;font-size:13.5px;line-height:1.3;min-height:2.6em;display:flex;align-items:center}
.rar{position:absolute;top:8px;inset-inline-start:8px;font-family:var(--round);font-weight:700;font-size:11px;color:#fff;padding:2px 8px;border-radius:7px;background:var(--rc);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:linear-gradient(135deg,#ff7fbe,#ffb21e,#36b4ff)}
.item.r3 .art,.item.r4 .art{background:radial-gradient(circle at 50% 40%,#fff,#f3e6ff)}
.item.r4 .art{background:radial-gradient(circle at 50% 40%,#fffbe8,#ffe7a8);box-shadow:inset 0 0 0 3px #ffd24a}
.item.locked .art svg{filter:brightness(0) opacity(.12)}
.item .kd{font-size:11px;font-weight:700;color:var(--ink2)}
.item.sel{outline:4px solid var(--sky);outline-offset:-2px}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.dbar .seg{margin:0}
.dsort{display:flex;gap:4px;padding:4px;border-radius:99px;background:#fff;border:2px solid var(--line)}.dsort button{border:0;background:none;font:inherit;font-weight:800;font-size:13px;color:var(--ink2);padding:6px 12px;border-radius:99px;cursor:pointer}.dsort button[aria-pressed=true]{background:var(--ink);color:#fff}
#dItems .item.sel{position:relative}#dItems .item.sel::after{content:'✓';position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--sky);color:#fff;font-weight:900;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.price{display:inline-flex;align-items:center;gap:4px}
.price i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc928 45%,#e09a00)}
.shophead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.shophead .note{font-size:13px;font-weight:700;color:var(--ink2)}
.how{font-size:13px;font-weight:700;color:var(--ink2);background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px 14px;margin-top:16px}

/* ---------- gacha ---------- */
.gacha{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:stretch}

.machine{display:grid;place-items:center;padding:16px}
.machine svg{width:min(320px,80vw);height:auto;overflow:visible}
.machine.shake svg{animation:shake .7s}
@keyframes shake{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
#knob{transform-origin:160px 300px;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
/* 3D capsule machine (gacha3d.js) */
.machine.m3{position:relative;display:block;padding:0;height:clamp(440px,calc(100vh - 210px),640px);border-radius:30px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  background:radial-gradient(60% 46% at 50% 30%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),linear-gradient(180deg,#fff3dc 0,#ffe9cf 58%,#f8d9bd 100%);box-shadow:inset 0 0 0 3px #fff,0 10px 30px -18px rgba(120,70,0,.45)}
.machine.m3::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.7) 0 2px,transparent 3px) 0 0/46px 46px,radial-gradient(circle at 60% 70%,rgba(255,200,160,.35) 0 2px,transparent 3px) 0 0/58px 58px}
.machine.m3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (max-width:760px){.machine.m3{height:min(440px,58vh);min-height:330px;border-radius:26px}}
.g3ui{position:absolute;inset:0;pointer-events:none;font-family:var(--round)}
.g3hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink2);background:rgba(255,255,255,.8);border-radius:99px;padding:3px 12px;opacity:0;transition:opacity .4s;white-space:nowrap}
.g3hint.on{opacity:1;animation:g3blink 1.6s 1.2s infinite}
@keyframes g3blink{50%{opacity:.45}}
.gxp{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(250px,72%);animation:gxUp .7s cubic-bezier(.25,1.4,.5,1) both}
@keyframes gxUp{from{transform:translate(-50%,-30%) scale(.2);opacity:0}}
.gxp .ga{position:relative;width:min(170px,44vw);aspect-ratio:1;border-radius:26px;background:radial-gradient(circle at 50% 42%,#fff,#fff8ea 70%);border:4px solid #fff;box-shadow:0 0 0 3px var(--rc),0 14px 30px -10px rgba(0,0,0,.35),0 0 40px 6px color-mix(in srgb,var(--rc) 55%,transparent);overflow:hidden;display:grid;place-items:center}
.gxp .ga svg{width:92%;height:92%}
.gxp.r4 .ga{box-shadow:0 0 0 3px #ffd24a,0 14px 30px -10px rgba(0,0,0,.35),0 0 46px 12px #ffd24a;animation:glow4 1.4s infinite alternate}
@keyframes glow4{to{box-shadow:0 0 0 3px #ff9bd0,0 14px 30px -10px rgba(0,0,0,.35),0 0 60px 18px #ff9bd0}}
.gxp .gxr{position:absolute;top:calc(min(170px,44vw)/2);left:50%;width:calc(min(170px,44vw)*1.55);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 45%,transparent) 0 12deg,transparent 12deg 30deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:gxSpin 9s linear infinite}
.gxp.r4 .gxr{background:repeating-conic-gradient(#ff7fbe88 0 10deg,transparent 10deg 20deg,#ffd24a88 20deg 30deg,transparent 30deg 40deg,#36b4ff88 40deg 50deg,transparent 50deg 60deg)}
@keyframes gxSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.gxl{display:flex;gap:6px;align-items:center;margin-top:4px}
.gxp .rr,.gxc .rr{font-weight:700;font-size:13px;color:#fff;background:var(--rc);border-radius:8px;padding:1px 9px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.gxp.r4 .rr,.gxc.r4 .rr{background:linear-gradient(135deg,#ff7fbe,#ffb21e,#36b4ff)}
.gxp .nw{background:var(--coral);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px;box-shadow:0 2px 0 var(--coral2)}
.gxp .dp{font-size:12px;font-weight:700;background:#fff7d6;color:#a66a00;border-radius:8px;padding:0 8px;border:1.5px solid #ffd24a}
.gxp .gxn{font-family:var(--round),var(--sans,inherit);font-weight:900;font-size:17px;line-height:1.25;text-align:center;color:var(--ink);background:rgba(255,255,255,.88);border-radius:12px;padding:3px 12px;max-width:100%}
.g3chips .gxc{position:absolute;transform:translate(-50%,-62%);width:clamp(48px,12%,74px);display:flex;flex-direction:column;align-items:center;gap:2px;animation:gxUp .45s cubic-bezier(.25,1.5,.5,1) both}
.gxc .ga{width:100%;aspect-ratio:1;border-radius:14px;background:#fff;border:2.5px solid #fff;box-shadow:0 0 0 2px var(--rc),0 6px 12px -6px rgba(0,0,0,.4);overflow:hidden;display:grid;place-items:center}
.gxc .ga svg{width:100%;height:100%}
.gxc.r3 .ga,.gxc.r4 .ga{box-shadow:0 0 0 2px var(--rc),0 0 16px 4px var(--rc)}
.gxc .rr{font-size:10px;padding:0 6px}
.gxc .nd{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.g3act{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:10px;justify-content:center;pointer-events:auto;opacity:0;visibility:hidden}
.g3act.on{opacity:1;visibility:visible;animation:gxAct .4s .3s both}
@keyframes gxAct{from{opacity:0;transform:translateY(12px)}}
.g3act:empty{display:none}
.sheet.gres .cap .in{transition:none}
.sheet.gres .cap{animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
.sheet.gres .cap.c3.open .b{box-shadow:0 0 0 3px #fff,0 0 22px 5px #d4a8ff;animation:glow3 1.4s infinite alternate}
@keyframes glow3{to{box-shadow:0 0 0 3px #fff,0 0 30px 9px #b46bff}}
.gpanel{padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;border-radius:30px}
.ghead{display:flex;align-items:center;gap:10px}
.ghead .gico{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.gpanel h3{margin:0;font-family:var(--round);font-size:26px;line-height:1.15}
.gwallet{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff8e6;border:2px solid #ffe6a6;border-radius:16px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink2)}
.gwallet b{font-family:var(--round);font-size:22px;color:#a66a00;gap:6px}
.gwallet b i{width:22px;height:22px}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gbig{position:relative;flex-direction:column;gap:6px;padding:18px 10px 16px;border-radius:26px;min-height:116px;font-size:19px;white-space:normal;text-align:center;line-height:1.2}
.gbig .gl{font-family:var(--round);font-weight:700}
.gbig .price{font-family:var(--round);font-size:15px;font-weight:700;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 10px 2px 4px}
.gbig .price i{width:18px;height:18px}
.gbadge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-style:normal;white-space:nowrap;font-family:var(--round);font-size:11.5px;font-weight:700;color:#fff;padding:2px 10px;border-radius:99px;background:linear-gradient(135deg,#b46bff,#36b4ff);box-shadow:0 2px 0 rgba(0,0,0,.15);border:2px solid #fff}
.gbig.short{background:#eceef3;color:#8d94a8;box-shadow:0 4px 0 #d3d7e0;opacity:1}
.gbig.short .price{background:#fff;color:#8d94a8}
.gbig .gneed{font-size:12px;font-weight:700;color:var(--coral2)}
.gsec{display:flex;flex-direction:column;gap:8px}
.gst{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:900;color:var(--ink2)}
.gcnt{font-family:var(--round);font-weight:700;font-size:14px;color:var(--ink)}
.rates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-family:var(--round);font-size:12px;font-weight:700}
.rates span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:12px;background:#fff;border:2px solid var(--line);color:var(--ink2)}
.rates span i{width:14px;height:14px;border-radius:50%;background:linear-gradient(#fff 0 46%,var(--rc) 46%);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08)}
.rates span.r4 i{background:linear-gradient(#fff 0 46%,transparent 46%),conic-gradient(#ff7fbe,#ffb21e,#3ccf91,#36b4ff,#b46bff,#ff7fbe)}
.rates span b{font-size:13px;color:var(--ink)}
.gbar{height:12px;border-radius:99px;background:#efe8d6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3ccf91,#36b4ff,#b46bff)}
.glink{align-self:flex-start;border:0;background:none;padding:2px 0;font:inherit;font-weight:900;font-size:13.5px;color:var(--sky2);cursor:pointer}
.glink:hover{text-decoration:underline}
.gfoot{margin:0;font-size:11.5px;font-weight:700;color:var(--ink2);opacity:.85}
@media (max-width:760px){
  .gpanel{padding:16px;gap:14px}
  .gpanel .ghead{display:none}
  .gpanel .gwallet{order:-2}
  .gpanel .gbtns{order:-1}
  .gbig{min-height:84px;font-size:17px}
  #pg-gacha{padding-bottom:calc(96px + env(safe-area-inset-bottom))}   /* clear the bottom tab bar */
}
.gnote{font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.6}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,30,15,.55);backdrop-filter:blur(4px)}
.ov.on{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;border-radius:28px;background:var(--paper);border:3px solid #fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.sheet h3{margin:0 0 14px;font-family:var(--round);font-size:24px}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0 18px}
.res.one{grid-template-columns:minmax(0,200px);justify-content:center}
@media (max-width:560px){.res{grid-template-columns:repeat(3,1fr)}}
.cap{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;perspective:600px}
.cap .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.cap.open .in{transform:rotateY(180deg)}
.cap .f,.cap .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cap .f{background:radial-gradient(circle at 40% 30%,#fff,var(--cc) 60%);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.cap .f::before{content:'';width:70%;aspect-ratio:1;border-radius:50%;background:linear-gradient(#fff 0 48%,#2b3044 48% 52%,var(--cc) 52%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.cap .b{transform:rotateY(180deg);background:#fff;border:3px solid var(--cc);padding:6px}
.cap .b svg{width:72%;height:auto}
.cap .b .n{font-size:11px;font-weight:900;line-height:1.2}
.cap .b .rr{font-family:var(--round);font-weight:700;font-size:11px;color:#fff;background:var(--cc);border-radius:6px;padding:1px 7px}
.cap .b .nw{position:absolute;top:-8px;inset-inline-end:-6px;background:var(--coral);color:#fff;font-family:var(--round);font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;box-shadow:0 2px 0 var(--coral2)}
.cap .b .dp{position:absolute;bottom:-8px;font-family:var(--round);font-size:11px;font-weight:700;background:#fff7d6;color:#a66a00;border-radius:8px;padding:1px 7px;border:1.5px solid #ffd24a}
.cap.c0{--cc:#b9c1d1}.cap.c1{--cc:#3ccf91}.cap.c2{--cc:#36b4ff}.cap.c3{--cc:#b46bff}.cap.c4{--cc:#ffb21e}
.cap.c4.open .b{box-shadow:0 0 0 4px #fff,0 0 24px 6px #ffd24a;animation:glow 1.4s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 4px #fff,0 0 34px 12px #ff9bd0}}
.newach{display:flex;flex-direction:column;gap:8px;text-align:start;margin-bottom:16px}
.newach .ach{background:#fff;border:2px solid var(--line)}
.total{font-family:var(--round);font-weight:700;font-size:28px;color:#a66a00;display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 16px}
.total i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc928 45%,#e09a00)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:900;font-size:14px;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* ---------- dress ---------- */
.dress{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.dress{grid-template-columns:1fr}}
.dprev{padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:90px;overflow:hidden}
.dprev .bgfill{position:absolute;inset:0;opacity:.85}
.dprev > *:not(.bgfill){position:relative}
@media (max-width:760px){.dprev{position:relative;top:auto;flex-direction:row}}
.dprev .dname{text-align:center;padding:8px 18px 9px;border-radius:16px;background:rgba(255,253,247,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 16px rgba(60,40,10,.12);border:2px solid rgba(255,255,255,.9)}
.dprev .dname b{font-size:20px;color:var(--ink)}.dprev .dname .gnote{color:#5a6078;font-weight:700}
.dprev.dark .dname{background:rgba(22,26,44,.72);border-color:rgba(255,255,255,.18)}.dprev.dark .dname b,.dprev.dark .dname .gnote{color:#fff}
/* dress-up preview: tap the character → it reacts (hop / spin / wiggle / squish / dance / flip) */
.dprev .poke{border:0;padding:0;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
#dItems .item.wearable{cursor:pointer;transition:transform .15s}#dItems .item.wearable:hover{transform:translateY(-3px)}#dItems .item.wearable:active{transform:scale(.97)}
.dprev .poke .av-ch{transform-box:fill-box;transform-origin:50% 90%;animation:avIdle 3.2s ease-in-out infinite}
@keyframes avIdle{50%{transform:scale(1.025,.975)}}
.dprev .poke.p-hop .av-ch{animation:avHop .9s cubic-bezier(.3,.7,.4,1)}
@keyframes avHop{0%{transform:none}12%{transform:scale(1.14,.82)}38%{transform:translateY(-34%) scale(.9,1.12)}55%{transform:translateY(-38%) scale(1)}78%{transform:scale(1.12,.86)}90%{transform:scale(.96,1.05)}100%{transform:none}}
.dprev .poke.p-spin .av-ch{animation:avSpin .9s cubic-bezier(.4,.1,.3,1)}
@keyframes avSpin{0%{transform:none}15%{transform:translateY(-6%)}35%{transform:translateY(-14%) scaleX(-1)}55%{transform:translateY(-14%) scaleX(1)}75%{transform:translateY(-6%) scaleX(-1)}92%{transform:scale(1.06,.94)}100%{transform:none}}
.dprev .poke.p-wiggle .av-ch{animation:avWig .8s ease-in-out}
@keyframes avWig{0%,100%{transform:none}15%{transform:rotate(-12deg)}35%{transform:rotate(11deg)}55%{transform:rotate(-8deg)}75%{transform:rotate(5deg)}}
.dprev .poke.p-squish .av-ch{animation:avSq .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes avSq{0%{transform:none}25%{transform:scale(1.28,.68)}50%{transform:scale(.86,1.2)}70%{transform:scale(1.08,.93)}100%{transform:none}}
.dprev .poke.p-dance .av-ch{animation:avDance 1s ease-in-out}
@keyframes avDance{0%,100%{transform:none}12%{transform:translate(-8%,-6%) rotate(-10deg)}25%{transform:translate(0,0) scale(1.08,.92)}37%{transform:translate(8%,-6%) rotate(10deg)}50%{transform:translate(0,0) scale(1.08,.92)}65%{transform:translateY(-14%) rotate(0)}80%{transform:scale(1.1,.9)}}
.dprev .poke.p-flip .av-ch{animation:avFlip 1s cubic-bezier(.3,.6,.4,1);transform-origin:50% 55%}
@keyframes avFlip{0%{transform:none}15%{transform:scale(1.15,.82)}45%{transform:translateY(-42%) rotate(-180deg)}75%{transform:translateY(0) rotate(-360deg)}88%{transform:scale(1.1,.9) rotate(-360deg)}100%{transform:rotate(-360deg)}}
.dprev .poke .puff{position:absolute;left:50%;top:38%;width:22px;height:22px;margin:-11px;pointer-events:none;opacity:0;animation:avPuff 1.1s cubic-bezier(.2,.8,.3,1) forwards;z-index:2}
.dprev .poke .puff svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(80,40,0,.2))}
@keyframes avPuff{0%{opacity:0;transform:scale(.2)}20%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(var(--s))}}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:99px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:99px;padding:7px 14px;font-weight:900;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--sky);color:#fff}
.foot{margin-top:30px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2)}
.foot a{color:inherit}

/* ---- character-guided rules (atlas/rules/*.js): the guide sits at the bottom, speaking in a bubble; one nav row ---- */
.bv.rules .hud{display:none}
.rgd{position:absolute;z-index:4;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:min(760px,calc(100% - 24px));transform:translate(-50%,130%);opacity:0;transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s;display:grid;gap:10px}

.rgd .cnt .sc{display:inline-flex;align-items:center;gap:6px;font:700 22px var(--round)}
.rgd .cnt .vs{font:700 18px var(--round);color:var(--ink2)}
.rgd .cnt .tag{background:var(--ink);color:#fff;border-radius:99px;padding:4px 14px;font:700 14px var(--round);letter-spacing:.1em}
.rgd .dk{width:18px;height:18px;border-radius:50%;display:inline-block}.rgd .dk.b{background:#16171b}.rgd .dk.w{background:#f3f0e6;box-shadow:inset 0 0 0 1px #c9c2b0}
