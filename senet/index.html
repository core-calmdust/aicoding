<style>
/* ================================================================ セネト — 黒檀と金、ファイアンスの青緑（ナイルの夕暮れ） */
:root{
  /* Tutankhamun's mask: burnished gold, lapis-lazuli stripes, a little carnelian and turquoise — on gilded black */
  --bg:#0f0b04; --bg2:#17110a; --panel:#1a150b; --panel2:#251d0e; --line:#5a4719;
  --text:#f3ead2; --muted:#d3c39a; --dim:#9c8a5e;
  --lapis:#2f5bd0; --lapis2:#1c3a96; --turq:#3fb7b0; --gold:#d9b45a; --gold2:#a8843a; --carn:#c2412d; --carn2:#8e2a1c;
  --accent:#e6c573; --brass:#d9b45a; --brass2:#8f7232; --red:#ff7a66; --good:#7fd6a4;
  --light1:#f4ecd6; --light2:#d8ccad; --dark1:#4a4a52; --dark2:#1c1c22;
  --vh:100vh; --gap:12px;
  --serif:'Cormorant Garamond','Shippori Mincho B1',serif;
  --mincho:'Shippori Mincho B1','Cormorant Garamond',serif;
}
@supports (height:100dvh){:root{--vh:100dvh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 18% -12%, rgba(232,180,64,.20) 0%, transparent 62%),
    radial-gradient(900px 600px at 110% 115%, rgba(47,91,208,.22) 0%, transparent 60%),
    radial-gradient(1px 1px at 12% 22%, rgba(255,240,200,.6), transparent),
    radial-gradient(1px 1px at 78% 12%, rgba(255,240,200,.5), transparent),
    radial-gradient(1.4px 1.4px at 64% 30%, rgba(255,240,200,.45), transparent),
    radial-gradient(1px 1px at 36% 8%, rgba(255,240,200,.5), transparent),
    var(--bg);
  color:var(--text);
  font-family:'Zen Kaku Gothic New','Noto Sans Devanagari','Noto Sans Arabic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}
html[lang=ar] body{direction:rtl}
html[lang=ar] .frame, html[lang=ar] .board-wrap, html[lang=ar] .kifu, html[lang=ar] .graph, html[lang=ar] .navbar{direction:ltr}

/* ---------------------------------------------------------------- shared look */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;position:relative;box-shadow:inset 0 1px 0 rgba(255,220,140,.08)}
.card::before{content:"";position:absolute;inset:3px;border-radius:11px;border:1px solid rgba(217,180,90,.08);pointer-events:none}
.label,.kifu-head .label,.evalrow .label{font-family:var(--serif);font-size:15px;letter-spacing:.12em;color:var(--accent);font-weight:700}
html[lang=ja] .label, html[lang=zh] .label,html[lang=zh-TW] .label, html[lang=ko] .label{font-family:var(--mincho);font-size:13.5px}
.kifu-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.kifu-head .kb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.kifu-head button{font-size:11.5px;color:var(--muted);padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.15);white-space:nowrap}
.kifu-head button:hover{color:var(--text);border-color:var(--brass2)}

/* ---------------------------------------------------------------- brand (phones) + icons */
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand-l{min-width:0;display:flex;flex-direction:column}
.brand a.series{font-size:11px;color:var(--dim);text-decoration:none;letter-spacing:.08em;white-space:nowrap}
.brand h1{font-family:var(--mincho);font-weight:800;font-size:21px;letter-spacing:.08em;white-space:nowrap;line-height:1.15;cursor:pointer;background:linear-gradient(180deg,#fff3cf,#d9b45a 70%,#a8843a);-webkit-background-clip:text;background-clip:text;color:transparent}
html:not([lang=ja]):not([lang=zh]):not([lang=zh-TW]):not([lang=ko]) .brand h1{font-family:var(--serif);font-size:23px;letter-spacing:.04em}
.brand h1 small{display:none}
.brand-r{display:flex;align-items:center;gap:6px;flex:none}
/* landscape option (phones, as backgammon): the wrapper page only holds the turned iframe; the button, its pulse and the tip */
body.rotwrap{overflow:hidden!important;height:100%;overscroll-behavior:none;touch-action:none;margin:0}
html:has(body.rotwrap){overflow:hidden;height:100%;overscroll-behavior:none}
body.rotwrap > :not(#rotFrame){display:none!important}
#rotFrame{background:var(--bg, #1a0d08)}
/* phones: the move navigation strip (shared/infotabs.js) only when it is of use — a finished game, a past position on view, the
   replay, the review box (app.js navNeedSync → body.nav-need); landscape: landtabs.js navSync */
body.it-on.it-nav:not(.nav-need) #itNav{display:none!important}
@media not all and (pointer: coarse){#btnLand{display:none!important}}
.lp-modal{width:min(360px,100%);text-align:center}
html .lp-modal h2{text-align:center;margin-bottom:6px}
.lp-sub{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:14px}
html[lang=ar] .lp-sub{text-align:center}
.lp-phone{width:120px;height:90px;display:block;margin:0 auto 8px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lp-phone .lp-scr{fill:rgba(217,163,90,.14);stroke:none}
.lp-phone .lp-arc{stroke:var(--brass);stroke-width:1.8}
.lp-rot{transform-origin:60px 41px;animation:lpRot 2.6s ease-in-out infinite}
@keyframes lpRot{0%,25%{transform:rotate(0)}55%,85%{transform:rotate(90deg)}100%{transform:rotate(0)}}
.snd.land.pulse{position:relative;color:var(--accent);border-color:var(--accent)}
.snd.land.pulse::after{content:"";position:absolute;inset:-3px;border-radius:9px;border:2px solid var(--accent);animation:lpPulse 1.1s ease-out infinite;pointer-events:none}
@keyframes lpPulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
body.no-anim .lp-rot{animation:none;transform:rotate(90deg)}
body.no-anim .snd.land.pulse::after{animation:none;opacity:.9;transform:none}
#langSel{background:rgba(0,0,0,.25);color:var(--muted);border:1px solid var(--line);border-radius:7px;font:inherit;font-size:11px;padding:3px 4px}
.snd{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim)}
.snd:hover{color:var(--text)}
a.snd{text-decoration:none}
.snd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .off-x{display:none}
.snd.on{color:var(--accent);border-color:rgba(217,180,90,.5)}
.snd:not(.on) .on-w{display:none}
.snd:not(.on) .off-x{display:inline}
.hb .brand-l h1{font-size:22px!important}

/* ---------------------------------------------------------------- menu */
.controls{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;transition:border-color .2s,color .2s,background .2s}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover:not(:disabled){border-color:var(--brass2);color:var(--text)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{color:var(--text);border-color:rgba(217,180,90,.45)}
.btn.on{color:var(--accent);border-color:rgba(217,180,90,.6);background:rgba(217,180,90,.08)}

/* ---------------------------------------------------------------- board */
.board-area{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.frame{position:relative;width:var(--bw);aspect-ratio:1104/584;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html.bv .frame{aspect-ratio:584/1104}
html.sn-band:not(.bv) .frame{aspect-ratio:1104/584}   /* (phones, the board lying across: 'hn', the board alone) */
.board-wrap{position:absolute;inset:0}
.board-wrap svg.sn-board{filter:drop-shadow(0 24px 28px rgba(0,0,0,.55))}
/* the dice in the notch of the side to move */
.dice-dock{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:auto;cursor:pointer;border-radius:12px;transition:opacity .25s}
.dice-dock .dice-host{width:100%;flex:1 1 auto;min-height:0}
html.bv .frame > .dice-dock .dice-host{transform:rotate(90deg)}
.dice-dock .dice-cap{font-family:var(--serif);font-weight:700;font-size:calc(var(--bw) * .026);line-height:1;color:var(--accent);letter-spacing:.06em;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8);min-height:1em}
html.bv .frame > .dice-dock .dice-cap{font-size:calc(var(--bw) * .05)}
/* PC: the count beside the sticks reads like the board's 上がり / Off counts (same face, size, gilt and line; lining figures) */
html.hb-on:not(.bv):not(.sn-band) .frame > .dice-dock .dice-cap{font-family:'Shippori Mincho B1','Cormorant Garamond','Noto Serif JP',serif;font-size:calc(var(--bw) * .02083);color:#f1d58c;opacity:.9;letter-spacing:.04em;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.dice-dock.can{animation:dkGlow 1.8s ease-in-out infinite}
@keyframes dkGlow{0%,100%{box-shadow:0 0 0 0 rgba(230,197,115,0)}50%{box-shadow:0 0 0 3px rgba(230,197,115,.35),0 0 22px rgba(230,197,115,.25)}}
body.no-anim .dice-dock.can{animation:none}
.dice-dock.dim .dice-host{opacity:.42}
.dice-dock.rolling .dice-host{opacity:1}
/* ready to roll: the plate alone in the notch (the old dice are cleared away); it breathes a soft gilt glow */
.dice-dock.can:not(.rolling) .dice-host{opacity:0}
.dice-dock.can:not(.rolling) .dice-cap{visibility:hidden}
.dice-dock.can{animation:none!important;box-shadow:none!important}
.dice-dock.can:not(.rolling) .roll-pill{animation:rpGlow 2.2s ease-in-out infinite}
@keyframes rpGlow{0%,100%{filter:drop-shadow(0 5px 7px rgba(0,0,0,.55)) drop-shadow(0 0 0 rgba(240,200,110,0))}50%{filter:drop-shadow(0 5px 7px rgba(0,0,0,.55)) drop-shadow(0 0 9px rgba(240,200,110,.55))}}
body.no-anim .dice-dock.can .roll-pill{animation:none}
/* 3D dice (board2d.js): the dice fill the whole dock, the caption sits under them */
.dice-dock.d3 .dice-host{position:absolute!important;inset:0;width:auto!important;height:auto!important;transform:none!important}
.dice-dock.d3 .dice-cap{position:absolute;left:0;right:0;top:0;text-align:center;pointer-events:none;z-index:3}   /* above the dice (they rest low in the notch: dice({shift})) */

html.bv[lang=ja] .frame > .dice-dock .roll-pill,html.bv[lang=zh] .frame > .dice-dock .roll-pill,html.bv[lang=zh-TW] .frame > .dice-dock .roll-pill,html.bv[lang=ko] .frame > .dice-dock .roll-pill{text-orientation:upright;letter-spacing:.3em}
html[lang=ja] .dice-dock .roll-pill,html[lang=zh] .dice-dock .roll-pill,html[lang=zh-TW] .dice-dock .roll-pill,html[lang=ko] .dice-dock .roll-pill{letter-spacing:.32em;text-indent:.32em;font-family:'Shippori Mincho B1',var(--serif);font-weight:800}
/* while the dice roll the plate steps aside */
.dice-dock.rolling .roll-pill{display:none}
.dice-dock:not(.can) .roll-pill{display:none}
/* move effects: soft, translucent, centred on the board */
.fx-msg{position:absolute;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%) scale(.96);pointer-events:none;opacity:0;text-align:center;white-space:nowrap;
  font-family:var(--serif);font-weight:700;letter-spacing:.14em;color:#fff3cf;font-size:calc(var(--bw) * .036);
  padding:.35em 1.3em .4em;border-radius:999px;background:radial-gradient(120% 140% at 50% 50%,rgba(28,18,10,.72),rgba(28,18,10,.42) 60%,rgba(30,20,12,0) 100%);
  text-shadow:0 0 18px rgba(230,197,115,.55),0 1px 2px rgba(0,0,0,.7);transition:opacity .35s ease,transform .5s ease}
html[lang=ja] .fx-msg, html[lang=zh] .fx-msg,html[lang=zh-TW] .fx-msg, html[lang=ko] .fx-msg{font-family:var(--mincho)}
html.bv .fx-msg{font-size:calc(var(--bw) * .07)}
.fx-msg small{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.48em;letter-spacing:.08em;color:rgba(239,232,214,.8);margin-top:.2em;font-weight:500}
/* readable at a glance (the main word ≈ 40px on PC, 28–34px on phones; the line under it ≥ 15px); the shown time is unchanged */
.fx-msg{font-size:clamp(28px, calc(var(--bw) * .052), 44px);padding:.32em 1.1em .42em;background:radial-gradient(120% 150% at 50% 50%,rgba(28,18,10,.78),rgba(28,18,10,.5) 58%,rgba(30,20,12,0) 100%)}
html.bv .fx-msg{font-size:clamp(28px, calc(var(--bw) * .15), 34px)}
.fx-msg small{font-size:max(15px, .42em);margin-top:.28em;color:rgba(239,232,214,.88)}
.fx-msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fx-msg.pass{color:#d8d4e8;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.fx-msg.cap{color:#ffd4c8;text-shadow:0 0 18px rgba(194,65,45,.6),0 1px 2px rgba(0,0,0,.7)}
.fx-glow{position:absolute;inset:-2%;z-index:1;pointer-events:none;border-radius:3%;opacity:0;transition:opacity .45s ease;box-shadow:inset 0 0 calc(var(--bw) * .06) rgba(230,197,115,.38)}
.fx-glow.cap{box-shadow:inset 0 0 calc(var(--bw) * .06) rgba(194,65,45,.38)}
.fx-glow.show{opacity:1}
.board-tip{position:absolute;z-index:7;left:50%;transform:translate(-50%,4px);max-width:64%;padding:6px 14px 7px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .35s ease,transform .35s ease;
  background:rgba(10,16,48,.62);border:1px solid rgba(217,180,90,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  color:rgba(239,232,214,.92);font-size:calc(var(--bw) * .0118 + 5px);line-height:1.45;letter-spacing:.03em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px -8px rgba(0,0,0,.7)}
.board-tip small{color:rgba(239,232,214,.62);margin-inline-start:.6em;font-size:.86em}
.board-tip.show{opacity:1;transform:translate(-50%,0)}
.board-tip.s0{bottom:-2%}.board-tip.s1{top:-2%}
html:not(.hb-on) .board-tip{display:none}
.toast{position:absolute;left:50%;bottom:6%;z-index:9;transform:translateX(-50%);max-width:92%;padding:8px 16px;border-radius:10px;background:rgba(20,13,8,.9);border:1px solid rgba(217,180,90,.4);font-size:13px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.review-bar{display:none;gap:6px;align-items:center;flex-wrap:wrap}
.pl-col > .review-bar{flex:none;justify-content:center;gap:4px 6px;padding:5px 8px;border-radius:12px;background:rgba(217,180,90,.08);border:1px solid rgba(217,180,90,.35)}
.pl-col > .review-bar #reviewText{display:inline;font-size:12px;margin-right:2px}
@media (max-height:820px){.pl-col > .review-bar #reviewText{display:none}
  html.hb-on body.reviewing .pl-col .players{padding:4px 8px;gap:2px} html.hb-on body.reviewing .pl-col .player{padding:3px 10px} html.hb-on body.reviewing .pl-col > .review-bar{padding:3px 8px}
  html.hb-on body.reviewing #evalCard .evalbar{display:none}}
.pl-col > .review-bar button{padding:3px 9px}
html.hb-on body.reviewing .board-tip{display:none}
.review-bar #reviewText{display:none}
body.reviewing .review-bar{display:flex}
body.reviewing .sbox .rollbtn{display:none}
.review-bar button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text)}
.review-bar button:hover{border-color:var(--brass2)}

/* ---------------------------------------------------------------- players / status */
.players{display:flex;flex-direction:column;gap:8px}
.player{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid transparent;transition:border-color .25s,background .25s}
.player.active{border-color:rgba(217,180,90,.6);background:rgba(217,180,90,.07)}
.player.won{border-color:rgba(127,214,164,.7);background:rgba(127,214,164,.08)}
.player .name{font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace}
.player .sub b{color:var(--muted);font-weight:700}
.player .clk{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--muted);padding:1px 7px;border-radius:7px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.player .clk:empty{display:none}
.player.active .clk{color:var(--accent);border-color:rgba(217,180,90,.6)}
.player .clk.low{color:#ff9b90;border-color:rgba(255,107,91,.6)}
.player .home{display:flex;align-items:baseline;gap:4px;font-family:var(--serif);font-weight:700;font-size:24px;line-height:1;color:var(--text);white-space:nowrap}
.player .home small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:10.5px;color:var(--dim);font-weight:500;letter-spacing:.04em}
.player .status{grid-column:2 / 4;font-size:11.5px;color:var(--accent);min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .status:empty{display:none}
.pdk{display:none}
.player.thinking .pdisc{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(230,197,115,.25)}}
.pdisc{width:24px;height:24px;flex:none;display:inline-block;background:center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.pdisc.p0{background-image:var(--pd0)}
.pdisc.p1{background-image:var(--pd1)}
.sbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);min-height:52px}
.sbox .st{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.5;color:var(--text)}
.sbox .st small{display:block;font-size:11.5px;color:var(--dim)}
.rollbtn{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap;
  background:linear-gradient(180deg,#f1d68e,#c9a24f);color:#1b1408;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.rollbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.rollbtn:disabled{opacity:.35;cursor:default;filter:grayscale(.4)}
.rollbtn.pass{background:linear-gradient(180deg,#c9c5da,#8f8ba6)}
.rollbtn kbd{font:600 10px 'JetBrains Mono',monospace;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.14)}
@media (pointer: coarse){.rollbtn kbd{display:none}}

/* ---------------------------------------------------------------- eval / graph / nav */
.evalrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.evalrow .val{font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;font-size:12.5px;text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.evalbar{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#3a3a44,#1c1c22);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.evalbar .fill{position:absolute;inset:0 auto 0 0;width:50%;background:linear-gradient(90deg,#cfc3a3,#f4ecd6);transition:width .5s ease}
.evalbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(230,197,115,.8)}
.graph{margin-top:8px;width:100%;height:clamp(44px, 9vh, 96px);display:block;cursor:pointer;touch-action:none}
.graph .zero{stroke:rgba(217,180,90,.35);stroke-dasharray:2 3}
.graph .cur{stroke:var(--accent);stroke-width:1}
.navbar{display:flex;gap:6px;margin-top:8px}
.navbar button{flex:1;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted);display:flex;align-items:center;justify-content:center}
.navbar button:hover{color:var(--text);border-color:var(--brass2)}
.navbar svg{width:15px;height:15px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.navbar .i-pause{display:none}
.navbar button.playing .i-play{display:none}.navbar button.playing .i-pause{display:block}
body.rated-live #evalCard .evalrow .val, body.rated-live #evalCard .evalbar, body.rated-live #evalCard .graph{visibility:hidden}

/* ---------------------------------------------------------------- kifu */
.kifu-card{display:flex;flex-direction:column;min-height:0}
.kifu{flex:1;min-height:0;overflow-y:auto;display:grid;align-content:start;grid-auto-rows:min-content;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px;line-height:1.45;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;font-size:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;max-height:200px}
.kifu button{min-height:24px;flex:none;padding:3px 6px;border-radius:5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-align:start}
.kifu button em{font-style:normal;color:var(--dim);font-size:.85em;min-width:1.9em;text-align:end}
.kifu button i{width:8px;height:8px;border-radius:50%;flex:none}
.kifu button i.s0{background:var(--light1)}.kifu button i.s1{background:#2a2a30;box-shadow:inset 0 0 0 1px #8a8a94}
.kifu button .x{color:#ff9b8f}.kifu button .r{color:var(--accent)}
.kifu button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.kifu button.cur{background:rgba(217,180,90,.16);color:var(--accent)}
.kifu button.q-bad{box-shadow:inset 0 -2px 0 #ff6b5b}.kifu button.q-dub{box-shadow:inset 0 -2px 0 #f2c060}
.kifu .empty{grid-column:1/-1;color:var(--dim);font-family:'Zen Kaku Gothic New';font-size:12px;padding:6px 0}

/* ---------------------------------------------------------------- review card */
.review-card{display:none}
.review-card.show{display:block;overflow-y:auto}
.rv-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rv-side{padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.rv-side h4{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden}
.rv-side .acc{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--accent);line-height:1.1}
.rv-side .acc small{font-family:'Zen Kaku Gothic New';font-size:11px;color:var(--dim);margin-inline-start:4px;font-weight:500}
.rv-side .qc{display:flex;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.qb{color:#8fe3b8}.qg{color:#9fc7ff}.qd{color:#f2c060}.qx{color:#ff8b7d}
.rv-cur{font-size:13px;line-height:1.65;padding:8px 10px;border-radius:10px;background:rgba(217,180,90,.06);border:1px solid rgba(217,180,90,.25);margin-bottom:8px}
.rv-cur b{color:var(--accent)}
.rv-list{display:flex;flex-direction:column;gap:3px}
.rv-list button{display:flex;gap:8px;align-items:center;text-align:start;font-size:12.5px;padding:4px 8px;border-radius:7px;border:1px solid transparent;color:var(--muted)}
.rv-list button:hover{border-color:var(--line);color:var(--text);background:rgba(255,255,255,.03)}
.rv-list .tag{flex:none;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;color:#0b1110}
.tag.bad{background:#ff6b5b}.tag.dubious{background:#f2c060}.tag.best{background:#6fd3a0}.tag.good{background:#9fc7ff}
.rv-prog{height:6px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden;margin:6px 0}
.rv-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .2s}
.rv-note{font-size:12px;color:var(--dim);line-height:1.6}
.ck-rvgo,.rv-go{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;background:linear-gradient(180deg,#f1d68e,#c9a24f);color:#1b1408;white-space:nowrap}

/* ---------------------------------------------------------------- lesson / puzzle cards */
.lesson-card,.puzzle-card{display:none}
body.in-lesson .lesson-card, body.in-puzzle .puzzle-card{display:block;overflow-y:auto}
body:is(.in-lesson,.in-puzzle) .cb-bar{padding-bottom:2px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.lt{font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
.dots i.ok{background:var(--good)}.dots i.ng{background:#ff8b7d}.dots i.part{background:#f2c060}.dots i.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(230,197,115,.3)}
.lesson-card h3,.puzzle-card h3{font-family:var(--mincho);font-size:17px;letter-spacing:.05em;margin:2px 0 6px;color:var(--text)}
.lesson-prompt,.pz-goal{font-size:13.5px;line-height:1.75;color:var(--text)}
.lesson-prompt p{margin-bottom:4px}
.lesson-prompt b{color:var(--accent)}
.pz-goal{display:flex;gap:8px;align-items:center}
.lesson-fb,.pz-status{margin-top:8px;font-size:13px;line-height:1.7;color:var(--muted);min-height:1.7em}
.lesson-fb b.ok,.pz-status b.ok{color:var(--good)}.lesson-fb b.ng,.pz-status b.ng{color:#ff9b8f}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.choices button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:13px;color:var(--text)}
.choices button:hover{border-color:var(--brass2)}
.choices button.ok{border-color:var(--good);color:var(--good)}.choices button.ng{border-color:#ff8b7d;color:#ff8b7d}
.lesson-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lesson-actions button{flex:1 1 auto;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:12.5px;color:var(--muted);white-space:nowrap}
.lesson-actions button:hover:not(:disabled){color:var(--text);border-color:var(--brass2)}
.lesson-actions button.go{background:linear-gradient(180deg,#f1d68e,#c9a24f);border-color:transparent;color:#1b1408;font-weight:800}
.lesson-actions button:disabled{opacity:.35;cursor:default}

/* ---------------------------------------------------------------- coach card (shared/coachkit.js styles + ours) */
.ck-card{overflow-y:auto}
.ck-card .ck-h{font-family:var(--mincho)}
/* coach text a size up (2026-11-05: easier to read) */
#coachCard h3.ck-h,#coachCard .ck-h{font-size:15px}#coachCard h3.ck-h small{font-size:13px}
#coachCard .ck-sum span{font-size:14px;padding:4px 11px}
#coachCard .ck-rec .ck-rb{font-size:17px}
#coachCard .ck-rec p{font-size:16px;line-height:1.75}
#coachCard .ck-sec-h{font-size:14.5px}
#coachCard .ck-intro{font-size:14.5px}
#coachCard .ck-bt b{font-size:15.5px}#coachCard .ck-bt .mv{font-size:14.5px}#coachCard .ck-bt .tg,#coachCard .ck-bt .gp{font-size:12.5px}
#coachCard .ck-bi p{font-size:14.8px}
#coachCard .ck-tips li{font-size:15.2px}

#coachCard .ck-calc{font-size:14.5px}
.ck-pop{font-size:14.5px}.ck-pop b{font-size:15.5px}
#coachCard.ck-off{opacity:.92}

/* ---------------------------------------------------------------- dialogs */
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,6,3,.66);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s;padding:16px;height:100vh;height:100dvh}
.overlay.show{opacity:1;pointer-events:auto}
.overlay.instant,.overlay.instant .modal{transition:none!important}
/* switching the tabs of the list dialogs: the new one appears on top of the old one at once (no fade, no backdrop flash) */
.overlay.ls-top{z-index:71}
.overlay.ls-under{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.modal{width:min(480px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,#2e2014,#1a110a);border:1px solid rgba(217,180,90,.35);border-radius:18px;padding:24px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 4px rgba(217,180,90,.05);transform:translateY(10px);transition:transform .25s;position:relative}
.overlay.show .modal{transform:none}
.modal h2{font-family:var(--mincho);font-size:22px;letter-spacing:.12em;margin-bottom:18px;color:#fff3cf}
html:not([lang=ja]):not([lang=zh]):not([lang=zh-TW]):not([lang=ko]) .modal h2{font-family:var(--serif);font-size:25px;letter-spacing:.06em}
@media (max-width: 520px), (max-height: 560px){
  .overlay{padding:10px}
  .modal{padding:18px 16px;max-height:calc(100dvh - 20px);border-radius:14px}
  .modal h2{font-size:19px;margin-bottom:12px}
}
.field{margin-bottom:16px}
.field > label{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.seg button.sel{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px rgba(217,180,90,.5)}
#segMode{flex-wrap:wrap}
#segMode button{flex:1 0 22%}
@media (max-width: 520px){#segMode{display:grid;grid-template-columns:1fr 1fr}}
.level-wrap{display:flex;flex-direction:column-reverse;gap:6px}
.level-wrap input{width:100%;margin:0;accent-color:var(--gold);height:32px;touch-action:pan-y}
.level-name{font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:22px}
.level-name small{font-weight:400;font-size:11px;color:var(--dim)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.checks label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.checks input{accent-color:var(--gold);width:16px;height:16px;flex:none}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.mbtn{flex:1;padding:12px;border-radius:11px;font-weight:700;letter-spacing:.08em;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted);white-space:nowrap}
.mbtn:hover{color:var(--text)}
.mbtn.go{background:linear-gradient(180deg,#f1d68e,#c9a24f);color:#1b1408;border-color:transparent}
.mbtn.go:hover{filter:brightness(1.07)}
.result-big{font-family:var(--mincho);font-size:34px;font-weight:800;text-align:center;letter-spacing:.1em;margin:4px 0 10px;color:#fff3cf}
html:not([lang=ja]):not([lang=zh]):not([lang=zh-TW]):not([lang=ko]) .result-big{font-family:var(--serif)}
.result-disc{display:flex;justify-content:center;margin:6px 0 4px}
.result-disc .pdisc{width:54px;height:54px}
.result-sub{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;line-height:1.7}
.modal:not(.ngt-on) > .ng-credit{margin-top:12px}
.ng-credit{text-align:center;font-size:11px;line-height:1.6;color:var(--dim)}
.ng-cols{display:grid;grid-template-columns:1fr;gap:0 26px}
@media (hover: hover) and (pointer: fine) and (min-width: 820px){
  #newOverlay .modal{width:min(900px,100%)}
  .ng-cols{grid-template-columns:1fr 1fr}
}

.dsg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.dsg button.sel{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px rgba(230,197,115,.35)}

/* ================================================================ layouts */
/* PC (common: mouse, ≥1040px, not tall): header bar on top; the wide board on top, the info in one row under it */
@media (hover: hover) and (pointer: fine) and (min-width: 1040px) and (min-aspect-ratio: 3/4){
  /* the room above the online dock at the bottom: its bar + the folded chat strip (108px; 46px while online play is not set up).
     Here, not in online.css: the 3D skin copies the page's own html.hb-on rules for its portal header (html.hb-atlas) */
  html.hb-on{--vh:calc(100vh - var(--hb-h) - 108px)}
  @supports (height:100dvh){html.hb-on{--vh:calc(100dvh - var(--hb-h) - 108px)}}
  html.hb-on.ol-soon{--vh:calc(100vh - var(--hb-h) - 46px)}
  @supports (height:100dvh){html.hb-on.ol-soon{--vh:calc(100dvh - var(--hb-h) - 46px)}}
  html.hb-on body{overflow:hidden}
  html.hb-on .app{height:var(--vh);display:grid;gap:12px;padding:28px clamp(16px, 2vw, 32px) 20px;   /* (a little room above the board and below the info: the 3D frame reaches past the flat board) */
   
    grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto minmax(var(--ih),560px);align-content:center;
    grid-template-areas:"board board board" "ck pl kf"}
  /* (a tall window: the board is as wide as it can be, the info row grows (up to 560px) right under it, and the two stay together in the middle) */
  html.hb-on{--ih:clamp(190px, calc(var(--vh) * .29), 290px);--bw:min(calc(100vw - 64px), calc((var(--vh) - var(--ih) - 60px - 88px) * 1.890), 1500px)}
  /* room above / below the board (44px each) for the larger sticks and the turn notes (#boardTip), which sit outside the frame,
     centred under / over the board; the sticks keep to the left of the strip with their count beside them (app.js placeDock),
     so the note, the sticks and the count never cover each other, the header or the info row (2026-11-07) */
  html.hb-on .board-area{padding-block:44px}
  html.hb-on .board-tip{left:50%;white-space:nowrap}
  html.hb-on .board-tip.s0{top:calc(100% + 4px);bottom:auto}
  html.hb-on .board-tip.s1{bottom:calc(100% + 4px);top:auto}
  html.hb-on .side, html.hb-on .side-in{display:contents}
  /* the online dock opened on a short window (shared/headerbar.js: dock-fit lowers --vh, dock-compact squeezes the info): the info row
     shrinks first so the board keeps a useful size; the graph gives way, the move list gets lower and scrolls (the eval bar and the ◀▶ stay).
     (dock-compact also comes on with room to spare: this page's .side is display:contents — so it only tightens, never hides the record) */
  html.hb-on.dock-fit{--ih:clamp(160px, calc(var(--vh) * .3), 330px)}
  html.hb-on.dock-compact{--ih:clamp(160px, calc(var(--vh) * .3), 330px)}
  html.hb-on.dock-compact .kifu{min-height:0!important}
  html.hb-on.dock-compact #evalCard .graph{display:none!important}
  html.hb-on.dock-compact .pl-col .players{padding:4px 8px!important;gap:2px!important}
  html.hb-on.dock-compact .pl-col .player{padding:2px 10px!important}
  html.hb-on.dock-compact #evalCard{padding:6px 10px!important}
  html.hb-on .board-area{grid-area:board;justify-content:center}
  /* PC info row: コーチ 1/2 | 対局者（1人1行）＋形勢 1/4 | 棋譜 1/4. The status / roll box is not shown: the hints are the board's
     small notes (#boardTip) and rolling is the board's roll button, the space bar or a tap on the dice */
  html.hb-on .pl-col{grid-area:pl;display:flex;flex-direction:column;gap:10px;min-height:0}
  html.hb-on .pl-col .players{flex:none;padding:8px 10px;gap:4px}
  html.hb-on .pl-col .player{grid-template-columns:auto minmax(0,1fr) auto auto;padding:6px 10px;column-gap:8px}
  html.hb-on .pl-col .player .sub, html.hb-on .pl-col .player .status{display:none}
  html.hb-on .pl-col .player .home{font-size:19px}
  html.hb-on .pl-col .player .pdisc{width:18px;height:18px}
  html.hb-on .pl-col #evalCard{flex:1 1 auto;min-height:0}
  html.hb-on .sbox{display:none!important}
  html.hb-on #coachCard, html.hb-on #itCoachRest, html.hb-on .review-card, html.hb-on .lesson-card, html.hb-on .puzzle-card{grid-area:ck;min-height:0;overflow-y:auto}
  html.hb-on body:is(.in-lesson,.in-puzzle){--ih:clamp(250px, calc(var(--vh) * .4), 360px)}
  html.hb-on #evalCard{min-height:0;display:flex;flex-direction:column;padding:10px 12px}
  html.hb-on #evalCard .graph{flex:1 1 auto;min-height:0;height:auto}
  html.hb-on #evalCard .navbar{flex:none}
  html.hb-on .kifu-card{grid-area:kf;min-height:0}
  html.hb-on .kifu{max-height:none}
  html.hb-on .info-line{display:none}
  html.hb-on body:is(.in-lesson,.in-puzzle) #coachCard, html.hb-on body:is(.in-lesson,.in-puzzle) #itCoachRest{display:none!important}
  html.hb-on body .review-card.show ~ #coachCard{display:none}
  html.hb-on body:has(.review-card.show) #coachCard{display:none!important}
  /* the PC review box (rvbox.js) */
  html.hb-on.rvb-on .app{grid-template-areas:"board board board" "bx pl kf"}
  html.hb-on.rvb-on .review-card{display:none!important}
  html.hb-on .app > .rvbox{grid-area:bx}
  .hb .hb-info .hb-chip .pdisc{width:14px;height:14px}
}
/* the online dock opened on a window without room for board + info row (≤ 1150px high): the board comes first — the players and the
   eval bar with ◀▶ in a slim column at its right, the coach and the move list wait until the dock closes (common spec: dock-compact) */
@media (hover: hover) and (pointer: fine) and (min-width: 1040px) and (min-aspect-ratio: 3/4) and (max-height: 1150px){
  html.hb-on body.dock-open{--bw:min(calc(100vw - 64px - 300px - 16px), calc((var(--vh) - 30px) * 1.890), 1500px)}
  html.hb-on body.dock-open .app{grid-template-columns:auto 300px!important;grid-template-rows:auto!important;grid-template-areas:"board pl"!important;justify-content:center;align-content:center;align-items:center;column-gap:16px}
  html.hb-on body.dock-open :is(#coachCard, #itCoachRest, .kifu-card, .review-card, .rvbox){display:none!important}
  html.hb-on body.dock-open #evalCard .graph{display:none!important}
  html.hb-on body.dock-open .pl-col{align-self:center}
  html.hb-on body.dock-open #evalCard{flex:none!important}
}
/* every other layout: one column (phones, tablets, narrow windows) */
@media not all and (hover: hover) and (pointer: fine) and (min-width: 1040px) and (min-aspect-ratio: 3/4){
  .app{display:flex;flex-direction:column;gap:8px;padding:max(8px, env(safe-area-inset-top)) 10px 16px;max-width:900px;margin:0 auto}
  :root{--bw:min(calc(100vw - 20px), 860px, calc((var(--vh) - 230px) * 1.890))}
  html.bv{--bw:min(calc(100vw - 20px), 440px, calc((var(--lvh) - var(--oh) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .529))}
  .board-area > .player{padding:6px 12px}
  .board-area > .player .home{font-size:20px}
  html.bv body:is(.in-lesson,.in-puzzle){--oh:420px;--bw:min(calc(100vw - 20px), 440px, calc((var(--lvh) - var(--oh) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .529))}
  body:is(.in-lesson,.in-puzzle) .board-area > .sbox{display:none}
  body:is(.in-lesson,.in-puzzle) .side-in > :is(.lesson-card,.puzzle-card){order:-1}
  .side{display:contents}
  .side-in{display:flex;flex-direction:column;gap:8px;order:5}
  .brand{order:0}
  .controls{order:1}
  .board-area{order:3;gap:8px}
  .pl-col{order:4;display:flex;flex-direction:column;gap:8px}
  .players .player.ps-top{order:-1}
  #coachCard, .review-card.show{max-height:none}
  .kifu{max-height:240px}
  .info-line{font-size:11px;color:var(--dim);text-align:center}
}
/* phones: the opponent's strip above the board, yours (with the status / roll button) below it — moved there by app.js */
.board-area > .player{width:var(--bw);max-width:100%}
.board-area > .sbox{width:var(--bw);max-width:100%}
@media (pointer: coarse) and (max-width: 760px){
  .controls .btn{font-size:10.5px;padding:7px 0}
  .controls .btn svg{width:18px;height:18px}
  .brand h1{font-size:19px}
}
/* phones held upright (html.sn-band; html.bv: the board turned): like the other games' phones — one slim brand row, one row of menu chips,
   the board as large as fits between the menu and the bottom tabs (from 100lvh; 8px apart). The pieces off the board wait in
   the notch (board2d 'vn'); the dice are thrown in a strip in the card of the player to roll — the opponent's above the board,
   yours below — with the roll plate there; each card one line: disc · name · 0 /7 ゴール · dice */
:root{--lvh:100vh;--oh:340px}
@supports (height:100lvh){:root{--lvh:100lvh}}
@media (pointer: coarse) and (max-width: 760px) and (orientation: portrait){
  /* (a short phone: the board lies across the screen, html.sn-band without html.bv — the dice strips all the same) */
  html.sn-band:not(.bv){--bw:min(calc(100vw - 20px), 860px, calc((var(--lvh) - var(--oh) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1.890))}
  html.sn-band:not(.bv) body:is(.in-lesson,.in-puzzle){--oh:420px;--bw:min(calc(100vw - 20px), 860px, calc((var(--lvh) - var(--oh) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1.890))}
  html.sn-band .app{gap:8px;padding-left:10px;padding-right:10px}
  html.sn-band .brand{height:28px}
  html.sn-band .brand a.series{display:none}
  html.sn-band .brand h1{font-size:clamp(15px, calc((100vw - 190px) / 7.4), 19px);letter-spacing:.05em}
  html.sn-band .snd{width:28px;height:26px}
  html.sn-band .controls{padding:6px;gap:5px}
  html.sn-band .controls::before{inset:2px}
  html.sn-band .controls .btn{padding:6px 1px;gap:2px;border-radius:9px}
  html.sn-band .controls .btn svg{width:17px;height:17px}
  html.sn-band .controls .btn span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:9.5px;letter-spacing:-.04em}
}
/* the players' cards and the dice strips on phones (upright and sideways) */
@media (pointer: coarse){
  html.sn-band .board-area{gap:8px}
  html.sn-band .board-area > .player{width:100%;display:flex;align-items:center;gap:8px;height:52px;padding:4px 6px 4px 10px;border-color:var(--line)}
  html.sn-band .board-area > .player.active{border-color:rgba(217,180,90,.6)}
  html.sn-band .board-area > .player > div{flex:1 1 auto;min-width:0}
  html.sn-band .board-area > .player .sub, html.sn-band .board-area > .player .status{display:none}
  html.sn-band .board-area > .player .name{font-size:13.5px}
  html.sn-band .board-area > .player .home{flex:none;font-size:21px}
  html.sn-band .board-area > .player .home small{font-size:10px}
  html.sn-band .board-area > .player .clk{flex:none;font-size:12.5px;padding:1px 5px}
  html.sn-band .board-area > .player .pdisc{width:20px;height:20px}
  html.sn-band .board-area > .sbox{display:none}
  /* looking back: ここから再開 / 最新の局面へ in your card, in place of the dice strip */
  html.sn-band .board-area > .player > .review-bar{flex:none;flex-wrap:nowrap;gap:5px}
  html.sn-band .board-area > .player > .review-bar button{padding:6px 9px;font-size:11.5px;white-space:nowrap}
  html.sn-band body.reviewing .board-area > .player:has(> .review-bar) > .pdk{display:none}
  /* the dice strip (the dice dock moved here by app.js) */
  html.sn-band .pdk{display:block;flex:none;position:relative;width:176px;height:44px;border-radius:10px;background:rgba(0,0,0,.24);box-shadow:inset 0 1px 3px rgba(0,0,0,.45);border:1px solid rgba(217,180,90,.14)}
  html.sn-band .pdk > .dice-dock{position:absolute!important;inset:0;border-radius:10px}
  html.sn-band .pdk > .dice-dock .dice-host{transform:none}
  html.sn-band .pdk > .dice-dock.dim:not(.rolling) .dice-host{opacity:.28}
  html.sn-band .pdk > .dice-dock .dice-cap{position:absolute;right:-5px;top:-7px;left:auto;min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:800;color:#1b1406;background:linear-gradient(180deg,#f3d88f,#c9a352);text-shadow:none;letter-spacing:0;box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:3}
  html.sn-band .pdk > .dice-dock .dice-cap:empty, html.sn-band .pdk > .dice-dock.rolling .dice-cap{display:none}
  html.sn-band .pdk > .dice-dock .roll-pill{width:132px;height:42px;font-size:18px;padding:0 14px}
}
/* phones held sideways (landtabs.js → html.sn-land, 2D and 3D): one slim top row (title · menu icons · icons), the board lying
   across ('hn') as large as the height allows, the players' cards with their dice strips on the left of the board (a wide
   screen) or above / below it (a shorter one), a tab rail at the right edge; a tab slides a drawer in from the right over the board */
@media (min-aspect-ratio: 1/1) and (pointer: coarse) and (max-height: 560px), (min-aspect-ratio: 1/1) and (pointer: coarse) and (max-width: 900px){
  html.sn-land, html.sn-land body{height:100%!important;overflow:hidden!important;overscroll-behavior:none}
  html.sn-land{--lvh:100vh;--ltw:300px;--lcw:166px;--tp:36px;--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right)}
  @supports (height:100dvh){html.sn-land{--lvh:100dvh}}
  /* the board drops its bear-off trays here (board2d setTrays(false); the counts are in the players' cards): 1096 × 396 */
  html.sn-land{--pr:52px;--bw:min(calc((var(--lvh) - var(--tp) - 26px - var(--pr)) * 2.768), calc(100vw - 58px - 26px - max(8px, var(--sr)) - max(10px, var(--sl))))!important}
  html.sn-land .frame{aspect-ratio:1096/396!important}
  html.sn-land body.lt-on .app{display:grid!important;position:static!important;height:var(--lvh)!important;min-height:0!important;max-width:none!important;margin:0!important;box-sizing:border-box;overflow:hidden;
    padding:6px max(8px, var(--sr)) 6px max(10px, var(--sl))!important;gap:6px 8px!important;
    grid-template-columns:auto minmax(0,1fr) auto 58px!important;grid-template-rows:var(--tp) minmax(0,1fr)!important;
    grid-template-areas:"bl ct br br" "board board board rl"!important}
  html.sn-land body.lt-on .app > .side, html.sn-land body.lt-on .side-in{display:contents!important}
  html.sn-land:not(.atlas-skin) body.lt-on .side > .brand{display:contents!important}
  html.sn-land body.lt-on .brand-l{grid-area:bl;align-self:center;min-width:0}
  html.sn-land body.lt-on .brand-l .series{display:none}
  html.sn-land body.lt-on .brand-l h1{font-size:17px!important;margin:0;white-space:nowrap}
  html.sn-land body.lt-on .brand-r{grid-area:br;justify-self:end;display:flex;align-items:center;gap:4px}
  html.sn-land body.lt-on .brand-r > :is(button, a){width:34px!important;height:32px!important;min-width:0;padding:0!important;display:inline-flex;align-items:center;justify-content:center;border-radius:8px!important;flex:none}
  html.sn-land body.lt-on .brand-r > :is(button, a) svg{width:17px!important;height:17px!important}
  html.sn-land body.lt-on .brand-r #langSel{width:74px!important;max-width:74px;height:32px!important;font-size:12px;padding:0 4px}
  html.sn-land body.lt-on .controls{grid-area:ct;display:flex!important;flex-direction:row;gap:4px!important;align-items:center;justify-content:flex-end;padding:0!important;background:none!important;border:0!important;box-shadow:none!important;min-width:0;overflow:hidden}
  html.sn-land body.lt-on .controls::before{display:none}
  html.sn-land body.lt-on .controls .btn span{display:none!important}
  html.sn-land body.lt-on .controls .btn{padding:0!important;flex:none!important;width:38px!important;height:32px!important;gap:0!important;border-radius:8px!important;justify-content:center}
  html.sn-land body.lt-on .controls .btn svg{width:17px!important;height:17px!important}
  html.sn-land body.lt-on .controls :is(#btnLesson, #btnPuzzle, #btnRules){display:none!important}
  html.sn-land body.lt-on :is(.pl-col, .info-line, .mtabs, .mt-strip, #itNav, #itCoachRest){display:none!important}
  /* the board across the full width, the two players' cards side by side under it (the opponent left, you right, as at the table) */
  html.sn-land body.lt-on .board-area{grid-area:board;align-self:center;justify-self:center;min-height:0;display:grid!important;
    grid-template-columns:calc((var(--bw) - 8px) / 2) calc((var(--bw) - 8px) / 2);grid-template-rows:auto var(--pr);column-gap:8px;row-gap:8px;align-items:stretch}
  html.sn-land body.lt-on .board-area > .frame{grid-column:1 / 3;grid-row:1;margin:0!important}
  html.sn-land body.lt-on .board-area > .player{grid-row:2;width:auto!important;height:var(--pr)!important;flex-wrap:nowrap;padding:4px 6px 4px 10px!important;min-width:0}
  html.sn-land body.lt-on .board-area > .player:not(.frame ~ .player){grid-column:1}
  html.sn-land body.lt-on .board-area > .frame ~ .player{grid-column:2}
  html.sn-land body.lt-on .board-area > .player > .pdk{flex:none;width:clamp(136px, calc(var(--bw) * .2), 176px)}
  /* a small phone (667 × 375 …): the name keeps its room — the count says only n/5 */
  @media (max-width: 720px){ html.sn-land body.lt-on .board-area > .player .home small .hl{display:none} }
  html.sn-land body.lt-on .board-area > .player > .review-bar{flex:none;flex-wrap:nowrap}
  html.sn-land body.lt-on .board-area > .player > .review-bar button{padding:6px 8px;font-size:11px}
  /* the rail */
