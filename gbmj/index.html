<body>
<div id="root">
  <!-- ホーム -->
  <section id="home" class="screen">
    <div class="hm-bg" aria-hidden="true"></div>
    <header class="topbar">
      <a class="logo" href="../" id="hmPortal"><b>CALMDUST</b><small>COLLECTION</small></a>
      <span class="sp"></span>
      <button class="ib" id="hmLang" aria-label="language"></button>
      <button class="ib" id="hmStats" aria-label="record"></button>
      <button class="ib" id="hmSet" aria-label="settings"></button>
    </header>
    <div class="hm-main">
      <div class="hm-title">
        <span class="hm-tiles" id="hmTiles"></span>
        <h1 id="hmH1"></h1>
        <p id="hmSub"></p>
      </div>
      <nav class="hm-menu" id="hmMenu"></nav>
      <p class="hm-note" id="hmNote"></p>
    </div>
  </section>
  <!-- 対局（大百科のリーチ麻雀 riichi/ と同じ組み立て：左上の箱・右上のアイコン・アバターの名札・手牌の行） -->
  <section id="game" class="screen" hidden>
    <div id="stage"></div>
    <div class="hud">
      <div class="rbox" id="rbox"></div>
      <div class="tbtns">
        <button class="ib" id="gFan" aria-label="fan list"></button>
        <button class="ib" id="gStats" aria-label="record"></button>
        <button class="ib" id="gSet" aria-label="settings"></button>
        <button class="ib" id="gExit" aria-label="exit"></button>
      </div>
      <div class="opp" id="opp1"></div>
      <div class="opp" id="opp2"></div>
      <div class="opp" id="opp3"></div>
      <aside class="intel gb-coach" id="coach" hidden></aside>
      <div class="me" id="mePanel"></div>
      <div class="acts" id="acts"></div>
      <div class="chiPick" id="chiPick" hidden></div>
      <div class="hand" id="hand"></div>
    </div>
  </section>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast"></div>
</div>
