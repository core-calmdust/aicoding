<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>WYRM RIDER (α版) - 竜に乗って洞窟を翔けるワンキーゲーム</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="翼をもつ竜に乗り、高低差のある洞窟を翔け抜けるワンキーゲーム。スペースキー・タップ・ゲームパッドで翼を打って上昇し、行く手をふさぐ壁のすき間をくぐり抜けよう。">
<meta name="author" content="CALMDUST">
<link rel="icon" href="../comet-plus/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root{--cy:#5ff2ff;--mg:#ff4fd8;--vi:#9b6bff;--gd:#ffc35a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0220;color:#fff;font-family:'Orbitron','Noto Sans JP',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#root{position:fixed;inset:0;background:#000;overflow:hidden}
#game{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:#0b0220;container-type:size}
body.mob #game{left:0;top:0;width:100%;height:100%;transform:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;pointer-events:none;z-index:5}
#hud{top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;transition:opacity .3s}
#score{font-weight:900;font-size:clamp(44px,7cqw,76px);letter-spacing:.04em;line-height:1;
  background:linear-gradient(180deg,#fff 20%,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(95,242,255,.55)) drop-shadow(0 0 2px rgba(255,79,216,.7))}
#score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#best{margin-top:6px;font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.55)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;pointer-events:none;
  text-align:center;padding:24px;transition:opacity .35s}
.hide{opacity:0}
.logo{font-weight:900;font-size:clamp(46px,10cqw,124px);letter-spacing:.06em;line-height:.95;
  background:linear-gradient(100deg,#fff 0%,var(--cy) 30%,var(--vi) 62%,var(--mg) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(155,107,255,.55)) drop-shadow(0 0 3px rgba(95,242,255,.8))}
.logo small{display:block;font-size:.26em;letter-spacing:.9em;margin:.5em -.9em 0 0;font-weight:700}
.sub{margin-top:18px;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:clamp(14px,2cqw,18px);letter-spacing:.2em;color:rgba(230,240,255,.85);text-shadow:0 0 12px rgba(95,242,255,.5)}
.press{margin-top:clamp(40px,9cqh,90px);font-size:clamp(13px,1.8cqw,17px);letter-spacing:.24em;color:#fff;animation:blink 1.3s ease-in-out infinite;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.press kbd,.press .pad{font-family:'Orbitron',sans-serif;font-size:.85em;padding:.35em .8em;border:1px solid rgba(95,242,255,.7);border-radius:6px;
  box-shadow:0 0 12px rgba(95,242,255,.45),inset 0 0 8px rgba(95,242,255,.25);background:rgba(10,20,40,.4)}
.press .pad{border-color:rgba(255,79,216,.75);box-shadow:0 0 12px rgba(255,79,216,.45),inset 0 0 8px rgba(255,79,216,.25)}
.press i{font-style:normal;opacity:.6}
@keyframes blink{50%{opacity:.35}}
.ov.split{justify-content:space-between;padding:max(9cqh,60px) 24px max(7cqh,40px)}
.ov.split .press{margin-top:0}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;pointer-events:none;opacity:0}
#stage.show{animation:stg 2.6s cubic-bezier(.2,.8,.2,1) forwards}
#stage .n{font-weight:900;font-size:clamp(52px,9cqw,112px);letter-spacing:.12em;color:#fff;text-shadow:0 0 26px var(--sc,#5ff2ff),0 0 6px #fff}
#stage .m{margin-top:10px;font-size:clamp(13px,1.8cqw,18px);letter-spacing:.7em;margin-right:-.7em;color:var(--sc,#5ff2ff);text-shadow:0 0 14px var(--sc,#5ff2ff)}
#stage .l{width:min(70%,640px);height:2px;margin:16px 0 0;background:linear-gradient(90deg,transparent,var(--sc,#5ff2ff),transparent);box-shadow:0 0 14px var(--sc,#5ff2ff)}
@keyframes stg{0%{opacity:0;transform:scale(1.9);filter:blur(12px)}12%{opacity:1;transform:scale(1);filter:blur(0)}16%{transform:translateX(-6px)}19%{transform:translateX(5px)}22%{transform:none}78%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(1.08);letter-spacing:.3em}}
.hint{margin-top:18px;font-family:'Noto Sans JP',sans-serif;font-size:13px;letter-spacing:.12em;color:rgba(255,255,255,.6)}
.over-t{font-weight:900;font-size:clamp(40px,8cqw,92px);letter-spacing:.1em;color:#fff;
  text-shadow:0 0 22px rgba(255,79,216,.9),0 0 4px #fff}
.res{margin-top:22px;display:flex;gap:clamp(24px,6cqw,60px);justify-content:center}
.res div{font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.6)}
.res b{display:block;font-size:clamp(34px,6cqw,58px);letter-spacing:.04em;color:#fff;margin-top:6px;text-shadow:0 0 14px rgba(95,242,255,.7)}
#newrec{margin-top:16px;font-size:15px;letter-spacing:.4em;color:var(--gd);text-shadow:0 0 14px rgba(255,195,90,.9);display:none;animation:blink .8s infinite}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;mix-blend-mode:screen}
.btn{position:absolute;z-index:7;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;pointer-events:auto;cursor:pointer;
  background:rgba(12,10,36,.55);border:1px solid rgba(155,107,255,.45);color:#dfe9ff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#home{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
#snd{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
#fs{top:max(12px,env(safe-area-inset-top));right:calc(max(12px,env(safe-area-inset-right)) + 54px)}
body.mob #fs,body.mob .pc{display:none}
#snd .x{display:none}#snd.off .x{display:inline}#snd.off .w{display:none}
.alpha{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:7;font-size:10px;letter-spacing:.3em;color:rgba(184,255,240,.6);pointer-events:none}
#err{position:absolute;inset:0;display:none;place-items:center;z-index:9;font-family:'Noto Sans JP',sans-serif;padding:24px;text-align:center;background:#0b0220}
</style>
</head>
<body>
<div id="root"><div id="game">
<canvas id="gl"></canvas>
<div id="stage"><div class="n" id="stN">STAGE 2</div><div class="l"></div><div class="m" id="stM">ABYSSAL DEEP</div></div>
<div id="flash"></div>
<div id="hud" class="ui hide"><div id="score">0</div><div id="best">BEST 0</div></div>

<div id="title" class="ov split">
  <div><div class="logo">WYRM RIDER<small>DRAGON CAVE FLIGHT</small></div>
  <div class="sub">翼を打て。洞窟を翔け抜けろ。</div></div>
  <div><div class="press"><kbd>SPACE</kbd><i>/</i><kbd>TAP</kbd><i>/</i><span class="pad">Ⓐ Ⓑ Ⓧ Ⓨ</span></div>
  <div class="hint">押すたびに羽ばたいて上昇。壁のすき間をくぐり抜けよう<span class="pc">　／　F：フルスクリーン</span></div></div>
</div>

<div id="over" class="ov hide">
  <div class="over-t">CRASHED</div>
  <div class="res"><div>SCORE<b id="rScore">0</b></div><div>BEST<b id="rBest">0</b></div></div>
  <div id="newrec">NEW RECORD</div>
  <div class="press"><kbd>SPACE</kbd><i>/</i><kbd>TAP</kbd><i>/</i><span class="pad">Ⓐ</span><i>でリトライ</i></div>
</div>

<a id="home" class="btn" href="../" aria-label="ホーム" title="ホーム"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></a>
<button id="fs" class="btn" type="button" aria-label="フルスクリーン" title="フルスクリーン（F）"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<button id="snd" class="btn" type="button" aria-label="サウンド" title="サウンド ON / OFF"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
<div class="alpha">PRE-ALPHA</div>
<div id="err">WebGLを初期化できませんでした。別のブラウザでお試しください。</div>
</div></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// 基本設定
// =====================================================================
const IS_MOBILE = (() => {
    const q = new URLSearchParams(location.search).get('mobile');
    if (q === '1') return true; if (q === '0') return false;
    return matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
})();
class LiteMat extends THREE.MeshLambertMaterial { constructor(p = {}) { const q = Object.assign({}, p); delete q.metalness; delete q.roughness; super(q); } }
const StdMat = IS_MOBILE ? LiteMat : THREE.MeshStandardMaterial;
if (IS_MOBILE) document.body.classList.add('mob');
// PC は 1280×720（16:9）固定で描き、ウィンドウやフルスクリーンには拡大して合わせる（描画の重さは画面サイズに左右されない）
const BASE_W = 1280, BASE_H = 720;
const prFor = s => IS_MOBILE ? Math.min(devicePixelRatio || 1, 2) * 0.6 : Math.min(1.6, Math.max(1, (devicePixelRatio || 1) * s)); // 線は画面の細かさで描く（重さはエフェクト側で抑える）
const gameEl = document.getElementById('game'), rootEl = document.getElementById('root');
let VW = IS_MOBILE ? innerWidth : BASE_W, VH = IS_MOBILE ? innerHeight : BASE_H, PR = prFor(1);
const canvas = document.getElementById('gl');
let renderer;
try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_MOBILE, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('err').style.display = 'grid'; throw e; }
renderer.setPixelRatio(PR); renderer.setSize(VW, VH, false);

const BG = new THREE.Color(0x0b0220);
const scene = new THREE.Scene();
scene.background = BG.clone();
scene.fog = new THREE.Fog(BG.clone(), 480, 2050);
const camera = new THREE.PerspectiveCamera(62, VW / VH, 1, 4200);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(Math.round(VW * PR), Math.round(VH * PR), { type: THREE.HalfFloatType, samples: renderer.capabilities.isWebGL2 && !IS_MOBILE ? 4 : 0 }));
composer.setPixelRatio(PR); composer.setSize(VW, VH);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(VW, VH), 0.62, 0.4, 0.42);
{ const ss = bloom.setSize.bind(bloom); bloom.setSize = (w, h) => ss(Math.round(w * 0.3), Math.round(h * 0.3)); /* にじみは低い解像度で（見た目はほぼ同じで軽い） */ bloom.setSize(VW * PR, VH * PR); }
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0xa8b8ff, 0x2a0c40, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(-300, 700, 300); scene.add(sun); scene.add(sun.target);

let baseFov = 62;
function resize() {
    let sc = 1;
    if (IS_MOBILE) { VW = innerWidth; VH = innerHeight; }
    else { VW = BASE_W; VH = BASE_H; sc = Math.min(innerWidth / BASE_W, innerHeight / BASE_H); gameEl.style.setProperty('--s', sc); }
    PR = prFor(sc);
    renderer.setPixelRatio(PR); renderer.setSize(VW, VH, false);
    composer.setPixelRatio(PR); composer.setSize(VW, VH);
    camera.aspect = VW / VH;
    baseFov = camera.aspect < 0.8 ? 84 : camera.aspect < 1.2 ? 72 : 62; // 縦画面は広角に
    camera.fov = baseFov; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); document.addEventListener('fullscreenchange', resize); resize();
function toggleFS() {
    if (IS_MOBILE) return;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (rootEl.requestFullscreen) rootEl.requestFullscreen().catch(() => {});
}

// =====================================================================
// 造形キット（COMET OUTBURST+ と同じ: 装甲＋縁の発光ライン＋一部ガラス面＋ワイヤー殻）
// =====================================================================
const NI = g => (g.index ? g.toNonIndexed() : g);
// 共通マテリアル: 色は頂点に焼き込み、部位ごとにまとめて描く（描画回数を減らす）
const SM = {
    armor: new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide }),
    flat: new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }), // 光を焼き込んだ面（洞窟・ゲート）
    line: new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }),
    glass: new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),
    glow: new THREE.MeshBasicMaterial({ vertexColors: true }),
};
SM.armor.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n\ttotalEmissiveRadiance += vColor.rgb * 0.3;'); };
Object.values(SM).forEach(m => { m.userData.shared = true; });
// 形に色（と明るさ k）を焼き込む。加算の線・ガラスは k が不透明度の代わり
function paint(geo, c, k = 1) {
    geo = geo.index ? geo.toNonIndexed() : geo.clone();
    for (const n of Object.keys(geo.attributes)) if (n !== 'position') geo.deleteAttribute(n);
    const col = new THREE.Color(c).multiplyScalar(k), n = geo.attributes.position.count, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { a[i * 3] = col.r; a[i * 3 + 1] = col.g; a[i * 3 + 2] = col.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(a, 3)); return geo;
}
const LDIR = new THREE.Vector3(0.35, 0.9, 0.45).normalize();
// 面ごとの明るさを色に焼き込む（ライト計算なしで描けるので軽い）
function paintLit(geo, c, k = 1) {
    geo = paint(geo, c, k); const p = geo.attributes.position.array, col = geo.attributes.color.array, e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), nn = new THREE.Vector3();
    for (let i = 0; i + 8 < p.length; i += 9) { e1.set(p[i + 3] - p[i], p[i + 4] - p[i + 1], p[i + 5] - p[i + 2]); e2.set(p[i + 6] - p[i], p[i + 7] - p[i + 1], p[i + 8] - p[i + 2]);
        const sh = 0.5 + 0.8 * Math.abs(nn.crossVectors(e1, e2).normalize().dot(LDIR)); for (let j = 0; j < 9; j++) col[i + j] *= sh; }
    return geo;
}
const gm = (geo, c, k = 1) => new THREE.Mesh(paint(geo, c, k), SM.glow);
// 動かない部品を、いちばん近い「動く節」(userData.rigid) ごとに1つの形へまとめる
function bake(top) {
    top.updateMatrixWorld(true);
    const nodes = []; top.traverse(o => { if (o === top || o.userData.rigid) nodes.push(o); });
    const m = new THREE.Matrix4();
    for (const t of nodes) {
        const inv = t.matrixWorld.clone().invert(), bins = new Map(), rm = [];
        const walk = o => { for (const c of o.children) { if (c.userData.rigid) continue;
            if ((c.isMesh || c.isLineSegments) && c.material.userData.shared) { const g = c.geometry.clone().applyMatrix4(m.multiplyMatrices(inv, c.matrixWorld)); if (!bins.has(c.material)) bins.set(c.material, []); bins.get(c.material).push(g); rm.push(c); }
            walk(c); } };
        walk(t);
        rm.forEach(c => { c.parent.remove(c); c.geometry.dispose(); });
        for (const [mat, gs] of bins) { const mg = mergeGeometries(gs); gs.forEach(g => g.dispose()); t.add(mat.isLineBasicMaterial ? new THREE.LineSegments(mg, mat) : new THREE.Mesh(mg, mat)); }
    }
    return top;
}
// 竜用: 動く節ごとの部品を節番号つきで1つにまとめ、節の行列をシェーダーで当てる（全身を材質ごとに1回で描く）
function bakeSkinned(top) {
    top.updateMatrixWorld(true);
    const nodes = [top]; top.traverse(o => { if (o !== top && o.userData.rigid) nodes.push(o); });
    const inv0 = top.matrixWorld.clone().invert(), m = new THREE.Matrix4(), bins = new Map(), rm = [];
    nodes.forEach((t, bi) => {
        const inv = t.matrixWorld.clone().invert();
        const walk = o => { for (const c of o.children) { if (c.userData.rigid) continue;
            if ((c.isMesh || c.isLineSegments) && c.material.userData.shared) { const g = c.geometry.clone().applyMatrix4(m.multiplyMatrices(inv, c.matrixWorld)); const b = new Float32Array(g.attributes.position.count).fill(bi); g.setAttribute('aBone', new THREE.BufferAttribute(b, 1)); if (!bins.has(c.material)) bins.set(c.material, []); bins.get(c.material).push(g); rm.push(c); }
            walk(c); } };
        walk(t);
    });
    rm.forEach(c => { c.parent.remove(c); c.geometry.dispose(); });
    const bones = nodes.map(() => new THREE.Matrix4()), uni = { value: bones }, NB = nodes.length;
    for (const [mat, gs] of bins) {
        const mm = mat.clone(); mm.userData = {};
        mm.onBeforeCompile = sh => { sh.uniforms.uBones = uni; sh.vertexShader = 'attribute float aBone;\nuniform mat4 uBones[' + NB + '];\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n\ttransformed = (uBones[int(aBone + 0.5)] * vec4(transformed, 1.0)).xyz;'); };
        mm.customProgramCacheKey = () => 'skin' + NB;
        const mg = mergeGeometries(gs); gs.forEach(g => g.dispose());
        const o = mat.isLineBasicMaterial ? new THREE.LineSegments(mg, mm) : new THREE.Mesh(mg, mm); o.frustumCulled = false; top.add(o);
    }
    // 毎フレーム: 各節の「節→竜の体」行列を更新
    return () => { const gi = m.copy(top.matrixWorld).invert(); nodes.forEach((t, i) => bones[i].multiplyMatrices(gi, t.matrixWorld)); };
}
const armor = (c, e = 0x0c1420) => { const m = new StdMat({ color: c, emissive: e, emissiveIntensity: 0.6, flatShading: true, metalness: 0.55, roughness: 0.32 }); m.side = THREE.DoubleSide; return m; };
const glowM = c => new THREE.MeshBasicMaterial({ color: c });
const glass = (c, o = 0.28) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const lineM = (c, o = 0.9) => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
function triSubset(g, frac, seed) {
    g = NI(g); const P = g.attributes.position, out = []; let r = seed;
    const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
    for (let k = 0; k + 2 < P.count; k += 3) { if (rnd() > frac) continue; for (let j = 0; j < 3; j++) out.push(P.getX(k + j), P.getY(k + j), P.getZ(k + j)); }
    const o = new THREE.BufferGeometry(); o.setAttribute('position', new THREE.Float32BufferAttribute(out, 3)); return o;
}
// 断面をつないだ装甲（ロフト）: st = [z, 幅, 高さ, y, x]
function loft(st, n = 6, rot = Math.PI / 6) {
    const rings = st.map(([z, w, h, yo = 0, xo = 0]) => { const r = []; for (let k = 0; k < n; k++) { const a = rot + k * Math.PI * 2 / n; r.push([xo + Math.cos(a) * w / 2, yo + Math.sin(a) * h / 2, z]); } return r; });

const S = { mode: 'title', d: 0, y: 0, vy: 0, speed: 320, score: 0, t: 0, deadT: 0, shake: 0, flash: 0, camY: 60, camV: 0, lookY: 0, lookV: 0, stage: 0, warpT: 9, evoUntil: 0 };
const bgFrom = new THREE.Color(), bgTo = new THREE.Color(PAL.bg); let bgK = 1;
applyPalInstant();
function resetWorld() {
    clearWorld(); SEED = Math.random() * 1000;
    S.stage = 0; setPal(0); applyPalInstant(); S.warpT = 9; warp.visible = false;
    S.d = 0; S.y = cave(0).cy; S.vy = 0; S.speed = 320; S.score = 0; S.deadT = 0; S.camY = S.y + 34; S.camV = 0; S.lookY = S.y + 26; S.lookV = 0; S.yAvg = S.y;
    nextGateD = 1e9; gateIdx = 0; prevGc = 0;
    dragon.g.rotation.set(0, 0, 0); dragon.resetTrails(); S.evoUntil = 0;
    updateChunks(S.d, 99);
}
function applyPalInstant() { bgTo.set(PAL.bg); bgK = 1; scene.background.copy(bgTo); scene.fog.color.copy(bgTo); dragon.setAccent(PAL.wing); }
// 10ゲートごとの進化: 竜は中空に浮かんで無敵。世界が分解して虚空になり、新しい形で組み上がってからゲーム再開
const EVO_T = 3.0;
function evolve() {
    S.stage++; setPal(S.stage);
    S.mode = 'evo'; S.evoT = 0; S.evoSpd = S.speed; S.evoY = S.y; S.lastAutoFlap = 0;
    S.warpT = 0; S.flash = 0.15; warpInit(); sfxEvolve();
    bgFrom.copy(scene.background); bgTo.set(PAL.bg); bgK = 0; dragon.setAccent(PAL.wing); dragon.flap();
    // 世界の分解と融合: 竜のまわりから波のように、いまの洞窟がポリゴンと線に分かれて散り、新しい形の洞窟が組み上がる
    for (const [ci, c] of chunks) { c.to = 1; c.delay = waveDelay((ci + 0.5) * CH - S.d); dying.push(c); } chunks.clear();
    S.evoUntil = S.t + 2.0;
    for (let i = gates.length - 1; i >= 0; i--) { const gt = gates[i];
        const old = { obj: gt.obj, u: gt.u, k: gt.k, to: 1, delay: waveDelay(gt.d - S.d) }; gt.bars.forEach(b => b.visible = false); gt.veil.visible = false; if (gt.ring) gt.ring.visible = false; dying.push(old);
        if (gt.passed) { gates.splice(i, 1); continue; }
        buildGate(gt); gt.delay = 1.35 + old.delay * 0.6; }
    const dc = dust.geometry.attributes.color.array; for (let i = 0; i < DUST; i++) { const k = lineCol(Math.random(), i); dc.set([k.r, k.g, k.b], i * 3); } dust.geometry.attributes.color.needsUpdate = true;
    const p0 = new THREE.Vector3(0, S.y, -S.d); [PAL.cry[0], PAL.cry[1]].forEach((c, i) => setTimeout(() => burstRing(p0.clone().setZ(-S.d - 60), c, 1.6 + i * 0.5, false, 0.45, 3), i * 120));
    const el = document.getElementById('stage'); el.style.setProperty('--sc', '#' + _c(PAL.line ? PAL.line[0] : 0xffffff).getHexString());
    document.getElementById('stN').textContent = 'STAGE ' + (S.stage + 1); document.getElementById('stM').textContent = PAL.name + (S.stage >= PALS.length ? ' +' : '');
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function startGates() { nextGateD = S.d + 1000; prevGc = S.y; gateIdx = 0; }
function setScore(n) { S.score = n; ui.score.textContent = n; ui.score.classList.remove('pop'); void ui.score.offsetWidth; ui.score.classList.add('pop'); }
function doFlap() { S.vy = FLAP; dragon.flap(); sfxFlap(); }
function press() {
    if (S.mode === 'title') {
        audio(); S.mode = 'play'; startGates(); setScore(0);
        ui.title.classList.add('hide'); ui.hud.classList.remove('hide'); ui.best.textContent = 'BEST ' + best;
        doFlap();
    } else if (S.mode === 'play') doFlap();
    else if (S.mode === 'dead' && S.deadT > 0.75) {
        resetWorld(); S.mode = 'play'; startGates(); setScore(0);
        ui.over.classList.add('hide'); ui.hud.classList.remove('hide'); ui.best.textContent = 'BEST ' + best;
        doFlap();
    }
}
function crash() {
    S.mode = 'dead'; S.deadT = 0; S.shake = 1; S.flash = 0.8; sfxCrash();
    shatter(new THREE.Vector3(0, S.y, -S.d));
    const nr = S.score > best; if (nr) { best = S.score; try { localStorage.setItem('wyrm-best', best); } catch (e) {} }
    setTimeout(() => { if (S.mode !== 'dead') return; ui.rScore.textContent = S.score; ui.rBest.textContent = best; ui.newrec.style.display = nr ? 'block' : 'none'; ui.over.classList.remove('hide'); ui.hud.classList.add('hide'); }, 650);
}
function step(h) {
    if (S.mode === 'dead') {
        S.speed *= Math.pow(0.25, h); S.vy = Math.max(VMAX, S.vy + G * h); S.y += S.vy * h; S.d += S.speed * h;
        const cv = cave(S.d); if (S.y < cv.fl + 6) { S.y = cv.fl + 6; S.vy = -S.vy * 0.25; }
        return;
    }
    if (S.mode === 'evo') { // 進化中: 減速して中空に浮かぶ（当たり判定なし）
        S.evoT += h; const e = Math.min(1, S.evoT / 0.6), r = Math.max(0, Math.min(1, (S.evoT - (EVO_T - 0.5)) / 0.5));
        S.speed = lerp(lerp(S.evoSpd, 110, e * e * (3 - 2 * e)), S.evoSpd, r);
        const ty = cave(S.d + 500).cy; S.y += (ty - S.y) * Math.min(1, h * 1.6); S.vy = (ty - S.y) * 1.6;
        S.d += S.speed * h;
        if (S.evoT - S.lastAutoFlap > 0.75 && S.evoT < EVO_T - 0.3) { S.lastAutoFlap = S.evoT; dragon.flap(); }
        if (S.evoT >= EVO_T) { S.mode = 'play'; S.vy = 120; S.speed = S.evoSpd; }
        return;
    }
    if (S.mode === 'title') { // 自動で飛ぶ
        const cv = cave(S.d + 80); if (S.y < cv.cy - 12 && S.vy < 40) doFlapQuiet();
    }
    S.vy = Math.max(VMAX, S.vy + G * h); S.y += S.vy * h; S.d += S.speed * h;
    if (S.mode !== 'play') return;
    const cv = cave(S.d), cvH = cave(S.d + 40);
    if (S.y - R < cv.fl + 3 || S.y + R > cv.ce - 3 || S.y + 18 > cvH.ce - 4 || S.y - 4 < cvH.fl) { crash(); return; }
    for (const gt of gates) {
        if (gt.passed) continue;
        if (Math.abs(S.d - gt.d) < GT / 2 + R && (S.y + R > gt.top || S.y - R < gt.bot)) { crash(); return; }
        // 頭（前方）も判定
        if (Math.abs(S.d + 34 - gt.d) < GT / 2 + 6 && (S.y + 20 > gt.top || S.y + 6 < gt.bot)) { crash(); return; }
        if (S.d - R > gt.d + GT / 2) { gt.passed = true; gt.flash = 1; setScore(S.score + 1); sfxPass(S.score); burstRing(new THREE.Vector3(0, S.y, -gt.d), PAL.gate[1]); S.speed = Math.min(560, 320 + S.score * 6); if (S.score % 10 === 0) { evolve(); return; } }
    }
}
function doFlapQuiet() { S.vy = FLAP; dragon.flap(); }

// ---- 入力: スペース / タップ・クリック / ゲームパッドのABXY ----
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); } else if (e.code === 'KeyF' && !e.repeat) toggleFS(); });
addEventListener('pointerdown', e => { if (e.button !== undefined && e.button > 0) return; press(); });
addEventListener('touchstart', e => { if (e.target.closest && e.target.closest('.btn')) return; e.preventDefault(); }, { passive: false });
addEventListener('contextmenu', e => e.preventDefault());
const padPrev = {};
function pollPads() {
    const ps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of ps) { if (!p) continue;
        let any = false; for (let b = 0; b < 4; b++) if (p.buttons[b] && p.buttons[b].pressed) any = true;
        if (any && !padPrev[p.index]) press(); padPrev[p.index] = any; }
}

// ---- メインループ ----
resetWorld();
let last = performance.now(), acc = 0;
const H = 1 / 120;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    pollPads();
    S.t += dt; if (S.mode === 'dead') S.deadT += dt;
    acc += dt; while (acc >= H) { step(H); acc -= H; }
    if (S.mode !== 'title') spawnGates(S.d);
    updateChunks(S.d, 1);
    for (const [, c] of chunks) tickK(c, dt);
    for (let i = dying.length - 1; i >= 0; i--) { tickK(dying[i], dt); if (dying[i].k >= 1) { disposeObj(dying[i].obj); dying.splice(i, 1); } }
    // 古いゲートを片付ける
    for (let i = gates.length - 1; i >= 0; i--) if (gates[i].d < S.d - 500) { disposeObj(gates[i].obj); gates.splice(i, 1); }
    gates.forEach(gt => { tickK(gt, dt); const vis = gt.k < 0.35; gt.bars.forEach(b => b.visible = vis); gt.veil.visible = vis; if (gt.ring) gt.ring.visible = vis; if (gt.flash > 0) { gt.flash = Math.max(0, gt.flash - dt * 2); } const k = 1.6 + gt.flash * 3 + Math.sin(S.t * 6) * 0.25; gt.bars.forEach(b => b.material.color.setHex(gt.stage ? 0xffffff : gt.col).multiplyScalar(gt.stage ? k * 0.9 : k)); if (gt.ring) gt.ring.rotation.y = S.t * 0.8; gt.veil.material.opacity = 0.035 + gt.flash * 0.25; });
    // 竜
    dragon.root.position.set(0, S.y, -S.d);
    dragon.update(dt, S.t, { vy: S.vy, dead: S.mode === 'dead' });
    // カメラ: 後ろ上から（洞窟からはみ出さない）
    const cd = S.d - 215, cv = cave(cd);
    S.yAvg = (S.yAvg ?? S.y) + (S.y - (S.yAvg ?? S.y)) * Math.min(1, dt / 0.35); // 羽ばたきの上下をならした高さ
    const ty = Math.max(cv.fl + 30, Math.min(cv.ce - 26, S.yAvg + 34));
    // カメラはばね（臨界減衰）でなめらかに追う。羽ばたきごとの上下は吸収し、大きな高低差にだけついていく
    const damp = (x, v, to, w) => { const k = Math.min(dt, 0.05), a = w * w * (to - x) - 2 * w * v; v += a * k; return [x + v * k, v]; };
    [S.camY, S.camV] = damp(S.camY, S.camV, ty, 3.2);
    { const off = S.camY - (S.y + 34), lim = 60; if (Math.abs(off) > lim) S.camY -= (off - Math.sign(off) * lim) * Math.min(1, dt * 5); } // 竜が画面から外れないよう、離れすぎた分だけやわらかく寄せる
    if (S.camY < cv.fl + 24) { S.camY = cv.fl + 24; S.camV = Math.max(0, S.camV); } else if (S.camY > cv.ce - 20) { S.camY = cv.ce - 20; S.camV = Math.min(0, S.camV); }
    S.kick = Math.max(0, (S.kick || 0) - dt * 3);
    const ly = S.mode === 'dead' ? S.y + 20 : S.y * 0.65 + cave(S.d + 300).cy * 0.35 + 26 - S.kick * 3; // 視線は竜と前方の通路の中間へ
    [S.lookY, S.lookV] = damp(S.lookY, S.lookV, ly, 2.6);
    const shk = S.shake * 8; S.shake = Math.max(0, S.shake - dt * 2.2);
    camPos.set((Math.random() - 0.5) * shk, S.camY + (Math.random() - 0.5) * shk, -cd);
    camera.position.copy(camPos);
    camLook.set(0, S.lookY, -S.d - 300);
    camera.lookAt(camLook);
    camera.rotation.z += Math.sin(S.t * 0.7) * 0.01;
    if (window.__cam) window.__cam(camera, S, dragon);
    sun.position.set(-300, S.y + 700, -S.d + 300); sun.target.position.set(0, S.y, -S.d);
    updateDust(camera.position.z, S.camY);
    for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(1 + r.t * r.m.userData.grow); r.m.material.opacity = Math.max(0, r.m.userData.op * (1 - r.t / 0.6)); r.m.position.z -= S.speed * dt * 0.3; if (r.t > 0.6) { disposeObj(r.m); rings.splice(i, 1); } }
    updateShards(dt);
    { const ft = dragon.pose.ft; if (S.prevFt < 0.16 && ft >= 0.16 && S.mode !== 'dead') { burstRing(new THREE.Vector3(0, S.y - 24, -S.d - 30), PAL.wing, 1.4, true, 0.32, 2.4); S.kick = 1; } S.prevFt = ft; } // 打ち下ろしの風
    // ステージ進化: 画角が一瞬開き、光が強まり、ワープ線が流れる
    S.warpT += dt; const wk = S.mode === 'evo' ? Math.min(1, S.evoT / 0.3) * Math.min(1, Math.max(0, (EVO_T - S.evoT) / 0.8)) * 0.85 : Math.max(0, 1 - S.warpT / 0.6) * 0.3;
    updateWarp(dt, 0, S.camY, camera.position.z, wk);
    camera.fov = baseFov + wk * 10; camera.updateProjectionMatrix();
    bloom.strength = 0.62 + wk * 0.35;
    if (bgK < 1) { bgK = Math.min(1, bgK + dt / 1.6); scene.background.copy(bgFrom).lerp(bgTo, bgK); scene.fog.color.copy(scene.background); }
    dragon.root.visible = !(S.mode === 'dead' && S.deadT > 0.05) || S.deadT < 0; // 墜落したら砕ける
    dragon.trails.forEach(t => t.visible = dragon.root.visible);

}
requestAnimationFrame(frame);
window.__wyrm = { S, press, dragon, gates, cave, info: renderer.info, evolve, scene, chunks };
