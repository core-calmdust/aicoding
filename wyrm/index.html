<!DOCTYPE html>
<html lang="ja">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",

<style>
:root{--cy:#5ff2ff;--mg:#ff4fd8;--vi:#9b6bff;--gd:#ffc35a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0220;color:#fff;font-family:'Orbitron','Noto Sans JP',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;pointer-events:none;z-index:5}
#hud{top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;transition:opacity .3s}
#score{font-weight:900;font-size:clamp(44px,7vw,76px);letter-spacing:.04em;line-height:1;
  background:linear-gradient(180deg,#fff 20%,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(95,242,255,.55)) drop-shadow(0 0 2px rgba(255,79,216,.7))}
#score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#best{margin-top:6px;font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.55)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;pointer-events:none;
  text-align:center;padding:24px;transition:opacity .35s}
.hide{opacity:0}
.logo{font-weight:900;font-size:clamp(46px,10vw,124px);letter-spacing:.06em;line-height:.95;
  background:linear-gradient(100deg,#fff 0%,var(--cy) 30%,var(--vi) 62%,var(--mg) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(155,107,255,.55)) drop-shadow(0 0 3px rgba(95,242,255,.8))}
.logo small{display:block;font-size:.26em;letter-spacing:.9em;margin:.5em -.9em 0 0;font-weight:700}

.press{margin-top:clamp(40px,9vh,90px);font-size:clamp(13px,1.8vw,17px);letter-spacing:.24em;color:#fff;animation:blink 1.3s ease-in-out infinite;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}

  box-shadow:0 0 12px rgba(95,242,255,.45),inset 0 0 8px rgba(95,242,255,.25);background:rgba(10,20,40,.4)}
.press .pad{border-color:rgba(255,79,216,.75);box-shadow:0 0 12px rgba(255,79,216,.45),inset 0 0 8px rgba(255,79,216,.25)}

@keyframes blink{50%{opacity:.35}}
.ov.split{justify-content:space-between;padding:max(9vh,60px) 24px max(7vh,40px)}
.ov.split .press{margin-top:0}

.over-t{font-weight:900;font-size:clamp(40px,8vw,92px);letter-spacing:.1em;color:#fff;
  text-shadow:0 0 22px rgba(255,79,216,.9),0 0 4px #fff}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;mix-blend-mode:screen}
.btn{position:fixed;z-index:7;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;pointer-events:auto;cursor:pointer;
  background:rgba(12,10,36,.55);border:1px solid rgba(155,107,255,.45);color:#dfe9ff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#home{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}

<body>
<canvas id="gl"></canvas>
<div id="flash"></div>
<div id="hud" class="ui hide"><div id="score">0</div><div id="best">BEST 0</div></div>

<div id="title" class="ov split">
  <div><div class="logo">WYRM RIDER<small>DRAGON CAVE FLIGHT</small></div>

<div id="over" class="ov hide">

  <div class="res"><div>SCORE<b id="rScore">0</b></div><div>BEST<b id="rBest">0</b></div></div>

<a id="home" class="btn" href="../" aria-label="ホーム" title="ホーム"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></a>
<button id="snd" class="btn" type="button" aria-label="サウンド" title="サウンド ON / OFF"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
<div class="alpha">ALPHA</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// 基本設定
// =====================================================================
const IS_MOBILE = (() => {
    const q = new URLSearchParams(location.search).get('mobile');
    if (q === '1') return true; if (q === '0') return false;
    return matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
})();
class LiteMat extends THREE.MeshLambertMaterial { constructor(p = {}) { const q = Object.assign({}, p); delete q.metalness; delete q.roughness; super(q); } }
const StdMat = IS_MOBILE ? LiteMat : THREE.MeshStandardMaterial;
const PR = IS_MOBILE ? Math.min(devicePixelRatio || 1, 1.5) : Math.min(devicePixelRatio || 1, 2);

let VW = innerWidth, VH = innerHeight;
const canvas = document.getElementById('gl');
let renderer;
try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_MOBILE, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('err').style.display = 'grid'; throw e; }
renderer.setPixelRatio(PR); renderer.setSize(VW, VH, false);

const BG = new THREE.Color(0x0b0220);
const scene = new THREE.Scene();
scene.background = BG.clone();
scene.fog = new THREE.Fog(BG.clone(), 520, 2300);
const camera = new THREE.PerspectiveCamera(62, VW / VH, 1, 4200);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(Math.round(VW * PR), Math.round(VH * PR), { type: THREE.HalfFloatType, samples: renderer.capabilities.isWebGL2 && !IS_MOBILE ? 4 : 0 }));
composer.setPixelRatio(PR); composer.setSize(VW, VH);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(VW, VH), 0.68, 0.42, 0.36);
{ const ss = bloom.setSize.bind(bloom); bloom.setSize = (w, h) => ss(Math.round(w * 0.6), Math.round(h * 0.6)); bloom.setSize(VW * PR, VH * PR); }
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0xa8b8ff, 0x2a0c40, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(-300, 700, 300); scene.add(sun); scene.add(sun.target);
const rim = new THREE.DirectionalLight(0xff66cc, 0.9); rim.position.set(400, 200, -500); scene.add(rim); scene.add(rim.target);
const lamp = new THREE.PointLight(0x7fe9ff, 2.6, 900, 1); scene.add(lamp); // 竜のまわりを照らす灯り

function resize() {
    VW = innerWidth; VH = innerHeight;
    renderer.setSize(VW, VH, false); composer.setSize(VW, VH);
    camera.aspect = VW / VH;
    camera.fov = camera.aspect < 0.8 ? 84 : camera.aspect < 1.2 ? 72 : 62; // 縦画面は広角に
    camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// =====================================================================
// 造形キット（COMET OUTBURST+ と同じ: 装甲＋縁の発光ライン＋一部ガラス面＋ワイヤー殻）
// =====================================================================
const NI = g => (g.index ? g.toNonIndexed() : g);
const armor = (c, e = 0x0c1420) => { const m = new StdMat({ color: c, emissive: e, emissiveIntensity: 0.6, flatShading: true, metalness: 0.55, roughness: 0.32 }); m.side = THREE.DoubleSide; return m; };
const glowM = c => new THREE.MeshBasicMaterial({ color: c });
const glass = (c, o = 0.28) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const lineM = (c, o = 0.9) => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
function triSubset(g, frac, seed) {
    g = NI(g); const P = g.attributes.position, out = []; let r = seed;
    const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
    for (let k = 0; k + 2 < P.count; k += 3) { if (rnd() > frac) continue; for (let j = 0; j < 3; j++) out.push(P.getX(k + j), P.getY(k + j), P.getZ(k + j)); }
    const o = new THREE.BufferGeometry(); o.setAttribute('position', new THREE.Float32BufferAttribute(out, 3)); return o;
}
// 断面をつないだ装甲（ロフト）: st = [z, 幅, 高さ, y, x]
function loft(st, n = 6, rot = Math.PI / 6) {
    const rings = st.map(([z, w, h, yo = 0, xo = 0]) => { const r = []; for (let k = 0; k < n; k++) { const a = rot + k * Math.PI * 2 / n; r.push([xo + Math.cos(a) * w / 2, yo + Math.sin(a) * h / 2, z]); } return r; });
    const p = [];
    for (let i = 0; i < rings.length - 1; i++) for (let k = 0; k < n; k++) { const a0 = rings[i][k], a1 = rings[i][(k + 1) % n], b0 = rings[i + 1][k], b1 = rings[i + 1][(k + 1) % n]; p.push(...a0, ...b0, ...b1, ...a0, ...b1, ...a1); }
    const cap = (r, rev) => { const c = r.reduce((m, v) => [m[0] + v[0] / n, m[1] + v[1] / n, m[2] + v[2] / n], [0, 0, 0]); for (let k = 0; k < n; k++) { const v0 = r[k], v1 = r[(k + 1) % n]; rev ? p.push(...c, ...v1, ...v0) : p.push(...c, ...v0, ...v1); } };
    cap(rings[0], false); cap(rings[rings.length - 1], true);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.computeVertexNormals(); return g;
}
const loftY = (st, n, rot) => { const g = loft(st, n, rot); g.rotateX(-Math.PI / 2); return g; };
const crystal = (r, h, n = 6) => loftY([[-h, 0.5, 0.5], [-h * 0.35, r * 2, r * 2], [h * 0.35, r * 2, r * 2], [h, 0.5, 0.5]], n, Math.PI / n);
const spike = (r, h, n = 4) => loftY([[0, r * 2, r * 2], [h * 0.4, r * 1.6, r * 1.6], [h, 0.3, 0.3]], n, Math.PI / n); // 根元から先へ尖る
const _steel = new THREE.Color(0x343c52), _c = h => new THREE.Color(h);
function fuse(geo, accent, o = {}) {
    const mat = armor(_steel.clone().lerp(_c(accent), o.tint ?? 0.32).getHex(), _c(accent).multiplyScalar(0.22).getHex());
    const g = new THREE.Group();
    g.add(new THREE.Mesh(geo, mat));
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 14), lineM(_c(accent).lerp(_c(0xffffff), 0.25).getHex(), o.edgeOp ?? 0.9)));
    if (o.glass !== 0) g.add(new THREE.Mesh(triSubset(geo, o.glass ?? 0.28, o.seed || 5), glass(accent, o.glassOp ?? 0.28)));
    const cage = o.cage === false ? 0 : (o.cage || 1.12);
    if (cage && !IS_MOBILE) { const c = geo.clone(); c.computeBoundingBox(); const ctr = new THREE.Vector3(); c.boundingBox.getCenter(ctr); c.translate(-ctr.x, -ctr.y, -ctr.z); c.scale(cage, cage, cage); c.translate(ctr.x, ctr.y, ctr.z); g.add(new THREE.LineSegments(new THREE.EdgesGeometry(c, 8), lineM(accent, 0.26))); }
    return g;
}
const wire = (geo, c, o = 0.6) => new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), lineM(c, o));
function polyLine(n, c, o = 0.8) {
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
    const l = new THREE.Line(geo, lineM(c, o)); l.frustumCulled = false; return l;
}
const setLine = (ln, pts) => { const a = ln.geometry.attributes.position; pts.forEach((p, i) => a.setXYZ(i, p.x, p.y, p.z)); a.needsUpdate = true; };
function dashRing(R, n, len, th, mat, gap = 4) {
    const parts = [], m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1), up = new THREE.Vector3(0, 1, 0);
    for (let k = 0; k < n; k++) { if (k % gap === gap - 1) continue; const a = k / n * Math.PI * 2; q.setFromAxisAngle(up, -a + Math.PI / 2); m4.compose(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R), q, one); parts.push(new THREE.BoxGeometry(len, th, th * 1.6).applyMatrix4(m4)); }
    return new THREE.Mesh(mergeGeometries(parts), mat);
}
// 線の軌跡（先頭が明るく、尾は消えていく）
function trail(n, color, op = 0.8) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
    const col = new Float32Array(n * 3), c = _c(color);
    for (let i = 0; i < n; i++) { const f = Math.pow(1 - i / (n - 1), 1.6); col[i * 3] = c.r * f; col[i * 3 + 1] = c.g * f; col[i * 3 + 2] = c.b * f; }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const l = new THREE.Line(geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false }));
    l.frustumCulled = false; l.userData.pts = Array.from({ length: n }, () => new THREE.Vector3()); l.userData.init = false;
    l.push = p => { const P = l.userData.pts; if (!l.userData.init) { P.forEach(q => q.copy(p)); l.userData.init = true; } for (let i = P.length - 1; i > 0; i--) P[i].copy(P[i - 1]); P[0].copy(p); setLine(l, P); };
    l.reset = () => { l.userData.init = false; };
    return l;
}

// =====================================================================
// 竜と騎手
// =====================================================================
const COL = { C: 0x45e6ff, V: 0x9b6bff, M: 0xff4fd8, GD: 0xffb848, R: 0xff3a5a, W: 0xe8f0ff };
function buildDragon() {
    const { C, V, M, GD, W } = COL;
    const root = new THREE.Group(); root.rotation.y = Math.PI; // 作り: 頭が+z、ゲームでは-zへ進む
    const g = new THREE.Group(); g.rotation.order = 'YXZ'; root.add(g);
    const mk = (p, x, y, z) => { const o = new THREE.Object3D(); o.position.set(x, y, z); p.add(o); return o; };

    // ---- 胴体 ----
    const torsoSt = [[-32, 14, 12, 0], [-18, 26, 22, 1], [-2, 32, 27, 2], [14, 30, 25, 3], [26, 19, 16, 5], [33, 12, 10, 7]];
    g.add(fuse(loft(torsoSt, 6), C, { glass: 0.26, cage: 1.14, seed: 3 }));
    g.add(fuse(loft([[-24, 14, 4, -9], [-6, 22, 5, -11], [12, 20, 4, -9.5], [28, 9, 3, -5]], 6), GD, { cage: false, glass: 0.45, tint: 0.5, seed: 9 })); // 腹の鱗
    const core = new THREE.Mesh(new THREE.OctahedronGeometry(5, 0), glowM(_c(GD).multiplyScalar(1.6))); core.position.set(0, -2, 12); core.scale.set(1, 0.7, 1.5); g.add(core); // 胸の炉
    const topAt = z => { for (let i = 0; i < torsoSt.length - 1; i++) { const a = torsoSt[i], b = torsoSt[i + 1]; if (z >= a[0] && z <= b[0]) { const t = (z - a[0]) / (b[0] - a[0]); return (a[3] + a[2] / 2) * (1 - t) + (b[3] + b[2] / 2) * t; } } return 0; };
    // 背びれの結晶（騎手の位置はあける）
    { const L = []; for (let z = -28; z <= 30; z += 7) { if (z > -2 && z < 16) continue; const h = 4 + (1 - Math.abs(z - 8) / 40) * 6; const c = spike(1.7, h); c.rotateX(-0.55); c.translate(0, topAt(z) - 1.2, z); L.push(c); }
      g.add(fuse(mergeGeometries(L), M, { cage: false, glass: 0.5, tint: 0.45 })); }
    // 脇腹の光の筋
    [-1, 1].forEach(s => { const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([[-28, 0], [-14, 3], [2, 4], [18, 3.5], [30, 6]].map(([z, y]) => new THREE.Vector3(s * (z < -20 ? 7 : z > 24 ? 9 : 15.5), y, z))), lineM(C, 0.75)); g.add(ln); });

    // ---- 首と頭 ----
    const neckBase = new THREE.Group(); neckBase.position.set(0, 9, 31); g.add(neckBase);
    const neck = []; let par = neckBase;
    const nGeo = loft([[0, 13, 12], [5, 14, 13], [10, 11.5, 10.5]], 6);
    for (let k = 0; k < 5; k++) {
        const s = new THREE.Group(); s.position.z = k ? 9 : 0; par.add(s);
        const sc = 1 - k * 0.07;
        const seg = fuse(nGeo, k % 2 ? V : C, { cage: false, glass: 0.25, seed: k + 2 }); seg.scale.setScalar(sc); s.add(seg);
        const fin = spike(1.4, 5 - k * 0.4); fin.rotateX(-0.6); fin.translate(0, 6 * sc, 4); s.add(fuse(fin, M, { cage: false, glass: 0.5, tint: 0.45 }));
        const ring = wire(new THREE.TorusGeometry(8.5 * sc, 0.6, 3, 8), k % 2 ? C : M, 0.5); ring.position.z = 9; s.add(ring);
        neck.push(s); par = s;
    }
    const head = new THREE.Group(); head.position.z = 10; par.add(head);
    head.add(fuse(loft([[-6, 15, 13, 1], [4, 18, 13.5, 2], [13, 14, 9, 1], [23, 9, 6, 0], [31, 4.5, 3.5, -1]], 6), C, { glass: 0.3, cage: 1.18, seed: 4 }));
    const jaw = new THREE.Group(); jaw.position.set(0, -3.5, 2); head.add(jaw);
    jaw.add(fuse(loft([[0, 12, 5, -2], [13, 9.5, 4, -3], [26, 3.5, 2.2, -3]], 4, Math.PI / 4), V, { cage: false, glass: 0.3 }));

    S.mode = 'dead'; S.deadT = 0; S.shake = 1; S.flash = 0.8; sfxCrash();
    shatter(new THREE.Vector3(0, S.y, -S.d));
    const nr = S.score > best; if (nr) { best = S.score; try { localStorage.setItem('wyrm-best', best); } catch (e) {} }
    setTimeout(() => { if (S.mode !== 'dead') return; ui.rScore.textContent = S.score; ui.rBest.textContent = best; ui.newrec.style.display = nr ? 'block' : 'none'; ui.over.classList.remove('hide'); ui.hud.classList.add('hide'); }, 650);
}
function step(h) {
    if (S.mode === 'dead') {
        S.speed *= Math.pow(0.25, h); S.vy = Math.max(VMAX, S.vy + G * h); S.y += S.vy * h; S.d += S.speed * h;
        const cv = cave(S.d); if (S.y < cv.fl + 6) { S.y = cv.fl + 6; S.vy = -S.vy * 0.25; }
        return;
    }
    if (S.mode === 'title') { // 自動で飛ぶ
        const cv = cave(S.d + 80); if (S.y < cv.cy - 12 && S.vy < 40) doFlapQuiet();
    }
    S.vy = Math.max(VMAX, S.vy + G * h); S.y += S.vy * h; S.d += S.speed * h;
    if (S.mode !== 'play') return;
    const cv = cave(S.d), cvH = cave(S.d + 40);
    if (S.y - R < cv.fl + 3 || S.y + R > cv.ce - 3 || S.y + 18 > cvH.ce - 4 || S.y - 4 < cvH.fl) { crash(); return; }
    for (const gt of gates) {
        if (gt.passed) continue;
        if (Math.abs(S.d - gt.d) < GT / 2 + R && (S.y + R > gt.top || S.y - R < gt.bot)) { crash(); return; }
        // 頭（前方）も判定
        if (Math.abs(S.d + 34 - gt.d) < GT / 2 + 6 && (S.y + 20 > gt.top || S.y + 6 < gt.bot)) { crash(); return; }
        if (S.d - R > gt.d + GT / 2) { gt.passed = true; gt.flash = 1; setScore(S.score + 1); sfxPass(S.score); burstRing(new THREE.Vector3(0, S.y, -gt.d), 0xffd060); S.speed = Math.min(560, 320 + S.score * 6); }
    }
}
function doFlapQuiet() { S.vy = FLAP; dragon.flap(); }

// ---- 入力: スペース / タップ・クリック / ゲームパッドのABXY ----
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); } });
addEventListener('pointerdown', e => { if (e.button !== undefined && e.button > 0) return; press(); });
addEventListener('touchstart', e => { if (e.target.closest && e.target.closest('.btn')) return; e.preventDefault(); }, { passive: false });
addEventListener('contextmenu', e => e.preventDefault());
const padPrev = {};
function pollPads() {
    const ps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of ps) { if (!p) continue;
        let any = false; for (let b = 0; b < 4; b++) if (p.buttons[b] && p.buttons[b].pressed) any = true;
        if (any && !padPrev[p.index]) press(); padPrev[p.index] = any; }
}

// ---- メインループ ----
resetWorld();
let last = performance.now(), acc = 0;
const H = 1 / 120;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    pollPads();
    S.t += dt; if (S.mode === 'dead') S.deadT += dt;
    acc += dt; while (acc >= H) { step(H); acc -= H; }
    if (S.mode === 'play' || S.mode === 'dead') spawnGates(S.d);
    updateChunks(S.d);
    // 古いゲートを片付ける
    for (let i = gates.length - 1; i >= 0; i--) if (gates[i].d < S.d - 500) { disposeObj(gates[i].obj); gates.splice(i, 1); }
    gates.forEach(gt => { if (gt.flash > 0) { gt.flash = Math.max(0, gt.flash - dt * 2); } const k = 1.6 + gt.flash * 3 + Math.sin(S.t * 6) * 0.25; gt.bars.forEach(b => b.material.color.setHex(0xff8a2a).multiplyScalar(k)); gt.veil.material.opacity = 0.035 + gt.flash * 0.25; });
    // 竜
    dragon.root.position.set(0, S.y, -S.d);
    dragon.update(dt, S.t, { vy: S.vy, dead: S.mode === 'dead' });
    lamp.position.set(0, S.y + 40, -S.d - 60);
    // カメラ: 後ろ上から（洞窟からはみ出さない）
    const cd = S.d - 200, cv = cave(cd);
    const ty = Math.max(cv.fl + 30, Math.min(cv.ce - 26, S.y + 60));
    S.camY += (ty - S.camY) * Math.min(1, dt * 5.5);
    const shk = S.shake * 8; S.shake = Math.max(0, S.shake - dt * 2.2);
    camPos.set((Math.random() - 0.5) * shk, S.camY + (Math.random() - 0.5) * shk, -cd);
    camera.position.copy(camPos);
    camLook.set(0, S.y + 18 + S.vy * 0.02, -S.d - 300);
    camera.lookAt(camLook);
    camera.rotation.z += Math.sin(S.t * 0.7) * 0.01;
    if (window.__cam) window.__cam(camera, S, dragon);
    sun.position.set(-300, S.y + 700, -S.d + 300); sun.target.position.set(0, S.y, -S.d);
    rim.position.set(400, S.y + 200, -S.d - 500); rim.target.position.set(0, S.y, -S.d);
    updateDust(camera.position.z, S.camY);
    for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(1 + r.t * 5); r.m.material.opacity = Math.max(0, 0.9 - r.t * 1.6); r.m.position.z -= S.speed * dt * 0.3; if (r.t > 0.6) { disposeObj(r.m); rings.splice(i, 1); } }
    updateShards(dt);
    dragon.root.visible = !(S.mode === 'dead' && S.deadT > 0.05) || S.deadT < 0; // 墜落したら砕ける
    dragon.trails.forEach(t => t.visible = dragon.root.visible);
    S.flash = Math.max(0, S.flash - dt * 2.5); ui.flash.style.opacity = S.flash;
    composer.render();
}
requestAnimationFrame(frame);
window.__wyrm = { S, press, dragon, gates, cave };
</script>
