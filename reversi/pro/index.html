<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<meta name="robots" content="noindex">
<title>Reversi — 最強解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" crossorigin>
<style>
:root{
  --bg:#0b0a09; --panel:#171310; --panel2:#211b15; --line:#3a2f24;
  --text:#efe8de; --muted:#ab9d8b; --dim:#76695a;
  --sqL:#e3cfa8; --sqD:#9c7349; --brass:#c9a961; --accent:#e2c275; --red:#ff6b5b; --good:#7fd6a4;
  --cell:min(calc((100vh - 120px) / 8), calc((100vw - 32px) / 8), 84px);
}
@media (min-width: 900px){ :root{ --cell:min(calc((100vh - 120px) / 8), calc((100vw - 480px) / 8), 96px); } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
header a{color:var(--muted);text-decoration:none;font-size:14px}
header a:hover{color:var(--accent)}
h1{margin:0;font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--brass);letter-spacing:.04em}
h1 small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
main{display:flex;gap:24px;padding:20px 16px;justify-content:center;flex-wrap:wrap}
#board{display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));background:#1f6b45;border:6px solid #12301f;border-radius:4px;box-shadow:0 10px 40px #000a;user-select:none;touch-action:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;border-right:1px solid #0d3a2466;border-bottom:1px solid #0d3a2466}
.disc{width:80%;height:80%;border-radius:50%;box-shadow:0 2px 4px #0008}
.disc.b{background:radial-gradient(circle at 35% 30%,#555,#111 70%)} .disc.w{background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 70%)}
.sq.tgt::after{content:'';position:absolute;width:22%;height:22%;border-radius:50%;background:#0006}
.sq.last .disc{outline:3px solid #e2c275aa;outline-offset:-3px}
.sq .co{position:absolute;font-size:10px;font-weight:700;color:#cfe8d966;pointer-events:none}
.sq .co.f{right:3px;bottom:1px} .sq .co.r{left:3px;top:1px}
#arrow{position:absolute;pointer-events:none}
.side{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--brass)}
button.go{background:linear-gradient(#c9a961,#8e7440);color:#1a130b;font-weight:700;border-color:#8e7440}
button:disabled{opacity:.45;cursor:default}
label{font-size:13px;color:var(--muted)}
.eval{font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--accent)}
.stats{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.pv{font-size:15px;line-height:1.6;word-break:break-word}
.moves{font-size:14px;line-height:1.7;max-height:160px;overflow:auto;color:var(--muted)}
.note{font-size:12px;color:var(--dim);line-height:1.6}
.status.ok{color:var(--good)} .status.ng{color:var(--red)}
input[type=text]{width:100%;font:inherit;font-size:13px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
</style>
</head>
<body>
<header>
  <a href="../" id="back">← Reversi</a>
  <h1><span id="gname">Reversi</span> <small id="ttl">最強解析</small></h1>
</header>
<main>
  <div style="position:relative">
    <div id="board"></div>
  </div>
  <div class="side">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="eval" id="eval">—</div>
        <div class="status" id="iso"></div>
      </div>
      <div class="stats">
        <span id="lDepth">深さ</span><span id="depth">—</span>
        <span id="lNps">局面/秒</span><span id="nps">—</span>
        <span id="lThreads">スレッド</span><span id="thr">—</span>
      </div>
      <div class="pv" id="pv"></div>
    </div>
    <div class="card">
      <div class="row">
        <button class="go" id="btnAna">解析</button>
        <button id="btnPlay">AIに指させる</button>
        <select id="selTime"></select>
      </div>
      <div class="row" style="margin-top:10px">
        <label for="selThr" id="lSel">スレッド数</label>
        <select id="selThr"></select>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="btnUndo">戻す</button>
        <button id="btnFlip">盤を反転</button>
        <button id="btnReset">初期配置</button>
      </div>
    </div>
    <div class="card">
      <div class="moves" id="moves"></div>
      <div style="margin-top:8px;font-size:13px;color:var(--muted)" id="count"></div>
      
    </div>
    <p class="note" id="note"></p>
  </div>
</main>
<script src="../../shared/mtengine.js?v=9"></script>
<script src="pro.js?v=3mt2-pt2"></script>
</body>
</html>
