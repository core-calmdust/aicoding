<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>チェッカー MT ベンチ</title>
<script src="../shared/bench-auto.js?v=1"></script>
<style>
:root{--bg:#f6f1e7;--fg:#2a2118;--mut:#7a6a58;--card:#fffaf0;--line:#e2d6c2;--acc:#8c2434;--ok:#2f7d4a;--ng:#b23b2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1915;--fg:#efe6d8;--mut:#a89884;--card:#28221c;--line:#3d342a;--acc:#e0707e;--ok:#6cc58a;--ng:#ef7b6c}}
:root[data-theme="dark"]{--bg:#1d1915;--fg:#efe6d8;--mut:#a89884;--card:#28221c;--line:#3d342a;--acc:#e0707e;--ok:#6cc58a;--ng:#ef7b6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px}
.kv b{font-weight:600}
.y{color:var(--ok);font-weight:600}.n{color:var(--ng);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-size:14px}
select,button{font:inherit}
select{padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{padding:8px 16px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button:disabled{opacity:.45;cursor:default}
#bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 4px}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#st{font-size:13px;color:var(--mut);min-height:1.5em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
h2{font-size:15px;margin:4px 0 8px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--mut);margin:8px 0 0;max-height:200px;overflow:auto}
</style>
</head>
<body>
<main>
<h1>チェッカー マルチスレッド ベンチマーク</h1>
<p class="sub">対局ページと同じ方式（Document-Isolation-Policy の分離、engine_mt.wasm の Lazy SMP）で、スレッド数ごとの読みの速さを測ります。①同じ時間での局面数／秒・深さ・最善手、②同じ深さまでの時間。Chrome（PC）で開き、終わったら「結果をコピー」を押して貼り付けてください。</p>

<div class="card"><div class="kv" id="env"></div></div>

<div class="card">
  <div class="row">
    <label>1回の時間 <select id="selT"><option value="1000">1秒</option><option value="2500" selected>2.5秒</option><option value="5000">5秒</option></select></label>
    <label>基準（1スレッド） <select id="selR"><option value="4">時間×4</option><option value="2" selected>時間×2</option><option value="0">なし</option></select></label>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="btnRun" disabled>開始</button>
    <button id="btnCopy" class="sec" disabled>結果をコピー</button>
  </div>
  <div id="bar"><i></i></div>
  <div id="st">準備中…</div>
</div>

<div class="card"><h2>結果</h2><div class="tw"><table id="tbl"><thead><tr><th>スレッド</th><th>局面数/秒</th><th>1スレッド比</th><th>平均の深さ</th><th>同じ深さまで</th><th>速さ（深さ）</th><th>基準と一致</th><th>起動</th></tr></thead><tbody></tbody></table></div><pre id="log"></pre></div>
</main>
<script src="../shared/mtengine.js?v=9"></script>
<script src="engine.js?v=rb4-pro1-n43-mt1"></script>
<script>
'use strict';
// 12 positions (move lists from the start, balanced material), the same engine and pool as the game page (app.js MTEngine.use)
const GAME = 'checkers', SW = 'sw.js?v=1';
const POS = [[490,565,457,16777553,1049031,696],[392,599,260,762,128,566,458,16777553,1049031,729],[392,532,458,565,67109548,2147484185,134218414,2147484216,260,830,128,599,326,400],[491,598,268436175,4294967866,457,533,134218414,2147484216,490,631,424,33554771,1049062,8388912,134742693,2147484185,161,400],[392,533,67109548,2147484185,261,696,458,598,327,498,33555019,400,490,262316,33025,631,227,33685619,424,565,134218414,797],[457,532,558,134218197,16777770,134218166,8389160,730,4294968145,68719477471,260,400,294,598,491,33554802,128,631,424,696,193,533,67109517,763,260,796],[490,565,623,465,16777801,268435958,33555019,268435927,755,8589935195,294,762,424,334,1049031,532,67109517,631,268436206,696,788,17179869853,457,499,887,367,558,134218197,193,729],[490,566,326,532,591,268435927,16777801,433,8389160,134218197,16777770,432,327,762,490,268435927,689,2147484216,293,524462,8421888,862,227,762,260,599,268436175,4294967897,392,465,656,829,193,729],[457,533,590,268435958,33555050,697,327,432,8389160,135266549,131395,830],[490,566,424,8388881,262533,599,268436175,4294967897,524,67109300,2155873065,34359739101,160,762,260,466],[392,599,261,466,16777801,268435958,33555019,762,160,268435927,16777770,134218197,326,302,524741,697,490,863,327,829,558,135266549,131395,730],[491,532,591,268435927,16777770,134218166,8389160,134218197,16777801,763,8589935474,762,294,696,457,729,261,796,161,631,359,862,491,33554771,590,268435958,226,829,1049031,400,293,262316,590,335,260,37,425,161,33056,664]];
// the page's pool (checkers/app.js): lead = engine.js?…&mt=1, helpers = mt-helper.js; a job = { io } for the helpers
const POOL = { wasm: 'engine_mt.wasm?v=3', lead: 'engine.js?v=rb4-pro1-n43-mt1&mt=1', helper: 'mt-helper.js?v=1', slot: 4 << 20, initial: 1024, maximum: 16384,
  imports: mem => ({ env: { memory: mem, now: () => Date.now(), progress: () => {} } }),
  help: m => m.type === 'think' ? { io: CheckersEngine.setupIO(null, m.moves) } : null };
const think = (moves, cfg, threads) => ({ type: 'think', moves, level: 20, cfg, mtThreads: threads });
const mvName = m => (CheckersEngine.mFrom(m) + 1) + '-' + (CheckersEngine.mTo(m) + 1);

const $ = s => document.querySelector(s);
const HC = navigator.hardwareConcurrency || 1;
const ISO = !!self.crossOriginIsolated && typeof SharedArrayBuffer === 'function';
// (+ the performance cores, shared/mtengine.js perfThreads — e.g. 10 of a Mac's 14 — the default of PRO's thread count, 2026-11-09)
const PERF = window.MTEngine && MTEngine.perfThreads ? MTEngine.perfThreads() : HC;
const COUNTS = (() => { const a = []; for (let t = 1; t < HC; t *= 2) a.push(t); if (PERF > 1 && PERF < HC) a.push(PERF); a.push(HC); return [...new Set(a)].sort((x, y) => x - y); })();
const ua = (() => { const d = navigator.userAgentData; const b = d && (d.brands || []).filter(x => !/Not/.test(x.brand)).map(x => x.brand + ' ' + x.version).join(', '); return (b ? b + ' / ' + (d.platform || '') : '') || navigator.userAgent; })();
let started = 0, lines = [];
function env() {
  $('#env').innerHTML = [
    ['crossOriginIsolated', ISO ? '<span class="y">true</span>' : '<span class="n">false</span>'],
    ['hardwareConcurrency', HC], ['測るスレッド数', COUNTS.join(', ')],
    ['起動できたスレッド', started ? started : '—'], ['ブラウザ', ua.replace(/</g, '&lt;')],
  ].map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
}
env();
async function isolate() {
  if (ISO) return true;
  if (!('serviceWorker' in navigator) || !isSecureContext) return false;
  try { await navigator.serviceWorker.register(SW, { scope: './' }); await navigator.serviceWorker.ready; } catch (e) { return false; }
  const K = GAME + '-bench-reload', last = +(localStorage.getItem(K) || 0);
  if (Date.now() - last > 15000) { try { localStorage.setItem(K, String(Date.now())); } catch (e) {} location.reload(); return null; }
  return false;
}
let pool = null;
async function setup() {
  const iso = await isolate();
  if (iso === null) { $('#st').textContent = '分離のために再読み込みしています…'; return; }
  if (!iso) { $('#st').innerHTML = '<span class="n">クロスオリジン分離できませんでした。</span>PC の Chrome / Edge で開いてください（スレッドを使えません）。'; return; }
  $('#st').textContent = 'スレッドを起動しています…';
  pool = MTEngine.pool(POOL);
  if (!(await pool.ready)) { $('#st').innerHTML = '<span class="n">スレッドを起動できませんでした。</span>'; return; }
  $('#st').textContent = `準備完了（最大 ${pool.maxThreads} スレッド）。「開始」を押してください。所要 約${estMin()}分。`;
  $('#btnRun').disabled = false;
}
function estMin() { const t = +$('#selT').value, r = +$('#selR').value; return Math.ceil(POS.length * t * (COUNTS.length * 1.6 + r) / 60000 + 0.3); }
['#selT', '#selR'].forEach(s => $(s).onchange = () => { if (pool && !$('#btnRun').disabled) $('#st').textContent = `所要 約${estMin()}分。`; });
async function job(msg) {
  await pool.run({ type: 'newgame' }, null, 'bench');   // (a fresh table for every search)
  const t0 = performance.now(), r = await pool.run(msg, null, 'bench');
  if (!r || r.error) throw new Error(r && r.error || 'cancelled');
  started = Math.max(started, r.threads || 1);
  return { nodes: r.nodes || 0, ms: performance.now() - t0, depth: r.depth || 0, move: r.move, threads: r.threads || 1 };
}
async function run() {
  $('#btnRun').disabled = true; $('#btnCopy').disabled = true;
  const ms = +$('#selT').value, rf = +$('#selR').value;
  const total = POS.length * (COUNTS.length * 1.6 + rf) * ms; let doneMs = 0;
  const tick = (add, msg) => { doneMs += add; $('#bar i').style.width = Math.min(100, doneMs / total * 100) + '%'; if (msg) $('#st').textContent = msg; };
  lines = [`${GAME} bench ${new Date().toISOString()} | ${ua} | isolated ${ISO} | hc ${HC} | ${ms} ms/run | ref 1 thread x${rf}`];
  const R = {};   // t → { n, ms, d, cnt, agree, dms, dms1, thr }
  try {
    tick(0, 'ウォームアップ…'); await job(think(POS[0], { s: 1, d: 99, ms: 800 }, COUNTS[COUNTS.length - 1]));
    for (let i = 0; i < POS.length; i++) {
      const p = POS[i]; let ref = null;
      if (rf) { tick(0, `局面 ${i + 1}/${POS.length}：基準 1スレッド ${ms * rf / 1000}秒`); ref = await job(think(p, { s: 1, d: 99, ms: ms * rf }, 1)); tick(ms * rf); }
      const row = [`pos ${i + 1} ply ${p.length}` + (ref ? ` ref ${mvName(ref.move)} d${ref.depth}` : '')];
      let D = 0, d1ms = 0;
      for (const t of COUNTS) {
        tick(0, `局面 ${i + 1}/${POS.length}：${t}スレッド（同じ時間）`);
        const r = await job(think(p, { s: 1, d: 99, ms }, t)); tick(ms);
        if (t === 1) D = Math.max(1, r.depth);
        const a = R[t] || (R[t] = { n: 0, ms: 0, d: 0, cnt: 0, agree: 0, dms: 0, dms1: 0, thr: 0 });
        a.n += r.nodes; a.ms += r.ms; a.d += r.depth; a.cnt++; a.thr = Math.max(a.thr, r.threads); if (ref && r.move === ref.move) a.agree++;
        row.push(`t${t}(${r.threads}) ${Math.round(r.nodes / r.ms)}kn/s d${r.depth} ${mvName(r.move)}`);
      }
      for (const t of COUNTS) {   // the same depth as one thread reached in the time
        tick(0, `局面 ${i + 1}/${POS.length}：${t}スレッド（深さ ${D} まで）`);
        const r = await job(think(p, { s: 1, d: D, ms: 0 }, t)); tick(ms * 0.6);
        if (t === 1) d1ms = r.ms;
        R[t].dms += r.ms; R[t].dms1 += d1ms; if (d1ms >= 50) { R[t].lg = (R[t].lg || 0) + Math.log(d1ms / Math.max(1, r.ms)); R[t].lc = (R[t].lc || 0) + 1; }
        row.push(`D${D} t${t} ${Math.round(r.ms)}ms`);
      }
      lines.push(row.join(' | '));
      render(R, rf);
    }
    tick(total, '完了。「結果をコピー」を押して、Claude に貼り付けてください。');
  } catch (e) { $('#st').innerHTML = '<span class="n">エラー：' + String(e.message || e).replace(/</g, '&lt;') + '</span>'; lines.push('error ' + (e.message || e)); }
  env();
  const sum = render(R, rf);
  lines.splice(1, 0, ...sum);
  $('#log').textContent = lines.join('\n');
  $('#btnRun').disabled = false; $('#btnCopy').disabled = false;
}
function render(R, rf) {
  const tb = $('#tbl tbody'), out = []; tb.innerHTML = '';
  const b = R[1]; if (!b) return out;
  const base = b.n / b.ms;
  for (const t of COUNTS) {
    const a = R[t]; if (!a) continue;
    const nps = a.n / a.ms * 1000, sp = a.n / a.ms / base, dsp = a.dms ? a.dms1 / a.dms : 0, geo = a.lc ? Math.exp(a.lg / a.lc) : 0;   // (geo: the geometric mean over the positions — one slow position does not decide it)
    const ag = rf ? `${a.agree}/${a.cnt}` : '—';
    tb.insertAdjacentHTML('beforeend', `<tr><td>${t}</td><td>${Math.round(nps).toLocaleString()}</td><td>${sp.toFixed(2)}×</td><td>${(a.d / a.cnt).toFixed(2)}</td><td>${a.dms ? (a.dms / 1000).toFixed(1) + '秒' : '—'}</td><td>${dsp ? dsp.toFixed(2) + '×' : '—'}</td><td>${ag}</td><td>${a.thr}</td></tr>`);
    out.push(`threads ${t}: ${Math.round(nps)} nps, x${sp.toFixed(2)} vs 1, depth ${(a.d / a.cnt).toFixed(2)}, time-to-depth x${dsp.toFixed(2)} (geomean x${geo.toFixed(2)}), agree ${ag}, started ${a.thr}`);
  }
  return out;
}
$('#btnRun').onclick = run;
$('#btnCopy').onclick = async () => {
  const txt = lines.join('\n');
  try { await navigator.clipboard.writeText(txt); $('#btnCopy').textContent = 'コピーしました'; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); $('#btnCopy').textContent = 'コピーしました'; } catch (e2) {} ta.remove(); }
  setTimeout(() => { $('#btnCopy').textContent = '結果をコピー'; }, 2000);
};
setup();
</script>
</body>
</html>
