<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<meta name="robots" content="noindex">
<title>将棋 — 最強解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" crossorigin>
<style>
:root{
  --bg:#130d09; --panel:#21170f; --panel2:#2b1f15; --line:#45321f;
  --text:#f2e8d9; --muted:#bba487; --dim:#8a735b;
  --wood:#e9c27c; --wood2:#d9ad62; --brass:#c9a961; --accent:#e2c275; --red:#ff6b5b; --good:#7fd6a4;
  --cell:min(calc((100vh - 200px) / 12.2), calc((100vw - 56px) / 9), 64px);
}
@media (min-width: 900px){ :root{ --cell:min(calc((100vh - 200px) / 12.2), calc((100vw - 500px) / 9), 72px); } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
header a{color:var(--muted);text-decoration:none;font-size:14px}
header a:hover{color:var(--accent)}
h1{margin:0;font-family:'Shippori Mincho B1',serif;font-size:24px;color:var(--brass);letter-spacing:.04em}
h1 small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
main{display:flex;gap:24px;padding:20px 16px;justify-content:center;flex-wrap:wrap}
#board{display:grid;grid-template-columns:repeat(9,var(--cell));grid-template-rows:repeat(9,calc(var(--cell) * 1.1));background:linear-gradient(135deg,var(--wood),var(--wood2));border:6px solid #6b4a26;border-radius:4px;box-shadow:0 10px 40px #000a;user-select:none;touch-action:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;border-right:1px solid #5a3d1c99;border-bottom:1px solid #5a3d1c99}
.sq img{width:88%;height:88%;pointer-events:none}
.sq.sel{box-shadow:inset 0 0 0 3px #b8322acc}
.sq.last{background:#c9a26155}
.sq.tgt::after{content:'';position:absolute;width:24%;height:22%;border-radius:50%;background:#3a220f66}
.hand{display:flex;gap:4px;align-items:center;min-height:calc(var(--cell) * 1.1);padding:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0;flex-wrap:wrap}
.hand .lbl{color:var(--muted);font-size:13px;margin-right:6px}
.hp{position:relative;width:var(--cell);height:calc(var(--cell) * 1.1);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px}
.hp img{width:86%;height:86%;pointer-events:none}
.hp.sel{box-shadow:inset 0 0 0 3px #b8322acc}
.hp .n{position:absolute;right:2px;bottom:0;font-size:13px;font-weight:700;color:var(--accent)}
.files,.ranks{display:grid;color:var(--muted);font-size:12px}
.files{grid-template-columns:repeat(9,var(--cell));text-align:center;margin-bottom:2px}
.ranks{grid-template-rows:repeat(9,calc(var(--cell) * 1.1));align-items:center;margin-left:4px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px}
#arrow{position:absolute;pointer-events:none}
.side{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--brass)}
button.go{background:linear-gradient(#c9a961,#8e7440);color:#1a130b;font-weight:700;border-color:#8e7440}
button:disabled{opacity:.45;cursor:default}
label{font-size:13px;color:var(--muted)}
.eval{font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--accent)}
.stats{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.pv{font-size:15px;line-height:1.6;word-break:break-word}
.moves{font-size:14px;line-height:1.7;max-height:160px;overflow:auto;color:var(--muted)}
.note{font-size:12px;color:var(--dim);line-height:1.6}
.status.ok{color:var(--good)} .status.ng{color:var(--red)}
input[type=text]{width:100%;font:inherit;font-size:13px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
</style>
</head>
<body>
<header>
  <a href="../" id="back">← 将棋</a>
  <h1><span id="gname">将棋</span> <small id="ttl">最強解析</small></h1>
</header>
<main>
  <div>
    <div class="hand" id="hand1"></div>
    <div class="files" id="files"></div>
    <div style="display:flex"><div id="board"></div><div class="ranks" id="ranks"></div></div>
    <div class="hand" id="hand0"></div>
  </div>
  <div class="side">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="eval" id="eval">—</div>
        <div class="status" id="iso"></div>
      </div>
      <div class="stats">
        <span id="lDepth">深さ</span><span id="depth">—</span>
        <span id="lNps">局面/秒</span><span id="nps">—</span>
        <span id="lThreads">スレッド</span><span id="thr">—</span>
      </div>
      <div class="pv" id="pv"></div>
    </div>
    <div class="card">
      <div class="row">
        <button class="go" id="btnAna">解析</button>
        <button id="btnPlay">AIに指させる</button>
        <select id="selTime"></select>
      </div>
      <div class="row" style="margin-top:10px">
        <label for="selThr" id="lSel">スレッド数</label>
        <select id="selThr"></select>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="btnUndo">戻す</button>
        <button id="btnFlip">盤を反転</button>
        <button id="btnReset">初期配置</button>
      </div>
    </div>
    <div class="card">
      <div class="moves" id="moves"></div>
      <div style="margin-top:10px"><input type="text" id="fen" spellcheck="false" aria-label="SFEN"></div>
      <div class="row" style="margin-top:8px"><button id="btnFen">SFENを読み込む</button><button id="btnCopy">SFENをコピー</button></div>
    </div>
    <p class="note" id="note"></p>
  </div>
</main>
<dialog id="promo"><div class="row"><button id="pYes">成る</button><button id="pNo">成らない</button></div></dialog>
<script src="../engine.js?v=20261108mt"></script>
<script src="pro.js?v=2sp-mt"></script>
</body>
</html>
