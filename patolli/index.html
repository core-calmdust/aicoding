<style>
/* ================================================================ パトリ — ござの生成り・トルコ石の青・朱（地はカカオ色）
   テーマ色（台帳の色）は トルコ石の青 #12a4b8。当初案の #0f7f86 はコナネ（#0f8a7e）と近いので、青寄りに振って朱と組み合わせた */
:root{
  --bg:#170f0b; --bg2:#1f1510; --panel:#251a13; --panel2:#30221a; --line:#553e2c;
  --text:#f5ecda; --muted:#d2c2a8; --dim:#9c8a72;
  --tq:#12a4b8; --tq2:#0b7686; --gold:#12a4b8; --gold2:#0b7686; --carn:#d8452c; --carn2:#9b2c1a; --mat:#d8bd7c;
  --accent:#6fdbe4; --brass:#12a4b8; --brass2:#2b8b98; --red:#ff7a66; --good:#7fd6a4;
  --light1:#e2553f; --light2:#c8392b; --dark1:#4b83d6; --dark2:#2f67c4;
  --vh:100vh; --gap:12px;
  --serif:'Cormorant Garamond','Shippori Mincho B1',serif;
  --mincho:'Shippori Mincho B1','Cormorant Garamond',serif;
  --p0a:#f0806a; --p0b:#c8392b; --p0c:#7a1a12; --p1a:#7fb2ee; --p1b:#2f67c4; --p1c:#153574;
}
html[data-pcs=maize]{--p0a:#e88a78;--p0b:#b7392f;--p0c:#6e1812;--p1a:#8f9bd6;--p1b:#3f4b9a;--p1c:#1d2356}
html[data-pcs=obsidian]{--p0a:#fff8ea;--p0b:#e6dcc4;--p0c:#a89c80;--p1a:#6a6e78;--p1b:#1d1f26;--p1c:#050608}
html[data-pcs=jade]{--p0a:#f29a7c;--p0b:#cf4a34;--p0c:#7d2114;--p1a:#a8e6c0;--p1b:#3fa878;--p1c:#17583a}
html[data-pcs=clay]{--p0a:#eeb489;--p0b:#c97a4a;--p0c:#834222;--p1a:#8b939c;--p1b:#4a525c;--p1c:#22282f}
html[data-pcs=gold]{--p0a:#fff0b0;--p0b:#e0b23c;--p0c:#8c6410;--p1a:#9ff0ea;--p1b:#1fa7a8;--p1c:#0b5a60}
@supports (height:100dvh){:root{--vh:100dvh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 14% -14%, rgba(18,164,184,.26) 0%, transparent 62%),
    radial-gradient(900px 600px at 112% 116%, rgba(216,69,44,.24) 0%, transparent 60%),
    repeating-linear-gradient(45deg, rgba(216,189,124,.035) 0 6px, transparent 6px 12px),
    var(--bg);
  color:var(--text);
  font-family:'Zen Kaku Gothic New','Noto Sans Devanagari','Noto Sans Arabic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}
html[lang=ar] body{direction:rtl}
html[lang=ar] .frame, html[lang=ar] .board-wrap, html[lang=ar] .kifu, html[lang=ar] .graph, html[lang=ar] .navbar{direction:ltr}

/* ---------------------------------------------------------------- shared look */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;position:relative}
.card::before{content:"";position:absolute;inset:3px;border-radius:11px;border:1px solid rgba(18,164,184,.08);pointer-events:none}
.label,.kifu-head .label,.evalrow .label{font-family:var(--serif);font-size:15px;letter-spacing:.12em;color:var(--accent);font-weight:700}
html[lang=ja] .label, html[lang=zh] .label, html[lang="zh-TW"] .label, html[lang=ko] .label{font-family:var(--mincho);font-size:13.5px}
.kifu-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.kifu-head .kb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.kifu-head button{font-size:11.5px;color:var(--muted);padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.15);white-space:nowrap}
.kifu-head button:hover{color:var(--text);border-color:var(--brass2)}

/* ---------------------------------------------------------------- brand (phones) + icons */
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand-l{min-width:0;display:flex;flex-direction:column}
.brand a.series{font-size:11px;color:var(--dim);text-decoration:none;letter-spacing:.08em;white-space:nowrap}
.brand h1{font-family:var(--mincho);font-weight:800;font-size:21px;letter-spacing:.08em;white-space:nowrap;line-height:1.15;cursor:pointer;background:linear-gradient(180deg,#fff3cf,#12a4b8 70%,#0b7686);-webkit-background-clip:text;background-clip:text;color:transparent}
html:not([lang=ja]):not([lang=zh]):not([lang="zh-TW"]):not([lang=ko]) .brand h1{font-family:var(--serif);font-size:23px;letter-spacing:.04em}
.brand h1 small{display:none}
.brand-r{display:flex;align-items:center;gap:6px;flex:none}
/* phones: the move navigation strip (shared/infotabs.js) only when it is of use — a finished game, a past position on view, the
   replay, the review box (app.js navNeedSync → body.nav-need); landscape: landtabs.js navSync */
body.it-on.it-nav:not(.nav-need) #itNav{display:none!important}
#langSel{background:rgba(0,0,0,.25);color:var(--muted);border:1px solid var(--line);border-radius:7px;font:inherit;font-size:11px;padding:3px 4px}
.snd{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim)}
.snd:hover{color:var(--text)}
a.snd{text-decoration:none}
.snd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .off-x{display:none}
.snd.on{color:var(--accent);border-color:rgba(18,164,184,.5)}
.snd:not(.on) .on-w{display:none}
.snd:not(.on) .off-x{display:inline}
.hb .brand-l h1{font-size:22px!important}

/* ---------------------------------------------------------------- menu */
.controls{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;transition:border-color .2s,color .2s,background .2s}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover:not(:disabled){border-color:var(--brass2);color:var(--text)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{color:var(--text);border-color:rgba(18,164,184,.45)}
.btn.on{color:var(--accent);border-color:rgba(18,164,184,.6);background:rgba(18,164,184,.08)}

/* ---------------------------------------------------------------- board */
.board-area{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.frame{position:relative;width:var(--bw);aspect-ratio:1/1;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board-wrap{position:absolute;inset:0}
.board-wrap svg.pt-board{filter:drop-shadow(0 18px 24px rgba(0,0,0,.5))}
/* 豆を投げる場所：X の左のすき間（board2d.js の SPOT.dock と同じ位置）。投げられるときは豆を片づけて「投げる」ボタンを出す。
   ボタンは字と高さに下限（13px・34px）があるので、盤が小さいとき（スマホ横持ちの小さい画面など）や名前の長い言語では、
   すき間（.dice-dock の幅）より大きくなる分だけ全体を縮める（app.js fitRollPill → --rps） */
.dice-dock{position:absolute;left:2.2%;top:37.5%;width:21.6%;height:25%;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;border-radius:12px;transition:opacity .25s}
.dice-dock .dice-host{position:absolute;inset:0 0 14% 0}
.dice-dock .dice-cap{position:absolute;left:0;right:0;bottom:-2%;text-align:center;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;font-weight:800;font-size:clamp(13px, calc(var(--bw) * .03), 26px);line-height:1;color:#2a1d10;white-space:nowrap;text-shadow:0 0 6px rgba(255,244,214,.9),0 0 2px rgba(255,244,214,.9);min-height:1em}
html[data-bd=mosaic] .dice-dock .dice-cap, html[data-bd=night] .dice-dock .dice-cap{color:#eafcfa;text-shadow:0 0 6px rgba(0,0,0,.9)}
.dice-dock.dim .dice-host{opacity:.5}
.dice-dock.rolling .dice-host{opacity:1}
.dice-dock.can:not(.rolling) .dice-host{opacity:0}
.dice-dock.can:not(.rolling) .dice-cap{visibility:hidden}
.dice-dock .roll-pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--rps,1));display:flex;align-items:center;justify-content:center;
  min-width:86%;height:clamp(34px, calc(var(--bw) * .07), 56px);padding:0 .7em;box-sizing:border-box;border-radius:999px;
  background:linear-gradient(180deg,#27c0d0,#0c7f90);border:2px solid #052e34;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 5px 10px rgba(0,0,0,.45);
  font-family:'Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:clamp(13px, calc(var(--bw) * .026), 22px);letter-spacing:.08em;white-space:nowrap;line-height:1;color:#fff;text-shadow:0 1px 2px rgba(0,40,46,.8);
  pointer-events:auto;cursor:pointer;transition:transform .09s ease,filter .09s ease}
.dice-dock.can:not(.rolling) .roll-pill{animation:rpGlow 2.2s ease-in-out infinite}
@keyframes rpGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 5px 10px rgba(0,0,0,.45),0 0 0 0 rgba(255,236,150,0)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 5px 10px rgba(0,0,0,.45),0 0 0 5px rgba(255,236,150,.5)}}
body.no-anim .dice-dock.can .roll-pill{animation:none}
.dice-dock .roll-pill:hover{filter:brightness(1.1)}
.dice-dock .roll-pill:active,.dice-dock.press .roll-pill{transform:translate(-50%,-50%) translateY(2px) scale(calc(var(--rps,1) * .97));filter:brightness(.9)}
.dice-dock .roll-pill:focus-visible{outline:2px solid #fff;outline-offset:3px}
.dice-dock.rolling .roll-pill{display:none}
.dice-dock:not(.can) .roll-pill{display:none}
/* move effects: soft, translucent, centred on the board */
.fx-msg{position:absolute;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%) scale(.96);pointer-events:none;opacity:0;text-align:center;white-space:nowrap;
  font-family:var(--serif);font-weight:700;letter-spacing:.14em;color:#fff3cf;font-size:calc(var(--bw) * .036);
  padding:.35em 1.3em .4em;border-radius:999px;background:radial-gradient(120% 140% at 50% 50%,rgba(30,19,13,.72),rgba(30,19,13,.42) 60%,rgba(30,19,13,0) 100%);
  text-shadow:0 0 18px rgba(111,219,228,.55),0 1px 2px rgba(0,0,0,.7);transition:opacity .35s ease,transform .5s ease}
html[lang=ja] .fx-msg, html[lang=zh] .fx-msg, html[lang="zh-TW"] .fx-msg, html[lang=ko] .fx-msg{font-family:var(--mincho)}
.fx-msg small{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.48em;letter-spacing:.08em;color:rgba(239,232,214,.8);margin-top:.2em;font-weight:500}
/* readable at a glance (the main word ≈ 40px on PC, 28–34px on phones; the line under it ≥ 15px); the shown time is unchanged */
.fx-msg{font-size:clamp(28px, calc(var(--bw) * .052), 44px);padding:.32em 1.1em .42em;background:radial-gradient(120% 150% at 50% 50%,rgba(30,19,13,.78),rgba(30,19,13,.5) 58%,rgba(30,19,13,0) 100%)}
.fx-msg small{font-size:max(15px, .42em);margin-top:.28em;color:rgba(239,232,214,.88)}
.fx-msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fx-msg.pass{color:#d8d4e8;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.fx-msg.cap{color:#ffd4c8;text-shadow:0 0 18px rgba(194,65,45,.6),0 1px 2px rgba(0,0,0,.7)}
.fx-glow{position:absolute;inset:-2%;z-index:1;pointer-events:none;border-radius:3%;opacity:0;transition:opacity .45s ease;box-shadow:inset 0 0 calc(var(--bw) * .06) rgba(111,219,228,.38)}
.fx-glow.cap{box-shadow:inset 0 0 calc(var(--bw) * .06) rgba(194,65,45,.38)}
.fx-glow.show{opacity:1}
.board-tip{position:absolute;z-index:7;left:50%;transform:translate(-50%,4px);max-width:64%;padding:6px 14px 7px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .35s ease,transform .35s ease;
  background:rgba(24,15,10,.62);border:1px solid rgba(18,164,184,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  color:rgba(239,232,214,.92);font-size:calc(var(--bw) * .0118 + 5px);line-height:1.45;letter-spacing:.03em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px -8px rgba(0,0,0,.7)}
.board-tip small{color:rgba(239,232,214,.62);margin-inline-start:.6em;font-size:.86em}
.board-tip.show{opacity:1;transform:translate(-50%,0)}
.board-tip.s0{bottom:-2%}.board-tip.s1{top:-2%}
html:not(.hb-on) .board-tip{display:none}
.toast{position:absolute;left:50%;bottom:6%;z-index:9;transform:translateX(-50%);max-width:92%;padding:8px 16px;border-radius:10px;background:rgba(20,13,9,.9);border:1px solid rgba(18,164,184,.4);font-size:13px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.review-bar{display:none;gap:6px;align-items:center;flex-wrap:wrap}
.pl-col > .review-bar{flex:none;justify-content:center;gap:4px 6px;padding:5px 8px;border-radius:12px;background:rgba(18,164,184,.08);border:1px solid rgba(18,164,184,.35)}
.pl-col > .review-bar #reviewText{display:inline;font-size:12px;margin-right:2px}
@media (max-height:820px){.pl-col > .review-bar #reviewText{display:none}
  html.hb-on body.reviewing .pl-col .players{padding:4px 8px;gap:2px} html.hb-on body.reviewing .pl-col .player{padding:3px 10px} html.hb-on body.reviewing .pl-col > .review-bar{padding:3px 8px}
  html.hb-on body.reviewing #evalCard .evalbar{display:none}}
.pl-col > .review-bar button{padding:3px 9px}
html.hb-on body.reviewing .board-tip{display:none}
.review-bar #reviewText{display:none}
body.reviewing .review-bar{display:flex}
body.reviewing .sbox .rollbtn{display:none}
.review-bar button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text)}
.review-bar button:hover{border-color:var(--brass2)}

/* ---------------------------------------------------------------- players / status */
.players{display:flex;flex-direction:column;gap:8px}
.player{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid transparent;transition:border-color .25s,background .25s}
.player.active{border-color:rgba(18,164,184,.6);background:rgba(18,164,184,.07)}
.player.won{border-color:rgba(127,214,164,.7);background:rgba(127,214,164,.08)}
.player .name{font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .sub{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace}
.player .sub b{color:var(--muted);font-weight:700}
.player .clk{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--muted);padding:1px 7px;border-radius:7px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.player .clk:empty{display:none}
.player.active .clk{color:var(--accent);border-color:rgba(18,164,184,.6)}
.player .clk.low{color:#ff9b90;border-color:rgba(255,107,91,.6)}
.player .home{display:flex;align-items:baseline;gap:4px;font-family:var(--serif);font-weight:700;font-size:24px;line-height:1;color:var(--text);white-space:nowrap}
.player .home small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:10.5px;color:var(--dim);font-weight:500;letter-spacing:.04em}
.player .status{grid-column:2 / 4;font-size:11.5px;color:var(--accent);min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .status:empty{display:none}
.pdk{display:none}
.player.thinking .pdisc{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(111,219,228,.25)}}
.pdisc{width:22px;height:22px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.25)}
.pdisc.p0{background:radial-gradient(circle at 36% 30%, var(--p0a), var(--p0b) 55%, var(--p0c))}
.pdisc.p1{background:radial-gradient(circle at 36% 30%, var(--p1a), var(--p1b) 55%, var(--p1c))}
/* 宝（賭け）の数：対局者の欄 */
.player .gold{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:17px;color:var(--text);padding:2px 9px 2px 6px;border-radius:999px;background:rgba(18,164,184,.16);border:1px solid rgba(18,164,184,.45);white-space:nowrap}
.player .gold i, .pool i{width:13px;height:13px;border-radius:50%;flex:none;display:inline-block;background:radial-gradient(circle at 36% 30%, #c8fff6, #27b4ae 50%, #0a5f66);box-shadow:0 0 0 1px #06383c}
.pool-info{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:0 4px}
.pool-info:empty{display:none}
.pool-info .pool{display:inline-flex;align-items:center;gap:6px}.pool-info b{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px}
.res-gold{display:flex;justify-content:center;gap:10px 18px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--text)}
.res-gold span{display:inline-flex;align-items:center;gap:6px}.res-gold b{font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--accent)}
.res-gold .pdisc{width:16px;height:16px}
.sbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);min-height:52px}
.sbox .st{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.5;color:var(--text)}
.sbox .st small{display:block;font-size:11.5px;color:var(--dim)}
.rollbtn{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap;
  background:linear-gradient(180deg,#5fd3de,#1193a6);color:#03191d;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.rollbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.rollbtn:disabled{opacity:.35;cursor:default;filter:grayscale(.4)}
.rollbtn.pass{background:linear-gradient(180deg,#c9c5da,#8f8ba6)}
.rollbtn kbd{font:600 10px 'JetBrains Mono',monospace;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.14)}
@media (pointer: coarse){.rollbtn kbd{display:none}}

/* ---------------------------------------------------------------- eval / graph / nav */
.evalrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:2px 8px}   /* （数字が見出しの横に入りきらない言語では次の行へ） */
.evalrow .val{max-width:100%;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;font-size:12.5px;text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.evalbar{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--p1b),var(--p1c));overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.evalbar .fill{position:absolute;inset:0 auto 0 0;width:50%;background:linear-gradient(90deg,var(--p0c),var(--p0b));transition:width .5s ease}
.evalbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(111,219,228,.8)}
.graph{margin-top:8px;width:100%;height:clamp(44px, 9vh, 96px);display:block;cursor:pointer;touch-action:none}
.graph .zero{stroke:rgba(18,164,184,.35);stroke-dasharray:2 3}
.graph .cur{stroke:var(--accent);stroke-width:1}
.navbar{display:flex;gap:6px;margin-top:8px}
.navbar button{flex:1;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted);display:flex;align-items:center;justify-content:center}
.navbar button:hover{color:var(--text);border-color:var(--brass2)}
.navbar svg{width:15px;height:15px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.navbar .i-pause{display:none}
.navbar button.playing .i-play{display:none}.navbar button.playing .i-pause{display:block}
body.rated-live #evalCard .evalrow .val, body.rated-live #evalCard .evalbar, body.rated-live #evalCard .graph{visibility:hidden}

/* ---------------------------------------------------------------- kifu */
.kifu-card{display:flex;flex-direction:column;min-height:0}
/* 1手1行（1列）。宝の動き（.g）は同じ行に収まらなければ次の行へ折り返す：長い言語でも文が切れない（2列・nowrap だと英語などで「1 t」のように途切れた） */
.kifu{flex:1;min-height:0;overflow-y:auto;display:grid;align-content:start;grid-auto-rows:min-content;grid-template-columns:minmax(0,1fr);gap:2px;line-height:1.45;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;font-size:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;max-height:200px}
.kifu button, .kifu .end{min-height:24px;flex:none;padding:3px 6px;border-radius:5px;color:var(--muted);display:flex;align-items:baseline;gap:6px;text-align:start;min-width:0}
.kifu button .tx, .kifu .end{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;column-gap:10px;overflow-wrap:anywhere}
.kifu .m{white-space:nowrap}
.kifu .end{padding-inline-start:calc(6px + 1.9em + 6px + 8px + 6px);color:var(--text);border-top:1px solid var(--line);border-radius:0;margin-top:2px}
.kifu button em{font-style:normal;color:var(--dim);font-size:.85em;min-width:1.9em;text-align:end}
.kifu button i{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.kifu button i.s0{background:var(--p0b)}.kifu button i.s1{background:var(--p1b)}
.kifu button .x{color:#ff9b8f}.kifu button .r{color:var(--accent)}.kifu .g{color:#f0cf8a}
.kifu button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.kifu button.cur{background:rgba(18,164,184,.16);color:var(--accent)}
.kifu button.q-bad{box-shadow:inset 0 -2px 0 #ff6b5b}.kifu button.q-dub{box-shadow:inset 0 -2px 0 #f2c060}
.kifu .empty{grid-column:1/-1;color:var(--dim);font-family:'Zen Kaku Gothic New';font-size:12px;padding:6px 0}

/* ---------------------------------------------------------------- review card */
.review-card{display:none}
.review-card.show{display:block;overflow-y:auto}
.rv-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rv-side{padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.rv-side h4{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden}
.rv-side .acc{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--accent);line-height:1.1}
.rv-side .acc small{font-family:'Zen Kaku Gothic New';font-size:11px;color:var(--dim);margin-inline-start:4px;font-weight:500}
.rv-side .qc{display:flex;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.qb{color:#8fe3b8}.qg{color:#9fc7ff}.qd{color:#f2c060}.qx{color:#ff8b7d}
.rv-cur{font-size:13px;line-height:1.65;padding:8px 10px;border-radius:10px;background:rgba(18,164,184,.06);border:1px solid rgba(18,164,184,.25);margin-bottom:8px}
.rv-cur b{color:var(--accent)}
.rv-list{display:flex;flex-direction:column;gap:3px}
.rv-list button{display:flex;gap:8px;align-items:center;text-align:start;font-size:12.5px;padding:4px 8px;border-radius:7px;border:1px solid transparent;color:var(--muted)}
.rv-list button:hover{border-color:var(--line);color:var(--text);background:rgba(255,255,255,.03)}
.rv-list .tag{flex:none;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;color:#0b1110}
.tag{color:#0b1110;font-size:.85em;font-weight:700;padding:0 6px;border-radius:5px;white-space:nowrap}
.tag.bad{background:#ff6b5b}.tag.dubious{background:#f2c060}.tag.best{background:#6fd3a0}.tag.good{background:#9fc7ff}
.rv-prog{height:6px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden;margin:6px 0}
.rv-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .2s}
.rv-note{font-size:12px;color:var(--dim);line-height:1.6}
.ck-rvgo,.rv-go{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;background:linear-gradient(180deg,#5fd3de,#1193a6);color:#03191d;white-space:nowrap}

/* ---------------------------------------------------------------- lesson / puzzle cards */
.lesson-card,.puzzle-card{display:none}
body.in-lesson .lesson-card, body.in-puzzle .puzzle-card{display:block;overflow-y:auto}
body:is(.in-lesson,.in-puzzle) .cb-bar{padding-bottom:2px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.lt{font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
.dots i.ok{background:var(--good)}.dots i.ng{background:#ff8b7d}.dots i.part{background:#f2c060}.dots i.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(111,219,228,.3)}
.lesson-card h3,.puzzle-card h3{font-family:var(--mincho);font-size:17px;letter-spacing:.05em;margin:2px 0 6px;color:var(--text)}
.lesson-prompt,.pz-goal{font-size:13.5px;line-height:1.75;color:var(--text)}
.lesson-prompt p{margin-bottom:4px}
.lesson-prompt b{color:var(--accent)}
.pz-goal{display:flex;gap:8px;align-items:center}
.lesson-fb,.pz-status{margin-top:8px;font-size:13px;line-height:1.7;color:var(--muted);min-height:1.7em}
.lesson-fb b.ok,.pz-status b.ok{color:var(--good)}.lesson-fb b.ng,.pz-status b.ng{color:#ff9b8f}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.choices button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:13px;color:var(--text)}
.choices button:hover{border-color:var(--brass2)}
.choices button.ok{border-color:var(--good);color:var(--good)}.choices button.ng{border-color:#ff8b7d;color:#ff8b7d}
.lesson-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lesson-actions button{flex:1 1 auto;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:12.5px;color:var(--muted);white-space:nowrap}
.lesson-actions button:hover:not(:disabled){color:var(--text);border-color:var(--brass2)}
.lesson-actions button.go{background:linear-gradient(180deg,#5fd3de,#1193a6);border-color:transparent;color:#03191d;font-weight:800}
.lesson-actions button:disabled{opacity:.35;cursor:default}

/* 文字を切らない（shared/cardbar.js・pzbook.js の既定より優先）：
   ［次の問題］はアイコンの列の横に入りきらなければ次の行へ回す（縮めて文字や矢印を欠けさせない） */
#puzzleCard .cb-bar, #lessonCard .cb-bar{flex-wrap:wrap!important}   /* （cardbar.js の .cb-cmp は nowrap：長い言語で［次の問題］が欠ける） */
#puzzleCard .cb-bar .cb-main, #lessonCard .cb-bar .cb-main{flex:1 0 auto;max-width:100%}
#puzzleCard .cb-bar .cb-main > button, #lessonCard .cb-bar .cb-main > button{flex:1 0 auto;overflow:visible;text-overflow:clip}
/* パズル一覧：カテゴリ名・テーマ名は省略（…）せず折り返す */
#pzLevels .pbh-tabs button .nm{white-space:normal;overflow:visible;text-overflow:clip;text-align:center;line-height:1.25;overflow-wrap:anywhere}
#pzLevels .pbh-nm, #pzLevelHead .pbh-nm{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3;overflow-wrap:anywhere}
#pzLevels .pbh-top{align-items:flex-start}
#pzLevels .pb-cont small{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
/* 結果のボタン：狭い画面では折り返す（3つが横に入りきらない言語がある） */
#resultOverlay .modal-actions{flex-wrap:wrap}
#resultOverlay .modal-actions .mbtn{flex:1 1 auto}

/* ---------------------------------------------------------------- coach card (shared/coachkit.js styles + ours) */
.ck-card{overflow-y:auto}
.ck-card .ck-h{font-family:var(--mincho)}
/* coach text a size up (2026-11-05: easier to read) */
#coachCard h3.ck-h,#coachCard .ck-h{font-size:15px}#coachCard h3.ck-h small{font-size:13px}
#coachCard .ck-sum span{font-size:14px;padding:4px 11px}
#coachCard .ck-rec .ck-rb{font-size:17px}
#coachCard .ck-rec p{font-size:16px;line-height:1.75}
#coachCard .ck-sec-h{font-size:14.5px}
#coachCard .ck-intro{font-size:14.5px}
#coachCard .ck-bt b{font-size:15.5px}#coachCard .ck-bt .mv{font-size:14.5px}#coachCard .ck-bt .tg,#coachCard .ck-bt .gp{font-size:12.5px}
#coachCard .ck-bi p{font-size:14.8px}
#coachCard .ck-tips li{font-size:15.2px}
#coachCard .ck-vd{font-size:15px}#coachCard .ck-vd b{font-size:16px}
#coachCard .ck-muted{font-size:15px}
#coachCard .ck-calc{font-size:14.5px}
.ck-pop{font-size:14.5px}.ck-pop b{font-size:15.5px}
#coachCard.ck-off{opacity:.92}

/* ---------------------------------------------------------------- dialogs */
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(8,5,3,.66);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s;padding:16px;height:100vh;height:100dvh}
.overlay.show{opacity:1;pointer-events:auto}
.overlay.instant,.overlay.instant .modal{transition:none!important}
/* switching the tabs of the list dialogs: the new one appears on top of the old one at once (no fade, no backdrop flash) */
.overlay.ls-top{z-index:71}
.overlay.ls-under{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.modal{width:min(480px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,#2f2018,#1b120d);border:1px solid rgba(18,164,184,.35);border-radius:18px;padding:24px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 4px rgba(18,164,184,.05);transform:translateY(10px);transition:transform .25s;position:relative}
.overlay.show .modal{transform:none}
.modal h2{font-family:var(--mincho);font-size:22px;letter-spacing:.12em;margin-bottom:18px;color:#fff3cf}
html:not([lang=ja]):not([lang=zh]):not([lang="zh-TW"]):not([lang=ko]) .modal h2{font-family:var(--serif);font-size:25px;letter-spacing:.06em}
@media (max-width: 520px), (max-height: 560px){
  .overlay{padding:10px}
  .modal{padding:18px 16px;max-height:calc(100dvh - 20px);border-radius:14px}
  .modal h2{font-size:19px;margin-bottom:12px}
}
.field{margin-bottom:16px}
.field > label{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.seg button.sel{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px rgba(18,164,184,.5)}
#segMode{flex-wrap:wrap}
#segMode button{flex:1 0 22%}
@media (max-width: 520px){#segMode{display:grid;grid-template-columns:1fr 1fr}}
.level-wrap{display:flex;flex-direction:column-reverse;gap:6px}
.level-wrap input{width:100%;margin:0;accent-color:var(--gold);height:32px;touch-action:pan-y}
.level-name{font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:22px}
.level-name small{font-weight:400;font-size:11px;color:var(--dim)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.checks label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.checks input{accent-color:var(--gold);width:16px;height:16px;flex:none}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.mbtn{flex:1;padding:12px;border-radius:11px;font-weight:700;letter-spacing:.08em;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted);white-space:nowrap}
.mbtn:hover{color:var(--text)}
.mbtn.go{background:linear-gradient(180deg,#5fd3de,#1193a6);color:#03191d;border-color:transparent}
.mbtn.go:hover{filter:brightness(1.07)}
.result-big{font-family:var(--mincho);font-size:34px;font-weight:800;text-align:center;letter-spacing:.1em;margin:4px 0 10px;color:#fff3cf}
html:not([lang=ja]):not([lang=zh]):not([lang="zh-TW"]):not([lang=ko]) .result-big{font-family:var(--serif)}
.result-disc{display:flex;justify-content:center;margin:6px 0 4px}
.result-disc .pdisc{width:54px;height:54px}
.result-sub{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;line-height:1.7}
.modal:not(.ngt-on) > .ng-credit{margin-top:12px}
.ng-credit{text-align:center;font-size:11px;line-height:1.6;color:var(--dim)}
.ng-cols{display:grid;grid-template-columns:1fr;gap:0 26px}
@media (hover: hover) and (pointer: fine) and (min-width: 820px){
  #newOverlay .modal{width:min(900px,100%)}
  .ng-cols{grid-template-columns:1fr 1fr}
}
/* rule variants (ゲーム tab): the shared cards of shared/ngtabs.js + shared/nglux.js; on PC the same big cards as shogi's
   本将棋／5五将棋… (two columns, the board on the left in a framed cell, name and description beside it, ルール at the foot) */
#ruleCards .gart svg{display:block}
@media (min-width: 600px){
  #newOverlay .modal:not(.ngt-on) #ruleCards{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:14px!important;min-height:0!important;align-content:start!important}
  #newOverlay .modal:not(.ngt-on) #ruleCards .ngt-gcard{display:grid!important;grid-template-columns:150px minmax(0,1fr)!important;grid-template-rows:1fr auto auto 1fr!important;column-gap:18px!important;row-gap:6px!important;padding:18px 20px 44px!important;min-height:190px;border-radius:16px;transform:none}
  #newOverlay .modal:not(.ngt-on) #ruleCards .gart{grid-column:1;grid-row:1 / 5!important;align-self:center;min-height:0!important;flex:none!important;border-radius:12px;padding:10px!important;background:color-mix(in srgb, var(--panel) 70%, transparent)!important;box-shadow:inset 0 0 0 1px var(--line)!important}
  #newOverlay .modal:not(.ngt-on) #ruleCards .gart svg{width:100%!important;height:auto!important;max-height:none!important}
  #newOverlay .modal:not(.ngt-on) #ruleCards b{grid-column:2;grid-row:2;font-size:20px!important;margin:0!important;font-family:var(--mincho)}
  #newOverlay .modal:not(.ngt-on) #ruleCards p{grid-column:2;grid-row:3;font-size:14px!important;line-height:1.75!important;min-height:0!important}
  #newOverlay .modal:not(.ngt-on) #ruleCards .gpick{top:12px;right:12px;width:24px;height:24px;font-size:13px}
}
.modal.ngt-on #ruleCards .gart{padding:6px!important}
/* 対局設定で「オンライン」を選んだとき：準備中の案内（⌛ の箱 .ol-setup）がこのダイアログの中に出るので、同じ文の短い説明（#fOlInfo）は出さない（2回出ていた） */
#newOverlay:has(.ol-setup) #fOlInfo{display:none!important}
/* スマホ横持ちの対局設定（shared/ngtabs.js の html.ngt-land）：右端のタブ名は省略（…）せず、小さめの字で折り返す。
   下のクレジットは右下に固定のボタンの下にもぐらないよう、ボタンの左の幅に収める */
html.ngt-land #newOverlay .modal.ngt-on .ngt-bar button{overflow:visible}
html.ngt-land #newOverlay .modal.ngt-on .ngt-bar button > span{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.15;font-size:10px;letter-spacing:-.01em}
html.ngt-land #newOverlay .modal.ngt-on .ngt-bar button{padding-inline:2px}
html:is([lang=ja],[lang=zh],[lang="zh-TW"],[lang=ko]).ngt-land #newOverlay .modal.ngt-on .ngt-bar button > span{font-size:12px}
html[lang=ru].ngt-land #newOverlay .modal.ngt-on .ngt-bar button > span{font-size:9.5px;letter-spacing:-.04em}   /* 「Оформление」が1行に入る大きさ */
html.ngt-land #newOverlay .modal.ngt-on > .ng-credit{max-width:calc(100% - 390px);text-align:start;margin-inline:12px auto}
/* design tiles */
.dsg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dsg button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px 7px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:11.5px;color:var(--muted);min-width:0}
.dsg button.sel{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px rgba(111,219,228,.35)}
.dsg button svg,.dsg button img{width:100%;height:auto;border-radius:6px}
.dsg button span{max-width:100%}
.dsg.pcs button .pp{display:block;width:74%;padding:2px 0}
.dsg.pcs button .pp i{width:30px;height:30px;border-radius:50%;background-size:200% 100%;background-repeat:no-repeat;box-shadow:0 2px 4px rgba(0,0,0,.5)}
/* 盤6種・駒6種：端数の出ない並びにする（5+1 にしない）。欄の幅が 560px 以上なら 6×1、それより狭ければ 3×2。
   共通部品（shared/nglux.js・ngtabs.js）の auto-fill より優先させるため id で指定し、画面の幅ではなく欄の幅（コンテナクエリ）で決める */

  html.pt-land body.lt-on .board-area > .player{width:auto!important;max-width:none;min-width:0;padding:6px 10px!important}
  html.pt-land body.lt-on .board-area > .player:not(.frame ~ .player){grid-area:op}
  html.pt-land body.lt-on .board-area > .frame ~ .player{grid-area:me}
  html.pt-land body.lt-on .board-area > .sbox{grid-area:sb;width:auto!important;max-width:none;min-width:0;min-height:46px;padding:6px 10px;flex-wrap:wrap}
  html.pt-land body.lt-on .board-area > .sbox .st small{display:none}
  html.pt-land body.lt-on .board-area > .sbox .rollbtn{padding:8px 12px}
  /* タブの列 */
  html.pt-land body.lt-on #ltRail{grid-area:rl;display:flex;flex-direction:column;justify-content:center;gap:4px;align-self:stretch;min-height:0;overflow-y:auto;scrollbar-width:none;
    padding:4px 0;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);position:relative;z-index:61}
  html.pt-land body.lt-on #ltRail button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;padding:4px 2px;border-radius:9px;
    color:var(--muted);font-size:9.5px;line-height:1.15;letter-spacing:0;white-space:nowrap;position:relative;-webkit-tap-highlight-color:transparent}
  html.pt-land body.lt-on #ltRail button[hidden]{display:none}
  html.pt-land body.lt-on #ltRail button span{display:block;max-width:100%;white-space:pre;text-align:center;line-height:1.15}
  html.pt-land body.lt-on #ltRail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  html.pt-land body.lt-on #ltRail button.sel{color:var(--accent);background:rgba(18,164,184,.16)}
  html.pt-land body.lt-on #ltRail button.sel::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;border-radius:2px;background:var(--accent)}
  /* 引き出し：右の欄の上（タイトルとメニューの2行は残す） */
  html.pt-land body.lt-on #ltPanel{position:fixed;top:calc(var(--tp) * 2 + 18px);bottom:6px;right:calc(max(8px, var(--sr)) + var(--rail) + 6px);width:var(--ltw);max-width:calc(100vw - 90px);z-index:60;box-sizing:border-box;
    display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
    background:linear-gradient(180deg,rgba(47,32,24,.98),rgba(23,15,11,.98));border:1px solid rgba(18,164,184,.35);border-radius:14px;box-shadow:-18px 0 40px -10px rgba(0,0,0,.8);
    transform:translateX(calc(100% + 80px));transition:transform .32s cubic-bezier(.2,1.25,.4,1);will-change:transform}
  html.pt-land body.lt-on.lt-open #ltPanel{transform:translateX(0)}
  html.pt-land body.lt-on #ltPanel.drag{transition:none}
  html.pt-land body.lt-on:not(.lt-open):not([data-ltpin]) #ltPanel:not(.drag){visibility:hidden;transition:transform .32s cubic-bezier(.2,1.25,.4,1),visibility 0s .32s}
  html.pt-land body.lt-on #ltPanel > *{flex:none;width:auto!important;max-width:none!important;margin:0!important;grid-area:auto!important;order:0!important}
  html.pt-land body.lt-on #ltPanel > [data-ltc]{display:none!important}
  html.pt-land body.lt-on[data-lt=coach]:not([data-ltpin]) #ltPanel > #coachCard:not(.hidden), html.pt-land body.lt-on[data-lt=coach]:not([data-ltpin]) #ltPanel > #reviewCard.show{display:block!important}
  html.pt-land body.lt-on.lt-ckrest[data-lt=coach]:not([data-ltpin]) #ltPanel > #ltCoachRest{display:block!important}
  html.pt-land body.lt-on[data-lt=ek]:not([data-ltpin]) #ltPanel > #evalCard{display:flex!important;flex-direction:column}
  html.pt-land body.lt-on[data-lt=ek]:not([data-ltpin]) #ltPanel > .kifu-card{display:flex!important;flex-direction:column;flex:1 1 auto!important;min-height:140px!important}
  html.pt-land body.lt-on #ltPanel #evalCard .graph{height:36px!important;min-height:0;margin-top:6px}
  html.pt-land body.lt-on #ltPanel #evalCard{padding:8px 12px}
  html.pt-land body.lt-on #ltPanel .kifu{max-height:none;overflow:visible}
  html.pt-land body.lt-on #ltPanel .card{padding:10px 12px}
  /* ルール・レッスンのタブ：ルール／レッスン／パズルの3つの小さな入口 */
  html.pt-land body.lt-on[data-lt=learn]:not([data-ltpin]) #ltPanel > #ltLearn{display:flex!important}
  html.pt-land body.lt-on[data-lt=learn]:not([data-ltpin]) #ltPanel{width:auto!important;min-width:0;top:calc(50% - 104px)!important;bottom:auto!important;padding:8px!important}
  html.pt-land body.lt-on #ltLearn{flex-direction:column;align-items:center;gap:10px}
  html.pt-land body.lt-on #ltLearn h3{display:none}
  html.pt-land body.lt-on #ltLearn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:62px;height:58px;padding:4px 6px;box-sizing:border-box;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font-family:inherit;font-size:10.5px;font-weight:700;white-space:nowrap;text-align:center;cursor:pointer}
  html.pt-land body.lt-on #ltLearn button svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  html.pt-land body.lt-on #ltLearn button > span{display:block}
  html.pt-land body.lt-on #ltLearn button small{display:none}
  /* レッスン・パズルの間：カードを右の欄に出したまま（引き出しではない）。タブの列は隠して、その幅もカードに使う */
  html.pt-land body.lt-on[data-ltpin] #ltRail{display:none}
  html.pt-land body.lt-on[data-ltpin] #ltPanel{position:static;grid-row:3 / 7;grid-column:2 / 5;align-self:stretch;transform:none;transition:none;visibility:visible;box-shadow:none;width:auto;max-width:none;min-height:0;background:none;border:0;padding:0}
  html.pt-land body.lt-on[data-ltpin].in-lesson #ltPanel > .lesson-card, html.pt-land body.lt-on[data-ltpin].in-puzzle #ltPanel > .puzzle-card{display:block!important;flex:1 1 auto;min-height:0;overflow-y:auto}
  html.pt-land body.lt-on[data-ltpin] :is(.lesson-card,.puzzle-card) h3{font-size:16px;margin:0 0 4px}
  html.pt-land body.lt-on[data-ltpin] :is(.lesson-prompt,.pz-goal){font-size:13px;line-height:1.6}
  /* 戦績・オンライン：引き出しと同じ場所に出す */
  html.pt-land body.lt-on.lt-rec .grc-ov{inset:calc(var(--tp) * 2 + 18px) calc(max(8px, var(--sr)) + var(--rail) + 6px) 6px auto!important;width:var(--ltw)!important;padding:0!important;background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;z-index:60!important;align-items:stretch!important;animation:ltIn .32s cubic-bezier(.2,1.25,.4,1)}
  html.pt-land body.lt-on.lt-rec .grc{width:100%!important;max-width:none!important;max-height:100%!important;border-radius:14px;box-shadow:-18px 0 40px -10px rgba(0,0,0,.8)}
  html.pt-land body.lt-on.lt-rec .grc-hd{padding:10px 12px 6px} html.pt-land body.lt-on.lt-rec .grc-hd h2{font-size:17px}
  html.pt-land body.lt-on.lt-rec .grc-tabs button{font-size:12px;padding:5px 10px;white-space:nowrap}
  html.pt-land body.lt-on.lt-rec .grc-sum b{font-size:28px}
  html.pt-land body.lt-on.lt-rec .grc-ft button{font-size:13px;padding:8px 14px;white-space:nowrap}
  html.pt-land body.lt-on.lt-rec .grc-ft [data-act=close]{display:none!important}
  @keyframes ltIn{from{transform:translateX(calc(100% + 80px))}to{transform:none}}
  html.pt-land body.lt-on.mtab-online .dock{left:auto!important;right:calc(max(8px, var(--sr)) + var(--rail) + 6px)!important;top:calc(var(--tp) * 2 + 18px)!important;bottom:6px!important;width:var(--ltw);border-radius:14px;border:1px solid rgba(18,164,184,.35);z-index:60!important;animation:ltIn .32s cubic-bezier(.2,1.25,.4,1)}
  html.pt-land body.ol-soon .dock{display:none!important}
  html.pt-land body.ol-soon:not(.no-online) .app{padding-bottom:6px!important}
  /* 手の送り（|< < ▶ > >|）：右の欄のいちばん下 */
  html.pt-land body.lt-on #ltPanel #navBar{display:none!important}
  html.pt-land body.lt-on #ltNav{display:none}
  html.pt-land body.lt-on.lt-nav:not([data-ltpin]) #ltNav{display:flex;grid-area:xx;align-self:end;justify-self:center;margin:0;padding:5px 6px;gap:4px;flex-wrap:nowrap;white-space:nowrap;box-sizing:border-box;
    background:rgba(23,15,11,.92);border:1px solid rgba(18,164,184,.35);border-radius:12px}
  html.pt-land body.lt-on #ltNav button{flex:none;width:40px;height:30px}
  /* アラビア語：並び（盤が左・タブの列が右端・引き出しは右から）は他の言語と同じにして、箱の中の文字だけ右から左へ
     （引き出しとスワイプの向きが右端前提なので、全体を左右反転させない） */
  html[lang=ar].pt-land body.lt-on .app{direction:ltr}
  html[lang=ar].pt-land body.lt-on :is(.brand-l, .board-area > .player, .board-area > .sbox, #ltPanel, #ltRail button){direction:rtl}
  /* ダイアログはタブの列・引き出しより上 */
  html.pt-land .overlay{z-index:80}
}
