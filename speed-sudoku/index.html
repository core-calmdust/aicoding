    <span class="sp"></span>

    <button class="ib" id="btnHelp" data-i18n-title="help.title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.5"/><path d="M12 16.8v.2"/></svg></button>

    <select id="langSel" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh">中文</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select>

  <main id="main">

      <nav class="htabs" id="htabs">

        <button data-p="col"><svg viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.5H11L9.5 22l10-12.5H13z"/></svg><span data-i18n="sp.col">問題集</span></button>
        <button data-p="var"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><circle cx="17" cy="7" r="4"/><path d="M7 13l4 8H3z"/><rect x="13" y="13" width="8" height="8" rx="2" transform="rotate(10 17 17)"/></svg><span data-i18n="sp.mix">ミックス</span></button>
      </nav>
      <div class="hpanel daily" data-p="daily" data-m="sp">
        <div class="dcol">
          <div class="card today" id="spdToday"></div>
          <div class="card" id="spdExtra"></div>
        </div>
        <div class="dcol">
          <div class="card" id="spdCal"></div>
          <a class="card sibling" href="../sudoku/"><span class="sibi"><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="#ffd0d9"/><rect x="5" y="5" width="22" height="22" rx="5" fill="#fff"/><path d="M12.3 5v22M19.7 5v22M5 12.3h22M5 19.7h22" stroke="#ffc0cc" stroke-width="1.2"/><circle cx="16" cy="16" r="3.4" fill="#f07a8f"/></svg></span><span><b data-i18n="sp.sib">まいにち数独で9×9も</b><small data-i18n="sp.sib.d">コイン・キャラ・進行はいっしょです</small></span><i>›</i></a>
        </div>
      </div>
      <div class="hpanel" data-p="col" data-m="sp">
        <div class="card colcard" id="spdCol"></div>
      </div>
      <div class="hpanel" data-p="var" data-m="sp">
        <div class="card colcard" id="spdMix"></div>
      </div>
    </section>

    <section class="screen" id="theme">
      <div class="card">
        <div class="tl-head">
          <button class="back" id="tlBack"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span data-i18n="back">もどる</span></button>
          <h2 id="tlName"></h2>
          <span class="pg num" id="tlProg"></span>
        </div>
        <div id="tlIntro"></div>
        <div id="tlBody"></div>
      </div>
    </section>

    <section class="screen" id="game">
      <div class="gbar">
        <button class="ib flip" id="gBack" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="gt" id="gTitle"></div>
        <button class="ib" id="gRule" data-i18n-title="rule.title" hidden><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/></svg></button>

          <span class="pill mist z" id="gMist" data-i18n-title="g.mistakes"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg><span class="num" id="gMistN">0</span></span>
          <button class="pill" id="gTime" data-i18n-title="g.pause"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg><span class="num" id="gClock">0:00</span></button>
        </div>
      </div>
      <div class="boardwrap" id="bw">
        <div class="board" id="board"></div>
        <div class="pausecov"><b data-i18n="g.paused">一時停止中</b><button class="btn" id="gResume"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><span data-i18n="g.resume">再開</span></button></div>
        <div class="hintcard" id="hintCard"></div>
      </div>
      <div class="side">
        <div class="tools">
          <button class="tool" id="tUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="t.undo">もどす</span></button>

          <button class="tool" id="tMemo"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-i18n="t.memo">メモ</span><i class="badge" id="memoBadge">OFF</i></button>
          <button class="tool" id="tAuto"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M16 12h.01M8 16h.01M12 16h.01" stroke-width="3"/><path d="M12 12h.01" stroke-width="3" opacity=".3"/></svg><span data-i18n="t.auto">自動メモ</span><i class="badge" id="autoN">3</i></button>
          <button class="tool" id="tHint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span data-i18n="t.hint">ヒント</span><i class="badge" id="hintN" hidden>0</i></button>
        </div>
        <div class="pad" id="pad"></div>
        <div class="help" id="kbHelp"></div>
      </div>
    </section>
