<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0b09">
<meta name="robots" content="noindex">
<title>シャンチー — 最強解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" crossorigin>
<style>
:root{
  --bg:#110c09; --panel:#1f1712; --panel2:#2a1f18; --line:#3d2e24;
  --text:#f3ece4; --muted:#b9a898; --dim:#7d6c5e;
  --wood:#e2b979; --ink:#5a3a1c; --brass:#d1a85c; --accent:#e8c27a; --red:#ff6b5b; --good:#7fd6a4;
  --cell:min(calc((100vh - 120px) / 10.6), calc((100vw - 32px) / 9.6), 64px);
}
@media (min-width: 900px){ :root{ --cell:min(calc((100vh - 120px) / 10.6), calc((100vw - 480px) / 9.6), 68px); } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
header a{color:var(--muted);text-decoration:none;font-size:14px}
header a:hover{color:var(--accent)}
h1{margin:0;font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--brass);letter-spacing:.04em}
h1 small{font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
main{display:flex;gap:24px;padding:20px 16px;justify-content:center;flex-wrap:wrap}
#board{position:relative;width:calc(var(--cell) * 9.6);height:calc(var(--cell) * 10.6);background:var(--wood);border:6px solid #4a2f18;border-radius:4px;box-shadow:0 10px 40px #000a;user-select:none;touch-action:none}
#board svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pt{position:absolute;width:var(--cell);height:var(--cell);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pc{width:88%;height:88%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8ea,#efd9b0 70%,#d6b682);border:2px solid #7a5530;box-shadow:0 2px 4px #0007;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .5);font-weight:700;pointer-events:none;font-family:'Zen Kaku Gothic New','Noto Serif TC',serif}
.pc.r{color:#b3261e} .pc.b{color:#1d1d1d}
.pc::before{content:'';position:absolute;width:74%;height:74%;border-radius:50%;border:1px solid currentColor;opacity:.45}
.pt.sel .pc{outline:3px solid #e8c27a;outline-offset:1px}
.pt.last::after{content:'';position:absolute;inset:6%;border:2px dashed #b3261e99;border-radius:50%;pointer-events:none}
.pt.tgt::before{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:#2a1d12aa;pointer-events:none}
.side{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--brass)}
button.go{background:linear-gradient(#d1a85c,#94713a);color:#1a120b;font-weight:700;border-color:#94713a}
button:disabled{opacity:.45;cursor:default}
label{font-size:13px;color:var(--muted)}
.eval{font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--accent)}
.stats{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.pv{font-size:15px;line-height:1.6;word-break:break-word}
.moves{font-size:14px;line-height:1.7;max-height:160px;overflow:auto;color:var(--muted)}
.note{font-size:12px;color:var(--dim);line-height:1.6}
.status.ok{color:var(--good)} .status.ng{color:var(--red)}
</style>
</head>
<body>
<header>
  <a href="../" id="back">← シャンチー</a>
  <h1><span id="gname">Xiangqi</span> <small id="ttl">最強解析</small></h1>
</header>
<main>
  <div id="board"></div>
  <div class="side">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="eval" id="eval">—</div>
        <div class="status" id="iso"></div>
      </div>
      <div class="stats">
        <span id="lDepth">深さ</span><span id="depth">—</span>
        <span id="lNps">局面/秒</span><span id="nps">—</span>
        <span id="lThreads">スレッド</span><span id="thr">—</span>
      </div>
      <div class="pv" id="pv"></div>
    </div>
    <div class="card">
      <div class="row">
        <button class="go" id="btnAna">解析</button>
        <button id="btnPlay">AIに指させる</button>
        <select id="selTime"></select>
      </div>
      <div class="row" style="margin-top:10px">
        <label for="selThr" id="lSel">スレッド数</label>
        <select id="selThr"></select>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="btnUndo">戻す</button>
        <button id="btnFlip">盤を反転</button>
        <button id="btnReset">初期配置</button>
      </div>
    </div>
    <div class="card">
      <div class="moves" id="moves"></div>
      <div style="margin-top:8px;font-size:13px;color:var(--muted)" id="turn"></div>
    </div>
    <p class="note" id="note"></p>
  </div>
</main>
<script src="../engine.js?v=20261108p1-l14-pro1-mt1-pd1"></script>
<script src="../../shared/mtengine.js?v=9"></script>
<script src="pro.js?v=2-pt1-bm1-ybw1-pd1"></script>
</body>
</html>
