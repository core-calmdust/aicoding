<!-- Dev tool: the 2D amazon pieces rendered from 3D models (three.js r128, procedural geometry and textures, a studio light

     ?set=cameo|coin|vase|enamel (2D) · statue|bronze|archer (3D look)&side=w|b&size=512 → window.SHOT = PNG data URL (transparent background). -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

(function () {

// ---------------------------------------------------------------- the four sets

function vaseTex(red) {   // the face: red-figure (a clay figure on black glaze) or black-figure (a black figure on clay)

function vase() {
