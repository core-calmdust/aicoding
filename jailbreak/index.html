<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b313c">
<title>だつごくスライダー！</title>
<meta name="description" content="ブロックをスライドさせて囚人を出口へ逃がす、脱獄テーマのスライドパズル。ハルデンからアルカトラズ・アバシリまで実在の刑務所を巡るコース、毎日3問のデイリーとランキング、カギ・感圧板・一方通行・氷の床・巡回する看守・2人同時脱獄・穴掘り・傾く独房など10のルールモード。">
<meta property="og:title" content="だつごくスライダー！">
<meta property="og:description" content="ブロックをずらして囚人を逃がす脱獄スライドパズル。1400ステージ、デイリーとランキング、10のルールモード。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://core-calmdust.github.io/aicoding/jailbreak/">
<meta property="og:image" content="https://core-calmdust.github.io/aicoding/images/jailbreak.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232b313c'/%3E%3Cpath d='M14 8v48M26 8v48M38 8v48' stroke='%23c7ccd6' stroke-width='5'/%3E%3Crect x='8' y='26' width='30' height='14' rx='4' fill='%23f26b1d' stroke='%23111' stroke-width='3'/%3E%3Cpath d='M44 33h14M52 27l6 6-6 6' stroke='%231fa463' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Jost:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=16">
<link rel="stylesheet" href="comic.css?v=1">
</head>
<body data-floor="concrete">
<div id="bg"></div>
<div id="app">
  <header class="top">
    <div class="brand">
      <a class="series" href="../" data-i18n="series">世界のボドゲ大全</a>
      <button class="logo" id="logo" type="button" aria-label="だつごくスライダー！"><span class="lg1" data-i18n="title">だつごく</span><span class="lg2" data-i18n="lg2">スライダー！</span></button>
    </div>
    <span class="sp"></span>
    <div class="icons">
      <button class="ib" id="btnAch" data-i18n-title="ach.title"><i class="dot"></i></button>
      <button class="ib" id="btnHelp" data-i18n-title="u.rules"></button>
      <button class="ib" id="btnSet" data-i18n-title="set.title"></button>
      <a href="../" class="ib" id="homeLink" data-i18n-title="home"></a>
    </div>
  </header>

  <main>
    <section class="screen" id="home">
      <div class="card prof" id="profCard"></div>
      <nav class="htabs" id="htabs"></nav>
      <div class="hpanel daily" data-p="daily">
        <div class="card panel dbox" id="dBox"><div class="dcard" id="dPuzzle"></div><div id="dCal"></div></div>
        <div class="card panel dsl" id="dSearch"></div>
      </div>
      <div class="hpanel" data-p="course" hidden><div id="coursePanel"></div></div>
      <div class="hpanel" data-p="modes" hidden><div id="modePanel"></div></div>
    </section>

    <section class="screen" id="play" hidden>
      <div class="gbar">
        <button class="ib" id="gBack" data-i18n-title="u.back"></button>
        <div class="gtitle"><b id="gTitle"></b><small id="gTitleSub"></small></div>
      </div>
      <div class="gctl" id="gctl">
        <div class="gstat"><span class="ns" id="gNS"></span><span class="hst" id="gStars"></span><span class="lim" id="gLim" hidden></span><span class="gclock" id="gClock" hidden></span></div>
        <div class="gbtns">
          <button class="ib gbtn" id="gHint" data-i18n-title="g.hint"><b class="hn" id="gHintN"></b><span class="gl" data-i18n="g.hint"></span></button>
          <button class="ib gbtn" id="gUndo" data-i18n-title="g.undo"><span class="gl" data-i18n="g.undo"></span></button>
          <button class="ib gbtn" id="gRestart" data-i18n-title="g.restart"><span class="gl" data-i18n="g.restart"></span></button>
        </div>
      </div>
      <div class="runi" id="runInfo" hidden></div>
      <div class="slbar"><i id="slBar"></i></div>
      <div id="boardWrap"><div id="board" class="board"></div><button class="dead" id="deadEnd" hidden data-i18n="g.dead">行き止まり！「待った」で戻ろう</button></div>
      <div class="tpad" id="tiltPad" hidden><button class="ib" data-t="0" aria-label="left"></button><button class="ib" data-t="2" aria-label="up"></button><button class="ib" data-t="3" aria-label="down"></button><button class="ib" data-t="1" aria-label="right"></button></div>
      <div class="ginfo" id="gInfo"></div>
    </section>
  </main>
</div>

<div id="gameMsg" hidden></div>
<div class="modal" id="modal" hidden><div class="mbox"><button class="ib mx" id="modalX" aria-label="close">✕</button><div id="modalBody"></div></div></div>
<canvas id="fx"></canvas>
<div id="toast"></div>

<script src="engine.js?v=2"></script>
<script src="art.js?v=4"></script>
<script src="i18n.js?v=2"></script>
<script src="i18n-more.js?v=2"></script>
<script src="i18n-v2.js?v=1"></script>
<script src="i18n-v3.js?v=2"></script>
<script src="skins.js?v=1"></script>
<script src="story.js?v=3"></script>
<script src="firebase-config.js?v=1"></script>
<script src="../shared/onlinesec.js?v=2"></script>
<script src="online.js?v=1"></script>
<script src="app.js?v=12"></script>
<!-- World Board Game Atlas: shared account sync -->
<script src="../shared/atlas.js?v=20261028jb" defer></script>
<script src="../shared/atlas-firebase-config.js?v=ac2" defer></script>
<script src="../shared/atlas-account.js?v=20261022ent" defer></script>
</body>
</html>
