<script>/* phones (portrait): freeze the height the board is sized from, so it doesn't grow/shrink while the browser bars slide away on scroll; re-measured only when the width changes (rotation) */
(function () { const R = document.documentElement, mq = matchMedia('(max-aspect-ratio: 1/1) and (pointer: coarse)'); let w = 0;
  // (pinch-zoom changes innerWidth/innerHeight but not the layout width: ignore it — only a real width change re-measures)
  const zoomed = () => window.visualViewport && Math.abs(visualViewport.scale - 1) > .01;
  const set = () => { if (!mq.matches) { R.style.removeProperty('--vh'); w = 0; return; } const lw = R.clientWidth; if (lw === w || (w && zoomed())) return; w = lw; R.style.setProperty('--vh', Math.round(zoomed() ? R.clientHeight : innerHeight) + 'px'); };
  set(); addEventListener('resize', set); addEventListener('orientationchange', () => setTimeout(() => { w = 0; set(); }, 300)); })();</script>

<style>
:root{
  --bg:#0b0f1c; --bg2:#111829; --panel:#151d31; --panel2:#1c2640; --line:#2a3758;
  --text:#eef1f8; --muted:#a3aec8; --dim:#6c789a;
  --brass:#c9a961; --brass2:#8e7440;
  --accent:#e9c97a; --red:#ff6b5b; --good:#7fd6a4;
  --vh: 100vh;
  --ttop: 58px;
  --pad: clamp(24px, 6vmin, 90px);
  --gap: clamp(24px, 3vw, 48px);
  /* the board frame is WU × HU units (set by app.js for the board size and orientation); --cell = one unit (centre distance of two cells) */
  --WU: 18; --HU: 12.4;
  --cell: min((var(--vh) - var(--pad) * 2 - 8px - var(--ttop)) / var(--HU), (100vw - var(--pad) * 2 - var(--gap) - 340px) / var(--WU), 76px);
  --fw: calc(var(--cell) * var(--WU));
  --fh: calc(var(--cell) * var(--HU));
  /* player colours (pieces, edges, chips): html[data-pcs] */
  --pr1:#ff8a7a; --pr2:#e5392e; --pr3:#a3160f; --pr4:#4d0703;
  --pb1:#8cc8ff; --pb2:#2f7fe0; --pb3:#16449a; --pb4:#061a45;
  --er:#e0412f; --eb:#2c78dc;
}
*{box-sizing:border-box;margin:0;padding:0}
@supports (height:100lvh){:root{--vh:100lvh}}
/* PC header bar (shared/headerbar.js): title + menu + icons live in the top bar, the board area starts below it */
html.hb-on{--ttop:0px;--vh:calc(100vh - var(--hb-h))}
@supports (height:100lvh){html.hb-on{--vh:calc(100lvh - var(--hb-h))}}
@media not all and (pointer: coarse){
  html.hb-on.ol-dock{--vh:calc(100vh - 108px - var(--hb-h))}
  @supports (height:100dvh){html.hb-on.ol-dock{--vh:calc(100dvh - 108px - var(--hb-h))}}
}
.hb-chip .pdisc{width:13px;height:13px}
.hb-chip small{color:var(--dim);font-size:11.5px}
@media (max-width: 1100px){.hb-chip small{display:none}}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(1200px 700px at 28% -10%, #461521 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #3c121d 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Zen Kaku Gothic New','Noto Sans Devanagari','Noto Sans Arabic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.app{
  height:var(--vh);
  display:grid;
  grid-template-columns: auto minmax(320px, 520px);
  grid-template-areas:"board side";
  gap:var(--gap);
  justify-content:center;
  align-items:center;
  padding:calc(var(--pad) + var(--ttop)) var(--pad) var(--pad);
}
/* ---------------------------------------------------------------- board */
.board-area{grid-area:board;display:flex;flex-direction:column;align-items:center}
.frame{
  position:relative;width:var(--fw);height:var(--fh);
  border-radius:20px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.05),transparent 60%),linear-gradient(145deg,#1a1712 0%,#0b0a08 55%,#17130d 100%);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.85),0 0 0 1px rgba(201,169,97,.25),inset 0 1px 0 rgba(255,255,255,.06);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.board{position:absolute;inset:0;cursor:default}
.board.can{cursor:pointer}
.bd{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bd .cell{fill:url(#cellG);stroke:var(--gl);stroke-width:.045;stroke-linejoin:round}
.bd .cell.alt{fill:url(#cellG2)}
.bd .rim{fill:none;stroke-linejoin:round;stroke-linecap:round}
.bd .rim.r{stroke:var(--er)}.bd .rim.b{stroke:var(--eb)}
.bd .rimsh{fill:none;stroke:rgba(0,0,0,.45);stroke-linejoin:round;stroke-linecap:round}
.bd .plate{fill:url(#plateG);stroke:rgba(201,169,97,.45);stroke-width:.04}
.bd .co{fill:var(--coord);font-family:'JetBrains Mono',monospace;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.board.no-num .bd .co{display:none}
.bd .st{transform-box:fill-box;transform-origin:center}
.bd .st.r .body{fill:url(#stR)}.bd .st.b .body{fill:url(#stB)}
.bd .st .hi{fill:url(#stHi);pointer-events:none}
.bd .st .sh{fill:rgba(0,0,0,.38);filter:url(#blur1)}
.bd .st.drop{animation:stDrop .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes stDrop{0%{transform:translateY(-.5px) scale(1.35);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.bd .st.dim{opacity:.5}
.bd .st.win .body{stroke:#fff4c8;stroke-width:.05}
.bd .lastdot{fill:#fff;stroke:#0b0b0b;stroke-width:.035;pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,.75))}
.bd .lastdot.onb{fill:#fff}
.board.hide-last .bd .lastdot{display:none}
.bd .ghost{opacity:.38;pointer-events:none}
.bd .winline{fill:none;stroke:#fff3b0;stroke-width:.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 3px rgba(0,0,0,.85));stroke-dasharray:.25 .14;animation:wl 1s linear infinite}
@keyframes wl{to{stroke-dashoffset:-.39}}
.bd .thr{fill:none;stroke-width:.07;stroke-dasharray:.12 .1;filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 2px rgba(0,0,0,.8))}
.bd .thr.r{stroke:var(--pr2)}.bd .thr.b{stroke:var(--pb2)}
.pieces,.fx{position:absolute;inset:0}
.fx{pointer-events:none;z-index:6}
.coach-mk{position:absolute;width:calc(var(--cell) * .8);height:calc(var(--cell) * .8);margin:calc(var(--cell) * -.4) 0 0 calc(var(--cell) * -.4);border-radius:50%;border:3px dashed #3df59a;background:rgba(6,18,12,.45);box-shadow:0 0 0 1.5px #08120c,inset 0 0 0 1.5px #08120c,0 0 6px rgba(0,0,0,.9);display:grid;place-items:center;font:800 calc(var(--cell) * .32)/1 'JetBrains Mono',monospace;color:#3df59a;text-shadow:0 0 1px #08120c,0 0 3px #000,0 0 3px #000;pointer-events:none;z-index:10}
.coach-mk.hov{border-style:solid;background:rgba(61,245,154,.22);box-shadow:0 0 0 1.5px #08120c,inset 0 0 0 1.5px #08120c,0 0 14px rgba(61,245,154,.75)}
/* coach (coach.js, shared/coachkit.js) */
#coachCard.hidden{display:none}
body.in-lesson #coachCard,body.in-puzzle #coachCard,body.in-online #coachCard,body.rated-live #coachCard{display:none!important}
#coachCard.ck-off .ck-muted{font-size:12px}
html.pc2 .side-in > #coachCard:not(.hidden):not(.ck-off){flex:1.7 1 0}
html.pc2 .side-in > #coachCard.ck-off{flex:.7 1 0}
#coachCard .ck-rvgo{font:inherit;font-size:14px;font-weight:700;padding:9px 18px;border-radius:10px;border:0;background:linear-gradient(180deg,#d8bb72,#a98a48);color:#1b150a;cursor:pointer;white-space:nowrap}
/* result dialog: button labels never wrap (common spec) — buttons wrap to a second row instead */
#resultOverlay .modal-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,80px),1fr));gap:8px}
#resultOverlay .modal-actions .mbtn{white-space:nowrap;letter-spacing:0;padding-left:4px;padding-right:4px;min-width:0;font-size:clamp(13px,3.8vw,16px)}
#resultOverlay .modal-actions .mbtn.hidden{display:none}
.mark{position:absolute;width:calc(var(--cell) * .84);height:calc(var(--cell) * .84);margin:calc(var(--cell) * -.42) 0 0 calc(var(--cell) * -.42);border-radius:50%;border:3px solid;pointer-events:none;z-index:8}
.mark.ok{border-color:var(--accent);box-shadow:0 0 0 1.5px rgba(0,0,0,.8),inset 0 0 0 1.5px rgba(0,0,0,.8),0 0 14px rgba(226,194,117,.7)}
.mark.ng{border-color:#ff6b5b;box-shadow:0 0 0 1.5px rgba(0,0,0,.8),inset 0 0 0 1.5px rgba(0,0,0,.8)}
.mark.ok2{border-color:#3df59a;border-style:dashed;box-shadow:0 0 0 1.5px rgba(0,0,0,.8),inset 0 0 0 1.5px rgba(0,0,0,.8)}
.mark.played{border:3px dashed #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.85),inset 0 0 0 1.5px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.6)}
.mark.played.bad{border-color:#ff6b5b}
.mark.played.dubious{border-color:#f2c060}
.mark.dot{width:calc(var(--cell) * .3);height:calc(var(--cell) * .3);margin:calc(var(--cell) * -.15) 0 0 calc(var(--cell) * -.15);border:0;background:#ffe9a6;box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 0 10px rgba(255,236,170,.9)}
.mark.carrier{width:calc(var(--cell) * .5);height:calc(var(--cell) * .5);margin:calc(var(--cell) * -.25) 0 0 calc(var(--cell) * -.25);border:2px dashed #3df59a;box-shadow:0 0 0 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.8)}
.hintlbl{position:absolute;width:calc(var(--cell));height:calc(var(--cell));margin:calc(var(--cell) * -.5) 0 0 calc(var(--cell) * -.5);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:9;font-family:'JetBrains Mono',monospace;line-height:1.05;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.8)}
.hintlbl b{font-size:calc(var(--cell) * .3);font-weight:700;background:rgba(10,14,26,.8);border-radius:6px;padding:0 .2em;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.hintlbl small{font-size:calc(var(--cell) * .17);opacity:.95;background:rgba(10,14,26,.72);border-radius:4px;padding:0 .25em;margin-top:1px}
.hintlbl.win{color:#9ff0c4}.hintlbl.loss{color:#ff9b90}.hintlbl.heur{color:rgba(255,255,255,.88)}.hintlbl.neg{color:#ffc2b8}
.hintlbl.best b{color:var(--accent)}
.hintlbl.best::before{content:"";position:absolute;inset:6%;border-radius:50%;border:2.5px solid #ffd76a;box-shadow:0 0 0 1.5px rgba(0,0,0,.85),inset 0 0 0 1.5px rgba(0,0,0,.85),0 0 10px rgba(255,215,106,.5)}
@media (pointer: coarse) and (max-width: 900px), (pointer: coarse) and (max-height: 560px){
  .hintlbl b{font-size:clamp(calc(var(--cell) * .3), calc(var(--cell) * .42), 15px);padding:0 .12em;border-radius:5px}
  .hintlbl small{font-size:clamp(calc(var(--cell) * .17), calc(var(--cell) * .26), 11px);margin-top:0}
}
.toast{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:20;
  background:rgba(10,14,26,.92);backdrop-filter:blur(6px);
  border:1px solid rgba(201,169,97,.45);color:var(--text);
  padding:14px 26px;border-radius:12px;font-weight:700;letter-spacing:.08em;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.big{font-family:'Cormorant Garamond','Shippori Mincho B1',serif;font-size:30px;letter-spacing:.2em;padding:12px 34px;color:var(--accent)}
.review-bar,.review-bar.show{display:none!important}
.prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--cell) * .12);z-index:15;font-size:12.5px;color:var(--accent);white-space:nowrap;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .2s;background:rgba(10,14,26,.9);border:1px solid rgba(201,169,97,.4);border-radius:999px;padding:3px 12px}
.prompt.show{opacity:1}
/* swap button (the second move with the swap rule on) */
.swapbtn{position:absolute;left:50%;top:calc(var(--cell) * .18);transform:translateX(-50%);z-index:16;display:none;align-items:center;gap:8px;padding:7px 16px 7px 12px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.04em;color:#1b150a;background:linear-gradient(180deg,#f0d78f,#b8963f);box-shadow:0 8px 20px -8px rgba(0,0,0,.8),0 0 0 1px rgba(255,240,200,.5);cursor:pointer;animation:swp 1.6s ease-in-out infinite}
.swapbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swapbtn.show{display:inline-flex}
@keyframes swp{50%{box-shadow:0 8px 20px -8px rgba(0,0,0,.8),0 0 0 4px rgba(240,215,143,.35)}}

/* ---------------------------------------------------------------- side */
.side{grid-area:side;width:100%;height:var(--fh);min-height:0;max-height:calc(var(--vh) - var(--pad) * 2);container-type:inline-size}
.side-in{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0}
.side{position:relative}
.side > .brand{position:absolute;left:0;right:0;bottom:calc(100% + 14px)}
.kifu-card{flex:1;min-height:0;display:flex;flex-direction:column}
.kifu-card .kifu{flex:1;min-height:0;max-height:none}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{--tl:17;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(15px, calc((100cqw - 190px) / (var(--tl) * .66)), 28px);letter-spacing:.06em;white-space:nowrap}
.brand h1 small{font-size:12px;letter-spacing:.3em;color:var(--brass);margin-left:8px;font-family:'Zen Kaku Gothic New';font-weight:500}
.brand a{font-size:12px;color:var(--dim);text-decoration:none;white-space:nowrap}
.brand a:hover{color:var(--muted)}
.brand-r{display:flex;align-items:center;gap:8px}
.brand h1{min-width:0;flex:1 1 auto;overflow:hidden}
.brand-r{flex:none}
#langSel{background:rgba(0,0,0,.25);color:var(--muted);border:1px solid var(--line);border-radius:7px;font:inherit;font-size:11px;padding:3px 4px;cursor:pointer}
#langSel:hover{color:var(--text)}
.snd{width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim)}
.snd:hover{color:var(--text)}
a.snd.home{text-decoration:none}
.snd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .off-x{display:none}
.snd.on{color:var(--accent);border-color:rgba(201,169,97,.5)}
.snd:not(.on) .on-w{display:none}
.snd:not(.on) .off-x{display:inline}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player{position:relative;border-radius:12px;padding:12px;background:rgba(0,0,0,.18);border:1px solid transparent;transition:border-color .25s, background .25s;min-width:0}
.player.active{border-color:rgba(201,169,97,.6);background:rgba(201,169,97,.07)}
.player.won{border-color:rgba(127,214,164,.7);background:rgba(127,214,164,.08)}
.player .top{display:flex;align-items:center;gap:8px;min-width:0}
.player .clk{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--muted);padding:1px 7px;border-radius:7px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.player .clk:empty{display:none}
.player.active .clk{color:var(--accent);border-color:rgba(201,169,97,.6)}
.player .clk.low{color:#ff9b90;border-color:rgba(255,107,91,.6)}
.rt-card{margin-top:10px;padding:11px 14px 12px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.rt-head{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.rt-lbl{font-size:12px;color:var(--muted);letter-spacing:.08em}
.rt-r{font-family:'JetBrains Mono',monospace;font-size:21px;color:var(--brass);font-weight:700}
.rt-rank{font-size:12.5px;color:var(--text)}
.rt-prov{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.rt-rec{font-size:12.5px;color:var(--muted);margin-top:3px}
.rt-spark{display:block;width:100%;height:34px;margin-top:8px}
.rt-spark polyline{fill:none;stroke:var(--brass);stroke-width:1.5}
.rt-spark line{stroke:var(--line);stroke-dasharray:3 3}
.rt-lbl2{font-size:11.5px;color:var(--dim);margin:7px 0 5px}
.rt-hist{display:flex;flex-wrap:wrap;gap:4px}
.rt-chip{font-size:11px;line-height:1.5;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:inline-flex;gap:4px;font-family:'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}
.rt-chip i{font-style:normal}
.rt-chip.w i,.rt-chip.w b{color:#8fe3b8}.rt-chip.l i,.rt-chip.l b{color:#ff9b90}
.rt-chip b{font-weight:600}
.rt-res{font-family:'JetBrains Mono',monospace}
body.rated-live #evalCard .evalrow,body.rated-live #evalCard .evalbar,body.rated-live #evalCard .graph{display:none}
.pdisc{width:20px;height:20px;border-radius:50%;flex:none;display:inline-block}
.pdisc.p1{background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 35%,var(--gold3) 85%)}
.pdisc.p2{background:radial-gradient(circle at 35% 30%,var(--plat1),var(--plat2) 35%,var(--plat3) 85%)}
.player .name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .count{font-family:'Shippori Mincho B1',serif;font-size:36px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.player .count small{font-size:12px;color:var(--dim);font-family:'Zen Kaku Gothic New';font-weight:500;margin-left:6px;letter-spacing:.05em}
.player .status{font-size:11px;color:var(--dim);height:15px;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player.thinking .status{color:var(--accent)}
.player.thinking .pdisc{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(226,194,117,.25)}}
.evalrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.evalrow .label{font-size:12px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}
.evalrow .val{font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evalbar{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--plat3),var(--plat2));overflow:hidden}
.evalbar .fill{position:absolute;inset:0 auto 0 0;width:50%;background:linear-gradient(90deg,var(--gold3),var(--gold2));transition:width .5s ease}
.evalbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.6)}
.graph{touch-action:none;user-select:none;-webkit-user-select:none;margin-top:10px;width:100%;height:clamp(40px, calc(var(--vh) * .09), 90px);display:block;cursor:pointer}
.graph .zero{stroke:rgba(201,169,97,.35);stroke-dasharray:2 3}
.graph .cur{stroke:var(--accent);stroke-width:1}
.controls{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:12px;color:var(--muted);transition:border-color .2s,color .2s,background .2s;white-space:nowrap;min-width:0;overflow:hidden}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover:not(:disabled){border-color:var(--brass2);color:var(--text)}
.btn.on{color:var(--accent);border-color:rgba(201,169,97,.6);background:rgba(201,169,97,.08)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{color:var(--text)}
.kifu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.kifu-head .label{font-size:12px;color:var(--muted);letter-spacing:.1em}
.kifu-head button{font-size:11px;color:var(--dim);padding:2px 6px;border-radius:5px}
.kifu-head button:hover{color:var(--text)}
.kifu{display:grid;align-content:start;grid-auto-rows:min-content;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:3px;max-height:150px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.kifu button{padding:3px 6px;border-radius:5px;color:var(--muted);display:flex;align-items:center;justify-content:flex-start;gap:5px;white-space:nowrap;overflow:hidden}
.kifu button em{font-style:normal;color:var(--dim);font-size:.85em;min-width:1.6em;text-align:right}
.kifu button i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.kifu button i.p1{background:var(--gold2)}
.kifu button i.p2{background:var(--plat2)}
.kifu button .x{color:#ff9b90}
.kifu button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.kifu button.cur{background:rgba(201,169,97,.16);color:var(--accent)}
.kifu button.q-bad{box-shadow:inset 0 -2px 0 #ff6b5b}
.kifu button.q-dub{box-shadow:inset 0 -2px 0 #f2c060}
.kifu .empty{grid-column:1/-1;color:var(--dim);font-family:'Zen Kaku Gothic New';font-size:12px;padding:6px 0}
.info-line{font-size:11px;color:var(--dim);text-align:center;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace}

/* ---------------------------------------------------------------- modal */
.overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(12,4,6,.62);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s;padding:16px}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(460px,100%);max-height:calc(var(--vh) - 32px);overflow-y:auto;background:linear-gradient(180deg,#35161e,#260e14);border:1px solid rgba(201,169,97,.35);border-radius:18px;padding:24px;box-shadow:0 40px 80px rgba(0,0,0,.6);transform:translateY(10px);transition:transform .25s}
.overlay.show .modal{transform:none}
.overlay.instant,.overlay.instant .modal{transition:none!important}
.overlay{height:100vh;height:100dvh;bottom:auto}
.modal{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overscroll-behavior:contain}
.ls-tabs{margin-bottom:16px}
.ls-tabs button{font-size:13.5px;padding:9px 4px}
@media (max-width: 520px), (max-height: 560px){
  .overlay{padding:10px}
  .modal{padding:18px 16px;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);border-radius:14px}
  .modal h2{font-size:19px;margin-bottom:12px}
  .ls-tabs{margin-bottom:12px}
}
.modal h2{font-family:'Shippori Mincho B1',serif;font-size:22px;letter-spacing:.12em;margin-bottom:18px}
.field{margin-bottom:16px}
.field > label{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
#segMode{flex-wrap:wrap}
#segMode button{flex:1 0 30%}
@media (max-width: 520px){#segMode{display:grid;grid-template-columns:1fr 1fr}}
.seg button.sel{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px rgba(201,169,97,.45)}
.level-wrap{display:flex;flex-direction:column-reverse;gap:6px}
.level-wrap input{width:100%;margin:0;accent-color:var(--brass);height:32px;touch-action:pan-y}
.level-name{font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:22px}
.level-name small{font-weight:400;font-size:11px;color:var(--dim)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.checks label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.checks input{accent-color:var(--brass);width:16px;height:16px}
.modal-actions{display:flex;gap:10px;margin-top:22px}
/* list views fill the fixed-size tabbed dialog; the Close / Back buttons stay pinned to the bottom when there is spare space */
#lessonOverlay .modal:has(> #lessonListView:not(.hidden)), #puzzleOverlay .modal:has(> #pzListView:not(.hidden)), #puzzleOverlay .modal:has(> #pzGridView:not(.hidden)){display:flex;flex-direction:column}
#lessonListView:not(.hidden), #pzListView:not(.hidden), #pzGridView:not(.hidden){flex:1 0 auto;display:flex;flex-direction:column}
#lessonListView > .modal-actions, #pzListView > .modal-actions, #pzGridView > .modal-actions{margin-top:auto;padding-top:22px}
.mbtn{flex:1;padding:12px;border-radius:11px;font-weight:700;letter-spacing:.08em;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted)}
.mbtn:hover{color:var(--text)}
.mbtn.go{background:linear-gradient(180deg,#d8bb72,#a98a48);color:#1b150a;border-color:transparent}
.mbtn.go:hover{filter:brightness(1.07)}
.result-big{font-family:'Shippori Mincho B1',serif;font-size:34px;font-weight:800;text-align:center;letter-spacing:.1em;margin:4px 0 10px}
.result-disc{display:flex;justify-content:center;margin:6px 0 4px}
.result-disc .pdisc{width:46px;height:46px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.result-sub{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;line-height:1.7}
.hidden{display:none!important}
body.rv-on #evalCard.hidden{display:block!important}   /* the ◀ ▶ navigation stays while reviewing, even with the 形勢 display off */
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:200;pointer-events:none;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}

.rulecards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rulecard{position:relative;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--text);min-width:0}
.rulecard:hover{border-color:var(--brass2)}
.rulecard.sel{border-color:var(--accent);background:linear-gradient(180deg,rgba(201,169,97,.14),rgba(201,169,97,.04));box-shadow:0 0 0 1px rgba(226,194,117,.25)}
.rulecard svg{display:block;width:44px;height:44px;margin-bottom:6px}
.rulecard b{display:block;font-family:'Shippori Mincho B1',serif;font-size:14.5px;letter-spacing:.04em}
.rulecard small{display:block;font-size:11px;color:var(--muted);line-height:1.5;margin-top:3px}
.rulecard .std{color:var(--accent);font-size:10.5px}
@media (max-width: 520px){.rulecards{grid-template-columns:1fr}.rulecard{display:grid;grid-template-columns:44px 1fr;column-gap:10px;align-items:center}.rulecard svg{grid-row:1 / span 2;margin:0}}

/* rules page */
#rulesOverlay .modal{width:min(900px,100%)}
/* hands-on rules tutorial (shared/ruletour.js): fixed dialog size, the tour has its own Back / Close / Next */
#rulesOverlay .modal{height:min(880px, calc(100vh - 32px));height:min(880px, calc(100dvh - 32px));display:flex;flex-direction:column}
#rulesOverlay .modal > h2, #rulesOverlay .modal > .modal-actions{display:none}
#rulesOverlay #rulesBody{flex:1;min-height:0}
#rulesOverlay #rulesBody > div{max-width:640px;width:100%;margin:0 auto}
/* phones held sideways: compact tabs so the board keeps a useful (fixed) size */
@media (max-height: 560px) and (orientation: landscape){ #rulesOverlay .modal{padding:10px 18px} #rulesOverlay .ls-tabs, #rulesOverlay #rulesTabs{margin-bottom:6px} #rulesOverlay .ls-tabs button, #rulesOverlay #rulesTabs button{padding-top:5px;padding-bottom:5px} #rulesOverlay #rulesBody > div{max-width:none} }
.rt-board svg.tour [data-p]{cursor:pointer}
.rt-board svg.tour .pop{animation:tourPop .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes tourPop{0%{opacity:0}100%{opacity:1}}
.rt-html .tour-pic{display:flex;justify-content:center}
.rt-html .tour-pic svg{width:min(240px, 64vw);height:auto}
.rl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.rl-head b{font-family:'Shippori Mincho B1',serif;font-size:20px;letter-spacing:.06em}
.rl-head .lvl{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid rgba(201,169,97,.5);color:var(--accent)}
.rl-lead{font-size:14.5px;line-height:1.8;color:#e9d8dc;margin-bottom:12px}
.rl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width: 620px){.rl-grid{grid-template-columns:1fr}}
.rl-item{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18);padding:10px 12px}
.rl-item h4{font-size:13.5px;color:var(--accent);margin-bottom:6px;letter-spacing:.04em}
.rl-item p{font-size:13px;line-height:1.7;color:#e9d8dc}
.rl-item svg{display:block;width:min(220px,100%);height:auto;margin:6px auto 6px}

/* lesson & puzzle */
.lesson-card,.puzzle-card{display:none}
/* opening study: compact step bar under the board (phones) + autoplay */
.st-nav{display:none;align-items:center;justify-content:center;gap:6px;direction:ltr}
.st-nav button{width:42px;height:36px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
.st-nav button:disabled{opacity:.35;pointer-events:none}
.st-nav svg,#lsAuto svg{width:16px;height:16px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st-nav .st-auto,#lsAuto{color:var(--accent);border-color:rgba(201,169,97,.55)}
.st-nav .st-auto{width:54px}
.st-nav .st-auto.on,#lsAuto.on{background:rgba(201,169,97,.2)}
.st-nav .i-pause,#lsAuto .i-pause{display:none}
.st-nav .on .i-pause,#lsAuto.on .i-pause{display:block}.st-nav .on .i-play,#lsAuto.on .i-play{display:none}
.st-pos{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);min-width:58px;text-align:center;white-space:nowrap}
.lesson-actions #lsAuto{flex:0 0 46px;padding:0;display:flex;align-items:center;justify-content:center}
.lesson-actions #lsAuto.hidden{display:none}
body.in-lesson .lesson-card{display:block}
body.in-puzzle .puzzle-card{display:block}
body.in-lesson .players, body.in-lesson #evalCard, body.in-lesson .kifu-card, body.in-lesson .info-line, body.in-lesson .controls,
body.in-puzzle #evalCard, body.in-puzzle .kifu-card, body.in-puzzle .info-line, body.in-puzzle .controls{display:none!important}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lt{font-size:12px;color:var(--brass);letter-spacing:.12em}
.lesson-card h3,.puzzle-card h3{font-family:'Shippori Mincho B1',serif;font-size:20px;margin:4px 0 8px;letter-spacing:.06em}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12)}
.dots i.ok{background:#6fd3a0}.dots i.mid{background:#f2c060}.dots i.ng{background:#ff6b5b}.dots i.cur{box-shadow:0 0 0 2px var(--accent)}
.lesson-prompt{font-size:14px;line-height:1.7}
.ls-goal,.pz-goal{margin-bottom:8px;padding:8px 10px;border-radius:9px;background:rgba(226,194,117,.08);border:1px solid rgba(226,194,117,.28);color:var(--text);display:flex;align-items:center;gap:8px}
.pz-goal{font-size:15px;font-weight:700}
.lesson-fb,.pz-status{margin-top:10px;font-size:13px;line-height:1.75;color:var(--muted);min-height:44px}
.lesson-fb b.ok,.pz-status b.ok{color:#8fe3b8}.lesson-fb b.ng,.pz-status b.ng{color:#ff9b90}
.pts{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:700;padding:1px 8px;border-radius:7px;margin-right:4px;border:1px solid}
.pts.ok{color:#8fe3b8;border-color:rgba(111,211,160,.5)}.pts.mid{color:#ffd29a;border-color:rgba(242,192,96,.5)}.pts.ng{color:#ff9b90;border-color:rgba(255,107,91,.5)}
.ld-score{font-family:'Shippori Mincho B1',serif;font-size:46px;font-weight:800;margin:6px 0}
.ld-score.ok{color:#8fe3b8}.ld-score.ng{color:#ff9b90}
.ld-score small{font-size:18px;color:var(--dim)}
.lesson-actions{display:flex;gap:8px;margin-top:12px}
.lesson-actions button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--muted);font-size:13px;font-weight:700}
.lesson-actions button:hover:not(:disabled){color:var(--text)}
.lesson-actions button:disabled{opacity:.35}
.lesson-actions button.go{background:linear-gradient(180deg,#d8bb72,#a98a48);color:#1b150a;border-color:transparent}
.lesson-list{display:grid;gap:8px}
.ls-course{grid-column:1 / -1;margin:10px 0 2px;display:flex;flex-direction:column;gap:2px}
.ls-course:first-child{margin-top:0}
.ls-course b{font-family:'Shippori Mincho B1',serif;font-size:16px;color:var(--brass)}
.ls-course small{font-size:12px;color:var(--dim);line-height:1.6}
.ls-grad{margin-top:12px;font-size:14px;line-height:1.7;color:var(--text)}
.lesson-item .no.op{font-size:13px;font-family:inherit;width:34px}
.op-choice{display:grid;gap:8px;margin-top:14px}
.op-meta{font-size:12px;color:var(--muted);font-weight:400}
.op-play{margin-top:10px;font-size:12.5px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--text)}
.op-play:hover{border-color:var(--brass2)}
.study-bar{display:block;height:4px;width:140px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.study-bar > span{display:block;height:100%;background:var(--brass)}
.lesson-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);text-align:left;color:var(--text);width:100%}
.lesson-item:hover{border-color:var(--brass2)}
.lesson-item .no{font-family:'Shippori Mincho B1',serif;font-size:20px;color:var(--brass);width:28px;text-align:center;flex:none}
.lesson-item .tx{flex:1;min-width:0}
.lesson-item .tx b{display:block;font-size:14px}
.lesson-item .tx small{display:block;font-size:12px;color:var(--dim);line-height:1.5}
.lesson-item .st{font-size:12px;color:var(--dim);flex:none}
.lesson-item .st.clear{color:#8fe3b8}
.lesson-intro p{font-size:14px;line-height:1.85;color:#e6d5d9;margin-bottom:10px}
.lesson-intro p b{color:var(--accent)}
.lesson-intro .note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--brass2);padding-left:10px}
.mini{display:block;margin:4px auto 12px;width:min(230px,72%);height:auto}
.var-tabs{margin:-6px 0 16px}.var-tabs button{font-size:12.5px;padding:7px 4px}
.pz-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pz-grid button{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px}
.pz-grid button:hover{border-color:var(--brass2)}
.pz-grid button.solved{border-color:rgba(111,211,160,.6);color:#8fe3b8}
.pz-grid button.solved::after{content:" ✓"}
.daily{border-color:rgba(226,194,117,.55)!important;background:linear-gradient(90deg,rgba(201,169,97,.16),rgba(0,0,0,.2))!important}
.daily .no{font-size:18px!important}

/* review / share */
.review-card{display:none}
:where(.review-card.show){flex:1.6 1 0;min-height:96px}
.review-card.show{display:block;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
/* the review card scrolls; its height shows the 振り返り解説 box (--rvh, set in renderReview) */
.review-card.show:has(.cr-box){flex:none!important;min-height:0!important;max-height:var(--rvh, 260px)!important;overflow-y:auto!important}
body.in-lesson .review-card, body.in-puzzle .review-card{display:none!important}
.rv-prog{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 4px}
.rv-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--accent));transition:width .2s}
.cr-box{margin:0 0 12px;padding:12px 14px;border-radius:12px;border:1px solid rgba(201,169,97,.35);background:rgba(201,169,97,.06)}
.cr-h{font-family:'Shippori Mincho B1',serif;font-size:16px;color:var(--brass);letter-spacing:.06em;margin-bottom:6px}
.cr-box p{font-size:13.5px;line-height:1.7;color:var(--text);margin:0 0 4px}
.cr-item{padding:8px 0;border-top:1px solid rgba(201,169,97,.18)}.cr-item:first-of-type{border-top:0;padding-top:2px}
.cr-mv .tag{font-size:12px;font-weight:700;margin-inline-start:4px}.cr-mv .tag.bad{color:#ff8b7d}.cr-mv .tag.dubious{color:#f2c060}.cr-mv .tag.best{color:#8fe3b8}
.cr-turn{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,139,125,.15);color:#ff8b7d;border:1px solid rgba(255,139,125,.4)}
.cr-box p.cr-tip{color:#e9dcb4}.cr-box p.cr-more{color:var(--dim);font-size:12px;margin-top:6px}
.cr-see{margin-top:4px;padding:4px 12px;border-radius:999px;border:1px solid rgba(201,169,97,.5);background:transparent;color:var(--brass);font:inherit;font-size:12px;cursor:pointer}
html[lang=ar] .cr-box{direction:rtl;text-align:right}
.rv-sum{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:12px;margin-top:2px;align-items:center}
.rv-sum .h{color:var(--dim);font-size:11px}
.rv-sum b{font-size:15px;color:var(--text)}
.rv-sum .who{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rv-sum .who .pdisc{width:12px;height:12px}
.rv-chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* ---------------------------------------------------------------- PC (html.pc2 = PC media, mouse windows from 900px wide, any
   height; set by the layout script at the end of the page; the header bar of shared/headerbar.js uses the same media).
   Like Mancala / Backgammon: the board is one wide band across the window — the frame spans the width and the board inside
   it is the diamond (long diagonal across, app.js pcRot) — and the info is a row of cards BELOW it (online watch / lesson /
   puzzle card, players, evaluation bar / graph / ◀ ▶, review, kifu). The board takes the height the info row (--ih) leaves;
   each card scrolls inside when it needs more room (2026-10-28) */
html.pc2{--pad:clamp(10px, 1.8vmin, 22px);--padx:clamp(14px, 1.8vw, 36px);--gap:clamp(10px, 1.2vw, 18px);--ih:clamp(156px, calc(var(--vh) * .26), 300px);--rbx:0px;
  --cell:max(20px, min((var(--vh) - var(--pad) * 2 - var(--gap) - var(--ih) - var(--rbx)) / var(--HU), (100vw - var(--padx) * 2 - 24px) / var(--WU), 96px))}
html.pc2 .app{display:grid;grid-template-columns:minmax(0, 1fr);grid-template-rows:auto var(--ih);grid-template-areas:"board" "side";gap:var(--gap);align-items:stretch;align-content:start;justify-content:stretch;height:auto;min-height:var(--vh);padding:var(--pad) var(--padx)}
html.pc2 body{overflow-y:auto}
html.pc2 .board-area{width:100%;align-items:stretch}
html.pc2 .frame{width:100%;height:calc(var(--fh) + 8px)}
html.pc2 .board{inset:4px auto auto 50%;width:var(--fw);height:var(--fh);transform:translateX(-50%)}
html.pc2 .side{width:100%;height:var(--ih);max-height:none;min-height:0;overflow:visible;container-type:normal}
html.pc2 .side-in{display:flex;flex-direction:row;align-items:stretch;gap:var(--gap);height:100%}
html.pc2 .side-in > *{flex:1 1 0;min-width:0;min-height:0;margin:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
html.pc2 .side-in > .card{padding:12px 14px}
html.pc2 .players{flex:.8 1 0;display:flex;flex-direction:column;gap:8px}
html.pc2 .players .player{flex:1 1 0;min-height:0;padding:8px 12px;display:grid;grid-template-columns:minmax(0, 1fr) auto;grid-template-areas:"top top" "count status";align-content:center;align-items:end;column-gap:8px}
html.pc2 .player .top{grid-area:top}
html.pc2 .player .count{grid-area:count;min-width:0;overflow:hidden;text-overflow:ellipsis}
html.pc2 .player .status{grid-area:status;position:static;height:auto;line-height:1.4;padding-bottom:3px;visibility:visible}
html.pc2 .player .count{font-size:clamp(24px, calc(var(--ih) * .14), 36px);margin-top:2px}
html.pc2 .player .count small{display:inline;margin:0 0 0 6px;font-size:11.5px}
html.pc2 #evalCard{display:flex;flex-direction:column}
html.pc2 #evalCard .graph{flex:1 1 auto;height:auto;min-height:30px}
html.pc2 .review-card.show{flex:1.5 1 0;max-height:none!important}
html.pc2 .kifu-card{flex:1.1 1 0;display:flex;flex-direction:column}
html.pc2 .kifu-head{flex-wrap:wrap;row-gap:2px}
html.pc2 .lesson-card, html.pc2 .puzzle-card{flex:2.2 1 0}
html.pc2 .lesson-actions{flex-wrap:wrap}
html.pc2 .info-line{display:none}
html.pc2 .side > .brand:not(:has(*)){display:none}
/* the swap button / prompt sit in the board's empty bottom corners */
html.bd-dia .swapbtn{left:calc(50% - var(--fw) / 2 + 16px);top:auto;bottom:16px;transform:none}
html.bd-dia .prompt{left:auto;right:calc(50% - var(--fw) / 2 + 16px);bottom:16px;transform:none}
/* PC: the two players sit in the board's empty top corners (diamond board), so the row under the board is
   コーチ 1/2 | 形勢 1/4 | 棋譜 1/4 (2026-10-30) */
html.pc2.bd-dia:not(.rb-on) .app{position:relative}
html.pc2.bd-dia:not(.rb-on) :is(.side, .side-in){position:static}
html.pc2.bd-dia:not(.rb-on) .side-in > .players{position:absolute;z-index:5;top:calc(var(--pad) + 14px);left:calc(var(--padx) + 14px);right:calc(var(--padx) + 14px);display:flex;flex-direction:row;justify-content:space-between;gap:12px;padding:0;margin:0;background:none;border:0;box-shadow:none;overflow:visible;pointer-events:none}
html.pc2.bd-dia:not(.rb-on) .side-in > .players .player{flex:none;width:clamp(170px, 15vw, 240px);pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
html.pc2.bd-dia:not(.rb-on) .side-in > .players .player .count{font-size:clamp(24px, 2.2vw, 34px)}
html.pc2.bd-dia:not(.rb-on) .side-in > #coachCard:not(.hidden){flex:2 1 0}
html.pc2.bd-dia:not(.rb-on) .side-in > #evalCard, html.pc2.bd-dia:not(.rb-on) .side-in > .kifu-card{flex:1 1 0}
/* review box (rbox.js, PC only): while a finished game is reviewed after the analysis, a wide box (commentary | candidate moves
   with their lines | study mode); it sits on the left of the row under the board, next to the info cards (players + evaluation | review + kifu),
   and that row grows a little (2026-10-28) */
.rbox{--rb-bg:var(--panel);--rb-line:var(--line);--rb-text:var(--text);--rb-muted:var(--muted);--rb-acc:var(--accent);--rb-acc-ink:#1a1408;--rb-s1:var(--pr2);--rb-s2:var(--pb2)}
html.pc2.rb-on{--ih:clamp(200px, calc(var(--vh) * .32), 320px)}
html.pc2.rb-on .app{grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr);grid-template-areas:"board board" "rbox side"}   /* commentary box on the left, like Backgammon */
html.pc2.rb-on .rbox{display:grid;grid-area:rbox;height:var(--ih);min-width:0}
html.pc2.rb-on .side-in{display:grid;grid-template-columns:minmax(0, .85fr) minmax(0, 1fr);grid-template-rows:minmax(0, 1fr) minmax(0, 1fr)}
html.pc2.rb-on .side-in > .players{display:none}   /* (the header bar shows the result and the stone counts) */
html.pc2.rb-on .side-in > #evalCard{grid-column:1;grid-row:1 / 3}
html.pc2.rb-on .side-in > .review-card{grid-column:2;grid-row:1}
html.pc2.rb-on .side-in > .kifu-card{grid-column:2;grid-row:2}
html.pc2.rb-on .side-in:not(:has(> .review-card.show)) > .kifu-card{grid-row:1 / 3}
html.rb-study #frame{outline:3px solid var(--accent);outline-offset:3px}
.rbpv{position:absolute;width:calc(var(--cell) * .66);height:calc(var(--cell) * .66);margin:calc(var(--cell) * -.33) 0 0 calc(var(--cell) * -.33);border-radius:50%;display:grid;place-items:center;z-index:9;pointer-events:none;font:800 calc(var(--cell) * .3)/1 system-ui,sans-serif;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45);opacity:.9}
.rbpv.s1{background:var(--pr2)}.rbpv.s2{background:var(--pb2)}
.rbpv{border:2px solid rgba(0,0,0,.75);text-shadow:0 0 2px #000,0 0 3px #000}
.rbpv.first{box-shadow:0 0 0 3px var(--accent),0 2px 8px rgba(0,0,0,.5);opacity:1}
/* 振り返り and 棋譜 share the height half and half in every layout (2026-10-28): side by side or one above the other, both boxes
   are the same height and scroll inside (overrides the older per-layout ratios and the review card's --rvh fit) */
html.pc2 body .side-in > .review-card.show{flex:1.5 1 0!important;min-width:0!important}   /* (the --rvh rule's flex:none made it as wide as its text) */
html:not(.pc2) body:not(.in-lesson):not(.in-puzzle):not(.in-online):not(.in-edit) .side-in:has(> .review-card.show:not(.slim)) > :is(.review-card.show, .kifu-card){flex:none!important;height:clamp(220px, 42vh, 380px)!important;min-height:0!important;max-height:none!important}
html:not(.pc2) body:not(.in-lesson):not(.in-puzzle):not(.in-online):not(.in-edit) .side-in:has(> .review-card.show:not(.slim)) > .review-card.show{overflow-y:auto!important}
html:not(.pc2) body:not(.in-lesson):not(.in-puzzle):not(.in-online):not(.in-edit) .side-in:has(> .review-card.show:not(.slim)) > .kifu-card .kifu{flex:1 1 0!important;min-height:0!important;max-height:none!important;overflow-y:auto!important;overscroll-behavior:auto}
/* portal 3D skin on phones: the same distance from the 3D board to the boxes above / below as in reversi (~15px) */
@media (pointer: coarse) and (orientation: portrait){ html.atlas-skin .board-area > #frame{margin-top:calc(var(--board) * .045 - 11px)!important;margin-bottom:calc(var(--board) * .045 - 13px)!important} }

<script>
/* PC layout (shared/headerbar.js HeaderBar.MEDIA): html.pc2 = board + one fixed-width info column (2026-10-28); every other
   layout (phones, tablets, narrow / clearly tall windows) is the one stacked column */
(function () {
  const MQ = '(hover: hover) and (pointer: fine) and (min-width: 900px)';   /* (also the header bar's media, app.js HeaderBar.init) */
  const mq = matchMedia(MQ);
  function apply() { document.documentElement.classList.toggle('pc2', mq.matches); window.dispatchEvent(new Event('resize')); }
  if (mq.addEventListener) mq.addEventListener('change', apply); else mq.addListener(apply);
  apply();
})();
</script>
<!-- World Board Game Atlas portal skin: hex/?skin=atlas — 3D marquetry hex board with glass stones, guide speech bubbles, portal look (all features kept) -->
<script>
(function () {
  if (!/[?&]skin=atlas\b/.test(location.search)) return;
  document.documentElement.classList.add('atlas-skin');
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '../atlas/skin/skin.css?v=22'; document.head.appendChild(css);
  const f = document.createElement('link'); f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@600;700&display=swap'; document.head.appendChild(f);
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  if (window.AtlasLoading) { AtlasLoading.show(); setTimeout(() => AtlasLoading.hide(), 12000); }   // safety net
  load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js').then(() => load('../atlas/table3d.js?v=73')).then(() => load('../atlas/skin/common.js?v=10')).then(() => load('../atlas/models/hex.js?v=1')).then(() => load('../atlas/skin/hex.js?v=2'))
    .catch(() => { document.documentElement.classList.remove('atlas-skin'); if (window.AtlasLoading) AtlasLoading.hide(); });
})();
</script>
