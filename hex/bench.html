<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ヘックス MT ベンチ</title>
<script src="../shared/bench-auto.js?v=1"></script>
<style>
:root{--bg:#f6f1e7;--fg:#2a2118;--mut:#7a6a58;--card:#fffaf0;--line:#e2d6c2;--acc:#a8562a;--ok:#2f7d4a;--ng:#b23b2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1915;--fg:#efe6d8;--mut:#a89884;--card:#28221c;--line:#3d342a;--acc:#e08a55;--ok:#6cc58a;--ng:#ef7b6c}}
:root[data-theme="dark"]{--bg:#1d1915;--fg:#efe6d8;--mut:#a89884;--card:#28221c;--line:#3d342a;--acc:#e08a55;--ok:#6cc58a;--ng:#ef7b6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px}
.kv b{font-weight:600}
.y{color:var(--ok);font-weight:600}.n{color:var(--ng);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-size:14px}
select,button{font:inherit}
select{padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{padding:8px 16px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button:disabled{opacity:.45;cursor:default}
#bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 4px}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#st{font-size:13px;color:var(--mut);min-height:1.5em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
h2{font-size:15px;margin:4px 0 8px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--mut);margin:8px 0 0;max-height:200px;overflow:auto}
</style>
</head>
<body>
<main>
<h1>ヘックス マルチスレッド ベンチマーク</h1>
<p class="sub">対局ページと同じ方式（Document-Isolation-Policy の分離、engine_mt.wasm の tree-parallel MCTS、11路・スワップなし）で、スレッド数ごとのプレイアウト数／秒と、基準（1スレッドで長く読んだ結果）との最善手の一致を測ります。Chrome（PC）で開き、終わったら「結果をコピー」を押して貼り付けてください。</p>

<div class="card"><div class="kv" id="env"></div></div>

<div class="card">
  <div class="row">
    <label>1回の時間 <select id="selT"><option value="1000">1秒</option><option value="3000" selected>3秒</option><option value="5000">5秒</option></select></label>
    <label>基準（1スレッド） <select id="selR"><option value="4">時間×4</option><option value="2">時間×2</option><option value="0">なし</option></select></label>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="btnRun" disabled>開始</button>
    <button id="btnCopy" class="sec" disabled>結果をコピー</button>
  </div>
  <div id="bar"><i></i></div>
  <div id="st">準備中…</div>
</div>

<div class="card"><h2>結果</h2><div class="tw"><table id="tbl"><thead><tr><th>盤</th><th>スレッド</th><th>プレイアウト/秒</th><th>1スレッド比</th><th>効率</th><th>基準と一致</th><th>起動</th></tr></thead><tbody></tbody></table></div><pre id="log"></pre></div>
</main>
<script src="../shared/mtengine.js?v=8"></script>
<script>
'use strict';
// Positions: 10 on 11x11 (seeded random cells, 4-20 stones, no swap) — the moves as cell indices r*n+c
const POS = (() => {
  let rs = 4242; const rnd = k => { rs = (rs * 1103515245 + 12345) & 0x7fffffff; return rs % k; };
  const out = [];
  for (let i = 0; i < 10; i++) { const len = 4 + rnd(17), used = new Set(), mv = []; while (mv.length < len) { const c = rnd(121); if (!used.has(c)) { used.add(c); mv.push(c); } } out.push({ n: 11, moves: mv }); }
  return out;
})();
const $ = s => document.querySelector(s);
const HC = navigator.hardwareConcurrency || 1;
const ISO = !!self.crossOriginIsolated && typeof SharedArrayBuffer === 'function';
const COUNTS = (() => { const a = []; for (let t = 1; t < HC; t *= 2) a.push(t); a.push(HC); return [...new Set(a)]; })();
const coord = (m, n) => m < 0 ? '-' : 'abcdefghijk'[m % n] + (Math.floor(m / n) + 1);
const ua = (() => { const d = navigator.userAgentData; const b = d && (d.brands || []).filter(x => !/Not/.test(x.brand)).map(x => x.brand + ' ' + x.version).join(', '); return (b ? b + ' / ' + (d.platform || '') : '') || navigator.userAgent; })();
let started = 0, lines = [];

function env() {
  $('#env').innerHTML = [
    ['crossOriginIsolated', ISO ? '<span class="y">true</span>' : '<span class="n">false</span>'],
    ['hardwareConcurrency', HC], ['測るスレッド数', COUNTS.join(', ')],
    ['起動できたスレッド', started ? started : '—'], ['ブラウザ', ua.replace(/</g, '&lt;')],
  ].map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
}
env();

// isolation: the folder's service worker (sw.js, the same as the game page) adds Document-Isolation-Policy; reload once
async function isolate() {
  if (ISO) return true;
  if (!('serviceWorker' in navigator) || !isSecureContext) return false;
  try { await navigator.serviceWorker.register('sw.js?v=1', { scope: './' }); await navigator.serviceWorker.ready; } catch (e) { return false; }
  const K = 'hex-bench-reload', last = +(localStorage.getItem(K) || 0);
  if (Date.now() - last > 15000) { try { localStorage.setItem(K, String(Date.now())); } catch (e) {} location.reload(); return null; }
  return false;
}

let pool = null;
async function setup() {
  const iso = await isolate();
  if (iso === null) { $('#st').textContent = '分離のために再読み込みしています…'; return; }
  if (!iso) { $('#st').innerHTML = '<span class="n">クロスオリジン分離できませんでした。</span>PC の Chrome / Edge で開いてください（スレッドを使えません）。'; return; }
  $('#st').textContent = 'スレッドを起動しています…';
  pool = MTEngine.pool({
    wasm: 'engine_mt.wasm?v=2', lead: 'engine.js?v=3-pro1-mt1&mt=1', helper: 'mt-helper.js?v=1', slot: 2 << 20, initial: 1024, maximum: 16384,
    imports: mem => ({ env: { memory: mem, now: () => Date.now(), progress: () => {} } }), help: m => m.type === 'analyze' ? {} : null,
  });
  if (!(await pool.ready)) { $('#st').innerHTML = '<span class="n">スレッドを起動できませんでした。</span>'; return; }
  $('#st').textContent = `準備完了（最大 ${pool.maxThreads} スレッド）。「開始」を押してください。所要 約${estMin()}分。`;
  $('#btnRun').disabled = false;
}
function estMin() { const t = +$('#selT').value, r = +$('#selR').value; return Math.ceil(POS.length * t * (COUNTS.length + r) / 60000 + 0.3); }
['#selT', '#selR'].forEach(s => $(s).onchange = () => { if (pool && !$('#btnRun').disabled) $('#st').textContent = `所要 約${estMin()}分。`; });

async function search(p, threads, ms) {
  const r = await pool.run({ type: 'analyze', start: { n: p.n, swap: false }, moves: p.moves, time: ms, max: 30, mtThreads: threads }, null, 'bench');
  if (!r || r.error) throw new Error(r && r.error || 'cancelled');
  started = Math.max(started, r.threads || 1);
  const best = r.list && r.list[0];
  return { visits: r.playouts || 0, ms: r.ms, threads: r.threads, best: best ? best.m : -1 };
}

async function run() {
  $('#btnRun').disabled = true; $('#btnCopy').disabled = true;
  const ms = +$('#selT').value, rf = +$('#selR').value;
  const total = POS.length * (COUNTS.length + rf) * ms + 2000; let doneMs = 0;
  const tick = (add, msg) => { doneMs += add; $('#bar i').style.width = Math.min(100, doneMs / total * 100) + '%'; if (msg) $('#st').textContent = msg; };
  lines = [`hex bench ${new Date().toISOString()} | ${ua} | isolated ${ISO} | hc ${HC} | 11x11 | ${ms} ms/run | ref 1 thread x${rf}`];
  const R = {};   // key n|t → { v, ms, agree, cnt, thr }
  try {
    tick(0, 'ウォームアップ…');
    await search(POS[0], COUNTS[COUNTS.length - 1], 2000); tick(2000);
    for (let i = 0; i < POS.length; i++) {
      const p = POS[i]; let ref = null;
      if (rf) { tick(0, `局面 ${i + 1}/${POS.length}（${p.n}路）：基準 1スレッド ${ms * rf / 1000}秒`); ref = await search(p, 1, ms * rf); tick(ms * rf); }
      const row = [`pos ${i + 1} ${p.n}x${p.n} ply ${p.moves.length}` + (ref ? ` ref ${coord(ref.best, p.n)} ${ref.visits}po` : '')];
      for (const t of COUNTS) {
        tick(0, `局面 ${i + 1}/${POS.length}（${p.n}路）：${t}スレッド`);
        const r = await search(p, t, ms); tick(ms);
        for (const k of [p.n + '|' + t, 'all|' + t]) { const a = R[k] || (R[k] = { v: 0, ms: 0, agree: 0, cnt: 0, thr: 0 }); a.v += r.visits; a.ms += r.ms; a.cnt++; a.thr = Math.max(a.thr, r.threads); if (ref && r.best === ref.best) a.agree++; }
        row.push(`t${t}(${r.threads}) ${Math.round(r.visits / r.ms)}k po/s ${coord(r.best, p.n)}`);
      }
      lines.push(row.join(' | '));
      render(R, rf);
    }
    tick(total, '完了。「結果をコピー」を押して、Claude に貼り付けてください。');
  } catch (e) { $('#st').innerHTML = '<span class="n">エラー：' + String(e.message || e).replace(/</g, '&lt;') + '</span>'; lines.push('error ' + (e.message || e)); }
  env();
  const sum = render(R, rf);
  lines.splice(1, 0, ...sum);
  $('#log').textContent = lines.join('\n');
  $('#btnRun').disabled = false; $('#btnCopy').disabled = false;
}
function render(R, rf) {
  const tb = $('#tbl tbody'), out = []; tb.innerHTML = '';
  for (const g of ['all']) {
    const b = R[g + '|1']; if (!b) continue;
    const base = b.v / b.ms;
    for (const t of COUNTS) {
      const a = R[g + '|' + t]; if (!a) continue;
      const vps = a.v / a.ms * 1000, sp = a.v / a.ms / base;
      const ag = rf ? `${a.agree}/${a.cnt}` : '—';
      tb.insertAdjacentHTML('beforeend', `<tr><td>11路</td><td>${t}</td><td>${Math.round(vps).toLocaleString()}</td><td>${sp.toFixed(2)}×</td><td>${(sp / t * 100).toFixed(0)}%</td><td>${ag}</td><td>${a.thr}</td></tr>`);
      out.push(`${g === 'all' ? 'all' : g + 'x' + g} threads ${t}: ${vps.toFixed(1)} playouts/s, x${sp.toFixed(2)} vs 1, eff ${(sp / t * 100).toFixed(0)}%, agree ${ag}, started ${a.thr}`);
    }
  }
  return out;
}
$('#btnRun').onclick = run;
$('#btnCopy').onclick = async () => {
  const txt = lines.join('\n');
  try { await navigator.clipboard.writeText(txt); $('#btnCopy').textContent = 'コピーしました'; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); $('#btnCopy').textContent = 'コピーしました'; } catch (e2) {} ta.remove(); }
  setTimeout(() => { $('#btnCopy').textContent = '結果をコピー'; }, 2000);
};
setup();
</script>
</body>
</html>
