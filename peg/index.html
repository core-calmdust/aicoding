<body class="no-online">

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <aside class="side">
    <div class="brand">
      <div class="brand-l"><a class="series" href="../" data-i18n="series">世界のボドゲ大百科</a><h1 class="to-board" role="button" tabindex="0"><span id="brandTitle" data-i18n="title">ペグソリテール</span><small id="brandSub">Peg Solitaire</small></h1></div>
      <span class="brand-r"><button id="btnSound" class="snd" data-i18n-title="sound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on-w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off-x" d="M16 9l6 6M22 9l-6 6"/></svg></button><select id="langSel" aria-label="Language">
        <option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="zh-TW">繁體中文</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="id">Indonesian</option><option value="hi">हिन्दी</option><option value="ar">العربية</option>
      </select><a href="../" class="snd home" data-i18n-title="back" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a></span>
    </div>
    <div class="side-in">
      <div class="card status-card" id="statusCard">
        <div class="st-top"><span class="st-board" id="stBoard"></span><span class="st-mode" id="stMode"></span></div>
        <div class="st-main"><b id="stLeft">32</b><span class="st-unit" id="stUnit"></span><span class="st-moves" id="stMoves"></span></div>
        <div class="st-goal" id="stGoal"></div>
        <div class="st-msg" id="stMsg"></div>
      </div>
      <div class="card puzzle-card" id="puzzleCard">
        <div class="lh"><span class="lt" id="pzStep"></span><button class="pz-quit" id="pzQuit"><svg viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M14 8l-4 4 4 4M10 12h10"/></svg><span id="pzQuitL"></span></button></div>
        <h3><span id="pzTitle"></span><small id="pzNo"></small><span class="pz-stars" id="pzStars"></span></h3>
        <div class="pz-status" id="pzStatus"></div>
        <div class="pz-actions">
          <button id="pzHint" class="ic"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg><span></span></button>

          <button id="pzAnswer" class="ic"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span></span></button>
          <button id="pzList" class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg><span></span></button>
          <button id="pzNext" class="nx"><span data-i18n="pz.next"></span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="card controls">
        <button class="btn primary" id="btnNew" data-i18n-title="btn.new.title"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="btn.new"></span></button>
        <button class="btn" id="btnUndo" data-i18n-title="btn.undo.title"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="btn.undo"></span></button>
        <button class="btn" id="btnReset" data-i18n-title="btn.reset.title"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span data-i18n="btn.reset"></span></button>
        <button class="btn" id="btnHint" data-i18n-title="btn.hint.title"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg><span data-i18n="btn.hint"></span></button>
        <button class="btn" id="btnRules" data-i18n-title="btn.rules.title"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg><span data-i18n="btn.rules"></span></button>
        <button class="btn" id="btnPuzzle" data-i18n-title="btn.puzzle.title"><svg viewBox="0 0 24 24"><path d="M4 7h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4h-4a2 2 0 1 0-4 0H4v-4a2 2 0 1 0 0-4z"/></svg><span data-i18n="btn.puzzle"></span></button>
      </div>
      <div class="card daily-card" id="dailyCard">
        <button class="daily-go" id="dailyGo"><span class="dg-ic">★</span><span class="dg-tx"><b data-i18n="daily.title"></b><small id="dailySub"></small></span><span class="dg-st" id="dailySt"></span></button><button class="daily-easy" id="dailyEasy">EASY</button>
      </div>
      <div class="card rec-card" id="recCard">
        <div class="rec-h" data-i18n="rec.title"></div>
        <div class="rec-list" id="recList"></div>
      </div>
    </div>

<!-- new game -->
<div class="overlay" id="newOverlay">
  <div class="modal ng-modal">
    <h2 data-i18n="ng.title"></h2>
    <div class="field" data-ng="game">
      <label data-i18n="ng.board"></label>
      <div class="ngt-gcards" id="ngBoards" style="--ngt-cols:3"></div>
    </div>
    <div class="ng-cols">
      <div class="ng-col">
        <div class="field">
          <label data-i18n="ng.start"></label>
          <div class="seg" id="segStart"><button data-v="classic" data-i18n="ng.start.classic"></button><button data-v="pick" data-i18n="ng.start.pick"></button></div>
          <p class="note" id="ngStartNote"></p>
        </div>
        <div class="field">
          <label data-i18n="ng.goal"></label>
          <div class="seg" id="segGoal"><button data-v="hole" data-i18n="ng.goal.hole"></button><button data-v="any" data-i18n="ng.goal.any"></button></div>
          <p class="note" id="ngGoalNote"></p>
        </div>
      </div>
      <div class="ng-col">
        <div class="field">
          <label data-i18n="ng.preview"></label>
          <div class="ng-prev" id="ngPrev"></div>
        </div>
      </div>
    </div>
    <div class="field" data-ng="design">
      <label data-i18n="ng.bd"></label>
      <div class="dz-row bdrow" id="bdRow"></div>
    </div>
    <div class="field" data-ng="design">
      <label data-i18n="ng.pg"></label>
      <div class="dz-row bdrow" id="pgRow"></div>
    </div>
    <div class="modal-actions"><button class="mbtn ghost" id="btnCancelNew" data-i18n="close"></button><button class="mbtn go" id="btnStartNew" data-i18n="ng.go"></button></div>
  </div>
</div>

<!-- result -->
<div class="overlay" id="resultOverlay">
  <div class="modal res-modal">
    <div class="res-badge" id="resBadge"></div>
    <h2 id="resTitle"></h2>
    <p id="resSub"></p>
    <div class="modal-actions"><button class="mbtn ghost" id="resUndo" data-i18n="res.undo"></button><button class="mbtn" id="resAgain" data-i18n="res.again"></button><button class="mbtn go" id="resNew" data-i18n="res.new"></button></div>
  </div>
</div>

<!-- rules | puzzles: one box, the tabs switch its page in place (as the other games) -->
<div class="overlay" id="puzzleOverlay">
  <div class="modal pz-modal">
    <div class="seg ls-tabs"><button data-v="rules" data-i18n="btn.rules"></button><button data-v="puzzle" data-i18n="btn.puzzle"></button></div>
    <div class="pz-view" id="rulesView" hidden><div id="rulesBody"></div></div>
    <div class="pz-view" id="pzListView" hidden><div id="pzLevels"></div><div class="modal-actions"><button class="mbtn" id="pzClose" data-i18n="close"></button></div></div>
    <div class="pz-view" id="pzGridView" hidden><div class="pz-head"><button class="mbtn ghost sm" id="pzBack" data-i18n="pz.back"></button></div><div id="pzLevelHead"></div><div class="pb-grid-wrap" id="pzGrid"></div><div class="modal-actions"><button class="mbtn" id="pzClose2" data-i18n="close"></button></div></div>
  </div>
</div>
