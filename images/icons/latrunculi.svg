<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ludus latrunculorum: a corner of the white marble board in its Tyrian-purple surround, a white glass counter
       enclosed between two black ones -->
  <defs>
    <clipPath id="lt-c"><rect width="96" height="96" rx="20"/></clipPath>
    <linearGradient id="lt-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a2f72"/><stop offset="1" stop-color="#4a173d"/></linearGradient>
    <linearGradient id="lt-mb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#e2ddd2"/></linearGradient>
    <radialGradient id="lt-b" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#6b7284"/><stop offset=".5" stop-color="#232733"/><stop offset="1" stop-color="#0a0c11"/></radialGradient>
    <radialGradient id="lt-w" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1f1ec"/><stop offset="1" stop-color="#bfc3bb"/></radialGradient>
  </defs>
  <g clip-path="url(#lt-c)">
    <rect width="96" height="96" fill="url(#lt-bg)"/>
    <rect x="9" y="9" width="78" height="78" rx="4" fill="url(#lt-mb)"/>
    <path d="M14 30q10-6 18 2t20-3 18 6M20 62q12 5 22-2t26 4" fill="none" stroke="#cfc8ba" stroke-width="1" opacity=".7"/>
    <path d="M35 9v78M61 9v78M9 35h78M9 61h78" stroke="#a99f8c" stroke-width="1.4"/>
    <ellipse cx="23" cy="51" rx="10.5" ry="3" fill="#000" opacity=".16"/><ellipse cx="49" cy="51" rx="10.5" ry="3" fill="#000" opacity=".16"/><ellipse cx="75" cy="51" rx="10.5" ry="3" fill="#000" opacity=".16"/>
    <circle cx="22" cy="47" r="10" fill="url(#lt-b)"/><circle cx="74" cy="47" r="10" fill="url(#lt-b)"/>
    <circle cx="48" cy="47" r="10" fill="url(#lt-w)" stroke="#d8423a" stroke-width="1.6"/>
    <circle cx="18.5" cy="43" r="2.6" fill="#fff" opacity=".55"/><circle cx="70.5" cy="43" r="2.6" fill="#fff" opacity=".55"/><circle cx="44.5" cy="43" r="2.6" fill="#fff" opacity=".9"/>
    <circle cx="48" cy="21" r="8" fill="url(#lt-b)" opacity=".92"/><circle cx="22" cy="74" r="8" fill="url(#lt-w)"/>
  </g>
</svg>
