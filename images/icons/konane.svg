<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <clipPath id="kn-c"><rect width="96" height="96" rx="20"/></clipPath>
    <radialGradient id="kn-bg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#d9b47e"/><stop offset="1" stop-color="#a87a46"/></radialGradient>
    <radialGradient id="kn-pk" cx=".5" cy=".38" r=".62"><stop offset="0" stop-color="#5a3a1c"/><stop offset=".75" stop-color="#7a5430"/><stop offset="1" stop-color="#c39a64"/></radialGradient>
    <radialGradient id="kn-b" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#5d5a57"/><stop offset=".55" stop-color="#2a2826"/><stop offset="1" stop-color="#121110"/></radialGradient>
    <radialGradient id="kn-w" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1ece2"/><stop offset="1" stop-color="#c9bfae"/></radialGradient>
    <pattern id="kn-tri" width="12" height="9" patternUnits="userSpaceOnUse"><path d="M0 9 6 0l6 9z" fill="#5a2c14"/></pattern>
  </defs>
  <g clip-path="url(#kn-c)">
    <rect width="96" height="96" fill="url(#kn-bg)"/>
    <!-- kapa bands with the triangle (niho manō) motif -->
    <rect y="0" width="96" height="9" fill="#e9cf9f"/><rect y="0" width="96" height="9" fill="url(#kn-tri)" opacity=".85"/>
        <!-- puka (cups) of the papamū: a row of three, and the row below -->
    <g fill="url(#kn-pk)"><circle cx="18" cy="46" r="12"/><circle cx="48" cy="46" r="12"/><circle cx="78" cy="46" r="12"/><circle cx="18" cy="78" r="12"/><circle cx="48" cy="78" r="12"/><circle cx="78" cy="78" r="12"/></g>
    <!-- stones -->
    <circle cx="19" cy="80" r="11" fill="#2a1c10" opacity=".5"/><circle cx="18" cy="78" r="10.5" fill="url(#kn-w)"/>
    <circle cx="49" cy="80" r="11" fill="#1a1008" opacity=".5"/><circle cx="48" cy="78" r="10.5" fill="url(#kn-b)"/>
    <circle cx="79" cy="80" r="11" fill="#2a1c10" opacity=".5"/><circle cx="78" cy="78" r="10.5" fill="url(#kn-w)"/>
    <circle cx="49" cy="48" r="11" fill="#2a1c10" opacity=".5"/><circle cx="48" cy="46" r="10.5" fill="url(#kn-w)"/>
    <circle cx="19" cy="48" r="11" fill="#1a1008" opacity=".55"/><circle cx="18" cy="46" r="10.5" fill="url(#kn-b)"/>
    <!-- the jump: the black stone hops over the white one into the empty cup -->
    <path d="M20 31C34 13 62 13 75 30" fill="none" stroke="#fff4d6" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M67.5 27.5 76 31.5 77 22.5" fill="none" stroke="#fff4d6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
