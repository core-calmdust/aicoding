    <radialGradient id="hearts-tint" cx=".25" cy=".12" r=".95"><stop offset="0" stop-color="#ffc7d2" stop-opacity=".28"/><stop offset=".6" stop-color="#ffc7d2" stop-opacity=".04"/><stop offset="1" stop-color="#ffc7d2" stop-opacity="0"/></radialGradient>
    <linearGradient id="hearts-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#ecdfc2"/></linearGradient>
