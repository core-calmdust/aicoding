    <radialGradient id="pt-b" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#74b0ea"/><stop offset=".6" stop-color="#2f6fb8"/><stop offset="1" stop-color="#173f78"/></radialGradient>
  </defs>
