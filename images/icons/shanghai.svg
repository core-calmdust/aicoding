<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Shanghai (the 3D game): a small stack of rounded ivory mahjong tiles on green felt, a big 中 tile in front, a star above -->
  <defs>
    <clipPath id="sh-c"><rect width="96" height="96" rx="20"/></clipPath>
    <radialGradient id="sh-bg" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#3e8f70"/><stop offset="1" stop-color="#123a2d"/></radialGradient>
    <linearGradient id="sh-iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ead9b8"/></linearGradient>
    <linearGradient id="sh-bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8a62"/><stop offset="1" stop-color="#14503a"/></linearGradient>
  </defs>
  <g clip-path="url(#sh-c)">
    <rect width="96" height="96" fill="url(#sh-bg)"/>
    <path d="M70 10l2.2 5.6 6 .4-4.6 3.8 1.5 5.8L70 22.4l-5.1 3.2 1.5-5.8L61.8 16l6-.4z" fill="#ffd76a"/>
    <circle cx="20" cy="18" r="1.4" fill="#fff" opacity=".7"/><circle cx="84" cy="34" r="1.1" fill="#fff" opacity=".6"/><circle cx="12" cy="40" r="1" fill="#fff" opacity=".5"/>
    <!-- the back tiles -->
    <g transform="translate(14 30)">
      <rect x="0" y="6" width="26" height="34" rx="5" fill="url(#sh-bk)"/><rect x="0" y="0" width="26" height="34" rx="5" fill="url(#sh-iv)"/>
      <circle cx="13" cy="17" r="8" fill="none" stroke="#1d4f9a" stroke-width="3"/><circle cx="13" cy="17" r="3" fill="#b3222c"/>
    </g>
    <g transform="translate(56 26)">
      <rect x="0" y="6" width="26" height="34" rx="5" fill="url(#sh-bk)"/><rect x="0" y="0" width="26" height="34" rx="5" fill="url(#sh-iv)"/>
      <rect x="6" y="5" width="5" height="24" rx="2.5" fill="#17704a"/><rect x="15" y="5" width="5" height="24" rx="2.5" fill="#17704a"/>
    </g>
    <!-- the big 中 -->
    <g transform="translate(29 40)">
      <rect x="0" y="9" width="38" height="48" rx="7" fill="url(#sh-bk)"/><rect x="0" y="0" width="38" height="48" rx="7" fill="url(#sh-iv)" stroke="#d8c39a" stroke-width="1"/>
      <rect x="9.5" y="14" width="19" height="13" rx="1.5" fill="none" stroke="#b3222c" stroke-width="4.2"/><rect x="17" y="7" width="4.2" height="34" rx="1.5" fill="#b3222c"/>
    </g>
  </g>
</svg>
