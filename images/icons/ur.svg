<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <clipPath id="ur-c"><rect width="96" height="96" rx="20"/></clipPath>
    <linearGradient id="ur-sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1d8"/><stop offset=".6" stop-color="#ecdcb4"/><stop offset="1" stop-color="#d6c08f"/></linearGradient>
    <radialGradient id="ur-pc" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#eee0bf"/><stop offset="1" stop-color="#b9a178"/></radialGradient>
    <radialGradient id="ur-pk" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#6a6a70"/><stop offset=".5" stop-color="#34343a"/><stop offset="1" stop-color="#16161a"/></radialGradient>
    <g id="ur-petal"><path d="M0 0C-3.4-5-3.4-12 0-17C3.4-12 3.4-5 0 0z"/></g>
  </defs>
  <g clip-path="url(#ur-c)">
    <rect width="96" height="96" fill="#14183a"/>
    <!-- lapis strips between the squares -->
    <rect x="0" y="0" width="96" height="96" fill="#2a3f9e"/>
    <g fill="#24388f" opacity=".7"><circle cx="12" cy="47" r="2"/><circle cx="47" cy="10" r="1.6"/><circle cx="50" cy="83" r="1.8"/><circle cx="85" cy="49" r="1.5"/></g>
    <!-- four shell squares -->
    <rect x="4" y="4" width="41" height="41" rx="2" fill="url(#ur-sh)"/>
    <rect x="51" y="4" width="41" height="41" rx="2" fill="url(#ur-sh)"/>
    <rect x="4" y="51" width="41" height="41" rx="2" fill="url(#ur-sh)"/>
    <rect x="51" y="51" width="41" height="41" rx="2" fill="url(#ur-sh)"/>
    <!-- rosette (top left) -->
    <g transform="translate(24.5 24.5)">
      <g fill="#b0332a" stroke="#2a1a10" stroke-width="1">
        <use href="#ur-petal"/><use href="#ur-petal" transform="rotate(90)"/><use href="#ur-petal" transform="rotate(180)"/><use href="#ur-petal" transform="rotate(270)"/>
      </g>
      <g fill="#2a46a8" stroke="#2a1a10" stroke-width="1">
        <use href="#ur-petal" transform="rotate(45)"/><use href="#ur-petal" transform="rotate(135)"/><use href="#ur-petal" transform="rotate(225)"/><use href="#ur-petal" transform="rotate(315)"/>
      </g>
      <circle r="3.4" fill="#b0332a" stroke="#2a1a10" stroke-width="1"/>
    </g>
    <!-- five circles (top right) -->
    <g fill="none" stroke="#2a1a10" stroke-width="1.4">
      <circle cx="61" cy="14" r="5"/><circle cx="82" cy="14" r="5"/><circle cx="71.5" cy="24.5" r="5"/><circle cx="61" cy="35" r="5"/><circle cx="82" cy="35" r="5"/>
    </g>
    <g fill="#2a46a8"><circle cx="61" cy="14" r="2.2"/><circle cx="82" cy="14" r="2.2"/><circle cx="71.5" cy="24.5" r="2.2"/><circle cx="61" cy="35" r="2.2"/><circle cx="82" cy="35" r="2.2"/></g>
    <!-- eyes (bottom left) -->
    <g fill="none" stroke="#2a1a10" stroke-width="1.3">
      <path d="M8 62q7-7 14 0q-7 7-14 0zM27 62q7-7 14 0q-7 7-14 0zM8 81q7-7 14 0q-7 7-14 0zM27 81q7-7 14 0q-7 7-14 0z"/>
      <path d="M24.5 54v36M6 71.5h37"/>
    </g>
    <g fill="#2a1a10"><circle cx="15" cy="62" r="2"/><circle cx="34" cy="62" r="2"/><circle cx="15" cy="81" r="2"/><circle cx="34" cy="81" r="2"/></g>
    <!-- zigzag square (bottom right) -->
    <path d="M56 56l5 3 5-3 5 3 5-3 5 3 5-3v31l-5-3-5 3-5-3-5 3-5-3-5 3z" fill="none" stroke="#2a1a10" stroke-width="1.2"/>
    <g fill="#2a46a8"><circle cx="64" cy="64" r="2.4"/><circle cx="79" cy="64" r="2.4"/><circle cx="71.5" cy="71.5" r="2.4"/><circle cx="64" cy="79" r="2.4"/><circle cx="79" cy="79" r="2.4"/></g>
    <!-- a shell piece and a shale piece -->
    <g transform="translate(64 66)">
      <ellipse cx="2" cy="4" rx="15" ry="13" fill="#000" opacity=".35"/>
      <circle r="14.5" fill="url(#ur-pc)" stroke="#8a7350" stroke-width="1"/>
      <g fill="#2a46a8"><circle cx="-6" cy="-6" r="2.6"/><circle cx="6" cy="-6" r="2.6"/><circle r="2.6"/><circle cx="-6" cy="6" r="2.6"/><circle cx="6" cy="6" r="2.6"/></g>
    </g>
    <g transform="translate(30 70)">
      <ellipse cx="2" cy="4" rx="13" ry="11.5" fill="#000" opacity=".35"/>
      <circle r="12.5" fill="url(#ur-pk)" stroke="#0b0b0d" stroke-width="1"/>
      <g fill="#f1e4c4"><circle cx="-5" cy="-5" r="2.2"/><circle cx="5" cy="-5" r="2.2"/><circle r="2.2"/><circle cx="-5" cy="5" r="2.2"/><circle cx="5" cy="5" r="2.2"/></g>
    </g>
  </g>
</svg>
