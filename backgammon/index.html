/* puzzle tiles: the position (with the dice) above the number and theme */

.pz-grid button.th .tth{display:block;width:100%}.pz-grid button.th .tth svg{display:block;margin:0;width:100%;height:auto;border-radius:5px;opacity:.9}

/* ---------------------------------------------------------------- PC (common spec: mouse, >= 1040px wide, not a clearly tall window):
   the board across the top (flat geometry fitted by pcFit in app.js: the window width and the height left above the info row),
   the info row under it — 対局者 | 形勢 | ヒント / 振り返り | 棋譜 (lessons / puzzles: 対局者 | the lesson / puzzle card). --ich = info row height (pcFit). */
@media (hover: hover) and (pointer: fine) and (min-width: 1040px) and (min-aspect-ratio: 3/4){
  :root{--px:24px}
  @media (max-width: 1299px){ :root{--px:16px} .players .count small{display:none} }
  html:not(.rot) .app{display:grid;height:auto;min-height:var(--vh);width:min(calc(100vw - 2 * var(--px)), max(var(--fw), 1180px));margin:0 auto;padding:12px 0!important;gap:12px 14px;
    justify-content:stretch;align-content:center;align-items:stretch;
    grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:var(--fh) var(--ich, 180px);grid-template-areas:"board board board" "pl ev kf"}
  html:not(.rot) .app:has(:is(.review-card,.hint-card).show){grid-template-columns:minmax(0,.95fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.95fr);grid-template-areas:"board board board board" "pl ev rv kf"}
  /* the coach (coach.js) takes a wide column of the info row; switched off it stays as a narrow note */
  html:not(.rot) .app:has(> .side > .side-in > #coachCard:not(.hidden)){grid-template-columns:minmax(0,.9fr) minmax(0,1.7fr) minmax(0,.95fr) minmax(0,.9fr);grid-template-areas:"board board board board" "pl ck ev kf"}
  html:not(.rot) .app:has(> .side > .side-in > #coachCard.ck-off:not(.hidden)){grid-template-columns:minmax(0,1fr) minmax(0,.7fr) minmax(0,1.1fr) minmax(0,1fr)}
  html:not(.rot) .app:has(> .side > .side-in > #coachCard:not(.hidden)):has(:is(.review-card,.hint-card).show){grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr) minmax(0,.85fr) minmax(0,1.1fr) minmax(0,.8fr);grid-template-areas:"board board board board board" "pl ck ev rv kf"}
  #coachCard{grid-area:ck;overflow-y:auto;min-height:0;padding:12px 14px;scrollbar-width:thin}
  body:is(.in-lesson,.in-puzzle) .app{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr)!important;grid-template-areas:"board board" "pl ls"!important}
  .board-area{grid-area:board;justify-self:center;align-self:center;position:relative;z-index:1}
  .side, .side-in{display:contents}
  .side-in > .brand, .controls:not(.hb-menu), .info-line, .scroll-jump, .sbox{display:none!important}
  .players{grid-area:pl;display:flex;flex-direction:column;gap:6px;padding:10px 12px;min-height:0;overflow:hidden}
  .players .pl-head{display:flex;margin-bottom:2px}
  .players .pl-info{display:block;flex:none;font-size:11.5px;color:var(--dim);line-height:1.5;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #evalCard{grid-area:ev;display:flex;flex-direction:column;overflow:hidden;padding:12px 14px;min-height:0}
  #evalCard .graph{flex:1 1 0;height:0!important;min-height:22px}
  #evalCard .navbar{flex:none;margin-top:8px;gap:4px}
  #evalCard .navbar button{width:auto;flex:1 1 0;max-width:52px}
  .kifu-card{grid-area:kf;display:flex;flex-direction:column;overflow:hidden;padding:12px 14px;min-height:0}
  .kifu{flex:1 1 auto;min-height:0;overflow-y:auto}
  .review-card.show, .hint-card.show{grid-area:rv;display:flex;flex-direction:column;overflow:hidden;padding:12px 14px;min-height:0}
  #rvBody, #hintBody{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin}
  body.in-lesson .lesson-card, body.in-puzzle .puzzle-card{grid-area:ls;overflow-y:auto;min-height:0}
  :is(.lesson-card,.puzzle-card) .lesson-actions{flex-wrap:wrap}
  :is(.lesson-card,.puzzle-card) .lesson-actions button{flex:1 1 auto;white-space:nowrap;text-overflow:clip}
  /* compact player cards: name on the left, pips on the right, the status line under it */
  body:not(.has-clk):not(.in-online) .players .player{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:1px;padding:7px 12px;min-height:0}
  body:not(.has-clk):not(.in-online) .players .player > .top{grid-column:1;grid-row:1;min-width:0}
  body:not(.has-clk):not(.in-online) .players .player > .row{grid-column:2;grid-row:1;margin:0;text-align:end;align-items:baseline;gap:8px}
  body:not(.has-clk):not(.in-online) .players .player > .status{grid-column:1 / -1;grid-row:2}
  body:not(.has-clk):not(.in-online) .players .player > .status:empty{display:none}
  .players .count, .players [id^=pip]{font-size:clamp(20px, 1.6vw, 26px)}
  .players .count small{margin-left:3px}
}
/* phone layouts on a mouse (narrow / tall PC windows): no jump button (the page scrolls with the wheel), room above the online dock */

@media (hover: hover) and (pointer: fine) and (min-width: 1040px) and (min-aspect-ratio: 3/4){

  body.rvbox-on .rvbox{display:grid;grid-area:bx;justify-self:stretch;width:auto;height:auto;

  .rvbox .bx-l,.rvbox .bx-r{display:flex;flex-direction:column;min-height:0;min-width:0}

  .rvbox .bx-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex:none;min-height:28px}
  .rvbox .bx-h .label{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.06em}

  .rvbox .bx-load::after{content:"";display:inline-block;width:10px;height:10px;margin-inline-start:8px;border-radius:50%;border:2px solid var(--brass);border-top-color:transparent;animation:bxspin .8s linear infinite;vertical-align:-1px}
  @keyframes bxspin{to{transform:rotate(360deg)}}
  .rvbox .bx-ctl{display:flex;gap:6px}
  .rvbox .bx-ctl button{height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-family:inherit}
  .rvbox .bx-ctl button:hover:not(:disabled){border-color:var(--brass2)}

  .rvbox .bx-ctl button svg{width:14px;height:14px;fill:currentColor}
  .rvbox .bx-ctl #bxStudy{border-color:var(--brass2);color:var(--accent)}
  .rvbox .bx-ctl .bx-restore{background:var(--accent);border-color:var(--accent);color:#1a1206}

  .rvbox .tag.bad{color:#ff8b7d}.rvbox .tag.dubious{color:#f2c060}.rvbox .tag.best{color:#8fe3b8}.rvbox .tag.good{color:#9fc7ff}
  .rvbox .ls{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-inline-start:6px}
  .rvbox bdi.mv{font-family:'JetBrains Mono',monospace;font-weight:700}
  .bx-dice{display:inline-flex;gap:3px;direction:ltr}

  .bx-dsel .dg button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:700 12px 'JetBrains Mono',monospace;cursor:pointer;padding:0}
  .bx-dsel .dg button.sel{background:#f4ecd8;color:#2a1a08;border-color:#f4ecd8}
  .bx-dsel .bx-roll{height:24px;padding:0 10px;border-radius:7px;border:1px solid var(--brass2);background:rgba(226,194,117,.1);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .bx-c{display:grid;grid-template-columns:16px minmax(0,1.5fr) 54px 118px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:start;padding:3px 8px;min-height:27px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:var(--text);font-size:13px;cursor:pointer;flex:none;font-family:inherit}

  html[lang=ar] .rvbox .bx-body p, html[lang=ar] .rvbox .rv-cur{direction:rtl;text-align:right}
  /* larger, easier-to-read text (PC, 2026-10-28) */

  .bx-c{grid-template-columns:18px minmax(0,1.5fr) 60px 130px minmax(0,1fr) auto}

/* PC with a wide window (16:10 or wider, body.wide-side) or with the online dock open (little height is left), so the info goes beside the board again (board | a scrolling column:
   lesson / puzzle card, 対局者, 形勢, ヒント / 振り返り, 棋譜) — 棋譜 always stays visible; the review box (if on) shares that column */
@media (hover: hover) and (pointer: fine) and (min-width: 1040px) and (min-aspect-ratio: 3/4){
  body.wide-side{--rw:340px}
  @media (max-width: 1299px){ body.wide-side{--rw:310px} }
  @media (min-width: 1700px){ body.wide-side{--rw:380px} }
  body.dock-open:not(.ol-soon){--rw:330px}
  @media (max-width: 1299px){ body.dock-open:not(.ol-soon){--rw:310px} }
  html:not(.rot) :is(body.dock-open:not(.ol-soon), body.wide-side) .app{width:auto!important;justify-content:center!important;align-content:start!important;column-gap:16px!important;row-gap:10px!important;
    grid-template-columns:var(--fw) var(--rw)!important;grid-template-rows:var(--fh)!important;grid-template-areas:"board side"!important}
  html:not(.rot) :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .app{grid-template-rows:calc(var(--fh) * .6 - 5px) calc(var(--fh) * .4 - 5px)!important;grid-template-areas:"board side" "board bx"!important}
  @media (max-height: 1199px){ body.dock-open.rvbox-on:not(.ol-soon) .side-in > .players{display:none!important} }   /* short: 形勢 and 棋譜 first (turn and pips are in the header bar) */
  html :is(body.dock-open:not(.ol-soon), body.wide-side) .side{display:block!important;grid-area:side;height:0!important;min-height:100%!important;max-height:none!important;align-self:stretch!important;overflow-y:auto!important;scrollbar-width:thin}
  :is(body.dock-open:not(.ol-soon), body.wide-side) .side-in{display:flex!important;flex-direction:column;gap:10px;height:100%;min-height:0}   /* (fixed height: 棋譜 takes what is left and scrolls inside) */
  :is(body.dock-open:not(.ol-soon), body.wide-side) .side-in > *{flex:none!important}
  :is(body.dock-open:not(.ol-soon), body.wide-side) .side-in > :is(.review-card,.hint-card).show{max-height:150px}
  :is(body.dock-open:not(.ol-soon), body.wide-side) .side-in > .kifu-card{flex:1 1 0!important;min-height:96px!important;overflow:hidden}
  :is(body.dock-open:not(.ol-soon), body.wide-side) .side-in > .kifu-card .kifu{flex:1 1 auto;min-height:0;overflow-y:auto}
  :is(body.dock-open:not(.ol-soon), body.wide-side) .side-in > #coachCard:not(.hidden):not(.ck-off){flex:2.4 1 0!important;min-height:240px;overflow-y:auto;scrollbar-width:thin}
  :is(body.dock-open:not(.ol-soon), body.wide-side) .side-in:has(> #coachCard:not(.hidden):not(.ck-off)) > #evalCard .graph{display:none}
  body.dock-open:not(.ol-soon) .players .pl-head, body.dock-open:not(.ol-soon) .players .pl-info{display:none!important}
  body.dock-open:not(.ol-soon) .players .player{padding:4px 12px!important}
  html.dock-compact body.dock-open:not(.ol-soon) .side #graph{display:none!important}   /* short window: no graph, so 棋譜 fits */
  @media (min-height: 1000px){ html.dock-compact body.dock-open:not(.ol-soon) .side #graph{display:block!important;flex:none!important;height:50px!important} }
  /* with the review box in the column too: 対局者 → 形勢 → 棋譜 (scrolls inside); the box below has the commentary, the summary card steps aside */
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .side-in > .players{order:1}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .side-in > #evalCard{order:2}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .side-in > .kifu-card{order:3;min-height:72px!important}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .side-in > .review-card{display:none!important}
  html.dock-compact body.dock-open.rvbox-on:not(.ol-soon) .side #graph{display:none!important}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .board-area{align-self:center}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .rvbox{grid-template-columns:minmax(0,1fr)!important;align-content:start;overflow-y:auto;padding:10px 12px!important;gap:8px!important}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .rvbox .bx-r{border-inline-start:none;padding-inline-start:0}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .rvbox .bx-body{flex:none;overflow:visible}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .rvbox{grid-auto-rows:max-content}
  :is(body.dock-open.rvbox-on:not(.ol-soon), body.wide-side.rvbox-on) .rvbox :is(.bx-l,.bx-r){min-height:auto!important;height:auto!important}
}
/* review commentary (all layouts) */
.rv-cur{margin:10px 0 4px;padding:10px 12px;border-radius:12px;border:1px solid rgba(201,169,97,.35);background:linear-gradient(160deg,rgba(201,169,97,.10),rgba(0,0,0,.18))}
.rv-cur .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rv-cur .h b{color:var(--accent);font-size:13px;letter-spacing:.06em}
.rv-cur .h .tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.rv-cur .tag.bad{color:#ff8b7d}.rv-cur .tag.dubious{color:#f2c060}.rv-cur .tag.ok{color:#8fe3b8}
.rv-cur .mvs{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 6px;font-size:14px;align-items:baseline}
.rv-cur .mvs span{color:var(--dim);font-size:12px;white-space:nowrap}
.rv-cur .mvs bdi{font-size:14.5px}
.rv-cur .mvs .bst{color:var(--accent)}.rv-cur .mvs .pld{color:#ffb3a8}
.rv-cur ul{list-style:none;display:grid;gap:6px;margin:6px 0 0}
.rv-cur li{position:relative;padding-left:16px;font-size:14.5px;line-height:1.7;color:#dfe7e2}
.rv-cur li::before{content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.rv-cur li.num{color:var(--muted);font-size:13px;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace}

(function () {
  if (!/[?&]skin=atlas\b/.test(location.search)) return;
  document.documentElement.classList.add('atlas-skin');
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '../atlas/skin/skin.css?v=22'; document.head.appendChild(css);
  const f = document.createElement('link'); f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@600;700&display=swap'; document.head.appendChild(f);
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  if (window.AtlasLoading) { AtlasLoading.show(); setTimeout(() => AtlasLoading.hide(), 12000); }   // safety net
  load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js').then(() => load('../atlas/table3d.js?v=68')).then(() => load('../atlas/skin/common.js?v=10')).then(() => load('../atlas/models/backgammon.js?v=5')).then(() => load('../atlas/skin/backgammon.js?v=4'))
    .catch(() => { document.documentElement.classList.remove('atlas-skin'); if (window.AtlasLoading) AtlasLoading.hide(); });
})();
</script>
