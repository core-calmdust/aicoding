<style>
:root{
  --bg:#0b1110; --bg2:#121b19; --panel:#141f1c; --panel2:#1a2724; --line:#26372f;
  --text:#e8eee9; --muted:#8fa39a; --dim:#5d7068;
  --brass:#c9a961; --brass2:#8e7440; --accent:#e2c275; --red:#ff6b5b; --good:#7fd6a4;
  --gold1:#fff6dc; --gold2:#e6cd8c; --gold3:#b39249; --gold4:#5e4720;
  --onyx1:#7b808a; --onyx2:#33363d; --onyx3:#16181c; --onyx4:#050506;
  --vh: 100vh; --vw: 100vw;
  --pad: clamp(24px, 5vmin, 72px);
  --gap: clamp(20px, 2.6vw, 44px);
  --u: min((var(--vh) - var(--pad) * 2) / 12, (var(--vw) - var(--pad) * 2 - var(--gap) - 360px) / 15.85, 70px);
  --fw: calc(var(--u) * 15.85);
  --fh: calc(var(--u) * 12);
}
*{box-sizing:border-box;margin:0;padding:0}
@supports (height:100dvh){:root{--vh:100dvh}}
/* forced landscape on a portrait phone: rotate the whole page 90deg (fixed overlays rotate with it) */
html.rot{--vh:100vw;--vw:100vh}
@supports (height:100dvh){html.rot{--vw:100dvh}}
html.rot body{position:fixed;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg);overflow:hidden}
.snd.land{display:none}
@media (pointer: coarse){.snd.land{display:inline-flex}}
.snd.land.on{color:var(--accent);border-color:rgba(201,169,97,.6)}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(1200px 700px at 30% -10%, #1b2b26 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #16231f 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Zen Kaku Gothic New','Noto Sans Devanagari','Noto Sans Arabic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.app{height:var(--vh);display:grid;grid-template-columns:auto minmax(330px, 500px);grid-template-areas:"board side";gap:var(--gap);justify-content:center;align-items:center;padding:var(--pad)}
/* ---------------------------------------------------------------- board */
.board-area{grid-area:board;display:flex;flex-direction:column;align-items:center}
.frame{position:relative;width:var(--fw);height:var(--fh);user-select:none;-webkit-user-select:none;touch-action:none;border-radius:calc(var(--u)*.28);box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(201,169,97,.3)}
.frame > svg.bd{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:inherit}
.layer{position:absolute;inset:0;pointer-events:none}
.ck{position:absolute;width:calc(var(--u)*.94);height:calc(var(--u)*.94);margin:calc(var(--u)*-.47) 0 0 calc(var(--u)*-.47);border-radius:50%;will-change:transform;pointer-events:none}
.ck::before{content:"";position:absolute;inset:17%;border-radius:50%}
.ck.p0{background:conic-gradient(from 200deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.25) 40deg,rgba(255,255,255,0) 90deg,rgba(255,255,255,0) 220deg,rgba(255,255,255,.14) 260deg,rgba(255,255,255,0) 300deg),radial-gradient(circle at 34% 28%,var(--gold1) 0%,var(--gold2) 26%,var(--gold3) 68%,var(--gold4) 100%);box-shadow:0 calc(var(--u)*.05) calc(var(--u)*.08) rgba(0,0,0,.55),inset 0 calc(var(--u)*-.06) calc(var(--u)*.1) rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,240,200,.4)}
.ck.p0::before{box-shadow:inset 0 2px 3px rgba(80,58,20,.45),0 1px 0 rgba(255,250,230,.5);border:1px solid rgba(120,92,40,.25)}
.ck.p1{background:conic-gradient(from 200deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.16) 40deg,rgba(255,255,255,0) 90deg,rgba(255,255,255,0) 220deg,rgba(255,255,255,.08) 260deg,rgba(255,255,255,0) 300deg),radial-gradient(circle at 34% 28%,var(--onyx1) 0%,var(--onyx2) 28%,var(--onyx3) 70%,var(--onyx4) 100%);box-shadow:0 calc(var(--u)*.05) calc(var(--u)*.08) rgba(0,0,0,.6),inset 0 calc(var(--u)*-.06) calc(var(--u)*.1) rgba(0,0,0,.5),inset 0 0 0 1.5px rgba(205,210,220,.55)}
.ck.p1::before{box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.18);border:1px solid rgba(200,205,215,.22)}
.ck b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:calc(var(--u)*.36);z-index:2}
.ck.p0 b{color:#3d2c0c}.ck.p1 b{color:#e8eaee}
.ck.movable{box-shadow:0 0 0 2px rgba(226,194,117,.55),0 0 calc(var(--u)*.25) rgba(226,194,117,.35),0 calc(var(--u)*.05) calc(var(--u)*.08) rgba(0,0,0,.55)}
.ck.sel{box-shadow:0 0 0 3px #fff3cf,0 0 calc(var(--u)*.4) rgba(255,236,170,.85)}
.ck.last::after{content:"";position:absolute;left:50%;top:50%;width:14%;height:14%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 5px rgba(255,255,255,.8);z-index:3}
.ck.p0.last::after{background:rgba(70,48,10,.75);box-shadow:none}
.ck.drag{z-index:40;transition:none;filter:drop-shadow(0 calc(var(--u)*.25) calc(var(--u)*.2) rgba(0,0,0,.6));transform:scale(1.08)}
.ck.flying{z-index:30}
.slab{position:absolute;width:calc(var(--u)*1.0);height:calc(var(--u)*.25);margin-left:calc(var(--u)*-.5);border-radius:calc(var(--u)*.06);pointer-events:none}
.slab.p0{background:linear-gradient(180deg,var(--gold1),var(--gold2) 35%,var(--gold3) 80%,var(--gold4));box-shadow:0 1px 1px rgba(0,0,0,.5)}
.slab.p1{background:linear-gradient(180deg,#8a8f99,var(--onyx2) 35%,var(--onyx3) 80%,#000);box-shadow:0 1px 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(200,205,215,.25)}
.dst{position:absolute;width:calc(var(--u)*.94);height:calc(var(--u)*.94);margin:calc(var(--u)*-.47) 0 0 calc(var(--u)*-.47);border-radius:50%;border:2px solid rgba(255,236,170,.95);box-shadow:0 0 calc(var(--u)*.3) rgba(255,226,140,.8),inset 0 0 calc(var(--u)*.2) rgba(255,226,140,.5);animation:dstp 1.1s ease-in-out infinite;pointer-events:none}
.dst.far{border-style:dashed;border-color:rgba(255,236,170,.7);box-shadow:none;animation:none}
.dst.hitd{border-color:#ffb3a8;box-shadow:0 0 calc(var(--u)*.3) rgba(255,120,100,.8)}
@keyframes dstp{50%{transform:scale(1.06);box-shadow:0 0 calc(var(--u)*.45) rgba(255,226,140,1),inset 0 0 calc(var(--u)*.25) rgba(255,226,140,.7)}}
.ptglow{position:absolute;width:calc(var(--u)*1);pointer-events:none;background:linear-gradient(var(--dir,180deg),rgba(255,226,140,.0),rgba(255,226,140,.16) 30%,rgba(255,226,140,.0));border-radius:6px}
.trayglow{position:absolute;border-radius:calc(var(--u)*.15);box-shadow:inset 0 0 0 2px rgba(255,236,170,.9),0 0 calc(var(--u)*.3) rgba(255,226,140,.6);background:rgba(255,226,140,.08);animation:dstp 1.1s ease-in-out infinite;pointer-events:none}
.die{position:absolute;width:calc(var(--u)*var(--ds,.82));height:calc(var(--u)*var(--ds,.82));margin:calc(var(--u)*var(--ds,.82)*-.5) 0 0 calc(var(--u)*var(--ds,.82)*-.5);border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--u)*var(--ds,.82)*.12);transition:opacity .25s,filter .25s}
.die.p0{background:linear-gradient(145deg,#fffaf0,#efe4cc 55%,#cdbf9e);box-shadow:0 calc(var(--u)*.08) calc(var(--u)*.14) rgba(0,0,0,.55),inset 0 -2px 3px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.die.p1{background:linear-gradient(145deg,#3d4148,#202328 55%,#0e0f12);box-shadow:0 calc(var(--u)*.08) calc(var(--u)*.14) rgba(0,0,0,.6),inset 0 -2px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)}
.die i{width:72%;height:72%;margin:auto;border-radius:50%;visibility:hidden}
.die.p0 i{background:radial-gradient(circle at 40% 35%,#6b2420,#3a0f0c)}
.die.p1 i{background:radial-gradient(circle at 40% 35%,#f4e7c5,#c9a961)}
.die i.on{visibility:visible}
.die.used{opacity:.32;filter:grayscale(.6)}
.cube{position:absolute;width:calc(var(--u)*.86);height:calc(var(--u)*.86);margin:calc(var(--u)*-.43) 0 0 calc(var(--u)*-.43);border-radius:16%;background:linear-gradient(145deg,#f3dc9a,#c9a961 50%,#8e7440);box-shadow:0 calc(var(--u)*.06) calc(var(--u)*.12) rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 3px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:calc(var(--u)*.36);color:#2a1e08;transition:left .45s cubic-bezier(.3,.7,.3,1),top .45s cubic-bezier(.3,.7,.3,1),transform .3s;pointer-events:none;z-index:5}
.cube.offer{animation:cubeOffer 1s ease-in-out infinite}
@keyframes cubeOffer{50%{transform:scale(1.12) rotate(6deg);box-shadow:0 0 calc(var(--u)*.45) rgba(255,226,140,.9)}}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25;overflow:visible}
.arrows > path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.bbtns{position:absolute;z-index:35;display:flex;gap:calc(var(--u)*.18);transform:translate(-50%,-50%);pointer-events:auto;flex-wrap:nowrap}
.bbtn{padding:calc(var(--u)*.16) calc(var(--u)*.3);min-width:calc(var(--u)*1.7);border-radius:calc(var(--u)*.5);font-size:max(12px,calc(var(--u)*.3));font-weight:700;letter-spacing:.06em;white-space:nowrap;background:rgba(8,14,12,.82);color:var(--text);border:1px solid rgba(201,169,97,.55);box-shadow:0 8px 20px rgba(0,0,0,.45);backdrop-filter:blur(4px);transition:transform .15s,background .15s}
.bbtn:hover{transform:translateY(-1px);background:rgba(20,30,26,.92)}
.bbtn.go{background:linear-gradient(180deg,#e2c275,#a98a48);color:#1b150a;border-color:transparent}
.bbtn.red{border-color:rgba(255,107,91,.6);color:#ffc4bd}
.bbtn:disabled{opacity:.4;pointer-events:none}
.toast{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%) scale(.9);z-index:45;background:rgba(10,16,14,.9);backdrop-filter:blur(6px);border:1px solid rgba(201,169,97,.45);color:var(--text);padding:12px 22px;border-radius:12px;font-weight:700;letter-spacing:.06em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.coach{position:absolute;left:50%;top:calc(var(--u)*.9);transform:translate(-50%,-6px);z-index:44;padding:6px 14px;border-radius:10px;font-size:13px;font-weight:700;background:rgba(10,16,14,.92);border:1px solid var(--line);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.coach.show{opacity:1;transform:translate(-50%,0)}
.coach.q-best{border-color:#6fd3a0;color:#b8f0d2}.coach.q-good{border-color:#9fc7ff;color:#d3e5ff}.coach.q-dubious{border-color:#f2c060;color:#ffe2a6}.coach.q-bad{border-color:#ff6b5b;color:#ffc4bd}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:'JetBrains Mono',monospace;font-size:calc(var(--u)*.24);color:rgba(226,194,117,.62);pointer-events:none;white-space:nowrap}
.lbl.pip{font-size:calc(var(--u)*.26);color:rgba(255,246,220,.82);font-weight:700}
.dicehint{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*.24);color:rgba(255,246,220,.75);pointer-events:none;white-space:nowrap;letter-spacing:.05em}
/* ---------------------------------------------------------------- side */
.side{grid-area:side;width:100%;height:var(--fh);min-height:0;max-height:calc(var(--vh) - var(--pad) * 2);container-type:inline-size}
.side-in{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(17px, calc((100cqw - 200px) / 8.6), 30px);letter-spacing:.08em;white-space:nowrap;min-width:0;flex:1 1 auto;overflow:hidden}
.brand h1 small{font-size:12px;letter-spacing:.3em;color:var(--brass);margin-left:8px;font-family:'Zen Kaku Gothic New';font-weight:500}
.brand-r{display:flex;align-items:center;gap:8px;flex:none}
#langSel{background:rgba(0,0,0,.25);color:var(--muted);border:1px solid var(--line);border-radius:7px;font:inherit;font-size:11px;padding:3px 4px;cursor:pointer;max-width:96px}
#langSel:hover{color:var(--text)}
.snd{width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim)}
.snd:hover{color:var(--text)}
a.snd.home{text-decoration:none}
.snd svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .off-x{display:none}
.snd.on{color:var(--accent);border-color:rgba(201,169,97,.5)}
.snd:not(.on) .on-w{display:none}
.snd:not(.on) .off-x{display:inline}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.player{position:relative;border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.18);border:1px solid transparent;transition:border-color .25s,background .25s;min-width:0}
.player.active{border-color:rgba(201,169,97,.6);background:rgba(201,169,97,.07)}
.player.won{border-color:rgba(127,214,164,.7);background:rgba(127,214,164,.08)}
.player .top{display:flex;align-items:center;gap:8px;min-width:0}
.pdisc{width:18px;height:18px;border-radius:50%;flex:none;display:inline-block;vertical-align:middle}
.pdisc.p0{background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 35%,var(--gold3) 85%)}
.pdisc.p1{background:radial-gradient(circle at 35% 30%,var(--onyx1),var(--onyx2) 40%,var(--onyx3) 85%);box-shadow:inset 0 0 0 1.5px rgba(205,210,220,.6)}
.player .name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:2px}
.player .count{font-family:'Shippori Mincho B1',serif;font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.player .count small{font-size:11px;color:var(--dim);font-family:'Zen Kaku Gothic New';font-weight:500;margin-left:5px;letter-spacing:.05em}
.player .score{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);white-space:nowrap}
.player .score small{color:var(--dim);font-size:11px}
.player .status{font-size:11px;color:var(--dim);height:15px;font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player.thinking .status{color:var(--accent)}
.player.thinking .pdisc{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(226,194,117,.25)}}
.evalrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.evalrow .label{font-size:12px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}
.evalrow .val{font-family:'JetBrains Mono','Zen Kaku Gothic New',monospace;font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evalbar{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#3a3e46,#202328);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(205,210,220,.15)}
.evalbar .fill{position:absolute;inset:0 auto 0 0;width:50%;background:linear-gradient(90deg,var(--gold3),var(--gold2));transition:width .5s ease}
.evalbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.6)}
.graph{touch-action:none;user-select:none;-webkit-user-select:none;margin-top:8px;width:100%;height:clamp(40px, calc(var(--vh) * .08), 80px);display:block;cursor:pointer}
.graph .zero{stroke:rgba(201,169,97,.35);stroke-dasharray:2 3}
.graph .cur{stroke:var(--accent);stroke-width:1}
.graph .sep{stroke:rgba(255,255,255,.18)}
.navbar{display:flex;justify-content:center;gap:6px;margin-top:8px}
.navbar button{width:40px;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--muted);display:flex;align-items:center;justify-content:center}
.navbar button:hover{color:var(--text);border-color:rgba(201,169,97,.5)}
.navbar button:disabled{opacity:.35;pointer-events:none}
.navbar button svg{width:16px;height:16px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navbar .i-pause{display:none}.navbar button.playing .i-pause{display:block}.navbar button.playing .i-play{display:none}
.navbar button.playing{color:var(--accent);border-color:rgba(201,169,97,.6)}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px}
.btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:12px;color:var(--muted);transition:border-color .2s,color .2s,background .2s;white-space:nowrap;min-width:0;overflow:hidden}
.btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover:not(:disabled){border-color:var(--brass2);color:var(--text)}
.btn.on{color:var(--accent);border-color:rgba(201,169,97,.6);background:rgba(201,169,97,.08)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{color:var(--text)}
.kifu-card{flex:1;min-height:92px;display:flex;flex-direction:column}
.hint-card.show{flex:0 1 auto;min-height:min(150px, 15vh);overflow:hidden;flex-direction:column}
@media (max-height: 800px) and (pointer: fine){ .side-in:has(.hint-card.show) .graph, .side-in:has(.review-card.show) .graph{height:30px} }
#hintBody{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.kifu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
.kifu-head .label{font-size:12px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}
.kifu-head button{font-size:11px;color:var(--dim);padding:2px 6px;border-radius:5px;white-space:nowrap}
.kifu-head button:hover{color:var(--text)}
.kifu-head .kb{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}

.lesson-list{display:grid;gap:8px}
.lesson-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);text-align:left;color:var(--text);width:100%}

.lt-modal{width:min(360px,100%);text-align:center}

}
/* phone landscape header: room for the title next to four controls */
@media (min-aspect-ratio: 1/1) and (pointer: coarse) and (max-height: 560px){ .brand-r{gap:5px} #langSel{max-width:76px} .brand h1{letter-spacing:.02em;font-size:15px} .brand h1 small{display:none} }
html.rot .brand-r{gap:5px} html.rot #langSel{max-width:76px} html.rot .brand h1{letter-spacing:.02em;font-size:15px} html.rot .brand h1 small{display:none}
/* forced landscape (CSS-rotated app on a portrait phone): same rules as phone landscape */
@media (pointer: coarse){
  /* phone landscape */
  html.rot{--u:min((var(--vh) - 14px) / 12, (var(--vw) - 290px) / 15.85, 60px)}
  html.rot .app{padding:7px max(10px, env(safe-area-inset-right)) 7px max(10px, env(safe-area-inset-left));gap:12px;grid-template-columns:auto minmax(220px, 340px)}
  html.rot .side{max-height:calc(var(--vh) - 14px);height:calc(var(--vh) - 14px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  html.rot .side::-webkit-scrollbar{display:none}
  html.rot .side-in{gap:7px;height:auto}
  html.rot .kifu-card{flex:none;min-height:110px}
  html.rot .kifu{max-height:none;overflow:visible}
  html.rot .review-card.show{flex:none;overflow:visible}
  html.rot #rvBody, html.rot #hintBody{overflow:visible}
  html.rot .hint-card.show{min-height:0}
  html.rot .lesson-card, html.rot .puzzle-card{flex:none;overflow:visible}
  html.rot .brand{align-items:center}
  html.rot .brand h1{font-size:16px;letter-spacing:.06em}
  html.rot .brand h1 small{font-size:10px;margin-left:5px}
  html.rot .card{padding:8px 10px;border-radius:12px}
  html.rot .players{gap:6px;padding:6px}
  html.rot .player{padding:5px 8px;border-radius:9px}
  html.rot .player .name{font-size:11px}
  html.rot .player .count{font-size:18px}
  html.rot .evalrow{margin-bottom:5px}
  html.rot .evalbar{height:6px}
  html.rot .graph{height:50px;margin-top:6px}
  html.rot .controls{gap:5px;padding:6px}
  html.rot .btn{flex-direction:row;justify-content:center;gap:4px;padding:6px 2px;font-size:10px;border-radius:8px}
  html.rot .btn span{display:none}
  html.rot .btn svg{width:16px;height:16px}
  html.rot .info-line{display:none}
  html.rot .lesson-prompt{font-size:14px}html.rot .lesson-fb, html.rot .pz-status{font-size:13.5px}
}
@media (min-height: 561px){
@container (min-width: 420px){
  html:not(.rot) #evalCard{flex:1 1 0;display:flex;flex-direction:column;min-height:120px}
  html:not(.rot) #evalCard .graph{flex:1;height:auto;min-height:40px}
  html:not(.rot) .kifu-card{flex:1 1 0}
  html:not(.rot) .side-in:has(.review-card.show) #evalCard{flex:.5 1 0;min-height:96px}
  html:not(.rot) .side-in:has(.review-card.show) #evalCard .graph{min-height:24px}
  html:not(.rot) .side-in:has(.hint-card.show) #evalCard{flex:.6 1 0}
  html:not(.rot) .player .count{font-size:clamp(30px, 4.2cqw, 46px)}
  html:not(.rot) .brand h1{font-size:clamp(18px, calc((100cqw - 200px) / 8.6), 40px)}
}
}
/* PC: wide lesson / puzzle dialogs */
@media (min-width: 900px) and (min-height: 561px) and (pointer: fine){
  #lessonOverlay .modal{width:min(860px, calc(100vw - 64px))}
  #lessonOverlay .modal:has(> #lessonListView:not(.hidden)), #puzzleOverlay .modal:has(> #pzListView:not(.hidden)), #puzzleOverlay .modal:has(> #pzGridView:not(.hidden)){width:min(1080px, calc(100vw - 64px))}
  #lessonOverlay .lesson-list, #puzzleOverlay .lesson-list{grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px}
  #lessonOverlay .lesson-list > p, #puzzleOverlay .lesson-list > p{grid-column:1 / -1}
  #puzzleOverlay .lesson-list > .daily{grid-column:1 / -1}
  .pz-grid{grid-template-columns:repeat(10, 1fr)}
  #newOverlay .modal{width:min(560px,100%)}
}
.brand-l{display:flex;flex-direction:column;min-width:0}
.brand a.series{font-family:'Zen Kaku Gothic New','Noto Sans Devanagari','Noto Sans Arabic',sans-serif;font-size:10.5px;letter-spacing:.3em;color:var(--brass);opacity:.85;margin:0 0 3px 2px;white-space:nowrap;text-decoration:none}
.brand a.series:hover{opacity:1;color:var(--accent)}
.brand:has(.brand-l){align-items:flex-end}
@media (pointer: coarse) and (max-width: 900px){ .brand a.series{display:none} .brand:has(.brand-l){align-items:center} }
</style>
</head>
<body>
<div class="app">
  <div class="board-area">
    <div class="frame" id="frame">
      <svg class="bd" id="boardSvg" viewBox="0 0 1585 1200" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="layer" id="glowLayer"></div>
      <div class="layer" id="lblLayer"></div>
      <div class="layer" id="ckLayer"></div>
      <div class="layer" id="dstLayer"></div>
      <div class="layer" id="diceLayer"></div>
      <div class="cube" id="cube">64</div>
      <svg class="arrows" id="arrows" viewBox="0 0 1585 1200" preserveAspectRatio="none"></svg>
      <div class="bbtns" id="bbtns"></div>
      <div class="coach" id="coach"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <aside class="side"><div class="side-in">
    <div class="brand">
      <div class="brand-l"><a class="series" href="../" data-i18n="series">世界のボドゲ大全</a><h1><span data-i18n="title"></span><small>V2</small></h1></div>
      <span class="brand-r"><button id="btnSound" class="snd" data-i18n-title="btn.sound.title" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on-w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off-x" d="M16 9l6 6M22 9l-6 6"/></svg></button><select id="langSel" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh">中文</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select><button id="btnLand" class="snd land" data-i18n-title="land.title" aria-label="Landscape"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 4.5h6M17 21a4 4 0 0 0 3-3"/><path d="M19.5 16.5 20 18l1.5-.5"/></svg></button><a href="../" class="snd home" data-i18n-title="back" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a></span>
    </div>

    <div class="card lesson-card" id="lessonCard">
      <div class="lh"><span class="lt" id="lsStep"></span><div class="dots" id="lsDots"></div></div>
      <h3 id="lsTitle"></h3>
      <div class="lesson-prompt" id="lsPrompt"></div>
      <div id="lsChoices" class="choices"></div>
      <div class="lesson-fb" id="lsFb"></div>
      <div class="lesson-actions">
        <button id="lsHint" data-i18n="ls.hint"></button>
        <button id="lsNext" class="go"></button>
        <button id="lsQuit" data-i18n="ls.quit"></button>
      </div>
    </div>
    <div class="card puzzle-card" id="puzzleCard">
      <div class="lh"><span class="lt" id="pzStep"></span></div>
      <h3 id="pzTitle"></h3>
      <div class="pz-goal" id="pzGoal"></div>
      <div class="pz-status" id="pzStatus"></div>
      <div class="lesson-actions">
        <button id="pzHint" data-i18n="ls.hint"></button>
        <button id="pzRetry" data-i18n="pz.retry"></button>
        <button id="pzAnswer" data-i18n="pz.answer"></button>
      </div>
      <div class="lesson-actions">
        <button id="pzNext" class="go" data-i18n="pz.next"></button>
        <button id="pzList" data-i18n="pz.list"></button>
        <button id="pzQuit" data-i18n="ls.quit"></button>
      </div>
    </div>

    <div class="card players">
      <div class="player" id="pl0">
        <div class="top"><span class="pdisc p0"></span><div class="name" id="name0"></div></div>
        <div class="row"><div class="count"><span id="pip0">167</span><small data-i18n="pips"></small></div><div class="score" id="score0"></div></div>
        <div class="status" id="status0"></div>
      </div>
      <div class="player" id="pl1">
        <div class="top"><span class="pdisc p1"></span><div class="name" id="name1"></div></div>
        <div class="row"><div class="count"><span id="pip1">167</span><small data-i18n="pips"></small></div><div class="score" id="score1"></div></div>
        <div class="status" id="status1"></div>
      </div>
    </div>

    <div class="card" id="evalCard">
      <div class="evalrow"><span class="label" data-i18n="eval"></span><span class="val" id="evalText">—</span></div>
      <div class="evalbar"><div class="fill" id="evalFill"></div><div class="mid"></div></div>
      <svg class="graph" id="graph" viewBox="0 0 300 74" preserveAspectRatio="none"></svg>
      <div class="navbar" id="navBar">
        <button data-n="first" data-i18n-title="nav.first"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 6 10 12l8 6z"/></svg></button>
        <button data-n="prev" data-i18n-title="nav.prev"><svg viewBox="0 0 24 24"><path d="M15 6 8 12l7 6z"/></svg></button>
        <button data-n="play" id="navPlay" data-i18n-title="nav.play"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
        <button data-n="next" data-i18n-title="nav.next"><svg viewBox="0 0 24 24"><path d="M9 6l7 6-7 6z"/></svg></button>
        <button data-n="last" data-i18n-title="nav.last"><svg viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M6 6l8 6-8 6z"/></svg></button>
      </div>
    </div>

    <div class="card controls">
      <button class="btn primary" id="btnNew" data-i18n-title="btn.new.title"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="btn.new"></span></button>
      <button class="btn" id="btnUndo" data-i18n-title="btn.undo.title"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="btn.undo"></span></button>
      <button class="btn" id="btnHint" data-i18n-title="btn.hint.title"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg><span data-i18n="btn.hint"></span></button>
      <button class="btn" id="btnLesson" data-i18n-title="btn.lesson.title"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v6"/></svg><span data-i18n="btn.lesson"></span></button>
      <button class="btn" id="btnPuzzle" data-i18n-title="btn.puzzle.title"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span data-i18n="btn.puzzle"></span></button>
    </div>

    <div class="card hint-card" id="hintCard">
      <div class="kifu-head"><span class="label" data-i18n="hint.title"></span><button id="hintClose" data-i18n="close"></button></div>
      <div id="hintBody"></div>
    </div>
    <div class="card review-card" id="reviewCard">
      <div class="kifu-head"><span class="label" data-i18n="rv.title"></span><button id="rvClose" data-i18n="close"></button></div>
      <div id="rvBody"></div>
    </div>
    <div class="card kifu-card">
      <div class="kifu-head"><span class="label" data-i18n="kifu"></span><span class="kb"><button id="btnAnalyze" data-i18n="rv.btn" data-i18n-title="rv.btn.title"></button><button id="btnShare" data-i18n="share" data-i18n-title="share.title"></button><button id="btnPaste" data-i18n="paste" data-i18n-title="paste.title"></button><button id="btnCopy" data-i18n="copy" data-i18n-title="copy.title"></button></span></div>
      <div class="kifu" id="kifu"></div>
    </div>
    <div class="info-line" id="infoLine"></div>
  </div></aside>
</div>

<!-- new game -->
<div class="overlay" id="newOverlay">
  <div class="modal">
    <h2 data-i18n="ng.title"></h2>
    <div class="field">
      <label data-i18n="ng.mode"></label>
      <div class="seg" id="segMode">
        <button data-v="ai" data-i18n="ng.ai"></button>
        <button data-v="pvp" data-i18n="ng.pvp"></button>
        <button data-v="watch" data-i18n="ng.watch"></button>
        <button data-v="lesson" data-i18n="ng.lesson"></button>
        <button data-v="puzzle" data-i18n="ng.puzzle"></button>
      </div>
    </div>
    <div class="field hidden" id="fInfo"><p style="font-size:13px;color:var(--muted);line-height:1.7" id="fInfoText"></p></div>
    <div class="field" id="fColor">
      <label data-i18n="ng.color"></label>
      <div class="seg" id="segColor">
        <button data-v="0" data-i18n="ng.gold"></button>
        <button data-v="1" data-i18n="ng.black"></button>
        <button data-v="2" data-i18n="ng.random"></button>
      </div>
    </div>
    <div class="field" id="fLevel">
      <label id="levelLabel"></label>
      <div class="level-wrap">
        <input type="range" min="1" max="10" step="1" id="levelRange">
        <div class="level-name" id="levelName"></div>
      </div>
    </div>
    <div class="field hidden" id="fLevel2">
      <label data-i18n="ng.level2"></label>
      <div class="level-wrap">
        <input type="range" min="1" max="10" step="1" id="levelRange2">
        <div class="level-name" id="levelName2"></div>
      </div>
    </div>
    <div class="field" id="fMatch">
      <label data-i18n="ng.match"></label>
      <div class="seg" id="segMatch">
        <button data-v="0" data-i18n="ng.single"></button>
        <button data-v="3" data-i18n="ng.m3"></button>
        <button data-v="5" data-i18n="ng.m5"></button>
        <button data-v="7" data-i18n="ng.m7"></button>
      </div>
    </div>
    <div class="field" id="fDisplay">
      <label data-i18n="ng.options"></label>
      <div class="checks">
        <label><input type="checkbox" id="optCube"><span data-i18n="opt.cube"></span></label>
        <label><input type="checkbox" id="optEval"><span data-i18n="opt.eval"></span></label>
        <label><input type="checkbox" id="optForced"><span data-i18n="opt.forced"></span></label>
        <label><input type="checkbox" id="optRoll"><span data-i18n="opt.roll"></span></label>
        <label><input type="checkbox" id="optCoach"><span data-i18n="opt.coach"></span></label>
        <label><input type="checkbox" id="optAnim"><span data-i18n="opt.anim"></span></label>
      </div>
    </div>
    <div class="field" id="fSeed">
      <label data-i18n="ng.seed"></label>
      <div class="seedrow"><input id="seedInput" maxlength="24" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-ph="ng.seedPh"></div>
      <div class="small-note" data-i18n="ng.seedNote"></div>
    </div>
    <div class="modal-actions">
      <button class="mbtn" id="btnCancelNew" data-i18n="close"></button>
      <button class="mbtn go" id="btnStart" data-i18n="start"></button>
    </div>
  </div>
</div>

<!-- lessons -->
<div class="overlay" id="lessonOverlay">
  <div class="modal">
    <div id="lessonListView">
      <div class="seg ls-tabs"><button data-v="lesson" data-i18n="tab.lesson"></button><button data-v="puzzle" data-i18n="tab.puzzle"></button></div>
      <h2 data-i18n="ls.title"></h2>
      <p style="font-size:13px;color:var(--muted);margin:-6px 0 14px;line-height:1.7" data-i18n="ls.desc"></p>
      <div class="lesson-list" id="lessonList"></div>
      <div class="modal-actions"><button class="mbtn" id="btnLessonClose" data-i18n="close"></button></div>
    </div>
    <div id="lessonIntroView" class="hidden">
      <div class="lt" id="liStep"></div>
      <h2 id="liTitle" style="margin-top:4px"></h2>
      <div class="lesson-intro" id="liBody"></div>
      <div class="modal-actions"><button class="mbtn" id="btnLessonBack" data-i18n="ls.back"></button><button class="mbtn go" id="btnLessonStart" data-i18n="ls.start"></button></div>
    </div>
    <div id="lessonDoneView" class="hidden">
      <div class="result-big" id="ldTitle"></div>
      <div class="result-sub" id="ldSub" style="font-size:14px"></div>
      <div class="modal-actions"><button class="mbtn" id="btnLessonQuit2" data-i18n="ls.toGame"></button><button class="mbtn" id="btnLessonRetry" data-i18n="ls.retry"></button><button class="mbtn go" id="btnLessonNextStep" data-i18n="ls.nextStep"></button></div>
    </div>
  </div>
</div>

<!-- puzzles -->
<div class="overlay" id="puzzleOverlay">
  <div class="modal">
    <div id="pzListView">
      <div class="seg ls-tabs"><button data-v="lesson" data-i18n="tab.lesson"></button><button data-v="puzzle" data-i18n="tab.puzzle"></button></div>
      <h2 data-i18n="pz.title"></h2>
      <p style="font-size:13px;color:var(--muted);margin:-6px 0 14px;line-height:1.7" data-i18n="pz.desc"></p>
      <div class="lesson-list" id="pzLevels"></div>
      <div class="modal-actions"><button class="mbtn" id="pzClose" data-i18n="close"></button></div>
    </div>
    <div id="pzGridView" class="hidden">
      <h2 id="pzLevelTitle"></h2>
      <div class="pz-grid" id="pzGrid"></div>
      <div class="modal-actions"><button class="mbtn" id="pzBack" data-i18n="ls.back"></button></div>
    </div>
  </div>
</div>

<!-- result -->
<div class="overlay" id="resultOverlay">
  <div class="modal">
    <div class="result-disc" id="resultDisc"></div>
    <div class="result-big" id="resultTitle"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="modal-actions">
      <button class="mbtn" id="btnReview" data-i18n="res.review"></button>
      <button class="mbtn" id="btnResAnalyze" data-i18n="rv.btn"></button>
      <button class="mbtn go" id="btnAgain" data-i18n="res.again"></button>
    </div>
  </div>
</div>

<div class="overlay" id="resumeOverlay">
  <div class="modal" style="width:min(480px,100%)">
    <h2 data-i18n="rs.title"></h2>
    <p id="rsText" style="font-size:13.5px;color:var(--muted);line-height:1.7;margin:-6px 0 4px"></p>
    <div class="modal-actions" style="flex-wrap:wrap">
      <button class="mbtn go" id="rsResume" data-i18n="rs.resume"></button>
      <button class="mbtn" id="rsRestart" data-i18n="rs.restart"></button>
      <button class="mbtn" id="rsCancel" data-i18n="close"></button>
    </div>
  </div>
</div>
<!-- one-time landscape tip (phones) -->
<div class="overlay" id="landTipOverlay">
  <div class="modal lt-modal">
    <svg class="lt-phone" viewBox="0 0 120 90" aria-hidden="true"><g class="lt-rot"><rect x="44" y="12" width="32" height="58" rx="6"/><path d="M56 63h8"/><rect class="lt-scr" x="48" y="19" width="24" height="40" rx="2"/></g><path class="lt-arc" d="M90 26a34 34 0 0 1 4 30"/><path class="lt-arc" d="M90 56l4 2 2-4"/></svg>
    <h2 data-i18n="land.tip"></h2>
    <p class="lt-sub" data-i18n="land.tipSub"></p>
    <div class="modal-actions"><button class="mbtn" id="ltKeep" data-i18n="land.keep"></button><button class="mbtn go" id="ltOn" data-i18n="land.go"></button></div>
  </div>
</div>
<div class="overlay" id="pasteOverlay">
  <div class="modal">
    <h2 data-i18n="paste.title"></h2>
    <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px" data-i18n="paste.desc"></p>
    <textarea class="paste-ta" id="pasteText" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="https://...#k=..."></textarea>
    <div class="modal-actions"><button class="mbtn" id="pasteCancel" data-i18n="close"></button><button class="mbtn go" id="pasteOk" data-i18n="paste.load"></button></div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="bg.js"></script>
<script src="app.js"></script>
</body>
</html>
